          for (var d5 = 1; d5 <= R2; d5++) {
            var A2 = end + (end > (v.a === 'h' ? cx : cy) ? d5 : -d5);
            var X3 = v.a === 'h' ? Math.round(A2) : c0, Y3 = v.a === 'h' ? c0 : Math.round(A2);
            if (X3 < 0 || Y3 < 0 || X3 >= W || Y3 >= H) break;
            if (B[Y3 * W + X3]) { c = R2 - d5; break; }
          }
          return c;
        };
        var hinge = wallNear(a0) >= wallNear(a1) ? -1 : 1;   // -1 — у начала проёма
        DOORS.push({ x: (v.a === 'h' ? cx : cx) / m.k, y: (v.a === 'h' ? cy : cy) / m.k,
          w: len / m.k, ang: v.a === 'h' ? 0 : 90, side: side, hinge: hinge,
          th: Math.max(2, t) / m.k });
      }
      return;
    }
    // окно смотрит на улицу: перпендикулярный луч хотя бы с одной стороны
    // доходит до края плана, не встретив толстой стены (внутри дома луч
    // всегда упрётся в наружную стену; тонкие размерные линии не преграда)
    var street = false, sgn, d3, cnt, hitWall;
    for (sgn = -1; sgn <= 1; sgn += 2) {
      hitWall = false; cnt = 0;
      for (d3 = Math.round(t / 2 + 3); ; d3++) {
        ci = c0 + sgn * d3;
        px2 = v.a === 'h' ? Math.round(cx) : ci;
        py2 = v.a === 'h' ? ci : Math.round(cy);
        if (px2 < 0 || py2 < 0 || px2 >= W || py2 >= H) break;   // дошли до края — улица
        if (B[py2 * W + px2]) { cnt++; if (cnt >= Tmin) { hitWall = true; break; } }
        else cnt = 0;
      }
      if (!hitWall) { street = true; break; }
    }
    if (!street) return;
    var off = t / 2 + 0.13 * ppm;
    var lenM = len / ppm;
    var wM = Math.min(2.0, Math.max(0.6, 0.70 * lenM));   // радиатор — 70% ширины окна
    var rx = cx, ry = cy, ang = 0;
    if (v.a === 'h') ry = cy + (scy > cy ? off : -off);
    else { rx = cx + (scx > cx ? off : -off); ang = 90; }
    out.push({ x: rx / m.k, y: ry / m.k, ang: ang, w: wM * (f.pxPerM || 100),
      // настоящая геометрия проёма: по ней рисуется окно и его размер
      // (w выше — ширина радиатора, 70% проёма, её место в другом месте)
      ox: cx / m.k, oy: cy / m.k, ow: len / m.k, oth: Math.max(2, t) / m.k });
  });
  return out;
}

/** Все комнаты этажа из разметки watershed: [{pts, m2}] без «улицы» и мелочи */
function enumerateRooms() {
  var m = labelRooms(); if (!m) return [];
  var ppm = (F().pxPerM || 100) * m.k, p2 = ppm * ppm;
  var out = [];
  for (var L = 1; L <= m.labN; L++) {
    if (m.labEdge[L]) continue;                  // касается края плана — улица
    var m2 = m.labCnt[L] / p2;
    if (m2 < 1.5 || m2 > 130) continue;
    var pts = traceLabel(m, L);
    if (pts) out.push({ pts: pts, m2: m2 });
  }
  return out;
}

function pip(p, pts) {  // точка внутри полигона (ray casting)
  var inn = false;
  for (var a = 0, b = pts.length - 1; a < pts.length; b = a++) {
    if ((pts[a][1] > p[1]) !== (pts[b][1] > p[1]) &&
        p[0] < (pts[b][0] - pts[a][0]) * (p[1] - pts[a][1]) / (pts[b][1] - pts[a][1]) + pts[a][0])
      inn = !inn;
  }
  return inn;
}

/** Сброс всего, что считалось от масштаба: метки комнат живут на маске, окна
 *  и двери — в своём кэше. Без этого смена масштаба оставляла бы на этаже
 *  комнаты и окна, отмеренные по прежнему числу. */
function resetScaleCaches() {
  var m = maskCache[cur];
  if (m) { m.labels = null; m.labCnt = null; m.labEdge = null; m.labMin = null; m.labN = 0; }
  delete winCache[cur];
  DOORS = [];
}

/** Медиана: одна ошибочная комната не должна утащить за собой масштаб. */
function median(a) {
  var v = a.slice().sort(function (x, y) { return x - y; });
  if (!v.length) return 0;
  return v.length % 2 ? v[(v.length - 1) / 2]
                      : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
}

/** Площади найденных на плане комнат (м²) при пробном масштабе.
 *  Сегментация сама зависит от масштаба — labelRooms отделяет комнаты по
 *  проёмам радиусом, заданным в метрах, — поэтому метки сбрасываются на
 *  каждый прогон, а прежний масштаб возвращается на место. */
function roomAreasAt(ppmTry, mode) {
  var f = F(), was = f.pxPerM, wasMode = f.roomMask, out = [];
  if (!getMask()) return out;
  f.pxPerM = ppmTry;
  if (mode === 'clean') f.roomMask = 'clean'; else delete f.roomMask;
  resetScaleCaches();
  try { out = enumerateRooms().map(function (r) { return r.m2; }); }
  catch (e) { console.error('[plan_editor] scale rooms:', e); }
  f.pxPerM = was;
  if (wasMode) f.roomMask = wasMode; else delete f.roomMask;
  resetScaleCaches();
  return out;
}

/** Общий множитель площадей: самое плотное скопление отношений «комната
 *  расчёта к комнате плана».
 *
 *  Пары не сводятся по порядку размера: на плане всегда находятся помещения,
 *  которых в расчёте нет (коридоры, гардеробные, лоджии), и одно лишнее сбило
 *  бы весь ряд. Берём ВСЕ отношения: верные ложатся кучно вокруг истинного
 *  множителя, случайные рассыпаются. Окно шириной ±8% по стороне помещения
 *  (±17% по площади) с наибольшим числом отношений и даёт ответ. */
function fitAreaRatio(measured, targets) {
  var rs = [];
  measured.forEach(function (a) {
    if (a > 0) targets.forEach(function (b) { if (b > 0) rs.push(b / a); });
  });
  if (rs.length < 2) return null;
  rs.sort(function (x, y) { return x - y; });
  var bi = 0, bj = 0;
  for (var i = 0; i < rs.length; i++) {
    var hi = rs[i] * 1.17, j = i;
    while (j + 1 < rs.length && rs[j + 1] <= hi) j++;
    if (j - i > bj - bi) { bi = i; bj = j; }
  }
  return median(rs.slice(bi, bj + 1));
}

/** Сколько комнат плана сошлись с расчётом при этом множителе — мера доверия
 *  к масштабу. Комната расчёта занята одной комнатой плана: две одинаковые
 *  спальни не должны считаться за одно совпадение дважды. */
function agreeCount(measured, targets, ratio) {
  var used = {}, ok = 0;
  measured.forEach(function (a) {
    var bestJ = -1, bestE = 1;
    targets.forEach(function (b, j) {
      if (used[j] || !(b > 0)) return;
      var e = Math.abs(a * ratio - b) / b;
      if (e < bestE) { bestE = e; bestJ = j; }
    });
    if (bestJ >= 0 && bestE <= 0.12) { used[bestJ] = 1; ok++; }
  });
  return ok;
}

/** Вес совпадений с расчётом с поправкой на число найденных кусков.
 *
 *  Когда стены плана читаются плохо, он рассыпается на десятки обрывков, и
 *  среди них всегда находятся «подходящие» площади: на исчерченном трубами
 *  инженерном плане 36 обрывков давали 8 совпадений из 8 при масштабе в два с
 *  половиной раза меньше настоящего. Лишние куски сверх числа комнат расчёта
 *  (с запасом 30 % на коридоры и гардеробные) снижают вес совпадений. */
function matchScore(ok, found, nTargets) {
  return ok * Math.min(1, nTargets * 1.3 / Math.max(1, found));
}

/** Площади комнат этажа из подробного расчёта — то единственное, по чему
 *  подбирается масштаб. Вынесено из guessScale: отказ обязан называть
 *  причину, а она как раз в том, сколько таких комнат нашлось. */
function scaleTargets() {
  var t = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && r.area > 0;
  }).map(function (r) { return r.area; });
  if (t.length >= 2) return t;
  // комнат в расчёте нет — площади, напечатанные на самом плане (PDF или прочитанные со скана)
  var pr = (PDF_AREAS[cur] || []).map(function (l) { return l.m2; });
  return pr.length >= 2 ? pr : t;
}

/** Масштаб по площадям комнат расчёта: сколько пикселей плана в метре.
 *
 *  Единственное число разметки, которого нет ни на чертеже, ни в расчёте, —
 *  и без него не работают ни авторазметка комнат, ни расстановка радиаторов.
 *  Считаем от обратного: помещения на плане уже находятся по стенам, их
 *  площади в расчёте известны, остаётся подобрать множитель.
 *
 *  Одного прогона мало: при заведомо неверном масштабе комнаты слипаются
 *  через проёмы или рассыпаются на куски. Поэтому идём лесенкой пробных
 *  масштабов, у каждого меряем согласие с расчётом, а лучший уточняем ещё
 *  дважды — уже на его собственной сегментации. */
function guessScale() {
  var targets = scaleTargets();
  if (targets.length < 2) return null;
  // Подбор по одной маске: обычной ('raw') либо очищенной от тонкого ('clean')
  var score = function (ok, n) { return matchScore(ok, n, targets.length); };
  var fitMode = function (mode) {
    var best = null;
    [40, 70, 110, 170, 260].forEach(function (ppmTry) {
      var meas = roomAreasAt(ppmTry, mode);
      var ratio = fitAreaRatio(meas, targets);
      if (!ratio) return;
      var ppm = ppmTry / Math.sqrt(ratio), ok = agreeCount(meas, targets, ratio);
      if (ppm < 10 || ppm > 600) return;
      var sc = score(ok, meas.length);
      if (!best || sc > best.sc) best = { ppm: ppm, ok: ok, sc: sc };
    });
    if (!best) return null;
    for (var k = 0; k < 2; k++) {
      var meas2 = roomAreasAt(best.ppm, mode);
      var ratio2 = fitAreaRatio(meas2, targets);
      if (!ratio2) break;
      var ppm2 = best.ppm / Math.sqrt(ratio2), ok2 = agreeCount(meas2, targets, ratio2);
      var sc2 = score(ok2, meas2.length);
      if (ppm2 < 10 || ppm2 > 600 || sc2 < best.sc) break;
      var settled = Math.abs(ppm2 - best.ppm) / best.ppm < 0.02;
      best = { ppm: ppm2, ok: ok2, sc: sc2 };
      if (settled) break;
    }
    best.mode = mode;
    return best;
  };
  // Очищенная маска берётся, только если её оценка строго выше: на
  // чистом архитектурном плане тонкие перегородки нарисованы линиями, и
  // чистка их стёрла бы — там прежний режим обязан остаться.
  var best = fitMode('raw'), alt = fitMode('clean');
  if (alt && (!best || alt.sc > best.sc)) best = alt;
  if (!best) return null;
  best.total = targets.length;
  // Три сошедшиеся комнаты (или все, если их всего две) — граница, ниже
  // которой это уже не подбор, а совпадение.
  return best.ok >= Math.min(3, targets.length) ? best : null;
}

/** Чем проверить подобранный масштаб: ширина дверных проёмов. Величина
 *  известна каждому монтажнику — 0,8–0,9 м, и разъехавшийся масштаб виден по
 *  ней сразу, в отличие от площадей, по которым он и подбирался. */
function doorWidthM() {
  try { detectWindows(); } catch (e) { return 0; }
  var f = F();
  if (!DOORS.length || !f.pxPerM) return 0;
  return median(DOORS.map(function (d) { return d.w / f.pxPerM; }));
}

/** Ширина дверных проёмов при таком масштабе: 0 — проёмов не нашлось.
 *  Проверка независимая: площади можно свести к чему угодно, а проём —
 *  величина известная, 0,8–0,9 м. */
function doorCheck(ppm) {
  var f = F(), was = f.pxPerM;
  f.pxPerM = ppm; resetScaleCaches();
  var dw = doorWidthM();
  f.pxPerM = was; resetScaleCaches();
  return dw;
}

/** Кнопка «Подобрать масштаб», она же автоподбор при загрузке плана.
 *  silent — молчать о неудаче: при загрузке плана комнат в расчёте может и
 *  не быть, ругаться тут не на что. */
function autoScale(silent) {
  // Первый источник — размеры самого чертежа. Он не зависит от того,
  // заполнен ли расчёт, и потому закрывает случай, на котором шаг «Масштаб»
  // раньше становился тупиком: план второго этажа есть, комнат второго
  // этажа в расчёте нет.
  var d = null;
  try { d = scaleFromDims(PDF_DIMS[cur]); }
  catch (e) { console.error('[plan_editor] dims:', e); }
  if (d) {
    var ddw = doorCheck(d.ppm);
    if (!ddw || (ddw >= 0.6 && ddw <= 1.3)) {
      if (!silent) pushUndo('scale');
      var fd = F();
      fd.pxPerM = d.ppm;
      resetScaleCaches();
      renderZones(); draw(); updateGuide();
      hint('<span class=ok>Масштаб взят с размерных линий чертежа</span> (сошлось ' +
        d.n + ' размеров из ' + d.total + '). ' +
        (ddw ? 'Проверьте: дверные проёмы получились ' + ddw.toFixed(2).replace('.', ',') +
          ' м. ' : 'Проверьте его кнопкой «Масштаб» по любому известному размеру. ') +
        'Дальше — «Распознать комнаты».');
      return true;
    }
    d = null;   // проёмы не сошлись — размеры не от этого плана, идём к площадям
  }
  var g = null;
  try { g = guessScale(); } catch (e) { console.error('[plan_editor] scale:', e); }
  if (!g) {
    // Причин у отказа две, и лечатся они по-разному: либо заполнить комнаты в
    // расчёте, либо задать масштаб руками. Общее «подобрать не удалось» не
    // говорило ни о той, ни о другой — и кнопка выглядела просто сломанной.
    var tg = scaleTargets();
    // Размеры на чертеже были, но не сошлись — об этом надо сказать отдельно,
    // иначе совет «заполните комнаты» выглядит единственным выходом.
    var pre = (PDF_DIMS[cur] && PDF_DIMS[cur].length)
      ? 'С размерных линий чертежа масштаб снять не вышло. ' : '';
    // Масштаб придётся задавать руками — значит, кнопка «Масштаб» должна
    // быть на виду, а не за «Все инструменты».
    if (!silent) heroOff = true;
    if (!silent) hint(pre + (tg.length < 2
      ? 'Подбирать масштаб не по чему: в подробном расчёте нет комнат ' + (cur + 1) +
        '-го этажа' + (tg.length ? ' (нашлась только одна)' : '') + '. Нужны хотя бы две ' +
        'комнаты с площадью и отметкой «' + (cur + 1) + ' этаж». Проставьте этаж комнатам ' +
        'в расчёте — или задайте масштаб кнопкой «Масштаб»: две точки отрезка с известной ' +
        'длиной и его длина в метрах.'
      : 'Масштаб по площадям комнат не подобрался: комнаты ' + (cur + 1) + '-го этажа из ' +
        'расчёта (' + tg.length + ' шт.) не сошлись с комнатами на подложке — стены плана ' +
        'читаются плохо или комнаты в расчёте от другого этажа. Задайте масштаб кнопкой ' +
        '«Масштаб»: две точки отрезка с известной длиной — подойдёт размерная линия плана ' +
        'или дверной проём 0,9 м.'));
    return false;
  }
  // Проверяем не тем, чем подбирали: площади можно свести к чему угодно, если
  // комнаты в расчёте вообще от другого объекта, а ширина дверного проёма —
  // величина известная. Вышло полтора метра — подобрался не масштаб, а
  // совпадение, и такой лучше не ставить вовсе.
  var f = F(), dw = doorCheck(g.ppm);
  // Проёмов не нашлось вовсе — проверить нечем, и тогда подбор должен сойтись
  // хотя бы по половине комнат этажа. Иначе на плане без читаемых стен
  // «сходились» три случайные площади, и масштаб уезжал в разы (39 px/м
  // вместо ~100 на инженерном плане второго этажа).
  if (!dw && g.ok < Math.ceil(g.total / 2)) {
    if (!silent) hint('Масштаб по площадям не принят: по стенам плана сошлось только ' + g.ok +
      ' комнат из ' + g.total + ', а дверных проёмов для проверки не нашлось. ' +
      'Задайте масштаб кнопкой «Масштаб».');
    return false;
  }
  if (dw && (dw < 0.6 || dw > 1.3)) {
    if (!silent) hint('Масштаб по площадям не принят: при нём дверные проёмы плана выходят ' +
      dw.toFixed(2).replace('.', ',') + ' м вместо обычных 0,8–0,9. Похоже, комнаты в ' +
      'расчёте не от этого этажа. Задайте масштаб кнопкой «Масштаб».');
    return false;
  }
  // При загрузке отменять нечего: снимок 'plan' уже сделан и масштаб в нём.
  if (!silent) pushUndo('scale');
  f.pxPerM = g.ppm;
  if (g.mode === 'clean') f.roomMask = 'clean'; else delete f.roomMask;
  resetScaleCaches();
  renderZones(); draw(); updateGuide();
  hint('<span class=ok>Масштаб подобран по площадям комнат расчёта: сошлось ' + g.ok +
    ' из ' + g.total + '.</span> ' +
    (dw ? 'Проверьте: дверные проёмы получились ' + dw.toFixed(2).replace('.', ',') +
      ' м — если это не так, задайте масштаб кнопкой «Масштаб». '
        : 'Проверьте его кнопкой «Масштаб» по любому известному размеру. ') +
    'Дальше — «Распознать комнаты».');
  return true;
}

/** Подложка на месте, а масштаба у этажа нет — подбираем сам.
 *
 *  Нужно для планов, пришедших не из файла, а из распознавания: их подложку
 *  кладёт калькулятор, applyPlanCanvas в этом случае не работает. Один раз на
 *  этаж: не подобрался — значит, монтажник задаст его вручную, и навязываться
 *  на каждой перерисовке незачем. Через таймер, потому что зовут отсюда из
 *  draw(), а autoScale сам draw() и вызывает. */
var scaleTried = {};
function tryAutoScaleOnce() {
  var f = F();
  if (!f || !f.img || f.pxPerM || scaleTried[cur] || !imgCache[cur]) return;
  scaleTried[cur] = true;
  setTimeout(function () { autoScale(true); }, 0);
}

/** Подложка этажа в кэше картинок: маску по ней строит getMask, а он берёт
 *  только готовую. Для текущего этажа это делает draw(), для остальных — никто:
 *  их разметка идёт «вслепую», без открытия вкладки. */
function ensureImage(fi) {
  return new Promise(function (ok) {
    var f = DATA.floors[fi];
    if (!f || !f.img) { ok(false); return; }
    if (imgCache[fi]) { ok(true); return; }
    var im = new Image();
    if (f.img.indexOf('data:') !== 0) im.crossOrigin = 'anonymous';
    im.onload = function () { imgCache[fi] = im; ok(true); };
    im.onerror = function () { ok(false); };
    im.src = f.img;
  });
}

/**
 * «Разметить всё»: масштаб → комнаты → радиаторы → коллектор → сохранение,
 * по всем этажам подряд.
 *
 * Ничего нового кнопка не считает — зовёт те же autoScale, autoRooms, autoRads
 * и saveAll. Но по отдельности их пять, идут они в строгом порядке и на каждом
 * этаже заново, а бросают разметку ровно на середине этого порядка.
 *
 * Уже размеченное не сносится: autoRooms пропускает комнаты, где зона есть,
 * autoRads — окна, под которыми уже стоит радиатор. Поэтому нажать её можно и
 * после ручных правок, и второй раз подряд.
 */
var autoBusy = false;
function autoMarkAll() {
  if (autoBusy) return;
  if (!DATA.floors.some(function (f) { return f.img; })) {
    alert('Сначала загрузите план этажа.'); return;
  }
  autoBusy = true;
  var btn = document.getElementById('b_automark');
  if (btn) btn.disabled = true;
  var was = cur, zones = 0, rads = 0, colls = 0, bad = [];
  // Возвращаем обещание: кнопке оно не нужно, но по нему видно, когда разметка
  // кончилась, — этим пользуется стенд, и это же понадобится, если запускать
  // разметку не рукой.
  var chain = Promise.resolve();
  DATA.floors.forEach(function (f, fi) {
    chain = chain.then(function () {
      if (!f.img) return null;
      cur = fi;
      hint('Размечаю ' + (fi + 1) + '-й этаж из ' + DATA.floors.length + '…');
      return ensureImage(fi).then(function (okImg) {
        var name = (fi + 1) + '-й этаж';
        if (!okImg) { bad.push(name + ' — подложка не открылась'); return; }
        if (!f.pxPerM) autoScale(true);
        if (!f.pxPerM) { bad.push(name + ' — не подобрался масштаб'); return; }
        var z0 = f.zones.length, r0 = (f.rads || []).length;
        autoRooms();
        autoRads();          // в режиме раскладки — мимо комнат только с тёплым полом
        // Комнаты с типом в расчёте есть, а зон не появилось — по площадям
        // ничего не сошлось. Молча написать «Зон: 0» мало: монтажник должен
        // знать, что обводить руками и на каком этаже.
        if (f.zones.length === z0) {
          var want = calcRooms.filter(function (r) {
            return (+r.floor || 1) === fi + 1 && zoneKindsOfRoom(r).length;
          }).map(function (r) { return r.name; });
          if (want.length) bad.push(name + ' — комнаты не совпали по площади, обведите: ' + want.join(', '));
        }
        zones += f.zones.length - z0;
        rads += (f.rads || []).length - r0;
        // Коллектор ТП ставим в котельную — там он и стоит. Котельной на
        // этаже нет, а тёплый пол есть — место неочевидно, точку ставит
        // монтажник, и об этом надо сказать вслух.
        var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
        var bz = null;
        f.zones.forEach(function (z) { if (z.type === 'boiler') bz = z; });
        if (hasTp && !f.coll) {
          if (bz) {
            var c = centroid(bz.pts);
            f.coll = { x: Math.round(c[0]), y: Math.round(c[1]) };
            colls++;
          } else if (UFH && ufhAutoColl(f)) {
            colls++;
          } else {
            bad.push(name + ' — некуда поставить коллектор ТП: котельная не отмечена');
          }
        }
      });
    });
  });
  return chain.then(function () {
    cur = was;
    // раскладка: дальше — клик по комнатам, режим сразу нужный
    if (UFH) { if (F().pxPerM && mode !== 'room') setMode('room'); }
    else if (mode !== 'select') setMode('select');
    renderTabs(); renderZones(); draw(); updateGuide();
    return saveAll();      // сохранение считает трассы, подводки и контуры стен
  }).then(function () {
    var done = zones + rads + colls;
    if (bad.length) heroOff = true;   // что-то осталось руками — открываем шапку
    if (UFH) {
      // что делать дальше, скажет строка мастера; здесь — только итог
      hint(F().pxPerM ? '<span class=ok>Найдено комнат: ' + zones + (rads ? ', радиаторов под окнами: ' + rads : '') + '.</span>' + lastRoomsNote +
        (bad.length ? ' <b>Осталось руками:</b> ' + bad.join('; ') + '.' : '') : '');
      return;
    }
    hint((done
      ? '<span class=ok>Разметка готова и сохранена.</span> Зон: ' + zones +
        ', радиаторов: ' + rads + (colls ? ', коллекторов ТП: ' + colls : '') + '. '
      : '<span class=ok>Сохранено.</span> Новых зон и радиаторов не нашлось. ') +
      (bad.length ? '<b>Осталось руками:</b> ' + bad.join('; ') + '. ' : '') +
      'Проверьте зоны и радиаторы — и «Листы проекта» в калькуляторе.');
  })['catch'](function (e) {
    console.error('[plan_editor] авторазметка:', e);
    hint('Разметить всё не удалось: ' + (e && e.message ? e.message : e) +
      '. Пройдите шаги по одному — кнопками выше.');
  }).then(function () {
    autoBusy = false;
    if (btn) btn.disabled = false;
  });
}

/** Какими зонами комната подробного расчёта ложится на план.
 *
 *  Назначение помещения важнее системы: котельная и санузел дают зону своего
 *  типа — по ним собираются компоновка котельной и листы водоснабжения с
 *  канализацией. Тёплый пол в том же помещении добавляется второй зоной по
 *  тому же контуру: убрать его нельзя, из геометрии выпадут петли, по которым
 *  смета считает трубу. */
function zoneKindsOfRoom(r) {
  var out = [], nm = (r && r.name) || '';
  if (/котельн|топочн|бойлерн/i.test(nm)) out.push('boiler');
  // раскладке тёплого пола санузлы с приборами не нужны: в расчёте карточка
  // водоснабжения бывает и у кухни — она стала бы «Санузлом» с унитазом
  else if (!UFH && wcCardOf(nm)) out.push('wc');
  if (((r && r.sys) || []).indexOf('tp') >= 0) out.push('tp');
  return out;
}

/** Отмечена ли котельная хоть на одном этаже: в доме она одна. */
function hasBoilerZone() {
  return DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
}

/** «Распознать комнаты»: зоны по комнатам подробного расчёта — тёплый пол,
 *  котельная и санузлы, тип берётся из самой комнаты (zoneKindsOfRoom).
 *  Сопоставление по площади (лучшие пары, допуск 25% или 2 м²); без расчёта —
 *  зоны ТП для всех найденных комнат. Уже размеченные комнаты не трогаются. */
var lastRoomsNote = '';   // итог сверки с подписанными площадями — для строки «Найдено комнат…»
function autoRooms() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб: кнопкой «Подобрать масштаб» или «Масштаб».'); return; }
  var rooms = [];
  try { rooms = enumerateRooms(); } catch (e) { console.error('[plan_editor] rooms:', e); }
  // Масштаб могли задать руками — тогда режим маски не выбирал никто.
  // Пробуем и вторую маску: берём её, если по площадям с расчётом она
  // сводит больше комнат (на исчерченном трубами плане так и бывает).
  var calcT = calcRooms.filter(function (r) { return (+r.floor || 1) === cur + 1 && r.area > 0; })
    .map(function (r) { return r.area; });
  if (calcT.length >= 2) {
    var fl0 = F(), mode0 = fl0.roomMask;
    var ok0 = matchScore(agreeCount(rooms.map(function (r) { return r.m2; }), calcT, 1), rooms.length, calcT.length);
    if (mode0 === 'clean') delete fl0.roomMask; else fl0.roomMask = 'clean';
    resetScaleCaches();
    var rooms1 = [];
    try { rooms1 = enumerateRooms(); } catch (e) { rooms1 = []; }
    var ok1 = matchScore(agreeCount(rooms1.map(function (r) { return r.m2; }), calcT, 1), rooms1.length, calcT.length);
    if (ok1 > ok0) rooms = rooms1;
    else { if (mode0) fl0.roomMask = mode0; else delete fl0.roomMask; resetScaleCaches(); }
  }
  if (!rooms.length) {
    hint('Комнаты распознать не удалось (пёстрая подложка?) — обведите зоны вручную.');
    return;
  }
  // Подписи площадей на плане (PDF): сверяем масштаб и выбираем вариант контура,
  // ближе всего к напечатанному
  var labs = PDF_AREAS[cur] || [], scaleNote = '';
  lastRoomsNote = '';
  if (labs.length) {
    var fixPpm = scaleFromPrinted(rooms, labs);
    if (fixPpm) {
      var oldPpm = F().pxPerM;
      F().pxPerM = fixPpm; resetScaleCaches();
      try { rooms = enumerateRooms(); } catch (e) { rooms = []; }
      scaleNote = ' Масштаб уточнён по площадям, напечатанным на плане: ' + oldPpm.toFixed(1) + ' → ' + fixPpm.toFixed(1) + ' px/м.';
      if (!rooms.length) { hint('Комнаты распознать не удалось.' + scaleNote); return; }
    }
    rooms = reconcileRooms(rooms, labs);
  }
  var free = rooms.filter(function (r) {
    var c = centroid(r.pts);
    return !F().zones.some(function (z) { return pip(c, z.pts); });
  });
  // В сопоставлении участвуют ВСЕ комнаты этажа из расчёта, а зоны создаются
  // только тем, у кого есть тип (котельная, санузел, тёплый пол). Раньше
  // соревновались одни «типовые»: кусок плана размером с прихожую доставался
  // котельной, потому что прихожей среди претендентов не было.
  var targets = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && r.area > 0;
  });
  pushUndo('zones');
  var made = 0, missed = [], cnt = {}, boiler = hasBoilerZone();
  if (targets.length) {
    var pairs = [];
    targets.forEach(function (t, ti) {
      var typed = zoneKindsOfRoom(t).length ? 0 : 1;
      free.forEach(function (c, ci) { pairs.push([Math.abs(c.m2 - t.area), ti, ci, typed]); });
    });
    // При равной разнице площадей первыми выбирают комнаты, которым нужна
    // зона: как было, пока в сопоставлении участвовали только они
    pairs.sort(function (a, b) { return (a[0] - b[0]) || (a[3] - b[3]); });
    var tU = {}, cU = {};
    pairs.forEach(function (p) {
      if (tU[p[1]] || cU[p[2]]) return;
      var t = targets[p[1]];
      if (p[0] > Math.max(2, 0.25 * t.area)) return;
      tU[p[1]] = 1; cU[p[2]] = 1;
      var pts = fitZonePts(free[p[2]].pts, F().pxPerM || 100, free[p[2]].printed);
      // Раскладка: у комнаты без своего типа — контур «Помещение», чтобы
      // клик по ней включал тёплый пол, а не искал стены заново
      if (UFH && !zoneKindsOfRoom(t).length) {
        F().zones.push({ type: 'room', name: t.name, roomId: (t.id != null ? t.id : null), pts: pts });
        cnt.room = (cnt.room || 0) + 1; made++;
      }
      zoneKindsOfRoom(t).forEach(function (kind) {
        // Вторую котельную не заводим: на этаже её запрещает addZone, а в
        // доме она одна — по ней собирается компоновка.
        if (kind === 'boiler' && boiler) return;
        if (kind === 'boiler') boiler = true;
        F().zones.push({ type: kind, name: t.name, roomId: (t.id != null ? t.id : null), pts: pts });
        cnt[kind] = (cnt[kind] || 0) + 1;
        made++;
      });
    });
    targets.forEach(function (t, ti) { if (!tU[ti] && zoneKindsOfRoom(t).length) missed.push(t.name); });
  }
  // Зоны ТП на все найденные комнаты — только когда расчёта по этажу нет вовсе
  // (как и сказано в описании кнопки). Комнаты в расчёте есть, но типовые не
  // сошлись — заливать весь этаж тёплым полом нельзя.
  // Раскладка: несовпавшие комнаты — контурами «Помещение» без имени. Тёплый
  // пол в них монтажник включит кликом, имя спросим тогда же.
  if (UFH) {
    free.forEach(function (c) {
      var cc = centroid(c.pts);
      if (F().zones.some(function (z) { return pip(cc, z.pts); })) return;
      F().zones.push({ type: 'room', name: c.pname || '', nameSrc: c.pname ? 'plan' : undefined, pts: fitZonePts(c.pts, F().pxPerM || 100, c.printed) });
      cnt.room = (cnt.room || 0) + 1; made++;
    });
    missed = [];
  }
  if (!made && !targets.length) {
    free.forEach(function (c) {
      F().zones.push({ type: 'tp', name: c.pname || '', nameSrc: c.pname ? 'plan' : undefined, pts: fitZonePts(c.pts, F().pxPerM || 100, c.printed) });
      made++;
    });
    cnt = { tp: made };
    missed = [];
  }
  // Санузел подписан именем из расчёта — приборы по его карточке встают сами
  if (cnt.wc && fixAuto) refreshAutoFixtures();
  renderZones(); draw();
  // Контур теперь по стенам, а площадь в расчёт — та, что напечатана на плане: у комнаты с
  // лестницей или проёмом они расходятся на несколько процентов. Пока контур не двигали
  // руками (подпись контура — printedSig), берётся напечатанная
  F().zones.forEach(function (z) {
    delete z.printedM2; delete z.printedSig;
    if (!labs.length || z.type === 'cold') return;
    var inside = labs.filter(function (l) { return pip([l.x, l.y], z.pts); });
    if (inside.length !== 1) return;
    var A = area(z.pts);
    // цифры, прочитанные со снимка, доверия меньше: на размытом фото 8,56 читалось как 8,18
    if (Math.abs(A - inside[0].m2) / inside[0].m2 <= (inside[0].scan ? 0.08 : 0.15)) { z.printedM2 = inside[0].m2; z.printedSig = JSON.stringify(z.pts); }
  });
  var named = F().zones.filter(function (z) { return z.nameSrc === 'plan' && z.name; }).length;
  lastRoomsNote = printedNote(labs) + scaleNote +
    (named ? ' Названия комнат взяты с плана (' + named + ') — проверьте их в списке справа.' : '');
  var NAMES = { tp: 'тёплый пол', boiler: 'котельная', wc: 'санузлы', room: 'прочие помещения' };
  var parts = ['tp', 'boiler', 'wc', 'room'].filter(function (k) { return cnt[k]; })
    .map(function (k) { return NAMES[k] + ' ' + cnt[k]; });
  if (UFH) {
    if (!F().coll) ufhAutoColl(F());   // тёплый пол из расчёта — коллектор сразу
    // режим на плане ведёт мастер (wzGo): на шаге «Комнаты» клик не должен включать тёплый пол
    renderZones(); draw();
    hint('<span class=ok>Найдено комнат: ' + rooms.length + '.</span> ' +
      (cnt.tp ? 'Тёплый пол из расчёта уже отмечен: ' + cnt.tp + '.' : '') + lastRoomsNote);
    return;
  }
  hint('<span class=ok>Найдено комнат: ' + rooms.length + ', создано зон: ' +
    (parts.length ? parts.join(', ') : '0') + '.</span>' +
    (missed.length ? ' Не совпали по площади: ' + missed.join(', ') + ' — обведите вручную.' : '') +
    (hasBoilerZone() ? '' : ' Котельную отметьте сами (тип зоны «Котельная») — ' +
      'без неё проект не выпускается.') +
    ' Лишние зоны удаляйте крестиком, имена правятся в списке.');
}

/** Кнопка «Под окна»: расставить радиаторы по найденным окнам */
function autoRads() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб: кнопкой «Подобрать масштаб» или «Масштаб».'); return; }
  var wins = floorWindows();
  if (!wins.length) {
    hint('Окна распознать не удалось (нечёткий план?) — расставьте радиаторы кликами.');
    if (mode !== 'rad') setMode('rad');
    return;
  }
  pushUndo('zones');
  var added = 0, ppmI = F().pxPerM;
  wins.forEach(function (w) {
    var busy = (F().rads || []).some(function (r) {
      return Math.hypot(r.x - w.x, r.y - w.y) < 0.7 * ppmI;
    });
    if (busy) return;
    if (UFH && !ufhWantsRad(w)) return;          // комната только с тёплым полом
    F().rads.push({ x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), ang: w.ang });
    added++;
  });
  renderZones(); draw();
  hint('<span class=ok>Найдено окон: ' + wins.length + ', поставлено радиаторов: ' + added +
    '.</span> Лишние уберите кликом по значку, недостающие добавьте кликом.');
  if (mode !== 'rad') setMode('rad');
}

/**
 * Размерные числа страницы PDF, пересчитанные в пиксели подложки.
 *
 * Держим в памяти по этажу: в разметку это не идёт (масштаб из них считается
 * один раз), а этажи только добавляются, поэтому индекс не разъезжается.
 */
var PDF_DIMS = {};

/** Умножение матриц PDF (как pdfjsLib.Util.transform, но без зависимости). */
function mulT(a, b) {
  return [a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
          a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
          a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];
}

/** Текстовый слой страницы → [{ s, x, y }] в пикселях отрисованной подложки. */
function textItemsPx(tc, vp) {
  var out = [];
  (tc.items || []).forEach(function (it) {
    var str = String(it.str == null ? '' : it.str).trim();
    if (!str || !it.transform) return;
    var m = mulT(vp.transform, it.transform);
    out.push({ s: str, x: m[4], y: m[5], w: (it.width || 0) * vp.scale, h: (it.height || 0) * vp.scale });
  });
  return out;
}

/**
 * Подписи площадей на плане («19,16 м²») из текстового слоя PDF.
 *
 * Проектировщик печатает площадь каждой комнаты — это самая точная цифра,
 * какая у нас есть: по ней сверяются найденные комнаты и масштаб (03.10.2026,
 * на плане заказчика найденные площади расходились с подписанными на 13–30 %).
 * Подпись бывает одним куском «19,16 м²» или двумя — число и «м²» рядом.
 * Число без единицы не берём: размерные цепочки тоже полны десятичных дробей.
 * Возвращает [{ m2, x, y }] — центр подписи в пикселях подложки.
 */
var PDF_AREAS = {};

/**
 * Подписи площадей на СКАНЕ или ФОТО плана (текстового слоя нет): картинку читает
 * тот же сервис распознавания, что во вкладке «Распознавание». Результат — тот же
 * [{ m2, x, y }] в пикселях подложки, что дают areaLabelsFrom для PDF, и дальше всё
 * работает одинаково: масштаб по площадям, выбор контура, площадь в расчёт.
 * Не ответил за 50 с или ошибся — молча [], план грузится как раньше.
 */
var AREA_READ_URL = 'https://proxy.heatcalc.ru/gemini_proxy.php';
var AREA_READ_PROMPT = 'Ты читаешь чертёж этажа частного дома. Найди на плане подписи площадей помещений: ' +
  'число с запятой или точкой и единицей м² (м2, кв.м), например «19,16 м²», стоящее внутри контура комнаты. ' +
  'Не бери размеры в миллиметрах, отметки высот, номера помещений, периметры, общую площадь этажа и числа из ' +
  'таблиц-экспликаций вне плана. Для каждой подписи верни число (точка вместо запятой), рамку текста ' +
  'box_2d = [ymin, xmin, ymax, xmax] в координатах 0–1000 от размеров изображения и название комнаты, ' +
  'если оно написано рядом с площадью на плане («Спальня», «Кухня-гостиная»), иначе пустую строку. ' +
  'Название бери ровно как написано, ничего не придумывай. ' +
  'Ответ — только JSON: {"labels":[{"m2":19.16,"name":"Спальня","box_2d":[210,300,225,350]}]}. Подписей нет — {"labels":[]}.';
function parseAreaReply(resp, W, H) {
  var txt = '';
  try { txt = resp.candidates[0].content.parts[0].text; } catch (e) { return []; }
  var data = null;
  try { data = JSON.parse(String(txt).trim().replace(/^```json\s*/i, '').replace(/```$/, '')); } catch (e) { return []; }
  var list = (data && data.labels) || (Array.isArray(data) ? data : []);
  var out = [];
  list.forEach(function (it) {
    var a = parseFloat(String(it && (it.m2 != null ? it.m2 : it.area)).replace(',', '.'));
    var b = it && it.box_2d;
    if (!(a >= 1.5 && a <= 300) || !Array.isArray(b) || b.length < 4) return;
    var x = (b[1] + b[3]) / 2 / 1000 * W, y = (b[0] + b[2]) / 2 / 1000 * H;
    if (!isFinite(x) || !isFinite(y)) return;
    // одна подпись, прочитанная дважды
    if (out.some(function (q) { return Math.abs(q.m2 - a) < 0.005 && Math.hypot(q.x - x, q.y - y) < 40; })) return;
    out.push({ m2: a, x: x, y: y, name: cleanRoomName(it.name), scan: true });      // scan — цифры читала модель, а не текстовый слой: могут быть неточны
  });
  uniqueLabelNames(out);
  return out;
}
function readAreaLabelsFromCanvas(c) {
  return new Promise(function (resolve) {
    var finished = false;
    var finish = function (v) { if (!finished) { finished = true; clearTimeout(tm); resolve(v || []); } };
    var tm = setTimeout(function () { console.warn('[plan_editor] подписи площадей: не дождались ответа'); finish([]); }, 50000);
    try {
      hint('Читаю подписи площадей на плане… (до минуты)');
      var k = Math.min(1, 1600 / Math.max(c.width, c.height));
      var t = document.createElement('canvas');
      t.width = Math.round(c.width * k); t.height = Math.round(c.height * k);
      var g = t.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, t.width, t.height); g.drawImage(c, 0, 0, t.width, t.height);
      var b64 = t.toDataURL('image/jpeg', 0.85).split(',')[1];
      var models = ['gemini-3.5-flash', 'gemini-flash-latest'], mi = 0;
      var tryNext = function () {
        fetch(AREA_READ_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'recognize', model: models[mi], systemInstruction: AREA_READ_PROMPT,
            messages: [{ role: 'user', parts: [{ inline_data: { mime_type: 'image/jpeg', data: b64 } },
              { text: 'Найди подписи площадей помещений на этом плане.' }] }]
          })
        }).then(function (r) { return r.json(); }).then(function (resp) {
          if (resp && resp.error && ++mi < models.length) { tryNext(); return; }
          finish(resp && !resp.error ? parseAreaReply(resp, c.width, c.height) : []);
        })['catch'](function (e) {
          console.warn('[plan_editor] подписи площадей:', e && e.message);
          if (++mi < models.length) tryNext(); else finish([]);
        });
      };
      tryNext();
    } catch (e) { console.warn('[plan_editor] подписи площадей:', e && e.message); finish([]); }
  });
}

/** Название комнаты из подписи: убрать мусор, отсеять не-названия, привести к «Спальня» */
function cleanRoomName(s) {
  s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim().replace(/[.,:;]+$/, '');
  if (s.length < 3 || s.length > 28) return '';
  if (!/[А-Яа-яЁё]{3}/.test(s)) return '';
  if (/^(площадь|итого|всего|этаж|план|лист|масштаб|экспликация|помещени[ея]|высота|отметка)\b/i.test(s)) return '';
  if (/м\s*[²2]|кв\.?\s*м|\bвт\b|\bмм\b/i.test(s)) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/** Одинаковые названия получают номера по порядку на плане (сверху вниз, слева направо): «Спальня 1», «Спальня 2» */
function uniqueLabelNames(labs) {
  var cnt = {}, seen = {};
  labs.forEach(function (l) { if (l.name) cnt[l.name.toLowerCase()] = (cnt[l.name.toLowerCase()] || 0) + 1; });
  labs.slice().sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); }).forEach(function (l) {
    if (!l.name) return;
    var k = l.name.toLowerCase();
    if (cnt[k] > 1) { seen[k] = (seen[k] || 0) + 1; l.name = l.name + ' ' + seen[k]; }
  });
}

/**
 * Название комнаты рядом с подписью площади в текстовом слое PDF: проектировщики ставят
 * его строкой выше (реже ниже), по центру над числом. Берётся ближайшая строка, куски
 * одной строки склеиваются («Кухня-» «гостиная»).
 */
function nameNearLabel(items, L) {
  var h = L.h || 9, best = null, bd = 1e9;
  var cand = items.filter(function (t) {
    return t !== L.item && /[А-Яа-яЁё]{2}/.test(t.s) && !/^м\s*[²2]/i.test(t.s);
  });
  cand.forEach(function (t) {
    var dy = L.y0 - t.y, ady = Math.abs(dy);
    if (ady < 0.4 * h || ady > 3.4 * h) return;
    var cxC = t.x + (t.w || 0) / 2, cxL = L.x0 + (L.w || 0) / 2;
    if (Math.abs(cxC - cxL) > Math.max(t.w || 0, L.w || 0) * 0.9 + 3 * h) return;
    var d = ady + (dy < 0 ? 0.6 * h : 0);                       // выше площади — предпочтительнее
    if (d < bd) { bd = d; best = t; }
  });
  if (!best) return '';
  var line = cand.filter(function (t) { return Math.abs(t.y - best.y) <= 0.35 * h; }).sort(function (a, b) { return a.x - b.x; });
  var i0 = line.indexOf(best), lo = i0, hi = i0;
  while (lo > 0 && line[lo].x - (line[lo - 1].x + (line[lo - 1].w || 0)) <= 1.3 * h) lo--;
  while (hi < line.length - 1 && line[hi + 1].x - (line[hi].x + (line[hi].w || 0)) <= 1.3 * h) hi++;
  return cleanRoomName(line.slice(lo, hi + 1).map(function (t) { return t.s.trim(); }).join(' ').replace(/-\s+/g, '-'));
}

function areaLabelsFrom(items) {
  var out = [], UNIT = /^(?:м\s*[²2]|м\.?\s*кв|кв\.?\s*м)/i;
  // Показатель степени в PDF обычно отдельный кусок «2» чуть выше строки:
  // «24,78 м» + «2». Ищем его сразу за концом числа.
  var sup = function (t, items) {
    for (var j = 0; j < items.length; j++) {
      var u = items[j];
      if (!/^[²2]$/.test(u.s)) continue;
      var dx = u.x - (t.x + (t.w || 0)), dy = Math.abs(u.y - t.y);
      if (dx > -3 && dx < Math.max(8, (t.h || 8)) && dy < Math.max(8, (t.h || 8))) return true;
    }
    return false;
  };
  (items || []).forEach(function (t, i) {
    var cx = t.x + (t.w || 0) / 2, cy = t.y - (t.h || 0) / 2, v = null, m;
    // площадь бывает и целой («20 м²»), но только с единицей рядом
    if ((m = /^(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:м\s*[²2]|м\.?\s*кв|кв\.?\s*м)/i.exec(t.s))) v = m[1];
    else if ((m = /^(\d{1,3}(?:[.,]\d{1,2})?)\s*м$/i.exec(t.s))) { if (sup(t, items)) v = m[1]; }
    else if (/^\d{1,3}(?:[.,]\d{1,2})?$/.test(t.s)) {
      for (var j = 0; j < items.length; j++) {
        var u = items[j];
        if (j === i || !UNIT.test(u.s)) continue;
        var dy = Math.abs(u.y - t.y), dx = u.x - (t.x + (t.w || 0));
        if (dy <= Math.max(3, (t.h || 8) * 0.6) && dx > -2 && dx < Math.max(12, (t.h || 8) * 2)) { v = t.s; break; }
      }
    }
    if (v === null) return;
    var a = parseFloat(String(v).replace(',', '.'));
    if (a >= 1.5 && a <= 300) out.push({ m2: a, x: cx, y: cy, item: t, x0: t.x, y0: t.y, w: t.w, h: t.h });
  });
  out.forEach(function (L) { L.name = nameNearLabel(items || [], L); delete L.item; });
  uniqueLabelNames(out);
  return out;
}

/**
 * Масштаб по размерным линиям чертежа.
 *
 * На листе проекта размеры стоят цепочками, и число подписано над своим
 * участком примерно по его середине. Значит расстояние между соседними
 * числами одной цепочки — это половина первого участка плюс половина
 * второго, то есть (v1 + v2) / 2 миллиметров. Отсюда и берётся, сколько
 * пикселей подложки приходится на миллиметр.
 *
 * Пары считаются по всем цепочкам — и горизонтальным (числа стоят в строку),
 * и вертикальным (в столбец), — а дальше берётся не среднее, а середина:
 * в цепочку попадают отметки высот и номера узлов, дающие чушь, и одно такое
 * число сдвинуло бы среднее, но не медиану.
 *
 * Источник надёжнее площадей: он не зависит от того, заполнен ли расчёт, и
 * не путает этажи. Проверяется он тем же, чем и подбор по площадям, —
 * шириной дверных проёмов.
 */
function scaleFromDims(items) {
  if (!items || items.length < 4) return null;
  var toks = [];
  items.forEach(function (t) {
    // «4 732» и «4732» — одно и то же: в PDF разряды разделены пробелом
    var v = t.s.replace(/[\s\u00a0]+/g, '');
    if (!/^\d{3,5}$/.test(v)) return;
    var mm = +v;
    if (mm < 200 || mm > 20000) return;   // не размер помещения: отметки, номера, годы
    toks.push({ v: mm, x: t.x, y: t.y });
  });
  if (toks.length < 3) return null;

  var ks = [];
  // sk — координата, по которой числа стоят в одну линию, ak — вдоль цепочки
  var walk = function (sk, ak) {
    var list = toks.slice().sort(function (a, b) { return a[sk] - b[sk]; });
    var grp = [];
    var flush = function () {
      if (grp.length >= 2) {
        grp.sort(function (a, b) { return a[ak] - b[ak]; });
        for (var i = 1; i < grp.length; i++) {
          var d = grp[i][ak] - grp[i - 1][ak];
          var mm = (grp[i].v + grp[i - 1].v) / 2;
          if (d <= 2 || mm <= 0) continue;
          var k = d / mm;                       // пикселей в миллиметре
          if (k > 0.004 && k < 1.5) ks.push(k); // 4..1500 px/м — вне этого чертежей не бывает
        }
      }
      grp = [];
    };
    list.forEach(function (t) {
      if (grp.length && Math.abs(t[sk] - grp[grp.length - 1][sk]) > 6) flush();
      grp.push(t);
    });
    flush();
  };
  walk('y', 'x');
  walk('x', 'y');
  if (ks.length < 3) return null;

  ks.sort(function (a, b) { return a - b; });
  var med = ks[Math.floor(ks.length / 2)];
  var good = ks.filter(function (k) { return Math.abs(k - med) / med < 0.12; });
  if (good.length < 3) return null;
  var sum = 0;
  good.forEach(function (k) { sum += k; });
  return { ppm: (sum / good.length) * 1000, n: good.length, total: ks.length };
}

function loadPdfPlan(file, done) {
  hint('Читаю PDF…');
  var rd = new FileReader();
  rd.onload = function () {
    var pdfDoc = null;
    loadPdfJs().then(function (pdfjs) {
      return pdfjs.getDocument({ data: rd.result }).promise;
    }).then(function (pdf) {
      pdfDoc = pdf;
      return pdf.numPages > 1 ? pickPdfPages(file, pdf.numPages) : [1];
    }).then(function (pages) {
      // Первая страница — в текущий этаж, каждая следующая — в новый
      var chain = Promise.resolve();
      pages.forEach(function (pno, k) {
        chain = chain.then(function () {
          if (k > 0) {
            undoStack.push({ t: 'floorAdd' });
            DATA.floors.push({ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] });
            cur = DATA.floors.length - 1;
            renderTabs();
          }
          return pdfDoc.getPage(pno).then(renderPdfPage);
        });
      });
      return chain;
    }).then(function () {
      if (done) done();
    }).catch(function (e) {
      console.error('[plan_editor] pdf:', e);
      hint('');
      alert('Не удалось прочитать PDF «' + file.name +
        '». Сохраните план картинкой (скриншот страницы) и загрузите её.');
      if (done) done();
    });
  };
  rd.readAsArrayBuffer(file);
}

/**
 * Несколько страниц в PDF: этажи это или нужна одна. Раньше спрашивали только
 * номер страницы, а в мастере каждая страница молча становилась этажом —
 * лишние «2 этаж», «3 этаж» путали (03.10.2026). Резолвит список страниц.
 */
function pickPdfPages(file, n) {
  var ask = function () {
    var p = parseInt(prompt('В PDF «' + file.name + '» ' + n + ' стр. Какая страница с планом?', '1'), 10);
    return [(p >= 1 && p <= n) ? p : 1];
  };
  if (!UFH) return Promise.resolve(ask());
  return new Promise(function (res) {
    var div = document.createElement('div'); div.className = 'namepick';
    var all = [];
    for (var i = 1; i <= n; i++) all.push(i);
    var word = n % 10 === 1 && n % 100 !== 11 ? 'страница' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'страницы' : 'страниц';
    var fl = n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'этажа' : 'этажей';
    div.innerHTML = '<div class="box"><h3>В файле ' + n + ' ' + word + '</h3>' +
      '<div class="sub">Это план нескольких этажей — по странице на этаж — или нужна одна страница?' +
      (n > 2 ? ' Калькулятор считает два этажа.' : '') + '</div>' +
      '<div class="grid" style="flex-direction:column;align-items:stretch">' +
      (n <= 4 ? '<button class="calc" data-a="all">Это ' + n + ' ' + fl + ' — по странице на этаж</button>' : '') +
      '<button data-a="one">Только первая страница</button>' +
      '<button data-a="pick">Другая страница…</button></div></div>';
    div.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      var a = b.getAttribute('data-a');
      div.remove();
      res(a === 'all' ? all : a === 'pick' ? ask() : [1]);
    };
    document.body.appendChild(div);
  });
}

/** Страница PDF → подложка текущего этажа (с размерными числами для масштаба). */
function renderPdfPage(page) {
  var vp1 = page.getViewport({ scale: 1 });
  var k = Math.min(4, 1600 / Math.max(vp1.width, vp1.height));
  var vp = page.getViewport({ scale: k });
  var c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  var g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);  // PDF бывает прозрачным
  // Размерные числа читаем ДО applyPlanCanvas: он сам зовёт автоподбор
  // масштаба, и к этому моменту размеры уже должны быть под рукой.
  var fi = cur;
  return page.getTextContent().then(function (tc) {
    PDF_DIMS[fi] = textItemsPx(tc, vp);
    PDF_AREAS[fi] = areaLabelsFrom(PDF_DIMS[fi]);
  }, function () { PDF_DIMS[fi] = null; PDF_AREAS[fi] = []; }).then(function () {
    return page.render({ canvasContext: g, viewport: vp }).promise;
  }).then(function () {
    // Страница-скан (текста почти нет) и подписей площадей не нашли — читаем картинку
    if (!(PDF_AREAS[fi] && PDF_AREAS[fi].length) && (!PDF_DIMS[fi] || PDF_DIMS[fi].length < 8)) {
      return readAreaLabelsFromCanvas(c).then(function (labs) { PDF_AREAS[fi] = labs; });
    }
  }).then(function () {
    applyPlanCanvas(c);
  });
}

/** Один файл (картинка или PDF) → подложка ТЕКУЩЕГО этажа; резолв по готовности */
function loadOne(file) {
  return new Promise(function (done) {
    if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      loadPdfPlan(file, done); return;
    }
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        // даунскейл: localStorage не резиновый, 1600 px хватает для печати подложкой
        var k = Math.min(1, 1600 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        // Подписи площадей на картинке читаем до масштаба: по ним он и подбирается
        var fi0 = cur;
        readAreaLabelsFromCanvas(c).then(function (labs) {
          PDF_AREAS[fi0] = labs;
          PDF_DIMS[fi0] = null;
          applyPlanCanvas(c);
          if (labs.length) hint('<span class=ok>На плане прочитано подписей площадей: ' + labs.length + '.</span> ' + (F().pxPerM ? '' : 'Дальше — масштаб.'));
          done();
        });
      };
      im.onerror = function () {
        alert('Не удалось прочитать файл «' + file.name + '».');
        done();
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function loadImage(inp) {
  var files = Array.prototype.slice.call(inp.files || []);
  inp.value = '';
  if (!files.length) return;
  // Один файл — в текущий этаж (замена подложки). Несколько — по этажам:
  // первый в текущий, если тот пуст, дальше каждый файл в новый этаж.
  var chain = Promise.resolve();
  files.forEach(function (file, idx) {
    chain = chain.then(function () {
      if (files.length > 1 && (idx > 0 || F().img)) {
        undoStack.push({ t: 'floorAdd' });
        DATA.floors.push({ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] });
        cur = DATA.floors.length - 1;
        renderTabs();
      }
      return loadOne(file);
    });
  });
  // мастер раскладки: после загрузки — масштаб, комнаты и радиаторы сами
  if (UFH) { chain.then(wzAfterLoad); return; }
  if (files.length > 1) chain.then(function () {
    // Масштаб на каждом этаже подбирается сам; напоминаем только про те,
    // где не вышло, — иначе подсказка гонит делать уже сделанное.
    var left = DATA.floors.filter(function (fl) { return fl.img && !fl.pxPerM; }).length;
    hint('Загружено файлов: ' + files.length + '. ' + (left
      ? 'Задайте масштаб на этажах, где он не подобрался: ' + left +
        ' из ' + DATA.floors.length + ' (вкладки сверху).'
      : 'Масштаб подобран на всех этажах — проверьте его и размечайте комнаты.'));
  });
}

function cs() { return F().w ? cv.width / F().w : 1; }  // канвас-пиксели на пиксель изображения

/**
 * Масштаб подложки на экране. Меняется только CSS-ширина канвы: сама она всегда
 * рисуется в 1200 точек, а клики пересчитываются через getBoundingClientRect
 * (см. evPt), поэтому от увеличения ничего не съезжает — ни зоны, ни радиаторы.
 * Плана мелкого чертежа иначе не разглядеть: обвести комнату по стенам, которые
 * в палец толщиной, невозможно.
 */
/**
 * Координатная сетка рабочего поля: точки с мелким шагом и крестики на каждом
 * пятом узле — так размечено поле в САПР. Пустой холст перестаёт быть просто
 * серым прямоугольником, а у подложки с полями видно, где кончается лист.
 *
 * Рисуется одним заполнением по образцу (createPattern): точек на холсте
 * больше семи тысяч, и класть их поштучно на каждую перерисовку — заметная
 * задержка при перетаскивании зон. Образец пересобирается только при смене
 * темы, ключ кэша — она же.
 */
var GRID_DOT = 12, GRID_CROSS = 5;   // шаг точек и через сколько точек крестик
var _gridPat = null, _gridKey = '';
function gridPattern() {
  var key = darkPlan ? 'd' : 'l';
  if (_gridPat && _gridKey === key) return _gridPat;
  var side = GRID_DOT * GRID_CROSS;
  var t = document.createElement('canvas');
  t.width = side; t.height = side;
  var g = t.getContext('2d');
  g.fillStyle = darkPlan ? '#343434' : '#d7d7d7';
  for (var y = 0; y < side; y += GRID_DOT)
    for (var x = 0; x < side; x += GRID_DOT) g.fillRect(x, y, 1, 1);
  // крестик в узле образца — он и повторится каждые пять точек
  g.strokeStyle = darkPlan ? '#4a4a4a' : '#b4b4b4';
