  for (var i = 0; i < n; i++) {
    var a = P[i], b = P[(i + 1) % n], ex = b[0] - a[0], ey = b[1] - a[1];
    var horiz = Math.abs(ey) <= 1.5 && Math.abs(ex) > 0.5 * ppm, vert = Math.abs(ex) <= 1.5 && Math.abs(ey) > 0.5 * ppm;
    if (!horiz && !vert) continue;
    var mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    var nrm = horiz ? [0, 1] : [1, 0];
    if (pip([mid[0] + nrm[0] * 4, mid[1] + nrm[1] * 4], P)) nrm = [-nrm[0], -nrm[1]];   // наружу
    var len = Math.max(Math.abs(ex), Math.abs(ey)), cnt = Math.max(6, Math.min(80, Math.round(len * k / 2)));
    var samples = [];
    for (var j = 0; j < cnt; j++) {
      var t = 0.1 + 0.8 * (j + 0.5) / cnt;
      samples.push([(a[0] + ex * t) * k, (a[1] + ey * t) * k]);
    }
    var frac = function (o) {
      var c = 0;
      for (var q = 0; q < samples.length; q++) if (wallAt(samples[q][0] + nrm[0] * o, samples[q][1] + nrm[1] * o)) c++;
      return c / samples.length;
    };
    var sh = 0, o;
    if (frac(0) > 0.5) {
      for (o = 1; o <= IN; o++) if (frac(-o) <= 0.35) { sh = -o; break; }
    } else {
      for (o = 1; o <= SN; o++) if (frac(o) >= 0.5) { sh = o - 1; break; }
    }
    if (!sh) continue;
    var d = sh / k;
    var i2 = (i + 1) % n;
    moved = true;
    if (horiz) { dyV[i] = nrm[1] * d; dyV[i2] = nrm[1] * d; }
    else { dxV[i] = nrm[0] * d; dxV[i2] = nrm[0] * d; }
  }
  if (!moved) return P;
  var out = P.map(function (q, j) { return [Math.round(q[0] + (dxV[j] || 0)), Math.round(q[1] + (dyV[j] || 0))]; });
  var A0 = area(P), A1 = area(out);
  return (A1 > 0.6 * A0 && A1 < 1.6 * A0) ? out : P;
}

/** Комнаты плана, в которых стоит ровно одна подпись площади: [{ room, label }] */
function printedPairs(rooms, labs) {
  var out = [];
  rooms.forEach(function (r) {
    var inside = labs.filter(function (l) { return pip([l.x, l.y], r.pts); });
    if (inside.length === 1) out.push({ room: r, label: inside[0] });
  });
  return out;
}

/**
 * Масштаб по площадям, напечатанным на плане. Размерные числа могут дать
 * масштаб мимо (чужие цепочки, лишний слой), а подписи площадей комнат —
 * независимый свидетель: если три и больше комнат разом выходят меньше или
 * больше подписанных в одно и то же число раз, неверен масштаб, а не стены.
 * Возвращает новый px/м или 0, если поправка не нужна.
 */
function scaleFromPrinted(rooms, labs) {
  var f = F(), pr = printedPairs(rooms, labs).map(function (p) {
    return { r: p.label.m2 / area(p.room.pts) };
  }).filter(function (p) { return isFinite(p.r) && p.r > 0; });
  if (pr.length < 3) return 0;
  var med = median(pr.map(function (p) { return p.r; }));
  var near = pr.filter(function (p) { return Math.abs(p.r / med - 1) <= 0.1; });
  if (near.length < 3 || near.length < pr.length * 0.6) return 0;
  if (Math.abs(med - 1) <= 0.1) return 0;
  var ppm = f.pxPerM / Math.sqrt(med);
  return (ppm > 10 && ppm < 600) ? ppm : 0;
}

/** Итог сверки для подсказки: сколько комнат сошлось с подписями на плане */
function printedNote(labs) {
  if (!labs || !labs.length) return '';
  var ok = 0, n = 0, bad = [];
  labs.forEach(function (l) {
    var best = null, ba = Infinity;
    F().zones.forEach(function (z) {
      if (z.mergedM2 || !pip([l.x, l.y], z.pts)) return;      // объединённая зона сверяется суммой таблицы, не одной подписью
      var a = area(z.pts);
      if (a < ba) { ba = a; best = z; }
    });
    if (!best) return;
    n++;
    if (Math.abs(ba - l.m2) / l.m2 <= 0.10) ok++;
    else bad.push(ba.toFixed(1).replace('.', ',') + ' вместо ' + String(l.m2).replace('.', ','));
  });
  if (!n) return '';
  var scan = labs.some(function (l) { return l.scan; });
  return ' Контуры комнат — по стенам плана; площади сверены с подписями' + (scan ? ' (прочитаны со снимка — сверьте цифры с планом)' : '') +
    ': сошлось ' + ok + ' из ' + n +
    (bad.length ? ' (контур расходится: ' + bad.join('; ') + ' м²; такие комнаты подсвечены жёлтым — потяните стороны к стенам или <a href="#" onclick="acceptAllDisputed();return false" style="color:inherit;font-weight:700">примите как подписано</a>)' : '') + '. В расчёт идут площади с плана.';
}

/**
 * Сверка найденных комнат с подписанными площадями: для каждой подписи берём
 * вариант, который ближе к ней, — с ростом до стены или без него (рост вытекает
 * через проём, если за стеной свободное место). Комнате ставим printed, и по
 * нему же в конце видно, сколько комнат сошлось.
 */
function reconcileRooms(rooms, labs) {
  var alt = [];
  GROW_ROOMS = false; resetScaleCaches();
  try { alt = enumerateRooms(); } catch (e) { alt = []; }
  GROW_ROOMS = true; resetScaleCaches();
  var out = rooms.slice();
  labs.forEach(function (l) {
    var pick = function (list) {
      var best = -1, ba = Infinity;
      list.forEach(function (r, i) {
        if (!pip([l.x, l.y], r.pts)) return;
        var a = area(r.pts);
        if (a < ba) { ba = a; best = i; }     // самая малая из вложенных
      });
      return best;
    };
    var ia = pick(out), ib = pick(alt);
    if (ia < 0) return;
    var A = area(out[ia].pts), B = ib >= 0 ? area(alt[ib].pts) : Infinity;
    var eA = Math.abs(A - l.m2) / l.m2, eB = Math.abs(B - l.m2) / l.m2;
    if (ib >= 0 && eB + 0.02 < eA) out[ia] = alt[ib];
  });
  printedPairs(out, labs).forEach(function (p) { p.room.printed = p.label.m2; if (p.label.name) p.room.pname = p.label.name; });
  return out;
}

/**
 * Контур комнаты, найденный кликом, — тем же путём, что у «Найти комнаты»:
 * вариант с подписанной на плане площадью (другая маска, без разрастания), посадка сторон
 * на стены и подгонка под напечатанное. Без этого контур по клику брался как есть и на плане,
 * исчерченном трубами, получался с отступами от стен (4,4 м² вместо 6,15).
 */
function refineClickPoly(poly, p) {
  var labs = PDF_AREAS[cur] || [], ppm = F().pxPerM || 100;
  var inside = labs.filter(function (l) { return pip([l.x, l.y], poly); });
  if (inside.length !== 1) {
    try { return { pts: fitZonePts(poly, ppm, 0), fitted: true }; } catch (e) { return { pts: poly, fitted: false }; }
  }
  var target = inside[0].m2, fl = F(), best = poly, bestErr = Math.abs(area(poly) - target) / target;
  try {
    // тот же клик при другой маске: на исчерченном плане «чистая» находит комнату целиком
    var mode0 = fl.roomMask;
    if (mode0 === 'clean') delete fl.roomMask; else fl.roomMask = 'clean';
    resetScaleCaches();
    var alt = null;
    try { alt = roomAtPoint(p[0], p[1]); } catch (e) { alt = null; }
    if (mode0) fl.roomMask = mode0; else delete fl.roomMask;
    resetScaleCaches();
    if (alt) {
      var e2 = Math.abs(area(alt) - target) / target;
      if (e2 + 0.02 < bestErr) { best = alt; bestErr = e2; }
    }
    var rr = reconcileRooms([{ pts: best, m2: area(best) }], labs);
    if (rr && rr[0]) {
      var e3 = Math.abs(area(rr[0].pts) - target) / target;
      if (e3 + 0.02 < bestErr) { best = rr[0].pts; bestErr = e3; }
    }
    return { pts: fitZonePts(best, ppm, target), fitted: true };
  } catch (e) {
    console.error('[plan_editor] refine:', e);
    return { pts: poly, fitted: false };
  }
}

/** Напечатанная на плане площадь у одной зоны — как это делает «Найти комнаты» для всех. */
function markPrintedZone(z) {
  if (!z || z.type === 'cold') return;
  delete z.printedM2; delete z.printedSig; delete z.planM2;
  var labs = PDF_AREAS[cur] || [];
  var inside = labs.filter(function (l) { return pip([l.x, l.y], z.pts); });
  if (inside.length !== 1) return;
  z.planM2 = inside[0].m2;
  var A = area(z.pts);
  if (Math.abs(A - inside[0].m2) / inside[0].m2 <= (inside[0].scan ? 0.08 : 0.15)) { z.printedM2 = inside[0].m2; z.printedSig = JSON.stringify(z.pts); }
  renderZones(); draw();
}

/** Разметка без картинок — в буфер обмена, для разбора присланных случаев. */
function dumpPlan() {
  var txt = JSON.stringify({ floors: DATA.floors.map(function (f) { var o = {}; for (var k in f) if (k !== 'img' && Object.prototype.hasOwnProperty.call(f, k)) o[k] = f[k]; return o; }) });
  var done = function () { hint('<span class=ok>Разметка скопирована</span> (' + Math.round(txt.length / 1024) + ' КБ) — вставьте её в сообщение.'); };
  var fallback = function () { window.prompt('Скопируйте разметку (Ctrl+C):', txt); };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
}

function addZone(pts, fitted) {
  if (!fitted) pts = simplifyZone(pts, F().pxPerM || 100);
  var type = document.getElementById('ztype').value;
  if (type === 'boiler' && cur !== 0) { alert('Котельная отмечается только на 1 этаже — переключитесь на вкладку «1 этаж».'); return; }
  if (type === 'boiler' && F().zones.some(function (z) { return z.type === 'boiler'; })) {
    alert('Котельная на этаже уже отмечена.'); return;
  }
  pushUndo('zones');
  var nz = { type: type, name: '', pts: pts };
  F().zones.push(nz);
  if (type === 'wc' && fixAuto) hint('Впишите имя санузла как в расчёте — приборы расставятся сами.');
  renderZones();
  if (UFH) {
    // раскладка: обвели место без обогрева — назад к клику по комнатам;
    // обвели комнату рамкой — это тёплый пол, спросим имя
    // На шаге «Комнаты» рамка обводит комнату без тёплого пола (тип «Помещение»)
    if (type === 'cold') { document.getElementById('ztype').value = 'tp'; setMode('room'); }
    else {
      if (type === 'tp' && !F().coll) ufhAutoColl(F());
      // Тёплый пол на части комнаты (рамкой или по точкам): имя берём у комнаты,
      // внутри которой он лежит, — спрашивать нечего. Разметка комнаты остаётся.
      var host = null;
      if (type === 'tp') {
        var cc = centroid(nz.pts);
        F().zones.forEach(function (q) {
          if (q !== nz && q.type !== 'cold' && q.type !== 'tp' && q.name && pip(cc, q.pts)) host = q;
        });
      }
      if (host) {
        nz.name = host.name; if (host.roomId != null) nz.roomId = host.roomId;
        renderZones(); draw();
        hint('<span class=ok>Тёплый пол на части «' + host.name + '»: ' + Math.abs(area(nz.pts)).toFixed(1).replace('.', ',') +
          ' м².</span> Контур можно поправить: тяните узлы, правый клик по стороне — добавить точку, по углу — убрать. Обведите ещё участок или кликните по следующей комнате.');
      } else ufhAskName(nz);
      if (type === 'tp' && (mode === 'poly' || mode === 'rect')) setMode('room');
      // обвели комнату на шаге «Комнаты» — рамка одноразовая: назад к выбору, иначе клики по плану рисуют новые рамки
      else if (type !== 'tp' && (mode === 'poly' || mode === 'rect')) { setMode(mode); selZ = F().zones.length - 1; draw(); }
    }
  }
}

/**
 * Галочка «тёплый пол» в списке комнат мастера — то же, что клик по комнате
 * на плане (ufhToggle), только без поиска комнаты по точке.
 */
function ufhSetTp(z, on) {
  var f = F(), zs = f.zones, key = JSON.stringify(z.pts);
  var copy = null;
  zs.forEach(function (q) { if (q !== z && q.type === 'tp' && JSON.stringify(q.pts) === key) copy = q; });
  pushUndo('zones');
  if (on) {
    if (z.type === 'room') z.type = 'tp';
    else if (z.type !== 'tp' && !copy) zs.push({ type: 'tp', name: z.name, roomId: z.roomId, pts: JSON.parse(JSON.stringify(z.pts)) });
    if (!f.coll) ufhAutoColl(f);
  } else if (copy) zs.splice(zs.indexOf(copy), 1);
  else if (z.type === 'tp') z.type = 'room';
  renderZones(); draw();
}

/** Список комнат мастера: галочка «тёплый пол», имя с подсказками, площадь, ✕. */
var RN_MAP = {};
/**
 * Номера комнат этажа: в порядке чтения — сверху вниз, в одном ряду слева направо. Ряд — комнаты, чьи верхние
 * края отличаются не больше чем на 1,2 м. Копия контура тёплого пола несёт номер своей комнаты. Ключ — контур зоны.
 */
function roomNums(f) {
  var tol = 1.2 * (f.pxPerM || 100), list = [], map = {};
  f.zones.forEach(function (z) {
    if (z.type === 'cold' || !z.pts || z.pts.length < 3 || isTpCopy(f, z)) return;
    var x0 = 1e9, y0 = 1e9;
    z.pts.forEach(function (p) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); });
    list.push({ z: z, x: x0, y: y0 });
  });
  list.sort(function (a, b) { return a.y - b.y; });
  var rows = [];
  list.forEach(function (it) {
    var row = rows.length ? rows[rows.length - 1] : null;
    if (row && Math.abs(it.y - row.y) <= tol) row.items.push(it); else rows.push({ y: it.y, items: [it] });
  });
  var n = 0;
  rows.forEach(function (row) {
    row.items.sort(function (a, b) { return a.x - b.x; });
    row.items.forEach(function (it) { n++; map[JSON.stringify(it.z.pts)] = n; });
  });
  return map;
}

/** Строка таблицы комнат, выбранной на плане: подсветить и показать (прокрутить), если выбор сменился */
var hiliteLast = -2;
function ufhHilite() {
  var rows = document.querySelectorAll('#zones .zone[data-zi]');
  if (!rows.length) rows = document.querySelectorAll('.zone[data-zi]');
  var hit = null;
  Array.prototype.forEach.call(rows, function (r) {
    var on = selZ >= 0 && (',' + r.getAttribute('data-zi') + ',').indexOf(',' + selZ + ',') >= 0;
    r.classList.toggle('zsel', on);
    if (on) hit = r;
  });
  if (hiliteLast !== selZ) {
    hiliteLast = selZ;
    if (hit && hit.scrollIntoView) { try { hit.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
}

/** Кружок с номером в левом верхнем углу каждой комнаты (тот же номер — в таблице справа) */
function roomBadgesDraw(f, k) {
  var map = roomNums(f);
  f.zones.forEach(function (z) {
    var n = map[JSON.stringify(z.pts)];
    if (!n || z.type === 'cold' || isTpCopy(f, z)) return;
    var x0 = 1e9, y0 = 1e9;
    z.pts.forEach(function (p) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); });
    var best = z.pts[0], bd = 1e18;
    z.pts.forEach(function (p) { var d = (p[0] - x0) + (p[1] - y0); if (d < bd) { bd = d; best = p; } });
    // размер — в экранных пикселях: холст сжат CSS-ом (масштаб плана, окно), поэтому делим на коэффициент сжатия
    var ds = (cv.getBoundingClientRect().width / cv.width) || 1, sc = Math.min(6, Math.max(1, 1 / ds));
    var R = 13 * sc, bx = best[0] * k + R + 2 * sc, by = best[1] * k + R + 2 * sc, txt = String(n);
    cx.save();
    cx.beginPath(); cx.arc(bx, by, R, 0, 6.2832);
    cx.fillStyle = '#2563eb'; cx.fill(); cx.strokeStyle = '#fff'; cx.lineWidth = 2 * sc; cx.stroke();
    cx.fillStyle = '#fff'; cx.font = 'bold ' + Math.round((txt.length > 1 ? 14 : 17) * sc) + 'px system-ui';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(txt, bx, by + sc);
    cx.restore();
  });
}

function renderZonesUfh(box) {
  var f = F();
  RN_MAP = roomNums(f);
  // строки — в порядке номеров (как кружки на плане); без номера («без обогрева») — в конце
  f.zones.map(function (z, i) { return { z: z, i: i, n: RN_MAP[JSON.stringify(z.pts)] || 1e9 }; })
    .sort(function (a, b) { return a.n - b.n || a.i - b.i; })
    .forEach(function (it) {
    var z = it.z, i = it.i;
    if (isTpCopy(f, z)) return;                       // вторая зона той же комнаты — одной строкой
    var d = document.createElement('div'); d.className = 'zone';
    var cold = z.type === 'cold';
    var key = JSON.stringify(z.pts);
    // номер комнаты — тот же, что кружком на плане; клик по строке выделяет комнату на плане, и наоборот
    var idxs = [];
    f.zones.forEach(function (q, qi) { if (q === z || (!cold && q.type !== 'cold' && JSON.stringify(q.pts) === key)) idxs.push(qi); });
    d.setAttribute('data-zi', idxs.join(','));
    var rnum = RN_MAP[key];
    var rn = document.createElement('span'); rn.className = 'rn' + (rnum ? '' : ' none'); rn.textContent = rnum || '–';
    d.appendChild(rn);
    d.onclick = function (e) {
      var tg = e.target && e.target.tagName;
      if (tg === 'INPUT' || tg === 'BUTTON' || tg === 'LABEL' || (e.target.className === 'del')) return;
      selZ = i; draw();
    };
    var tpOn = z.type === 'tp' || f.zones.some(function (q) { return q !== z && q.type === 'tp' && JSON.stringify(q.pts) === key; });
    var sw = document.createElement('span'); sw.className = 'sw';
    sw.style.background = cold ? TYPES.cold[1] : tpOn ? TYPES.tp[1] : TYPES.room[1];
    d.appendChild(sw);
    if (cold) {
      var lb = document.createElement('span'); lb.className = 'zt'; lb.textContent = 'Без обогрева';
      lb.style.flex = '1 1 auto'; d.appendChild(lb);
    } else {
      var ch = document.createElement('label'); ch.className = 'tpchk';
      ch.title = 'Тёплый пол в этой комнате';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = tpOn;
      cb.onchange = function () { ufhSetTp(z, cb.checked); };
      ch.appendChild(cb); ch.appendChild(document.createTextNode('ТП'));
      d.appendChild(ch);
      var inp = document.createElement('input'); inp.type = 'text';
      inp.placeholder = 'название комнаты'; inp.value = z.name || '';
      inp.setAttribute('list', 'ufhNames');
      inp.oninput = function () {
        // имя одно на комнату: у санузла с тёплым полом — и у второй зоны
        f.zones.forEach(function (q) { if (q === z || JSON.stringify(q.pts) === key) { q.name = inp.value; q.roomId = roomIdByName(inp.value); } });
        draw();
      };
      d.appendChild(inp);
    }
    var ar = document.createElement('span'); ar.className = 'ar';
    // тёплый пол на части комнаты: показываем, сколько из площади комнаты занято
    var parts = 0, isPart = false;
    if (!cold) {
      f.zones.forEach(function (q) {
        if (q === z || q.type !== 'tp' || !q.name || q.name !== z.name || JSON.stringify(q.pts) === key) return;
        if (z.type === 'tp') isPart = true; else parts += zoneM2(q);
      });
    }
    if (cold) ar.textContent = zoneM2(z).toFixed(1).replace('.', ',') + ' м²';
    else {
      // площадь — поле: вписать числом, если контур не нужен или не сходится с подписью
      var am2 = document.createElement('input'); am2.type = 'number'; am2.step = '0.1'; am2.min = '0';
      am2.className = 'ar-in'; am2.title = 'Площадь, м² — можно вписать числом';
      am2.value = zoneM2(z).toFixed(1);
      am2.onchange = function () {
        pushUndo('zones');
        var v = parseFloat(String(am2.value).replace(',', '.'));
        f.zones.forEach(function (q) {
          if (q !== z && JSON.stringify(q.pts) !== key) return;
          if (v > 0) q.manualM2 = Math.round(v * 100) / 100; else delete q.manualM2;
        });
        renderZones(); draw();
      };
      ar.appendChild(am2); ar.appendChild(document.createTextNode(' м²'));
      if (isPart) {
        var pb = document.createElement('span'); pb.textContent = ' часть';
        pb.style.cssText = 'font-size:11px;color:#d97706'; pb.title = 'Участок тёплого пола внутри комнаты «' + z.name + '»';
        ar.appendChild(pb);
      }
      if (parts > 0) {
        var ps = document.createElement('span');
        ps.textContent = ' · ТП ' + parts.toFixed(1).replace('.', ',');
        ps.style.cssText = 'font-size:11px;color:#16a34a'; ps.title = 'Тёплый пол занимает ' + parts.toFixed(1).replace('.', ',') + ' м² этой комнаты';
        ar.appendChild(ps);
      }
    }
    var dsp = zoneDisputed(z);
    if (dsp) {
      d.style.background = 'rgba(245,158,11,.16)'; d.style.boxShadow = 'inset 3px 0 0 #f59e0b';
      var tipTxt = 'Контур комнаты на плане — ' + dsp.geom.toFixed(1).replace('.', ',') + ' м², а подписано ' +
        String(dsp.plan).replace('.', ',') + ' м². Нажмите, чтобы принять как подписано: контур останется, в расчёт пойдёт ' +
        String(dsp.plan).replace('.', ',') + ' м². Или потяните стороны к стенам — подсветка погаснет, когда площади сойдутся.';
      var wn = document.createElement('button'); wn.type = 'button';
      wn.textContent = '⚠ принять ' + String(dsp.plan).replace('.', ',');
      wn.style.cssText = 'font-size:11px;padding:2px 6px;white-space:nowrap;border-color:#d97706;color:#92400e;background:#fef3c7;cursor:pointer';
      wn.title = tipTxt;
      wn.onclick = function () { acceptPlanArea(z); };
      d.appendChild(wn);
    } else if (z.acceptSig && z.acceptSig === JSON.stringify(z.pts)) {
      var okm = document.createElement('span'); okm.textContent = '✓';
      okm.style.cssText = 'color:#16a34a;font-weight:700;cursor:help';
      okm.title = 'Принята площадь с плана — ' + String(z.planM2).replace('.', ',') + ' м². Контур не менялся.';
      d.appendChild(okm);
    }
    d.appendChild(ar);
    var del = document.createElement('span'); del.className = 'del'; del.textContent = '✕';
    del.title = 'Убрать';
    del.onclick = function () {
      pushUndo('zones');
      for (var k = f.zones.length - 1; k >= 0; k--)
        if (f.zones[k] === z || (!cold && f.zones[k].type !== 'cold' && JSON.stringify(f.zones[k].pts) === key)) f.zones.splice(k, 1);
      renderZones(); draw();
    };
    d.appendChild(del);
    box.appendChild(d);
    if (wwLayer() === 'water') {
      var wwd = DATA.floors[0].water, wci = wwd ? wwCardIdx(wwd, cur, z) : -1;
      if (wci >= 0) { d.style.background = 'rgba(11,114,133,.14)'; box.appendChild(wwChips(wwd, wci)); }
    }
  });
  if (wwLayer() === 'water') wwOrphans(box);
  if (!f.zones.length) {
    var em = document.createElement('div'); em.className = 'pempty';
    em.textContent = f.img ? (f.pxPerM ? 'Комнаты ещё не найдены' : 'Сначала масштаб') : 'Загрузите план этажа';
    box.appendChild(em);
  }
  var rc = (f.rads || []).length;
  if (rc) {
    var rd = document.createElement('div'); rd.className = 'zone';
    rd.innerHTML = '<span class="sw" style="background:#d22222"></span><span class="zt">Радиаторы</span>' +
      '<span style="flex:1 1 auto"></span><span class="ar">' + rc + ' шт.</span>';
    box.appendChild(rd);
  }
  var sum = document.getElementById('zsummary');
  if (sum) sum.innerHTML = '';
  ufhHilite();
}

/** Зона с именем «Котельная…», обведённая не тем типом — найти (на любом этаже котельной ещё нет). */
function boilerLookalike() {
  if (cur !== 0) return null;      // котельная — только на 1 этаже
  if (DATA.floors.some(function (fl) { return (fl.zones || []).some(function (z) { return z.type === 'boiler'; }); })) return null;
  var found = null;
  F().zones.forEach(function (z) {
    if (!found && z.type !== 'boiler' && z.type !== 'cold' && /котельн/i.test(z.name || '')) found = z;
  });
  return found;
}

/** Одна кнопка: зона «Котельная», обведённая как тёплый пол, становится котельной. */
function makeBoiler(z) {
  z = z || boilerLookalike();
  if (!z) return;
  pushUndo('zones');
  // Котельная — отдельная зона поверх комнаты: тёплый пол и радиаторы под ней остаются
  var ov = { type: 'boiler', name: z.name || '', pts: z.pts.map(function (q) { return [q[0], q[1]]; }) };
  if (z.roomId != null) ov.roomId = z.roomId;
  F().zones.push(ov);
  renderZones(); draw();
  if (typeof updateGuide === 'function') updateGuide();
  hint('<span class=ok>Котельная отмечена: «' + (z.name || 'Котельная') + '».</span> Тёплый пол в ней остался. Нажмите «Сохранить».');
}

/** Удалить зону по индексу и сбросить всё, что на неё указывало: выбор, наведение,
 *  перетаскивание, незавершённый контур. Без этого после удаления индексы и
 *  перетаскивание указывали на чужую зону или на пустоту, и кнопки на плане
 *  переставали реагировать. */
function deleteZoneAt(i) {
  if (!F().zones[i]) return;
  pushUndo('zones');
  F().zones.splice(i, 1);
  selZ = -1; hoverZ = hoverV = hoverE = -1;
  dragZ = null; dragA = null; tmp = []; polyCur = null;
  justDragged = 0;
  renderZones(); draw();
}

function renderZones() {
  var box = document.getElementById('zlist'); box.innerHTML = '';
  if (UFH) { renderZonesUfh(box); return; }
  F().zones.forEach(function (z, i) {
    var d = document.createElement('div'); d.className = 'zone';
    var sw = document.createElement('span'); sw.className = 'sw';
    sw.style.background = TYPES[z.type][1]; d.appendChild(sw);
    var lb = document.createElement('span'); lb.className = 'zt';
    lb.textContent = TYPES[z.type][0]; d.appendChild(lb);
    if (z === boilerLookalike()) {
      d.style.background = 'rgba(245,158,11,.16)'; d.style.boxShadow = 'inset 3px 0 0 #f59e0b';
      var mb = document.createElement('button'); mb.type = 'button';
      mb.textContent = '→ котельная';
      mb.title = 'Зона названа котельной, но обведена как «' + TYPES[z.type][0] + '». Нажмите, чтобы сделать её котельной.';
      mb.style.cssText = 'font-size:11px;padding:2px 6px;white-space:nowrap;border-color:#d97706;color:#92400e;background:#fef3c7;cursor:pointer';
      mb.onclick = function () { makeBoiler(z); };
      d.appendChild(mb);
    }
    var inp = document.createElement('input'); inp.type = 'text';
    inp.placeholder = 'помещение…'; inp.value = z.name;
    if (roomNames.length) inp.setAttribute('list', 'roomNames');
    inp.oninput = function () {
      z.name = inp.value;
      z.roomId = roomIdByName(inp.value);
      // санузел подписали именем из расчёта — приборы появляются сразу
      if (z.type === 'wc' && fixAuto) { refreshAutoFixtures(); renderZones(); }
      draw();
    };
    d.appendChild(inp);
    // Вид укладки: по умолчанию улитка, в узком месте змейка — как в проектах;
    // монтажник может задать своё для зоны.
    if (z.type === 'tp') {
      var ls = document.createElement('select'); ls.className = 'lay';
      ls.title = 'Укладка петель: «авто» — улитка, а в узком месте (уже 1,2 м) змейка';
      [['', 'авто'], ['spiral', 'улитка'], ['snake', 'змейка']].forEach(function (o) {
        var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1];
        if ((z.lay || '') === o[0]) op.selected = true;
        ls.appendChild(op);
      });
      ls.onchange = function () {
        pushUndo('zones');
        if (ls.value) z.lay = ls.value; else delete z.lay;
        draw();
      };
      d.appendChild(ls);
    }
    var ar = document.createElement('span'); ar.className = 'ar';
    if (z.type === 'wc') {
      var card = wcCardOf(z.name);
      var cnt = 0;
      if (card) Object.keys(card.fixtures || {}).forEach(function (k) { cnt += +card.fixtures[k] || 0; });
      ar.textContent = card ? (cnt + ' приб.') : 'имя не найдено';
      ar.style.color = card ? 'var(--ok)' : '#EF4444';
      ar.title = card ? 'Приборы взяты из карточки санузла в расчёте'
        : 'Впишите имя санузла так же, как в расчёте — приборы подставятся сами';
    } else {
      // площадь — поле: вписать вручную, если контур и подпись не сходятся
      var am = document.createElement('input'); am.type = 'number'; am.step = '0.1'; am.min = '0';
      am.className = 'ar-in'; am.title = 'Площадь, м² — можно вписать вручную';
      am.value = zoneM2(z).toFixed(1);
      am.onchange = function () {
        pushUndo('zones');
        var v = parseFloat(String(am.value).replace(',', '.'));
        if (v > 0) z.manualM2 = Math.round(v * 100) / 100; else delete z.manualM2;
        renderZones(); draw();
      };
      ar.appendChild(am); ar.appendChild(document.createTextNode(' м²'));
    }
    d.appendChild(ar);
    var del = document.createElement('span'); del.className = 'del'; del.textContent = '✕';
    del.onclick = function () { deleteZoneAt(i); };
    d.appendChild(del);
    box.appendChild(d);
  });
  var rc = (F().rads || []).length;
  if (!F().zones.length && !rc) {
    var em = document.createElement('div'); em.className = 'pempty';
    em.textContent = F().pxPerM ? 'Зоны ещё не обведены' : 'Задайте масштаб, затем обведите зоны';
    box.appendChild(em);
  }
  if (rc) {
    var rd = document.createElement('div'); rd.className = 'zone';
    rd.innerHTML = '<span class="sw" style="background:#d22222"></span>' +
      '<span class="zt">Радиаторы</span>' +
      '<span style="flex:1 1 auto"></span>' +
      '<span class="ar">' + rc + ' шт.</span>';
    rd.title = 'Убрать радиатор — клик по значку в режиме «Радиаторы»';
    box.appendChild(rd);
  }

  // ── Сводка этажа и статусы: секция «параметр — значение» ─────────────────
  var sum = document.getElementById('zsummary');
  if (!sum) return;
  sum.innerHTML = '';
  var tpS = 0, tpN = 0;
  F().zones.forEach(function (z) { if (z.type === 'tp') { tpS += area(z.pts); tpN++; } });
  var hasB = DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });

  // Строка палитры: слева имя, справа значение. cls — good/warn, когда значение
  // само по себе статус, а не число.
  var rows = function (title, list) {
    var g = document.createElement('div'); g.className = 'pgroup';
    var h = '<div class="phead">' + title + '</div><div class="pbody">';
    list.forEach(function (r) {
      h += '<div class="prow"><span class="k">' + r[0] + '</span>' +
        '<span class="v' + (r[2] ? ' ' + r[2] : '') + '">' + r[1] + '</span></div>';
    });
    g.innerHTML = h + '</div>';
    sum.appendChild(g);
    return g;
  };

  var fl = UFH ? [['Тёплый пол', tpN ? tpN + ' комн. · ' + tpS.toFixed(1) + ' м²' : '—']] : [
    ['Тёплый пол', tpN ? tpN + ' зон · ' + tpS.toFixed(1) + ' м²' : '—'],
    ['Радиаторы', rc ? rc + ' шт.' : '—'],
    ['Котельная', hasB ? (F().zones.some(function (z) { return z.type === 'boiler'; }) ? 'отмечена' : 'отмечена на ' + (DATA.floors.findIndex(function (fl) { return (fl.zones || []).some(function (z) { return z.type === 'boiler'; }); }) + 1) + ' этаже') : (cur !== 0 ? 'нужна на 1 этаже' : 'не отмечена'), hasB ? 'good' : 'warn']
  ];
  if (tpN) fl.push(['Коллектор ТП', F().coll ? 'отмечен' : 'не отмечен',
    F().coll ? 'good' : 'warn']);

  // санузлы и приборы: видно, что уйдёт на листы водоснабжения и канализации
  var fxs = F().fixtures || [];
  var wcz = F().zones.filter(function (z) { return z.type === 'wc'; });
  if (!UFH && (wcz.length || fxs.length || calcWc.length)) {
    var noName = wcz.filter(function (z) { return !wcCardOf(z.name); }).length;
    var risers = fxs.filter(function (q) { return q.t === 'riser'; }).length;
    fl.push(['Санузлы', wcz.length ? wcz.length + ' зон' : '—']);
    if (noName) fl.push(['· без имени из расчёта', noName, 'warn']);
    fl.push(['Приборы санузлов', fxs.filter(function (q) { return q.t !== 'riser'; }).length || '—']);
    fl.push(['Стояк канализации', risers ? risers + ' шт.' : 'нет', risers ? 'good' : 'warn']);
  }
  rows('Этаж ' + (cur + 1), fl);

  // ── Комнаты расчёта: клик подписывает первую безымянную зону ─────────────
  if (calcRooms.length) {
    var g = document.createElement('div'); g.className = 'pgroup';
    var h = '<div class="phead">Комнаты из расчёта <span class="note">клик — подписать зону</span></div>';
    calcRooms.forEach(function (r, idx) {
      var mt = [];
      mt.push('эт.' + r.floor);
      if (r.sys.indexOf('tp') >= 0) mt.push('ТП');
      if (r.sys.indexOf('rad') >= 0) mt.push('рад.');
      if (r.win) mt.push(r.win + ' ок.');
      h += '<div class="croom" data-i="' + idx + '">' +
        '<span class="nm">' + r.name + '</span>' +
        '<span class="mt">' + (r.area ? (Math.round(r.area * 100) / 100) + ' м² · ' : '') + mt.join(' · ') + '</span></div>';
    });
    g.innerHTML = h;
    g.onclick = function (e) {
      var t = e.target && e.target.closest ? e.target.closest('.croom') : null;
      if (!t) return;
      var r = calcRooms[+t.getAttribute('data-i')];
      var z = null;
      for (var zi = 0; zi < F().zones.length; zi++)
        if (!F().zones[zi].name) { z = F().zones[zi]; break; }
      if (!z) { hint('Все зоны этажа уже подписаны — исправьте имя прямо в списке зон.'); return; }
      z.name = r.name;
      z.roomId = (r.id != null ? r.id : null);
      renderZones(); draw();
    };
    sum.appendChild(g);
  }
}

/**
 * Разметка в хранилище браузера. Подложку сюда не кладём — только имя её
 * файла на сервере: всё остальное вместе взятое весит единицы килобайт.
 *
 * keepImages — аварийный режим: сервер не ответил, и картинку приходится
 * держать в браузере по-старому, иначе работа монтажника пропадёт.
 */
function writeLocal(keepImages) {
  // Копируем этаж целиком и убираем только картинку: у этажа есть поля,
  // которые считаются на лету (leads — маршруты подводок к коллектору), и
  // перечислять их поимённо значило бы терять всё, что добавят потом.
  // forCalc — номер расчёта, которому принадлежат планы; его ставит
  // калькулятор перед открытием редактора. Проносим его через сохранение,
  // иначе соседняя вкладка калькулятора приняла бы эти планы за свои.
  var out = { key: planKey(), forCalc: DATA.forCalc || null, floors: DATA.floors.map(function (f) {
    var o = {};
    for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) o[k] = f[k];
    o.imgFile = f.imgFile || null;
    delete o.img;
    if (keepImages && f.img && f.img.indexOf('data:') === 0) o.img = f.img;
    return o;
  }) };
  try {
    localStorage.setItem('floor_plans_v1', JSON.stringify(out));
    return true;
  } catch (e) {
    return false;
  }
}

function saveAll() {
  ensureRadIds();
  refreshAutoFixtures();   // приборы санузлов из расчёта — на случай правок зон
  computeLeads();   // маршруты подводок к коллектору — свежие на момент сохранения
  computeVk();      // и трассы водоснабжения с канализацией
  computeSewerMain();     // лежак канализации до выпуска
  computeWaterTrunks();   // и магистрали воды от коллекторов до санузлов (шаг мастера «Санузлы и вода»)
  computeGeom();    // и контуры стен с окнами — по ним рисуются листы планов

  // Сначала кладём работу в браузер — вместе с подложками, чтобы ничего не
  // пропало, если отправка не удастся. Раньше «Сохранить» ждало сервера, и
  // на слабой связи монтажник минутами смотрел в «Отправляю подложки…», не
  // зная, идёт ли что-нибудь вообще. Теперь сохранение мгновенное, а
  // подложки уезжают следом, фоном, со счётчиком в полоске шагов.
  var full = writeLocal(true);
  if (!full && !writeLocal()) {
    alert('Не удалось сохранить разметку в браузере. Освободите место и попробуйте снова.');
    return Promise.resolve();
  }
  hint('<span class=ok>Сохранено.</span> ' + (full
    ? 'Откройте «Проект» — планы этажей и тёплый пол попадут в комплект.'
    : 'Разметка на месте, а подложки в браузер не поместились — не закрывайте вкладку, ' +
      'пока они не уедут на сервер.'));
  uploadPending();
  return Promise.resolve();
}

// Состояние фоновой отправки: {run, done, total, pct} или {err} после отказа.
// Показывается в полоске шагов, интерфейс её не ждёт.
var upState = null;

/** Отправляет на сервер подложки тех этажей, которых там ещё нет. */
function uploadPending() {
  if (upState && upState.run) return;   // уже едет — второй раз не начинаем
  var pending = [];
  DATA.floors.forEach(function (f, i) {
    if (f.img && f.img.indexOf('data:') === 0) pending.push(i);
  });
  if (!pending.length) { upState = null; updateGuide(); return; }

  upState = { run: true, done: 0, total: pending.length, pct: 0 };
  updateGuide();

  // Последовательно, а не разом: этаж — это сотни килобайт, и параллельные
  // загрузки с телефона на объекте только мешают друг другу.
  pending.reduce(function (chain, fi) {
    return chain.then(function () {
      return putFloorImage(fi, function (p) {
        upState.pct = p; updateGuide();
      }).then(function (name) {
        if (!name) return;
        DATA.floors[fi].imgFile = name;
        DATA.floors[fi].img = planUrl(name);
        upState.done++; upState.pct = 0;
        writeLocal(true);   // этот этаж уже на сервере — из браузера уходит
        updateGuide();
      });
    });
  }, Promise.resolve()).then(function () {
    upState = null;
    updateGuide();
  }).catch(function (e) {
    console.error('[plan_editor] загрузка подложки:', e);
    // Связи нет, сессия истекла или скрипт хранилища не отвечает. Работа не
    // потеряна: разметка вместе с подложками уже лежит в браузере.
    writeLocal(true);
    upState = { run: false, err: (e && e.message) ? e.message : 'нет связи' };
    updateGuide();
  });
}

// ═══ Режим «Раскладка тёплого пола» (?m=ufh) ═══════════════════════════
// Тот же план и те же зоны, что у проектирования, — только меньше шагов:
// план → комнаты → клик «тёплый пол здесь» → «Готово». Тёплый пол — зона
// 'tp', комната без него — зона 'room' (контур сохраняется, клик переключает
// тип). Имя зоны связывает её с комнатой расчёта: по нему калькулятор ставит
// и снимает галочку тёплого пола в карточке (app.syncRoomsFromPlan).

var UFH_NAMES = ['Гостиная', 'Кухня', 'Кухня-гостиная', 'Спальня', 'Детская', 'Кабинет',
  'Прихожая', 'Холл', 'Коридор', 'Санузел', 'С/у', 'Ванная', 'Гардеробная', 'Кладовая', 'Котельная', 'Тамбур'];

// Трассы радиаторов для холста — тот же projectPlans.radRoutes, что у сметы.
// Схема (лучевая или тройниковая) — из расчёта. Кэш по разметке этажа.
var radCache = { key: null, val: [], items: [] };
// Стороны подключения по моделям сметы: { комната: 'R'|'L'|'C'|'S' } — кладёт
// калькулятор при открытии окна (app.radConnMap)
var RAD_CONN = {};
try { RAD_CONN = JSON.parse(localStorage.getItem('heatcalc_rad_conn') || '{}') || {}; } catch (e) {}
/** Калькулятор, в котором открыто окно плана (iframe мастера или вкладка редактора). */
function radHostApp() {
  try { if (window.parent && window.parent !== window && window.parent.app) return window.parent.app; } catch (e) {}
  try { if (window.opener && !window.opener.closed && window.opener.app) return window.opener.app; } catch (e) {}
  return null;
}

/** Режим луча: { mode: 'single'|'auto', why } — why не пусто, когда переключатель не действует. Без калькулятора — из сохранения. */
function radBeamInfo() {
  var h = radHostApp();
  try { if (h && h.radBeamInfo) return h.radBeamInfo(); } catch (e) {}
  var st = {};
  try { st = JSON.parse(localStorage.getItem('stout_save')) || {}; } catch (e) {}
  var auto = st.radBeamMode ? st.radBeamMode === 'auto' : !!st.radSharedBeams;
  return { mode: auto ? 'auto' : 'single', why: st.radConnectionScheme === 'tee' ? 'в тройниковой схеме коллектора нет' : '' };
}

/** Комнаты с общей трассой — те же, что у сметы (калькулятор считает их по нагрузке приборов); null — режим «на каждый прибор». */
function radShareRooms() {
  var h = radHostApp(), info = radBeamInfo();
  if (info.mode !== 'auto' || info.why || !h || !h.radPlanDia) return null;
  try { return h.radPlanDia().radShare || null; } catch (e) { return null; }
}

function ufhRadRoutes(f, stepMm) {
  if (!window.projectPlans || !projectPlans.radRoutes || dragZ || dragC) return radCache.val;
  var tee = false;
  try { tee = (JSON.parse(localStorage.getItem('stout_save')) || {}).radConnectionScheme === 'tee'; } catch (e) {}
  var share = tee ? null : radShareRooms();
  var key = cur + '|' + stepMm + '|' + tee + '|' + JSON.stringify(share) + '|' + JSON.stringify([f.zones, f.rads, f.coll, f.radColl || null]);
  if (radCache.key === key) return radCache.val;
  var segs = [], items = [], outs = 0;
  try { var R = projectPlans.radRoutes(f, stepMm, tee, RAD_CONN, share); segs = R ? R.segs : []; items = R ? R.items : []; outs = R ? R.outs || 0 : 0; }
  catch (e) { console.error('[plan_editor] трассы радиаторов:', e); }
  radCache = { key: key, val: segs, items: items, outs: outs };
  return segs;
}

/** Кнопка рядом с «Автотрассы»: ветка на каждый прибор ↔ одна трасса на комнату. */
function radBeamBtn() {
  var info = radBeamInfo(), auto = info.mode === 'auto';
  var tip = info.why ? 'Сейчас недоступно: ' + info.why + '.'
    : (auto ? 'Автоподбор трассы: программа сама решает, где приборам комнаты хватает общей трассы (по нагрузке, скорости воды и потерям), а где нужна отдельная ветка. Нажмите — ветка на каждый прибор.'
      : 'Ветка на каждый прибор: ничего не объединяется, при нехватке Ø16, насоса или выходов покажем предупреждение. Нажмите — автоподбор трассы.');
  return '<button' + (info.why ? ' disabled' : '') + ' class="' + (auto ? 'go' : '') + '" title="' + tip + '" onmouseenter="radBeamTip(this)" onclick="radBeamToggle()">' +
    (auto ? 'Автоподбор трассы' : 'Ветка на каждый прибор') + '</button>';
}

/** Подсказка кнопки: сколько трубы и выходов экономит автоподбор против ветки на каждый прибор (считает калькулятор). */
function radBeamTip(el) {
  var h = radHostApp();
  try { var t = h && !radBeamInfo().why && h.radBeamCompareText ? h.radBeamCompareText() : ''; if (t) el.title = el.title.split('\n\n')[0] + '\n\n' + t; } catch (e) {}
}

/** Предупреждения по лучам (из расчёта сметы): причина и что делать. Пусто — всё хватает. */
function radWarnHtml() {
  var h = radHostApp(), w = [];
  try { if (h && h.radBeamWarnings) w = h.radBeamWarnings() || []; } catch (e) {}
  if (!w.length) return '';
  return '<div style="margin-top:6px;padding:6px 10px;border-radius:8px;background:#fff3e0;color:#7a3b00;font-size:12px;line-height:1.45">' +
    w.map(function (x) { return '<div><b>⚠ ' + x.title + '.</b> ' + x.text + ' <i>Что делать: ' + x.fix + '</i></div>'; }).join('') + '</div>';
}

function radBeamToggle() {
  var h = radHostApp(), info = radBeamInfo();
  if (!h || !h.setRadBeamMode) { hint('Переключатель работает из калькулятора — откройте план из сметы.'); return; }
  if (info.why) { hint('Общая трасса сейчас недоступна: ' + info.why + '.'); return; }
  h.setRadBeamMode(info.mode === 'auto' ? 'single' : 'auto');
  radCache.key = null;
  var f = F(); ufhRadRoutes(f, UFH_STEP[cur] || 150);
  var shared = radShareRooms(), n = shared ? Object.keys(shared).length : 0;
  hint(info.mode === 'auto'
    ? '<span class=ok>Ветка на каждый прибор.</span> Выходов коллектора: ' + (radCache.outs || (f.rads || []).length) + '. Смета и гидравлика пересчитаны; чего не хватает — в предупреждении ниже.'
    : '<span class=ok>Автоподбор трассы: ' + (n ? 'общая трасса в комнатах: ' + n + ', выходов коллектора: ' + (radCache.outs || '—') + '.'
      : 'объединять нечего — в комнатах по одному прибору или общей трассе не хватает по Ø16/Ø20, остаются отдельные ветки.') +
      '</span> Смета и гидравлика пересчитаны.');
  try { var cmp = h.radBeamCompareText(); if (cmp) hint(document.getElementById('hint').innerHTML + '<br><span style="white-space:pre-line">' + cmp + '</span>'); } catch (e) {}
  renderZones(); renderSteps(); draw();
}

/** Комната прибора — по ней берётся модель из сметы (как в radRoutes). */
function radRoomName(r) {
  var a = (r.ang || 0) * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a), d = 0.3 * (F().pxPerM || 100);
  var name = '';
  [[r.x + nx * d, r.y + ny * d], [r.x - nx * d, r.y - ny * d]].some(function (p) {
    for (var i = F().zones.length - 1; i >= 0; i--) {
      var q = F().zones[i];
      if (q.type !== 'cold' && pip(p, q.pts)) { name = q.name || ''; return true; }
    }
    return false;
  });
  return name;
}

/**
 * Повернуть коллектор на 90° вокруг своей оси. Положение определяет не стена
 * (она могла распознаться неверно), а монтажник: правый клик по значку или
 * клавиша R, пока курсор над ним. Значок на листах поворачивается так же.
 */
function collRotate(kind) {
  var f = F();
  pushUndo('zones');
  var cur0 = window.projectPlans && projectPlans.collAngle ? projectPlans.collAngle(f, kind === 'tp' ? 'tp' : 'rad') : 0;
  var a = (cur0 + 90) % 360;
  if (kind === 'tp') f.collAng = a; else f.radCollAng = a;
  hint('<span class=ok>Коллектор ' + (kind === 'tp' ? 'тёплого пола' : 'радиаторов') + ' повёрнут на 90°.</span> ' +
    'Отводы смотрят ' + ({ 0: 'вверх', 90: 'вправо', 180: 'вниз', 270: 'влево' })[a] + '. Правый клик по нему (или R над ним) — повернуть ещё раз.');
  renderZones(); draw();
}

/** Прибор прилипает к стене по нормали его угла: лучи в обе стороны, ближайшая
 *  стена — прибор отходит от неё на толщину стены и отступ. Работает для любого
 *  угла, в том числе 45° у скошенных граней эркера. */
function snapRadToWall(r, ang) {
  var f = F(), m = getMask();
  if (!m) return;
  var ppm = f.pxPerM || 100, a = ang * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a);
  var R = Math.round(0.5 * ppm * m.k), sx = Math.round(r.x * m.k), sy = Math.round(r.y * m.k), best = null;
  [1, -1].forEach(function (sg) {
    for (var d = 1; d <= R; d++) {
      var x = Math.round(sx + sg * nx * d), y = Math.round(sy + sg * ny * d);
      if (x < 0 || y < 0 || x >= m.w || y >= m.h) break;
      if (m.bar[y * m.w + x]) { if (!best || d < best.d) best = { d: d, sg: sg }; break; }
    }
  });
  if (!best) return;
  var off = best.d / m.k - 0.07 * ppm - 2;
  if (off > 0) { r.x = Math.round(r.x + best.sg * nx * off); r.y = Math.round(r.y + best.sg * ny * off); }
}

function radRotate(i) {
  var f = F(), r = f.rads[i];
  if (!r) return;
  pushUndo('zones');
  r.ang = (((r.ang || 0) % 180) === 90) ? 0 : 90;
  snapRadToWall(r, r.ang);
  hint('<span class=ok>Радиатор повёрнут — ' + (r.ang === 90 ? 'вертикально' : 'горизонтально') + '.</span> ' +
    'R над прибором или Shift + правый клик — повернуть ещё раз.');
  renderZones(); draw();
}

/** [ и ] над радиатором — поворот на 45° (скошенные грани эркера). Угол хранится в градусах,
 *  прибор снова прижимается к стене по новой нормали. */
function radTurnIdx(ri, delta) {
  var r = F().rads[ri];
  pushUndo('zones');
  r.ang = (((r.ang || 0) + delta) % 360 + 360) % 360;
  snapRadToWall(r, r.ang);
  hint('<span class=ok>Радиатор повёрнут на ' + Math.round(r.ang) + '°.</span> ' +
    '[ и ] — по 45°, R или пробел — 0° или 90°.');
  renderZones(); draw();
}
function radTurnAt(delta) {
  if (!UFH || !lastPt || !F().pxPerM) return false;
  var ri = radAt(lastPt);
  if (ri < 0) return false;
  radTurnIdx(ri, delta);
  return true;
}
/** Кнопки «↺ 45°» / «↻ 45°»: поворачивают прибор, над которым курсор был последним
 *  (сам курсор уходит на кнопку, поэтому запоминаем прибор, а не точку). */
function radTurnLast(delta) {
  if (!lastRad || lastRad.f !== cur || !F().rads[lastRad.i]) {
    hint('Наведите курсор на радиатор, затем нажмите кнопку поворота.');
    return;
  }
  radTurnIdx(lastRad.i, delta);
}

/** R (и русская К) над коллектором или радиатором — повернуть его */
var lastPt = null, lastRad = null;   // lastRad — последний прибор под курсором, с этажом
cv.addEventListener('mousemove', function (e) {
  lastPt = evPt(e);
  var ri = UFH && F().pxPerM ? radAt(lastPt) : -1;
  if (ri >= 0) lastRad = { f: cur, i: ri };
});
cv.addEventListener('mouseleave', function () { lastPt = null; });
function rotateUnderCursor() {
  if (!UFH || !lastPt || !F().pxPerM) return false;
  var ck = collAt(lastPt);
  if (ck) { collRotate(ck); return true; }
  var ri = radAt(lastPt);
  if (ri >= 0) { radRotate(ri); return true; }
  if (wwLayer()) {
    var fi1 = fixAt(lastPt), fq = fi1 >= 0 ? F().fixtures[fi1] : null;
    if (fq && fq.t !== 'riser') { fq.ang = (((fq.ang || 0) + 90) % 360); wwSavePos(fq); wwRefresh(); return true; }
  }
  return false;
}

/**
 * Правый клик по радиатору — развернуть подключение (левое ↔ правое). Так
 * бывает, когда прибор вешают иначе, чем подсказывает модель; выбор
 * монтажника хранится у прибора (r.conn) и главнее модели.
 */
function radFlip(i) {
  var r = F().rads[i];
  if (!r) return;
  var eff = projectPlans.radConnSide ? projectPlans.radConnSide(r, radRoomName(r), RAD_CONN) : (r.conn || 'R');
  pushUndo('zones');
  r.conn = eff === 'L' ? 'R' : 'L';
  hint('<span class=ok>Подключение радиатора — ' + (r.conn === 'R' ? 'справа' : 'слева') + '.</span> ' +
    'Правый клик по прибору ещё раз — развернуть обратно.');
  renderZones(); draw();
}

function ufhSteps() {
  var f = F();
  var anyRoom = f.zones.some(function (z) { return z.type !== 'cold'; });
  var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
  var L = [];
  L.push({ id: 'plan', t: 'План', ok: !!f.img, btn: ['b_upload'], tipBtn: 'b_upload',
    tip: 'Загрузите план этажа: фото, скан или PDF. Несколько файлов — каждый станет своим этажом. ' +
      'Дальше нажмите «Найти комнаты» — масштаб, стены и комнаты найдутся сами.' });
  L.push({ id: 'scale', t: 'Масштаб', ok: !!f.pxPerM, btn: ['b_autoscale', 'b_scale'], mode: 'scale',
    tipBtn: 'b_autoscale', demo: 'scale',
    tip: 'Масштаб подбирается сам — по размерам на чертеже или по площадям комнат расчёта. Не подобрался — ' +
      '«Масштаб»: две точки на плане (например, края дверного проёма) и длина между ними в метрах.' });
  L.push({ id: 'rooms', t: 'Комнаты', ok: anyRoom, btn: ['b_autorooms', 'b_room'], tipBtn: 'b_autorooms',
    tip: 'Нажмите «Распознать комнаты» — комнаты найдутся по стенам плана. Те, где в расчёте уже стоит ' +
      'тёплый пол, отметятся сразу.' });
  L.push({ id: 'tp', t: 'Тёплый пол', ok: hasTp, mode: 'room', type: 'tp', tipBtn: 'b_room', demo: 'room',
    btn: ['b_room', 'b_cold', 'b_rect', 'b_poly'],
    tip: 'Кликните по комнатам, где нужен тёплый пол, — петли разложатся сами. Повторный клик убирает его. ' +
      'Лестницу, ванну или кухонный остров внутри комнаты обведите кнопкой «Без обогрева» — петли их обойдут.' });
  if (hasTp) L.push({ id: 'coll', t: 'Коллектор', ok: !!f.coll, mode: 'coll', btn: ['b_coll'], tipBtn: 'b_coll',
    tip: 'Коллектор ставится сам — в котельную, а без неё ближе к середине тёплого пола. Передвинуть: ' +
      '«Коллектор» и клик в нужном месте.' });
  // Радиаторы — если в расчёте они есть хоть в одной комнате этажа (или комнат
  // в расчёте нет вовсе: тогда решает монтажник)
  var calcHere = calcRooms.filter(function (r) { return (+r.floor || 1) === cur + 1; });
  var wantRad = !calcHere.length || calcHere.some(function (r) { return (r.sys || []).indexOf('rad') >= 0; });
  if (wantRad) L.push({ id: 'rad', t: 'Радиаторы', ok: (f.rads || []).length > 0, mode: 'rad',
    btn: ['b_autorad', 'b_rad'], tipBtn: 'b_autorad',
    tip: 'Нажмите «Под окна» — радиаторы встанут под найденными окнами (кроме комнат, где в расчёте только ' +
      'тёплый пол). Лишний уберите кликом по значку, недостающий добавьте кликом у окна или стены в режиме ' +
      '«Радиаторы». Трассы к ним построятся сами — вдоль стен, от коллектора радиаторов.' });
  return L;
}

/** Нужен ли радиатор у окна: не нужен, если комната в расчёте только с тёплым полом. */
function ufhWantsRad(w) {
  var a = (w.ang || 0) * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a), d = 0.5 * (F().pxPerM || 100);
  var z = null;
  [[w.x + nx * d, w.y + ny * d], [w.x - nx * d, w.y - ny * d]].some(function (p) {
    for (var i = F().zones.length - 1; i >= 0; i--) {
      var q = F().zones[i];
      if (q.type !== 'cold' && pip(p, q.pts)) { z = q; return true; }
    }
    return false;
  });
  if (!z || !z.name) return true;
  var key = z.name.trim().toLowerCase(), r = null;
  calcRooms.forEach(function (c) { if (String(c.name).trim().toLowerCase() === key && (+c.floor || 1) === cur + 1) r = c; });
  if (!r) return true;
  var s = r.sys || [];
  return !(s.indexOf('tp') >= 0 && s.indexOf('rad') < 0);
}

/** Клик по комнате: тёплый пол есть — убрать, нет — включить. */
function ufhToggle(p) {
  var f = F(), zs = f.zones, tpI = -1, baseI = -1, i;
  for (i = zs.length - 1; i >= 0; i--) {
    if (!pip(p, zs[i].pts)) continue;
    if (zs[i].type === 'tp') { if (tpI < 0) tpI = i; }
    else if (zs[i].type !== 'cold' && baseI < 0) baseI = i;
  }
  pushUndo('zones');
  if (tpI >= 0) {
    var tz = zs[tpI];
    // У санузла и котельной тёплый пол — вторая зона по тому же контуру:
    // её просто убираем. Комната сама по себе остаётся контуром «Помещение».
    if (baseI >= 0) zs.splice(tpI, 1); else tz.type = 'room';
    renderZones(); draw();
    hint('Тёплый пол ' + (tz.name ? 'в «' + tz.name + '» ' : '') + 'убран. Клик ещё раз — вернуть.');
    return;
  }
  var z;
  if (baseI >= 0 && zs[baseI].type === 'room') { z = zs[baseI]; z.type = 'tp'; }
  else if (baseI >= 0) {
    var b = zs[baseI];
    z = { type: 'tp', name: b.name, roomId: b.roomId, pts: JSON.parse(JSON.stringify(b.pts)) };
    zs.push(z);
  } else {
    var poly = null;
    try { poly = roomAtPoint(p[0], p[1]); } catch (err) { console.error('[plan_editor] room:', err); }
    if (!poly) {
      hint('Комнату по стенам найти не удалось (проём или пёстрая подложка) — «Иначе ▾» и обведите её рамкой.');
      return;
    }
    z = { type: 'tp', name: '', pts: fitZonePts(poly, f.pxPerM || 100) };
    zs.push(z);
  }
  if (!f.coll) ufhAutoColl(f);
  renderZones(); draw();
  if (!z.name) ufhAskName(z);
  else hint('<span class=ok>Тёплый пол в «' + z.name + '».</span> Кликните следующую комнату или жмите «Дальше».');
}

/** «Без обогрева»: рамкой обвести лестницу, ванну, остров внутри комнаты. */
function ufhCold() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб.'); return; }
  document.getElementById('ztype').value = 'cold';
  if (mode !== 'rect') setMode('rect');
  hint('Растяните рамку по лестнице, ванне или кухонному острову — петли и подводки его обойдут.');
}

/**
 * Коллектор, если монтажник его не ставил: в котельную, а без неё — в
 * середину тёплого пола этажа (центр площадей зон), и если эта точка не в
 * комнате, то к ближайшей стене ближайшей комнаты, на 0,3 м внутрь.
 */
function ufhAutoColl(f) {
  var tz = (f.zones || []).filter(function (z) { return z.type === 'tp'; });
  if (!tz.length || !f.pxPerM) return false;
  var sx = 0, sy = 0, sa = 0;
  tz.forEach(function (z) { var a = Math.abs(area(z.pts)) || 1, c = centroid(z.pts); sx += c[0] * a; sy += c[1] * a; sa += a; });
  var C = [sx / sa, sy / sa], best = null, bd = Infinity;
  // Котельная — зона этого типа или комната с таким названием; коллектор —
  // у её стены, ближней к тёплому полу (не в середине комнаты)
  var bz = window.projectPlans && projectPlans.boilerZone ? projectPlans.boilerZone(f)
    : (f.zones || []).filter(function (z) { return z.type === 'boiler'; })[0];
  if (bz) {
    var bp = window.projectPlans && projectPlans.wallSpot ? projectPlans.wallSpot(f, bz, C, 0.16).p : centroid(bz.pts);
    f.coll = { x: Math.round(bp[0]), y: Math.round(bp[1]) };
    f.collAuto = true;
    return true;
  }
  // Котельной нет: ближайшая к центру тёплого пола комната, коллектор у её стены и вдоль неё.
  // Раньше центр площадей, попавший в комнату, и был местом коллектора — посреди комнаты.
  if (window.projectPlans && projectPlans.snapCollector) {
    var sn = projectPlans.snapCollector(f, C);
    if (sn) {
      // угол, заданный рукой, сбрасываем только когда коллектор переехал: функция зовётся на каждой перерисовке
      if (!f.coll || f.coll.x !== sn.x || f.coll.y !== sn.y) { f.coll = { x: sn.x, y: sn.y }; delete f.collAng; }
      f.collAuto = true; return true;
    }
  }
  (f.zones || []).forEach(function (z) {
    if (z.type === 'cold' || bd === 0) return;
    if (pip(C, z.pts)) { best = C; bd = 0; return; }
    var zc = centroid(z.pts);
    for (var i = 0; i < z.pts.length; i++) {
      var a = z.pts[i], b = z.pts[(i + 1) % z.pts.length];
      var dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
      var t = Math.max(0, Math.min(1, ((C[0] - a[0]) * dx + (C[1] - a[1]) * dy) / L2));
      var q = [a[0] + dx * t, a[1] + dy * t], d = Math.hypot(C[0] - q[0], C[1] - q[1]);
      if (d >= bd) continue;
      var vx = zc[0] - q[0], vy = zc[1] - q[1], vl = Math.hypot(vx, vy) || 1, in3 = Math.min(0.3 * f.pxPerM, vl / 2);
      bd = d; best = [q[0] + vx / vl * in3, q[1] + vy / vl * in3];
    }
  });
  if (!best) return false;
  f.coll = { x: Math.round(best[0]), y: Math.round(best[1]) };
  f.collAuto = true;
  return true;
}

/**
 * Котельную отметили (зона «Котельная» или комната с таким названием) — оба коллектора,
 * тёплого пола и радиаторов, переезжают к её стене, даже если их переставляли руками: отметка
 * котельной — прямое указание, где им стоять. Срабатывает на появление или смену контура
 * котельной (f.boilerKey), а не на каждую перерисовку, поэтому потом коллекторы можно
 * переставить; у проектов, где котельная уже стояла до этой функции, ничего не двигаем.
 */
function ufhBoilerSync(f) {
  if (!window.projectPlans || !projectPlans.boilerZone) return false;
  var bz = projectPlans.boilerZone(f), key = bz ? JSON.stringify(bz.pts) : '';
  var first = f.boilerKey === undefined;                      // этаж впервые попал сюда: котельной ещё не было ('') или проект старый
  if (key === (f.boilerKey || '') && !first) return false;
  if (first && !bz) { f.boilerKey = ''; return false; }       // запомнили: котельной нет — её появление будет переходом
  f.boilerKey = key;
  if (!bz) return false;
  if (first && f.coll && !f.collAuto) return false;        // старый проект: котельная уже стояла, коллектор поставлен рукой — не трогаем
  var tz = (f.zones || []).filter(function (z) { return z.type === 'tp'; });
  var sx = 0, sy = 0, sa = 0;
  tz.forEach(function (z) { var a = Math.abs(area(z.pts)) || 1, c = centroid(z.pts); sx += c[0] * a; sy += c[1] * a; sa += a; });
  var C = sa ? [sx / sa, sy / sa] : centroid(bz.pts);
  var bp = projectPlans.wallSpot(f, bz, C, 0.16).p;
  if (tz.length) { f.coll = { x: Math.round(bp[0]), y: Math.round(bp[1]) }; delete f.collAng; f.collAuto = true; }
  delete f.radColl; delete f.radCollAng;                     // коллектор радиаторов сам встанет у стены котельной
  if (!first) hint('<span class=ok>Котельная отмечена — коллекторы перенесены к её стене.</span> Переставить можно мышью.');
  setTimeout(function () { renderZones(); draw(); }, 0);
  return true;
}

/**
 * Коллектор тёплого пола, поставленный самим мастером (collAuto), следит за
 * разметкой: назвали комнату «Котельная» позже первого клика по тёплому
 * полу — коллектор переезжает к её стене. Поставленный рукой не трогаем.
 * Зовётся из строки мастера на каждой перерисовке; место детерминированное,
 * поэтому переставляется только при настоящей перемене.
 */
function ufhFollowColl() {
  var f = F();
  if (f && f.pxPerM && !dragC) ufhBoilerSync(f);
  if (!f || !f.pxPerM || (f.coll && !f.collAuto) || dragC) return;
  var was = f.coll ? f.coll.x + ',' + f.coll.y : '';
  if (!f.zones.some(function (z) { return z.type === 'tp'; })) {
    if (f.coll && f.collAuto) { f.coll = null; setTimeout(draw, 0); }   // тёплый пол сняли — и коллектор ни к чему
    return;
  }
  ufhAutoColl(f);
  if ((f.coll ? f.coll.x + ',' + f.coll.y : '') !== was) setTimeout(function () { renderZones(); draw(); }, 0);
}

/** Какая это комната: имя связывает зону с комнатой подробного расчёта. */
function ufhAskName(z) {
  var used = {};
  DATA.floors.forEach(function (fl) {
    (fl.zones || []).forEach(function (q) { if (q !== z && q.name) used[q.name.trim().toLowerCase()] = 1; });
  });
  var a = Math.abs(area(z.pts));
  var calc = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && !used[String(r.name).trim().toLowerCase()];
  }).sort(function (x, y) { return Math.abs(x.area - a) - Math.abs(y.area - a); });
  var uniq = function (nm) {
    var k = 2, out = nm;
    while (used[out.toLowerCase()]) out = nm + ' ' + (k++);
    return out;
  };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var div = document.createElement('div'); div.className = 'namepick';
  var h = '<div class="box"><h3>Какая это комната?</h3>' +
    '<div class="sub">По плану ' + a.toFixed(1).replace('.', ',') + ' м². По имени тёплый пол свяжется с ' +
    'комнатой расчёта' + (calc.length ? '' : ', а если её там нет — комната добавится в расчёт') + '.</div>';
  if (calc.length) {
    h += '<div class="sub" style="margin-bottom:4px">Из расчёта:</div><div class="grid">';
    calc.forEach(function (r) {
      h += '<button class="calc" data-n="' + esc(r.name) + '">' + esc(r.name) +
        (r.area ? ' · ' + String(Math.round(r.area * 100) / 100).replace('.', ',') + ' м²' : '') + '</button>';
    });
    h += '</div><div class="sub" style="margin-bottom:4px">Или новая:</div>';
  }
  // не отмечены котельная, санузел, кухня — они первыми и подписаны: без них не собрать котельную, воду и канализацию
  var need = reqRooms('all').filter(function (r) { return !r.ok && (r.key === 'boiler' || waterWanted()); }).map(function (r) { return r.label; });
  if (need.length) h += '<div class="sub" style="color:#d97706;margin-bottom:4px">Ещё не отмечено на плане: ' + need.join(', ').toLowerCase() + '</div>';
  var names = need.concat(UFH_NAMES.filter(function (n) { return need.indexOf(n) < 0; }));
  h += '<div class="grid">';
  names.forEach(function (nm) { h += '<button' + (need.indexOf(nm) >= 0 ? ' class="calc"' : '') + ' data-n="' + esc(uniq(nm)) + '">' + esc(uniq(nm)) + '</button>'; });
  h += '</div><div class="row"><input type="text" placeholder="Своё название"><button class="go" data-own="1">OK</button></div>' +
    '<div style="margin-top:8px;text-align:right"><button class="ghost" data-skip="1">Пропустить</button></div></div>';
  div.innerHTML = h;
  var inp = div.querySelector('input');
  var done = function (nm) {
    div.remove();
    if (nm) { z.name = nm; z.roomId = roomIdByName(nm); if (/котельн/i.test(nm)) nameAsBoiler(z); }
    renderZones(); draw();
    var tpz = z.type === 'tp';
    hint(!z.name ? 'Комната без имени: в расчёт она добавится как «Помещение». Имя можно вписать в списке справа.'
      : tpz ? '<span class=ok>Тёплый пол в «' + z.name + '».</span> Кликните следующую комнату или жмите «Дальше».'
      : '<span class=ok>Комната «' + z.name + '» добавлена.</span>');
  };
  div.onclick = function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) { if (e.target === div) done(null); return; }
    if (b.getAttribute('data-skip')) done(null);
    else if (b.getAttribute('data-own')) { var v = inp.value.trim(); if (v) done(uniq(v)); else inp.focus(); }
    else done(b.getAttribute('data-n'));
  };
  inp.onkeydown = function (e) {
    if (e.key === 'Enter') { var v = inp.value.trim(); if (v) done(uniq(v)); }
    if (e.key === 'Escape') done(null);
  };
  document.body.appendChild(div);
}

/**
 * «Готово»: коллектор на этажах с тёплым полом, сохранение, дождаться, пока
 * подложки уедут на сервер, — и сказать калькулятору закрыть окно. Закрыть
 * раньше нельзя: в смету уходит только имя файла подложки, без картинки на
 * сервере план в смете был бы пустым.
 */
function ufhDone() {
  DATA.floors.forEach(function (f) {
    if ((f.zones || []).some(function (z) { return z.type === 'tp'; }) && !f.coll) ufhAutoColl(f);
  });
  saveAll();
  (function wait() {
    if (upState && upState.run) {
      hint('Отправляю план на сервер — ' + Math.round((upState.pct || 0) * 100) + '%…');
      setTimeout(wait, 300);
      return;
    }
    // Не ушло — из окна всё равно должен быть выход: второе нажатие
    // возвращает к смете, разметка уже в браузере (картинку в смете
    // увидят, когда план уйдёт на сервер со следующим сохранением).
    if (upState && upState.err && !ufhDone.retried) {
      ufhDone.retried = true;
      hint('<b>План не ушёл на сервер:</b> ' + upState.err + '. Разметка сохранена в браузере. ' +
        'Нажмите ещё раз — вернётесь к смете; картинка плана уйдёт на сервер, когда откроете план снова.');
      return;
    }
    ufhDone.retried = false;
    ufhPost(true);
  })();
}

/**
 * Сказать калькулятору (окно-родитель), что разметка сохранена. Вместе с
 * этим — итог мастера одной строкой: калькулятор покажет его в строке
 * «План дома», чтобы было видно, что изменилось.
 */
function ufhPost(done) {
  try {
    if (window.parent && window.parent !== window)
      window.parent.postMessage({ type: 'hc-ufhplan', done: !!done, sum: wzSummary().plain }, location.origin);
    else if (done) hint('<span class=ok>Сохранено.</span> Вернитесь в калькулятор — раскладка появится в смете.');
  } catch (e) {}
}

/**
 * «Листы проекта ↗»: сохранить и открыть полный редактор проектирования.
 * Вкладку открываем сразу по нажатию — после ожидания отправки на сервер
 * браузер счёл бы её всплывающим окном и не открыл. Разметка к этому
 * моменту уже в браузере (saveAll), полный редактор читает её оттуда.
 */
function ufhSheets() {
  saveAll();
  // открываем от имени калькулятора, а не окна мастера: окно сейчас закроется, а вкладке выпуска
  // нужно, куда вернуться (window.opener)
  var host = window;
  try { if (window.parent && window.parent !== window && window.parent.app) host = window.parent; } catch (e) {}
  try { host.localStorage.setItem('hc_project_flow', String(Date.now())); } catch (e) {}
  host.open('plan_editor.html', 'hc_plan_editor');
  ufhDone();
}

// ═══ Мастер раскладки ═══════════════════════════════════════════════════
// Монтажник видел два десятка кнопок и мелкую полоску шагов, а что делать
// дальше — не понимал (03.10.2026). Теперь: крупные шаги с номерами, под
// ними одна фраза «что сделать сейчас», кнопки только этого шага и зелёная
// «Дальше →». Масштаб — шагом, только если не подобрался сам. Остальные
// инструменты — под «Ещё ▾».

/** Отпечаток разметки: комнаты (тип и имя) и число радиаторов по этажам. */
function wzSig() {
  return JSON.stringify(DATA.floors.map(function (f) {
    return [(f.zones || []).map(function (z) { return z.type + ':' + (z.name || ''); }).join('|'), (f.rads || []).length];
  }));
}
var WZ_SIG0 = '';     // отпечаток при открытии окна — ставится в конце загрузки
var wzStep = null;    // шаг, на который перешли кнопкой «Дальше» или кликом
var wzAuto = {};      // этажи, где комнаты уже искали сами (второй раз не ищем)

/** Радиаторы нужны, если в расчёте они есть хоть в одной комнате этажа (или комнат нет вовсе). */
function wzWantRad() {
  var here = calcRooms.filter(function (r) { return (+r.floor || 1) === cur + 1; });
  return !here.length || here.some(function (r) { return (r.sys || []).indexOf('rad') >= 0; });
}

/** Зона «Тёплый пол» поверх санузла или котельной — второй контур той же комнаты. */
function isTpCopy(f, z) {
  if (z.type !== 'tp') return false;
  var key = JSON.stringify(z.pts);
  return (f.zones || []).some(function (q) {
    return q !== z && q.type !== 'tp' && q.type !== 'cold' && JSON.stringify(q.pts) === key;
  });
}

function wzSteps() {
  var f = F();
  var L = [{ id: 'plan', t: 'План', ok: !!f.img }];
  if (f.img && !f.pxPerM) L.push({ id: 'scale', t: 'Масштаб', ok: false });
  L.push({ id: 'rooms', t: 'Комнаты', ok: f.zones.some(function (z) { return z.type !== 'cold'; }) });
  L.push({ id: 'tp', t: 'Тёплый пол', ok: f.zones.some(function (z) { return z.type === 'tp'; }) });
  if (wzWantRad()) L.push({ id: 'rad', t: 'Радиаторы', ok: (f.rads || []).length > 0 });
  if (f.img) L.push({ id: 'water', t: 'Санузлы и вода', ok: !!(DATA.floors[0].water && DATA.floors[0].water.visited) });
  if (f.img) L.push({ id: 'sewer', t: 'Канализация', ok: !!(DATA.floors[0].water && DATA.floors[0].water.sewerSeen) });
  L.push({ id: 'done', t: 'Готово', ok: false });
  return L;
}

/** Текущий шаг: без плана — «План», без масштаба — «Масштаб», дальше — выбранный или первый несделанный. */
function wzCur(L) {
  var f = F();
  if (!f.img) return 'plan';
  if (!f.pxPerM) return 'scale';
  var ids = L.map(function (s) { return s.id; });
  if (wzStep && ids.indexOf(wzStep) >= 0 && wzStep !== 'plan' && wzStep !== 'scale') return wzStep;
  for (var i = 0; i < L.length; i++) if (!L[i].ok) return L[i].id;
  return 'done';
}

var WZ_MODE = { rooms: 'select', tp: 'room', rad: 'rad', water: 'wet', sewer: 'select', done: 'select' };

/**
 * Перейти на шаг: включить его режим на плане. Переход рукой (кнопка
 * «Дальше», клик по шагу) стирает пояснение справа — оно было про прошлый
 * шаг; keepHint — переход сам после разметки, там справа её итог.
 */
function wzGo(id, keepHint) {
  hoverLn = null; pinLn = null; if (typeof wwTip === 'function' && wwTipEl) wwTip('', { clientX: 0, clientY: 0 });
  if (wzStep === 'rooms' && id !== 'rooms') roomsLogEnd();
  if (!keepHint && id !== 'plan') hint('');
  if (id === 'plan') {
    var inp = document.querySelector('#b_upload input');
    if (inp) inp.click();
    return;
  }
  if (id === 'scale') { wzStep = null; if (mode !== 'scale') setMode('scale'); updateGuide(); return; }
  wzStep = id;
  if (id === 'tp') document.getElementById('ztype').value = 'tp';
  var m = WZ_MODE[id] || 'select';
  if (F().pxPerM && m !== mode) setMode(m === 'select' ? mode : m);   // setMode(тот же) — выключить в «select»
  if (id === 'rooms' && F().pxPerM && !F().zones.some(function (z) { return z.type !== 'cold'; })) autoRooms();
  if (id === 'water' || id === 'sewer') { var wz0 = wwInit(); wz0.visited = true; wz0.seen = true; if (id === 'sewer') { wz0.sewerSeen = true; slopeAsked = ''; } wwRefresh(); }
  if (id === 'done') hint('');      // итог — в строке шага, прошлые пояснения справа уже ни к чему
  draw();
}

/**
 * Обязательные комнаты: котельная, санузел, кухня. От них зависят компоновка котельной, вода и канализация,
 * поэтому мастер просит отметить их на плане всегда — списком с кнопками, в окне названия и перед «Дальше».
 */
var REQ_NAMES = { boiler: 'Котельная', wc: 'Санузел', kitchen: 'Кухня' };
var markNext = null;        // что отмечаем следующим кликом по комнате: 'boiler' | 'wc' | 'kitchen'
var wzNextWarn = false;     // предупреждение перед «Дальше» уже показано
/** Считаем ли водоснабжение: галочка на шаге «Санузлы и вода» или включённая вода в расчёте */
function waterWanted() {
  var w = DATA.floors[0].water;
  if (w && w.enable != null && w.touched) return !!w.enable;
  try { return !!(JSON.parse(localStorage.getItem('stout_save')) || {}).water; } catch (e) { return false; }
}
/**
 * Что должно быть отмечено на плане. scope: 'base' — котельная (нужна всегда); 'water' — кухня и санузел
 * (нужны, если считаем водоснабжение, и спрашиваются на шаге «Санузлы и вода»); 'all' — всё, что нужно сейчас.
 */
function reqRooms(scope) {
  scope = scope || 'all';
  var zs = [];
  DATA.floors.forEach(function (fl) { (fl.zones || []).forEach(function (z) { if (z.type !== 'cold') zs.push(z); }); });
  var has = function (fn) { return zs.some(fn); };
  var ww = DATA.floors[0].water;
  var card = function (kind) { return !!(ww && ww.cards && ww.cards.some(function (c) { return c.kind === kind && c.zone && wwRoomZone(c.fl, c.zone); })); };
  var L = [];
  if (scope !== 'water') L.push({ key: 'boiler', label: 'Котельная', ok: has(function (z) { return z.type === 'boiler' || /котельн/i.test(z.name || ''); }) });
  if (scope === 'water' || (scope === 'all' && waterWanted())) {
    L.push({ key: 'wc', label: 'Санузел', ok: card('wc') });
    L.push({ key: 'kitchen', label: 'Кухня', ok: card('kitchen') });
  }
  return L;
}
function reqHtml(scope, always) {
  var L = reqRooms(scope), miss = L.filter(function (r) { return !r.ok; });
  if (!L.length || (!miss.length && !always)) return '';
  var h = '<div style="margin-top:8px;font-size:12.5px;line-height:1.9"><b>Отметьте на плане:</b> ';
  L.forEach(function (r) {
    h += r.ok ? '<span style="color:#16a34a;margin-right:12px">✓ ' + r.label + '</span>'
      : '<span style="margin-right:12px"><span style="color:#d97706">✕ ' + r.label + '</span> <button onclick="wzMark(\'' + r.key + '\')"' + (markNext === r.key ? ' class="go"' : '') + '>' +
        (markNext === r.key ? 'Кликните комнату…' : 'Отметить') + '</button></span>';
  });
  return h + '</div>';
}
/** Кнопка «Отметить»: следующий клик по комнате на плане называет её котельной, санузлом или кухней */
function wzMark(key) {
  markNext = markNext === key ? null : key;
  wzNextWarn = false;
  hint(markNext ? 'Кликните на плане комнату — это ' + REQ_NAMES[key].toLowerCase() + '.' : '');
  stepsHtml = ''; renderSteps();
}
/** Котельная — отдельный тип зоны: у комнаты вида «room» меняем тип, у комнаты с тёплым полом — зона поверх */
function nameAsBoiler(z) {
  var key = JSON.stringify(z.pts);
  if (F().zones.some(function (q) { return q !== z && q.type === 'boiler' && JSON.stringify(q.pts) === key; })) return;
  if (z.type === 'boiler') return;
  if (z.type === 'tp') { makeBoiler(z); return; }
  z.type = 'boiler';
}
function wzMarkApply(zi) {
  var f = F(), z = f.zones[zi], key = markNext;
  if (!z || z.type === 'cold') return;
  var base = REQ_NAMES[key], used = {};
  DATA.floors.forEach(function (fl) { (fl.zones || []).forEach(function (q) { if (q !== z && q.name) used[String(q.name).trim().toLowerCase()] = 1; }); });
  var nm = base, k = 2;
  if (key === 'wc' && used['санузел']) { nm = 'Санузел 1'; }
  while (used[nm.toLowerCase()]) nm = base + ' ' + (k++);
  pushUndo('zones');
  var pk = JSON.stringify(z.pts);
  f.zones.forEach(function (q) { if (q === z || JSON.stringify(q.pts) === pk) { q.name = nm; q.roomId = roomIdByName(nm); } });
  if (key === 'boiler') nameAsBoiler(z);
  markNext = null; wzNextWarn = false;
  // на шаге «Санузлы и вода» отмеченная комната сразу становится санузлом / кухней с приборами
  if (key !== 'boiler' && wwLayer() === 'water') { var w0 = wwInit(); if (wwCardIdx(w0, cur, z) < 0) wwToggleRoom(zi); }
  renderZones(); draw();
  hint('<span class=ok>Отмечено: ' + nm + '.</span>');
  stepsHtml = ''; renderSteps();
}

function wzNext() {
  var L = wzSteps(), c = wzCur(L), ids = L.map(function (s) { return s.id; }), i = ids.indexOf(c);
  if (c === 'done') { ufhDone(); return; }
  // с шага «Комнаты» не уходим молча, пока на плане нет котельной, санузла и кухни: сначала спрашиваем, второе нажатие — пропустить
  if (c === 'rooms' || c === 'water') {
    var miss = reqRooms(c === 'rooms' ? 'base' : 'water').filter(function (r) { return !r.ok; });
    if (miss.length && !wzNextWarn) {
      wzNextWarn = true;
      hint('<b style="color:#d97706">Не отмечено на плане: ' + miss.map(function (r) { return r.label.toLowerCase(); }).join(', ') +
        '.</b> ' + (c === 'rooms' ? 'Без котельной не собрать компоновку и обвязку.' : 'Без них вода и канализация не посчитаются по плану.') + ' Отметьте кнопками выше или нажмите «Дальше» ещё раз — пропустить.');
      stepsHtml = ''; renderSteps();
      return;
    }
  }
  wzNextWarn = false;
  if (i >= 0 && i + 1 < L.length) wzGo(ids[i + 1]);
}

/** Шаг «Тёплый пол»: обвести участок рамкой или по точкам (комната сложной формы, часть комнаты). */
function wzTpDraw(m) {
  document.getElementById('ztype').value = 'tp';
  if (mode !== m) setMode(m);
  hint(m === 'poly'
    ? 'Кликайте углы участка по порядку. Замкнуть — клик по первой точке, двойной клик или Enter. Точки прилипают к стенам и углам, Alt — отключить. Shift — под 90°, Ctrl+Z — убрать точку.'
    : 'Растяните рамку по участку мышью.');
}

/** «Обвести рамкой» на шаге «Комнаты»: контур комнаты без тёплого пола. */
function wzRect() {
  document.getElementById('ztype').value = 'room';
  if (mode !== 'rect') setMode('rect');
}

/**
 * После загрузки плана: масштаб, комнаты, радиаторы, коллектор — сами, и
 * сразу «Комнаты». Размечаем только новые подложки (wzFresh): на старых
 * этажах «Под окна» вернул бы радиаторы, которые монтажник убрал руками.
 */
var wzFresh = {};
function wzAfterLoad() {
  var fresh = Object.keys(wzFresh).map(Number);
  wzFresh = {};
  if (!F().img || !fresh.length) return;
  // этаж без масштаба искать не по чему — комнаты найдутся, когда его зададут (wzRender)
  fresh.forEach(function (i) { if (DATA.floors[i].pxPerM) wzAuto[i] = 1; });
  var all = DATA.floors.every(function (f, i) { return !f.img || fresh.indexOf(i) >= 0; });
  if (all) {
    var p = autoMarkAll();
    if (p && p.then) p.then(function () { wzGo(F().pxPerM ? 'rooms' : 'scale', true); });
    return;
  }
  // новая подложка в доме, где другие этажи уже размечены, — только её этажи
  var was = cur;
  fresh.forEach(function (fi) {
    cur = fi;
    if (!F().pxPerM) return;
    autoRooms();
    if (wzWantRad()) autoRads();
    if (!F().coll) ufhAutoColl(F());
  });
  cur = was;
  renderTabs(); renderZones();
  wzGo(F().pxPerM ? 'rooms' : 'scale', true);
  saveAll();
}

/**
 * Итог по всем этажам: комнаты, тёплый пол (комнаты, петли, метры),
 * радиаторы. html — для шага «Готово», plain — калькулятору.
 */
function wzSummary() {
  var rooms = 0, tpRooms = 0, loops = 0, m = 0, rads = 0, floors = 0, over = false;
  DATA.floors.forEach(function (f, fi) {
    if (!f || !f.img) return;
    floors++;
    if (fi > 1) over = true;
    (f.zones || []).forEach(function (z) {
      if (z.type === 'cold') return;
      if (z.type === 'tp') tpRooms++;
      if (!isTpCopy(f, z)) rooms++;
    });
    rads += (f.rads || []).length;
    if (!f.pxPerM) return;
    var was = cur, L;
    cur = fi;
    try { L = tpLoops(f, UFH_STEP[fi] || 150); } catch (e) { L = {}; }
    cur = was;
    Object.keys(L || {}).forEach(function (k) {
      (L[k] || []).forEach(function (lp) { loops++; m += lp.m || 0; });
    });
  });
  var pl = function (n, a, b, c) { var k = n % 10, h = n % 100; return (k === 1 && h !== 11) ? a : (k >= 2 && k <= 4 && (h < 10 || h >= 20)) ? b : c; };
  var parts = [rooms + ' ' + pl(rooms, 'комната', 'комнаты', 'комнат')];
  parts.push(tpRooms ? 'тёплый пол: ' + tpRooms + ' ' + pl(tpRooms, 'комната', 'комнаты', 'комнат') +
    (loops ? ', ' + loops + ' ' + pl(loops, 'петля', 'петли', 'петель') + ', ' + Math.round(m) + ' м' : '') : 'без тёплого пола');
  if (rads) parts.push('радиаторов: ' + rads);

  if (ww && ww.visited && ww.cards && ww.cards.length) parts.push('санузлов: ' + ww.cards.length);
  var plain = parts.join(' · ');
  // Нехватка тепла по последнему расчёту — только пока план не менялся с
  // открытия окна: после правок цифры устарели, там честнее промолчать (свежие
  // калькулятор покажет в строке «План дома» сразу после «Готово»)
  var lack = '';
  if (wzSig() === WZ_SIG0) {
    var def = {};
    try { def = JSON.parse(localStorage.getItem('heatcalc_room_deficit') || '{}') || {}; } catch (e) {}
    var names = Object.keys(def);
    if (names.length) lack = '<br><span style="color:#d97706">Не хватает тепла по текущей смете: ' +
      names.slice(0, 4).map(function (k) { return k.replace(/</g, '&lt;') + ' −' + Math.abs(def[k]) + ' Вт'; }).join(', ') +
      (names.length > 4 ? ' и ещё ' + (names.length - 4) : '') +
      '. Добавьте радиатор на шаге «Радиаторы» или тёплый пол.</span>';
  }
  return { plain: plain, floors: floors, over: over,
    html: '<b>Всё готово:</b> ' + plain + (floors > 1 ? ' (этажей: ' + floors + ')' : '') + '. ' +
      (over ? 'Калькулятор считает два этажа — третий и выше в смету не попадут. ' : '') +
      lack };
}
