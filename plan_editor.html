<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Служебная страница приложения, в поиске ей делать нечего. -->
<meta name="robots" content="noindex, nofollow">
<title>Планы этажей — подложка и зоны</title>
<style>
  /* Оформление — как в проектных САПР (Revit): графитовые панели, плоские
     элементы почти без скруглений, синий акцент Autodesk, светлый чертёж на
     тёмном поле. Тема всегда тёмная и от калькулятора не зависит: редактор —
     рабочее место с чертежом, а не страница сметы, и белый фон вокруг подложки
     засвечивает сам план. Шрифт системный, как во всех САПР. */
  :root {
    --primary: #0696D7;          /* акцент Autodesk */
    --primary-dim: #0b7cb0;
    --primary-light: rgba(6, 150, 215, .18);
    --bg: #2c2c2c;               /* поле вокруг чертежа */
    --surface: #3c3c3c;          /* панели и лента */
    --surface-light: #454545;    /* карточки внутри панелей */
    --surface-hi: #4f4f4f;       /* наведение */
    --text-main: #e6e6e6;
    --text-sec: #a0a0a0;
    --border: #5a5a5a;
    --border-soft: #4a4a4a;
    --ok: #4c9a2a;
    --ok-bg: rgba(76, 154, 42, .18);
    --warn-bg: #4a2a2a;
    --warn-text: #ff9b8a;
    --warn-border: #7a3b3b;
    --rad: 3px;                  /* САПР почти не скругляет */
  }
  body { margin: 0; font: 13px/1.4 'Segoe UI', system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--text-main); }
  .topbar { position: sticky; top: 0; z-index: 5; }
  /* лента инструментов */
  .bar { background: var(--surface); color: var(--text-main); padding: 7px 10px; display: flex;
         gap: 5px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #222; }
  .bar b { font-weight: 600; letter-spacing: .2px; }
  /* полоска «что осталось»: единственное место, где видны все шаги сразу */
  .steps { background: #343434; color: var(--text-sec); padding: 6px 10px; display: flex;
           gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px;
           border-bottom: 1px solid #222; }
  .steps .lbl { color: var(--text-sec); }
  .steps .st { padding: 3px 9px; border-radius: var(--rad); border: 1px solid var(--border-soft);
               background: var(--surface-light); color: var(--text-main); cursor: pointer;
               white-space: nowrap; font-weight: 500; }
  .steps .st:hover { background: var(--surface-hi); border-color: var(--primary); }
  .steps .st.next { background: var(--primary); border-color: var(--primary); color: #fff;
                    font-weight: 600; }
  .steps .st.done { background: transparent; border-color: var(--border-soft); color: #7ec95a;
                    cursor: default; }
  .steps .st.done:hover { background: transparent; border-color: var(--border-soft); }
  .steps .st.save { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .steps .up { color: #d8b26a; }
  .steps .up.bad { color: var(--warn-text); }
  .steps .up b { cursor: pointer; text-decoration: underline; }
  /* Что делать прямо сейчас. Живёт в полоске шагов, а не только в правой
     колонке: там же печатаются результаты и отказы, инструкция под ними
     теряется, а подсказки к тому же бывают выключены. */
  .steps .tip { color: #9ccbe8; }
  .steps .tip.wait { color: #d8b26a; }
  button, select, input[type=text] { font: inherit; font-size: 12.5px; padding: 5px 10px;
         border-radius: var(--rad); border: 1px solid var(--border-soft);
         background: var(--surface-light); color: var(--text-main); cursor: pointer;
         transition: background .12s, border-color .12s; }
  button:hover, select:hover { background: var(--surface-hi); border-color: var(--primary); }
  button.on { background: var(--primary); color: #fff; border-color: var(--primary-dim); }
  button.on:hover { background: var(--primary-dim); }
  button.ghost { background: transparent; color: var(--text-sec); border-color: var(--border-soft); }
  /* Главное действие панели: делает разом то, на что ниже пять кнопок. */
  button.go { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  button.go:hover { background: var(--ok); border-color: #fff; }
  button.go:disabled { opacity: .5; cursor: default; }
  button.ghost:hover { background: var(--surface-light); color: var(--text-main); }
  input[type=text] { background: #2a2a2a; border-color: #222; cursor: text; }
  input[type=text]:focus { outline: none; border-color: var(--primary); }
  /* Инструмент, не нужный на текущем шаге: гаснет, но остаётся на своём месте и
     нажимается. Прятался — и соседние кнопки прыгали под курсором. */
  .dim { opacity: .4; }
  .dim:hover { opacity: 1; }
  .tab { padding: 5px 10px; border-radius: var(--rad); background: var(--surface-light);
         color: var(--text-sec); cursor: pointer; }
  .tab.on { background: var(--primary); color: #fff; }
  .wrap { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
  /* рабочее поле: чертёж лежит на графите, как вид в САПР */
  .cvbox { background: #262626; border: 1px solid #1c1c1c; border-radius: var(--rad);
           padding: 8px; flex: 1 1 auto; min-width: 0; overflow: auto; }
  canvas { display: block; max-width: 100%; background: #1e1e1e; border-radius: 2px;
           cursor: crosshair; touch-action: none; }
  /* Палитра свойств: секции с заголовками и строки «параметр — значение»,
     как в окне свойств САПР. До этого панель была сплошным абзацем текста,
     в котором сводка этажа, статусы и список комнат сливались в кучу. */
  .side { flex: 0 0 320px; background: var(--surface); border: 1px solid #2a2a2a;
          border-radius: var(--rad); padding: 0; overflow: hidden; }
  .side .pad { padding: 10px 10px 12px; }
  .pgroup { border-top: 1px solid #2a2a2a; }
  .pgroup:first-of-type { border-top: 0; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
           background: #454545; border-bottom: 1px solid #2a2a2a; padding: 5px 10px;
           font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
           color: #cfcfcf; }
  .phead .note { font-size: 10px; font-weight: 400; letter-spacing: 0; text-transform: none;
                 color: var(--text-sec); white-space: nowrap; }
  .pbody { padding: 4px 0; }
  /* строка свойства: имя слева, значение прижато вправо */
  .prow { display: flex; align-items: baseline; gap: 10px; padding: 3px 10px; font-size: 12px; }
  .prow:nth-child(even) { background: rgba(255,255,255,.025); }
  .prow .k { color: var(--text-sec); flex: 1 1 auto; }
  .prow .v { color: var(--text-main); text-align: right; white-space: nowrap; flex: 0 0 auto; }
  .prow .v.warn { color: var(--warn-text); }
  .prow .v.good { color: #7ec95a; }
  .pempty { padding: 7px 10px; font-size: 12px; color: var(--text-sec); font-style: italic; }
  /* зона: цветная метка, тип, поле имени, площадь, удаление — по колонкам */
  .zone { border: 0; border-bottom: 1px solid #333; border-radius: 0; padding: 4px 10px;
          margin: 0; background: transparent; display: flex; gap: 7px;
          align-items: center; flex-wrap: nowrap; }
  .zone:nth-child(even) { background: rgba(255,255,255,.025); }
  .zone:hover { background: rgba(6,150,215,.10); }
  .zone.zsel { background: rgba(37,99,235,.28) !important; box-shadow: inset 3px 0 0 #2563eb; }
  .zone .rn { flex: 0 0 auto; min-width: 20px; height: 20px; border-radius: 10px; background: #2563eb; color: #fff;
              font: 700 11px/20px system-ui; text-align: center; padding: 0 3px; box-sizing: border-box; }
  .zone .rn.none { background: transparent; color: var(--text-sec); }
  .wetfx { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 2px 10px 7px 38px; font-size: 11px; color: var(--text-sec);
           border-bottom: 1px solid #333; background: rgba(11,114,133,.08); }
  .wetfx .wf { white-space: nowrap; padding: 1px 5px; border-radius: 9px; border: 1px solid rgba(128,128,128,.35); }
  .wetfx .wf.on { color: var(--text-main); border-color: #0b7285; }
  .wetfx .wf b { cursor: pointer; padding: 0 4px; font-size: 13px; }
  .zone .sw { width: 9px; height: 9px; border-radius: 1px; flex: 0 0 auto; }
  .zone .zt { color: var(--text-sec); font-size: 11px; flex: 0 0 auto; white-space: nowrap; }
  .zone input[type=text] { flex: 1 1 60px; min-width: 0; padding: 2px 5px; font-size: 12px; }
  .zone .ar { color: var(--text-main); font-size: 11.5px; white-space: nowrap; flex: 0 0 auto;
              font-variant-numeric: tabular-nums; }
  .zone .ar-in { width: 54px; padding: 1px 3px; font-size: 11.5px; text-align: right; }
  .zone select.lay { flex: 0 0 auto; padding: 1px 2px; font-size: 11px; max-width: 74px; }
  .zone .del { color: var(--text-sec); cursor: pointer; font-weight: 700; padding: 0 2px;
               flex: 0 0 auto; }
  .zone .del:hover { color: #e06c5f; }
  /* строка комнаты расчёта: имя слева, свойства справа */
  .croom { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; font-size: 12px;
           cursor: pointer; border-bottom: 1px solid #333; }
  .croom:nth-child(even) { background: rgba(255,255,255,.025); }
  .croom:hover { background: rgba(6,150,215,.12); }
  .croom .nm { flex: 1 1 auto; color: var(--text-main); }
  .croom .mt { flex: 0 0 auto; color: var(--text-sec); font-size: 11px; white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  .hint { background: #343434; border: 1px solid var(--border-soft);
          border-left: 3px solid var(--primary); border-radius: var(--rad); padding: 8px 10px;
          font-size: 12.5px; margin-bottom: 9px; color: var(--text-main); }
  .ok { color: #7ec95a; font-weight: 600; }
  /* пошаговые подсказки */
  .guide { position: fixed; z-index: 50; max-width: 320px; background: var(--surface);
           border: 1px solid var(--primary); border-radius: var(--rad); padding: 10px 12px;
           box-shadow: 0 8px 28px rgba(0,0,0,.5); font-size: 13px; color: var(--text-main);
           cursor: move; user-select: none; touch-action: none; }
  .guide .step { font-size: 10.5px; color: var(--primary); font-weight: 700;
                 text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .guide .grip { color: var(--text-sec); font-size: 12px; margin-right: 5px; }
  .guide .close { float: right; color: var(--text-sec); cursor: pointer; font-size: 12px;
                  margin: -2px -4px 4px 8px; }
  .guide .close:hover { color: #e06c5f; }
  .guide .demo { margin-top: 7px; border: 1px solid var(--border-soft); border-radius: 2px;
                 overflow: hidden; background: #fff; }
  .guide .demo svg { display: block; width: 100%; height: auto; }
  @keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(6,150,215,.7); }
                      70% { box-shadow: 0 0 0 11px rgba(6,150,215,0); }
                      100% { box-shadow: 0 0 0 0 rgba(6,150,215,0); } }
  .pulse { animation: pulseG 1.6s infinite; border-radius: var(--rad); }
  /* масштаб подложки */
  .zoombox { display: inline-flex; align-items: center; gap: 0; }
  .zoombox button { border-radius: 0; margin: 0; }
  .zoombox button:first-child { border-radius: var(--rad) 0 0 var(--rad); }
  .zoombox button:last-child { border-radius: 0 var(--rad) var(--rad) 0; }
  .zoombox .val { min-width: 46px; text-align: center; font-size: 11.5px; font-weight: 600;
                  color: var(--text-sec); border-top: 1px solid var(--border-soft);
                  border-bottom: 1px solid var(--border-soft); background: #2a2a2a;
                  padding: 5px 4px; cursor: pointer; }
  /* Режим «Раскладка тёплого пола» (?m=ufh): радиаторы, сантехника, север и
     листы проекта — не его дело. !important — шаги ставят display в style. */
  .ufh-only { display: none; }
  html.ufh .ufh-only { display: inline-block; }
  /* Выпуск проекта (полный редактор, не мастер раскладки): та же простая шапка и шаги по
     номерам; все инструменты — под «Ещё ▾» (html.more) */
  .pj-head { display: none; }
  html.pj .pj-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px;
                     background: var(--surface); border-bottom: 1px solid #222; }
  .pj-head .t { font-size: 15px; font-weight: 700; }
  .pj-head .sub { color: var(--text-sec); flex: 1 1 220px; font-size: 12.5px; }
  .pj-path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pj-path .p { padding: 4px 12px; border-radius: 15px; border: 1px solid var(--border-soft); color: var(--text-sec);
                white-space: nowrap; }
  .pj-path .p.done { color: #7ec95a; cursor: pointer; }
  .pj-path .p.cur { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .pj-path .p.rel { cursor: pointer; border-color: var(--ok); color: #9be07a; }
  .pj-path .ar { color: #6a6a6a; }
  html.pj #b_more { display: inline-block; }
  html.pj #b_sheets_ufh { display: none !important; }
  html.pj:not(.more) .bar > :not(.ufh-keep):not(#b_save) { display: none !important; }
  html.pj #b_save { margin-left: auto; }
  .pj-checks { margin: 6px 0 0; padding-left: 18px; color: #d8b26a; font-size: 12.5px; }
  .pj-checks li { margin: 1px 0; }
  html.ufh #b_fixauto, html.ufh #b_wc,
  html.ufh #wctype, html.ufh #ztype, html.ufh #northsel, html.ufh #b_alltools,
  html.ufh #b_sheets, html.ufh #b_hints { display: none !important; }
  /* Мастер раскладки: в шапке только этажи, масштаб экрана, «Шаг назад» и
     «Ещё ▾»; инструменты шага — в строке мастера под шапкой. «Ещё» (html.more)
     возвращает шапку целиком. */
  html.ufh:not(.more) .bar > :not(.ufh-keep) { display: none !important; }
  .steps.wz { display: block; padding: 9px 12px 10px; font-size: 13px; }
  .wz-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wz-st { padding: 4px 11px 4px 5px; border-radius: 15px; border: 1px solid var(--border-soft);
           color: var(--text-sec); cursor: pointer; white-space: nowrap; font-weight: 500; }
  .wz-st .n { display: inline-block; min-width: 19px; height: 19px; line-height: 19px; text-align: center;
              border-radius: 10px; background: #4a4a4a; color: #fff; font-size: 11px; margin-right: 6px; }
  .wz-st.done { color: #7ec95a; }
  .wz-st.done .n { background: #3f7a2a; }
  .wz-st.cur { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; cursor: default; }
  .wz-st.cur .n { background: #fff; color: var(--primary); }
  .wz-st.off { opacity: .45; cursor: default; }
  .wz-ar { color: #6a6a6a; }
  .wz-do { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wz-do .tx { flex: 1 1 360px; color: var(--text-main); font-size: 13.5px; line-height: 1.45; }
  .wz-do .tx b { color: #fff; }
  /* карточка шага в стиле ИИ-ассистента: свечение, значок ✦, чипы-подсказки */
  .wz-do { padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(124,140,255,.35);
           background: linear-gradient(110deg, rgba(99,102,241,.16), rgba(56,189,248,.08) 60%, rgba(168,85,247,.10));
           box-shadow: 0 0 0 1px rgba(255,255,255,.03) inset, 0 4px 18px rgba(99,102,241,.12); }
  .wz-ai { flex: 1 1 360px; display: flex; gap: 11px; align-items: flex-start; min-width: 0; }
  .wz-ai .ai-ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
                  font-size: 15px; color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7 55%, #38bdf8);
                  box-shadow: 0 2px 10px rgba(124,92,255,.45); animation: aipulse 2.8s ease-in-out infinite; }
  .wz-ai .ai-body { min-width: 0; }
  .wz-ai .ai-h { color: var(--text-main); font-size: 14px; line-height: 1.4; font-weight: 500; }
  .wz-ai .ai-h b { color: inherit; }
  .wz-ai .ai-step { display: inline-block; margin-right: 8px; padding: 1px 9px; border-radius: 10px; font-size: 11.5px;
                    font-weight: 700; letter-spacing: .02em; color: #c7d2fe; background: rgba(99,102,241,.28); vertical-align: 1px; }
  /* подсказки — одной строкой под заголовком и кнопками, а не колонкой в узком блоке слева */
  .wz-do .ai-tips { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; }
  .wz-do .ai-tip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 2px; border-radius: 12px;
                   font-size: 11.5px; line-height: 1.5; color: var(--text-sec); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); }
  .wz-do .ai-tip i { font-style: normal; font-weight: 600; font-size: 11px; padding: 0 7px; border-radius: 10px;
                     color: var(--text-main); background: rgba(255,255,255,.10); }
  @keyframes aipulse { 0%, 100% { box-shadow: 0 2px 10px rgba(124,92,255,.45); } 50% { box-shadow: 0 2px 16px rgba(56,189,248,.7); } }
  @media (prefers-reduced-motion: reduce) { .wz-ai .ai-ic { animation: none; } }
  html.ufh.light .wz-do { background: linear-gradient(110deg, rgba(99,102,241,.08), rgba(56,189,248,.05) 60%, rgba(168,85,247,.06)); }
  html.ufh.light .wz-ai .ai-step { color: #4338ca; background: rgba(99,102,241,.14); }
  html.ufh.light .wz-do .ai-tip { background: rgba(0,0,0,.03); border-color: rgba(0,0,0,.09); }
  html.ufh.light .wz-do .ai-tip i { background: rgba(0,0,0,.07); }
  .wz-do button.go { font-size: 13.5px; padding: 6px 16px; }
  /* «ИИ читает план»: карточка по центру, пока модель отвечает */
  #scanbox { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 80;
             width: min(380px, calc(100vw - 32px)); box-sizing: border-box; padding: 18px 20px 16px;
             background: var(--surface); color: var(--text-main); border: 1px solid var(--border);
             border-radius: 14px; box-shadow: 0 14px 44px rgba(0,0,0,.4); animation: sbin .25s ease-out; }
  #scanbox .sb-t { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
  #scanbox .sb-spin { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%;
                      border: 3px solid rgba(128,128,128,.35); border-top-color: var(--primary);
                      animation: sbspin .8s linear infinite; }
  #scanbox .sb-bar { height: 8px; margin: 14px 0 9px; border-radius: 4px; overflow: hidden;
                     background: rgba(128,128,128,.28); }
  #scanbox .sb-bar i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .5s linear;
                       background: linear-gradient(90deg, var(--primary), var(--primary) 35%, rgba(255,255,255,.75) 50%, var(--primary) 65%, var(--primary));
                       background-size: 220% 100%; animation: sbshine 1.6s linear infinite; }
  #scanbox .sb-s { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text-sec); }
  #scanbox .sb-x { margin-top: 12px; font-size: 13px; color: var(--text-sec); }
  #scanbox .sb-x b { color: var(--primary); cursor: pointer; text-decoration: underline; font-weight: 600; }
  @keyframes sbspin { to { transform: rotate(360deg); } }
  @keyframes sbshine { from { background-position: 220% 0; } to { background-position: -120% 0; } }
  @keyframes sbin { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @media (prefers-reduced-motion: reduce) { #scanbox, #scanbox .sb-spin, #scanbox .sb-bar i { animation: none; } }
  /* Телефон: план на всю ширину, список комнат под ним (в ряд с колонкой 320 px
     от плана оставалась миниатюра), шаги — номерами, текст шага — одной фразой */
  @media (max-width: 720px) {
    .wrap { flex-direction: column; padding: 6px; align-items: stretch; }
    .cvbox, .side { flex: none; width: 100%; box-sizing: border-box; }
    .wz-ar { display: none; }
    .wz-st:not(.cur) { font-size: 0; padding: 4px; }
    .wz-st:not(.cur) .n { margin-right: 0; font-size: 11px; }
    .wz-do .tx, .wz-ai { flex: 1 1 100%; font-size: 14px; }
    .wz-do button { flex: 1 1 auto; }
    .pj-head .sub { display: none; }
  }
  .wz-todo { margin-top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: rgba(59,130,246,.16); border: 1px solid #3b82f6; }

<style id="skin">
  /* ===== Единая современная тема редактора =====

  :root {

    --border: rgba(20,30,60,.18); --border-soft: rgba(20,30,60,.10);

  .steps.wz { padding: 4px 14px 12px; }
  .wz-row { gap: 8px; }
  .wz-st { padding: 6px 14px 6px 6px; border-radius: 999px; border-color: var(--border-soft);
           background: var(--surface-light); transition: all .2s; }

  html.ufh.light .wz-st .n { background: rgba(20,30,60,.12); }

  #scanbox .sb-bar { height: 6px; margin: 16px 0 12px; border-radius: 3px; background: var(--surface-light); }
  #scanbox .sb-bar i { border-radius: 3px; background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8, #a855f7, #6366f1); background-size: 300% 100%;
                       animation: sbshine 2.4s linear infinite; }
  #scanbox .sb-stages { display: grid; gap: 7px; margin: 2px 0 6px; }
  #scanbox .sb-g { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-sec); transition: color .3s; }
  #scanbox .sb-g .d { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
                      font-size: 10px; border: 1.5px solid var(--border); color: transparent; transition: all .3s; }
  #scanbox .sb-g.on { color: var(--text-main); font-weight: 600; }
  #scanbox .sb-g.on .d { border-color: #818cf8; background: radial-gradient(circle, #818cf8 35%, transparent 40%); animation: dotpulse 1.4s ease-in-out infinite; }
  #scanbox .sb-g.ok { color: #5be0a2; }
  #scanbox .sb-g.ok .d { background: #22b573; border-color: #22b573; color: #fff; }
  @keyframes dotpulse { 50% { box-shadow: 0 0 0 5px rgba(129,140,248,.0); transform: scale(1.12); } 0% { box-shadow: 0 0 0 0 rgba(129,140,248,.6); } }
  #scanbox .sb-s { font-size: 12.5px; padding-top: 4px; }
  #scanbox .sb-x { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--k-line); }
  #scanbox .sb-x b { color: #a5b4fc; text-decoration: none; padding: 3px 10px; border-radius: 8px; background: rgba(99,102,241,.16); }
  #scanbox .sb-x b:hover { background: rgba(99,102,241,.3); }
  /* луч сканирования идёт по самому чертежу */
  #scanbeam { position: fixed; z-index: 70; pointer-events: none; overflow: hidden; border-radius: 10px;
              box-shadow: inset 0 0 0 1px rgba(129,140,248,.45), inset 0 0 40px rgba(99,102,241,.18); }
  #scanbeam::before { content: ''; position: absolute; left: 0; right: 0; height: 120px; top: -120px;
              background: linear-gradient(to bottom, transparent, rgba(99,102,241,.0) 5%, rgba(129,140,248,.28) 85%, rgba(56,189,248,.85) 99%, rgba(56,189,248,0));
              animation: beam 2.8s ease-in-out infinite; }
  #scanbeam::after { content: ''; position: absolute; inset: 0;
              background: linear-gradient(rgba(129,140,248,.07) 1px, transparent 1px) 0 0 / 100% 28px,
                          linear-gradient(90deg, rgba(129,140,248,.07) 1px, transparent 1px) 0 0 / 28px 100%;
              animation: gridfade 2.8s ease-in-out infinite; }
  @keyframes beam { 0% { transform: translateY(0); } 100% { transform: translateY(calc(100% + 240px)); } }
  @keyframes gridfade { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #scanbeam::before, #scanbeam::after, .wz-do, .wz-st.cur, #scanbox .sb-spin, #scanbox .sb-spin::after { animation: none; } }
  /* подсказки, окна выбора, быстрые клавиши */

  .fs-corner button { border-radius: 12px; background: var(--ai-grad); border-color: transparent; padding: 8px 14px;

  html.fs #steps { border-radius: 16px; background: var(--k-panel); backdrop-filter: blur(16px); border-color: var(--k-line);

<script>
'use strict';
// Доступ к проектированию. Своей авторизации у страницы нет, поэтому отметку
// оставляет калькулятор (app.syncDesignUI) — без неё редактор не открываем:
// иначе прямая ссылка обходила бы переключатель в админке.
// Режим «Раскладка тёплого пола» (?m=ufh): тот же редактор, но только то, что
// нужно для петель — план, комнаты, клик «тёплый пол здесь», коллектор.
// Открывается окном поверх калькулятора (app.openUfhPlan) и пускается своей
// отметкой: модуль раскладки включают тарифом, а не проектированием.
var UFH = /[?&]m=ufh(&|$)/.test(location.search);
var PJ = !UFH;     // полный редактор = «Выпуск проекта»: шаги по номерам, шапка с возвратом в калькулятор
if (PJ) document.documentElement.classList.add('pj');
if (UFH) document.documentElement.classList.add('ufh');
// Мастер раскладки открывается внутри калькулятора и оформляется его цветами
// (app.openUfhPlan кладёт их в heatcalc_ufh_theme): светлый калькулятор —
// светлое окно. Полный редактор проектирования остаётся тёмным, как САПР.
var UFH_THEME = null;
if (UFH) try { UFH_THEME = JSON.parse(localStorage.getItem('heatcalc_ufh_theme') || 'null'); } catch (e) {}
// Тему можно сменить, пока окно открыто (кнопка в шапке калькулятора): app.syncUfhTheme
// зовёт эту функцию. Прежние значения снимаются, иначе светлая тема после тёмной
// оставалась бы на половину тёмной.
function applyUfhTheme(T) {
  if (!T) return;
  var R = document.documentElement, st = R.style;
  ['--primary', '--primary-dim', '--bg', '--surface', '--text-main', '--text-sec', '--border', '--border-soft',
   '--surface-light', '--surface-hi', '--rad'].forEach(function (k) { st.removeProperty(k); });
  R.classList.remove('light');
  UFH_THEME = T;
  if (T.primary) { st.setProperty('--primary', T.primary); st.setProperty('--primary-dim', T.primary); }
  if (!T.dark) {
    R.classList.add('light');
    var set = function (k, v) { if (v) st.setProperty('--' + k, v); };
    set('bg', T.bg); set('surface', T.surface); set('text-main', T['text-main']); set('text-sec', T['text-sec']);
    set('border', T.border); set('border-soft', T.border);
    set('surface-light', T.bg); set('surface-hi', T.bg);
    st.setProperty('--rad', '8px');
  }
  // чертёж: на светлом окне — как есть, на тёмном — в графитовом виде
  try { if (typeof darkPlan !== 'undefined') { darkPlan = !!T.dark; if (typeof draw === 'function') draw(); } } catch (e) { }
}
if (UFH_THEME) applyUfhTheme(UFH_THEME);
(function () {
  var ok = false;
  try {
    ok = localStorage.getItem('heatcalc_design_access') === '1' ||
      (UFH && localStorage.getItem('heatcalc_ufhplan_access') === '1');
  } catch (e) {}
  if (ok) return;
  document.body.innerHTML =
    '<div style="max-width:520px;margin:80px auto;background:var(--surface);border-radius:3px;padding:28px 32px;' +
    'font:15px/1.5 system-ui,sans-serif;color:var(--text-main);border:1px solid var(--border-soft);'  +
    'box-shadow:0 8px 30px rgba(0,0,0,.45)">' +
    '<h2 style="margin:0 0 10px;font-size:19px">Раздел проектирования не открыт</h2>' +
    '<p style="margin:0 0 14px;color:var(--text-sec)">Планы этажей и проект включает администратор. ' +
    'Если доступ вам уже дали — откройте калькулятор heatcalc.ru, войдите в свою учётную запись ' +
    'и перейдите в редактор оттуда.</p>' +
    '<a href="index.html" style="display:inline-block;padding:9px 18px;border-radius:8px;' +
    'background:var(--primary);color:#fff;text-decoration:none;font-weight:600">К калькулятору</a></div>';
  document.body.style.background = 'var(--bg)';
  throw new Error('design access denied');
})();

// Данные: этажи с подложкой и зонами. Точки зон — в пикселях ИЗОБРАЖЕНИЯ.
var DATA = { floors: [{ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] }] };
var cur = 0, mode = 'select', tmp = [], scalePts = [], dragA = null, imgCache = {};
var scaleCur = null, scaleFree = false;   // след масштабной линейки и режим угла
var imgFailed = {};   // этажи, чью подложку не удалось забрать с сервера
var polyCur = null, closeTs = 0, undoStack = [], redoStack = [];
var TYPES = { tp: ['Тёплый пол', '#ff8000'], rad: ['Радиаторы', '#d22'],
  boiler: ['Котельная', '#5577aa'], wc: ['Санузел', '#0b7285'],
  // лестница, колонна, ванна, шкаф внутри тёплого пола — петли и подводки обходят
  cold: ['Без обогрева', '#888888'],
  // контур помещения без тёплого пола: клик в режиме раскладки делает из него
  // тёплый пол и обратно, контур при этом не теряется
  room: ['Помещение', '#8a94a6'] };
// Сантехприборы: подпись, буква на значке и габарит в мм (вдоль стены × от
// стены). Габариты нужны и для привязки к стене, и для значка на листах.
var FIXT = {
  basin: ['Раковина', 'Р', 600, 450],
  toilet: ['Унитаз', 'У', 360, 700],
  bath: ['Ванна', 'В', 1700, 700],
  shower: ['Душ', 'Д', 900, 900],
  wash: ['Стиральная машина', 'СМ', 600, 600],
  dish: ['Посудомоечная машина', 'ПМ', 600, 600],
  riser: ['Стояк канализации', 'Ст', 110, 110],
  // Канализационная насосная станция (BIOLIFT): условный корпус 400×300 мм, точные габариты — по паспорту модели
  pump: ['Насосная станция', 'БН', 400, 300]
};

try {
  var saved = JSON.parse(localStorage.getItem('floor_plans_v1'));
  if (saved && saved.floors && saved.floors.length) DATA = saved;
} catch (e) {}

// ─── Подложки на сервере (plans.php на Beget) ──────────────────────────
// В хранилище браузера подложка больше не лежит: одна картинка — сотни
// килобайт, на третьем этаже сохранение упиралось в лимит, а чистка кэша
// уносила работу целиком. Здесь остаётся только разметка (зоны, масштаб,
// радиаторы), сама картинка едет на хостинг и возвращается ссылкой.
//
// Мимо Supabase — сознательно: его egress выбран на две трети, а на Beget
// свободно 12 ГБ и трафик не тарифицируется.
var PLANS_URL = 'https://proxy.heatcalc.ru/plans.php';

// Ключ проекта: 32 hex-знака, он же имя папки на сервере. По нему подложку
// заберёт и заказчик, открывший ссылку на смету, — угадать 128 бит нельзя.
function planKey() {
  if (!/^[a-f0-9]{32}$/.test(DATA.key || '')) {
    var a = new Uint8Array(16);
    window.crypto.getRandomValues(a);
    DATA.key = Array.prototype.map.call(a, function (b) {
      return (b < 16 ? '0' : '') + b.toString(16);
    }).join('');
  }
  return DATA.key;
}

function planUrl(file) {
  return PLANS_URL + '?k=' + planKey() + '&n=' + encodeURIComponent(file);
}

/**
 * Токен сессии Supabase из хранилища калькулятора.
 *
 * Своей авторизации у редактора нет (доступ он берёт из отметки
 * heatcalc_design_access), но заливать файлы на хостинг без входа нельзя.
 * Домен тот же, что у калькулятора, поэтому сессия лежит рядом: библиотека
 * держит её под ключом sb-<проект>-auth-token и в разных версиях пишет туда
 * либо JSON, либо тот же JSON, завёрнутый в base64.
 */
var authKeysSeen = [];   // что нашлось в хранилище — для внятной жалобы

function authToken() {
  // Имя ключа и вложенность зависят от версии библиотеки
  // («sb-<проект>-auth-token» или «supabase.auth.token»; токен то в корне,
  // то в currentSession). Поэтому формат не угадываем, а ищем access_token
  // в любом ключе, похожем на хранилище Supabase — так же, как это делает
  // калькулятор в recognitionToken().
  function findToken(node, depth) {
    if (!node || typeof node !== 'object' || depth > 4) return null;
    if (typeof node.access_token === 'string' && node.access_token) return node.access_token;
    for (var k in node) {
      if (!Object.prototype.hasOwnProperty.call(node, k)) continue;
      var found = findToken(node[k], depth + 1);
      if (found) return found;
    }
    return null;
  }
  authKeysSeen = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i) || '';
      if (!/^(sb-|supabase)/i.test(key)) continue;
      authKeysSeen.push(key);
      var raw = localStorage.getItem(key);
      // Часть версий заворачивает сессию в base64.
      if (raw && raw.indexOf('base64-') === 0) {
        try { raw = atob(raw.slice(7)); } catch (e) {}
      }
      var parsed;
      try { parsed = JSON.parse(raw); } catch (e) { continue; }
      var token = findToken(parsed, 0);
      if (token) return token;
    }
  } catch (e) {}
  return null;
}

/**
 * Заливает подложку этажа. Резолвится именем файла на сервере.
 *
 * Не fetch, а XMLHttpRequest — ради двух вещей, которых у fetch нет:
 * прогресса отправки (иначе на слабой связи полоска молчит минутами и
 * непонятно, идёт ли вообще что-то) и таймаута (иначе запрос висит, пока
 * его не оборвёт сеть).
 */
function putFloorImage(fi, onProgress) {
  var f = DATA.floors[fi];
  var m = /^data:image\/(jpeg|png|webp);base64,(.+)$/.exec(f.img || '');
  if (!m) return Promise.resolve(null);
  var tok = authToken();
  if (!tok) {
    console.warn('[plan_editor] ключи хранилища Supabase:', authKeysSeen);
    return Promise.reject(new Error(authKeysSeen.length
      ? 'сессия в браузере есть, но токен в ней не найден — выйдите и войдите заново'
      : 'нет входа в учётную запись — войдите в калькуляторе по email или через Яндекс ID'));
  }
  var body = JSON.stringify({
    action: 'put', key: planKey(), floor: fi + 1,
    ext: m[1] === 'jpeg' ? 'jpg' : m[1], data: m[2]
  });
  return new Promise(function (ok, err) {
    var x = new XMLHttpRequest();
    x.open('POST', PLANS_URL, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('Authorization', 'Bearer ' + tok);
    x.timeout = 90000;
    if (x.upload && onProgress) {
      x.upload.onprogress = function (e) {
        if (e.lengthComputable) onProgress(e.loaded / e.total);
      };
    }
    x.onload = function () {
      var j = {};
      try { j = JSON.parse(x.responseText) || {}; } catch (e) {}
      if (x.status >= 200 && x.status < 300 && j.file) { ok(j.file); return; }
      err(new Error(j.error || ('сервер ответил ' + x.status)));
    };
    // Статус сюда не доходит: браузер прячет ответ, у которого нет
    // разрешения CORS, — а его нет ровно тогда, когда отвечал не наш
    // скрипт (страница 404, если plans.php не выложен, или отлуп хостинга).
    x.onerror = function () { err(new Error('сервер подложек не ответил')); };
    x.ontimeout = function () { err(new Error('сервер молчал полторы минуты')); };
    x.send(body);
  });
}

/**
 * Комната расчёта по имени — для зоны, подписанной руками.
 *
 * Связь «зона ↔ комната» держится на id, а не на совпадении имён: тёзки
 * («Санузел» на обоих этажах) по имени не различаются, и сверка на них
 * ломалась. Руками вписанное имя превращаем в id только тогда, когда такое
 * имя в расчёте одно; иначе ссылки нет и сверка работает по-старому.
 */
function roomIdByName(nm) {
  var k = String(nm || '').trim().toLowerCase(), hit = null, n = 0;
  if (!k) return null;
  calcRooms.forEach(function (r) {
    if (String(r.name).trim().toLowerCase() === k) { hit = r.id; n++; }
  });
  return (n === 1 && hit != null) ? hit : null;
}

/** Карточка санузла расчёта по имени зоны (регистр и пробелы не важны) */
function wcCardOf(name) {
  var k = String(name || '').trim().toLowerCase();
  if (!k) return null;
  for (var i = 0; i < calcWc.length; i++)
    if (String(calcWc[i].name).trim().toLowerCase() === k) return calcWc[i];
  return wcFuzzyCard(k);
}

// Помещение называется «С/у», «Ванная», «Душевая», а карточка водоснабжения в
// расчёте — «Санузел 1»: имена не совпали, и санузел на плане оставался без
// приборов, а в комплекте не было листов В и К. Такие комнаты берут по порядку
// карточки, чьё имя не совпадает ни с одной комнатой расчёта.
var WC_NAME_RE = /с\/у|с\.\s?у|санузел|санузл|ванн|туалет|душев|уборн|гигиен/i;
var wcFuzzy = {}, wcFuzzyN = 0, wcSpare = null;
function wcFuzzyCard(k) {
  if (!WC_NAME_RE.test(k) || !calcWc.length) return null;
  if (!wcSpare) {
    var roomKeys = {};
    calcRooms.forEach(function (r) { roomKeys[String(r.name || '').trim().toLowerCase()] = 1; });
    wcSpare = calcWc.filter(function (c) { return !roomKeys[String(c.name).trim().toLowerCase()]; });
  }
  if (!wcSpare.length) return null;
  if (!(k in wcFuzzy)) { wcFuzzy[k] = wcSpare[Math.min(wcFuzzyN, wcSpare.length - 1)]; wcFuzzyN++; }
  return wcFuzzy[k];
}

/**
 * Направление севера на плане: на сколько градусов по часовой стрелке он

 * 90. Расчёт по нему определяет, на какую сторону света выходит каждая
 * комната: на север и восток теплопотери по СНиП 41-01-2003 выше на 10 %.
 *
 * Хранится у этажа, а не у всего дома: подложки этажей сканируют по-разному, и
 * второй этаж вполне может лежать повёрнутым. Но задают север обычно один раз,
 * поэтому первое указание расходится на все этажи, где его ещё нет.
 */
function setNorth(v) {
  var f = F();
  if (v === '' || v === null) delete f.north;
  else {
    f.north = parseInt(v, 10) || 0;
    DATA.floors.forEach(function (g) { if (g && g.north === undefined) g.north = f.north; });
  }
  draw();
  hint(f.north === undefined
    ? 'Север не указан — надбавка на сторону света не начисляется, её можно задать вручную в карточке помещения.'
    : '<span class=ok>Север задан.</span> Расчёт сам определит, куда выходит каждая комната.');
}
function syncNorth() {

// pdf.js — лениво и с того же CDN, что использует распознавание накладных
var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadPdfJs() {

    var s = document.createElement('script');

  });
}

function applyPlanCanvas(c, later) {

  if (UFH) { f.rads = []; delete f.coll; wzFresh[cur] = 1; }   // новый план — разметка с нуля

function finishPlanLoad() {
  // Масштаб — единственное число разметки, которого нет ни на чертеже, ни в
  // расчёте. Комнаты этажа посчитаны — подбираем его по их площадям, и лист
  // сразу готов к «Распознать комнаты». Не вышло — как раньше, вручную.
  if (autoScale(true)) { if (mode !== 'select') setMode('select'); return; }
  hint('План загружен. Кликните две точки известного отрезка — режим масштаба уже включён.');
  // Следующий шаг после загрузки всегда один и тот же, поэтому режим
  // масштаба включаем сами: нажимать «Масштаб» вручную незачем. Проверка
  // на текущий режим обязательна — setMode переключает, и повторный вызов
  // в режиме масштаба его бы выключил.
  if (mode !== 'scale') setMode('scale');

// ─── Карта стен: тёмные пиксели подложки как преграды ──────────────────
// Общая основа «зоны по клику» и прилипания прямоугольника к стенам.
var maskCache = {};
function getMask(fi) {
  var idx = (fi == null) ? cur : fi;
  var f = DATA.floors[idx];
  if (!f || !f.img || !imgCache[idx]) return null;
  if (maskCache[idx]) return maskCache[idx];
  var k = Math.min(1, 900 / f.w);
  var w = Math.round(f.w * k), h = Math.round(f.h * k);
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.drawImage(imgCache[idx], 0, 0, w, h);
  var d = g.getImageData(0, 0, w, h).data;
  var bar = new Uint8Array(w * h);
  for (var i = 0, p = 0; i < bar.length; i++, p += 4) {
    var r = d[p], gg = d[p + 1], b = d[p + 2];
    var lum = (r * 3 + gg * 6 + b) / 10;
    // тёмное — стена/линия; красноватое (размерные цепочки) преградой не считаем
    var dark = lum < 165 && !(r > gg + 28 && r > b + 28);
    // Стены, залитые жёлтым или охрой (брус, бревно на планах проектировщиков):
    // светлые, по яркости в стены не проходили, а по «красноватости» ещё и
    // принимались за размерную линию. Отличаем их насыщенностью: синего в
    // них заметно меньше, чем красного и зелёного. Бледные заливки комнат
    // (кремовый, светло-жёлтый) под это не попадают — синего в них много.
    var ochre = r > 140 && gg > 120 && b < Math.min(r, gg) - 70 && gg > r * 0.62;
    bar[i] = (dark || ochre) ? 1 : 0;
  }
  // Чистить маску от размерных линий здесь нельзя: на планах они заодно
  // перекрывают широкие проёмы, и без них заливка комнат утекает через
  // проходы — помещения слипаются в одно. Чистка живёт в exportGeom, где
  // она нужна только контурам стен для листа.
  maskCache[idx] = { w: w, h: h, k: k, bar: bar };
  return maskCache[idx];
}

/**
 * Размыкание маски: эрозия и обратная дилатация радиусом r.
 *
 * Считается по интегральной сумме, поэтому не зависит от радиуса по времени.
 * Если чистка съедает больше половины тёмного — стены на плане нарисованы
 * тонким контуром, а не залиты; тогда откатываемся к исходной маске, иначе
 * от плана ничего не осталось бы.
 */
function openThin(bar, W, H, ppm) {
  var r = Math.max(1, Math.round(0.035 * ppm));
  if (r < 1 || W < 3 || H < 3) return;
  var N = W * H, i, x, y;
  var keep = new Uint8Array(N), was = 0;
  for (i = 0; i < N; i++) if (bar[i]) was++;
  if (!was) return;
  var sum = new Int32Array((W + 1) * (H + 1));
  var box = function (S, x0, y0, x1, y1) {           // сумма по прямоугольнику
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    x1 = Math.min(W - 1, x1); y1 = Math.min(H - 1, y1);
    return S[(y1 + 1) * (W + 1) + x1 + 1] - S[y0 * (W + 1) + x1 + 1]
         - S[(y1 + 1) * (W + 1) + x0] + S[y0 * (W + 1) + x0];
  };
  var integral = function (src, S) {
    for (y = 0; y < H; y++) {
      var row = 0;
      for (x = 0; x < W; x++) {
        row += src[y * W + x];
        S[(y + 1) * (W + 1) + x + 1] = S[y * (W + 1) + x + 1] + row;
      }
    }
  };
  integral(bar, sum);
  var er = new Uint8Array(N);
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    var x0 = x - r, y0 = y - r, x1 = x + r, y1 = y + r;
    var cells = (Math.min(W - 1, x1) - Math.max(0, x0) + 1) *
                (Math.min(H - 1, y1) - Math.max(0, y0) + 1);
    er[y * W + x] = (box(sum, x0, y0, x1, y1) === cells) ? 1 : 0;
  }
  var sum2 = new Int32Array((W + 1) * (H + 1));
  integral(er, sum2);
  var left = 0;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    var v = box(sum2, x - r, y - r, x + r, y + r) > 0 ? 1 : 0;
    keep[y * W + x] = v;
    if (v) left++;
  }
  if (left < was * 0.4) return;                       // стены контуром — не трогаем
  for (i = 0; i < N; i++) bar[i] = keep[i];
}

// ─── Подводки петель ТП к коллектору ───────────────────────────────────
// Маршруты считаются здесь при сохранении и уезжают в данные планов
// (f.leads): листы (project_plans.js) их только рисуют, ничего не зная о
// карте стен. Пересохранение пересчитывает маршруты заново.

/** Ближайшая свободная клетка маски (значок мог попасть на линию стены) */
function nearestFree(m, x, y) {
  x = Math.max(0, Math.min(m.w - 1, x)); y = Math.max(0, Math.min(m.h - 1, y));
  if (!m.bar[y * m.w + x]) return [x, y];
  for (var r = 1; r < 40; r++)
    for (var dy = -r; dy <= r; dy++)
      for (var dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        var nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < m.w && ny < m.h && !m.bar[ny * m.w + nx]) return [nx, ny];
      }
  return null;
}

/** Кратчайший маршрут по свободному полю (BFS): труба обходит стены,
 *  проходит в дверные проёмы — как реальная подводка по полу */
function routeOnMask(m, a, b) {
  var W = m.w, N = W * m.h;
  var prev = new Int32Array(N), i;
  for (i = 0; i < N; i++) prev[i] = -1;
  var q = new Int32Array(N), qt = 0, qh = 0;
  var s = a[1] * W + a[0], e = b[1] * W + b[0];
  prev[s] = s; q[qt++] = s;
  while (qh < qt) {
    var id = q[qh++];
    if (id === e) break;
    var x = id % W;
    if (x && !m.bar[id - 1] && prev[id - 1] < 0) { prev[id - 1] = id; q[qt++] = id - 1; }
    if (x < W - 1 && !m.bar[id + 1] && prev[id + 1] < 0) { prev[id + 1] = id; q[qt++] = id + 1; }
    if (id >= W && !m.bar[id - W] && prev[id - W] < 0) { prev[id - W] = id; q[qt++] = id - W; }
    if (id < N - W && !m.bar[id + W] && prev[id + W] < 0) { prev[id + W] = id; q[qt++] = id + W; }
  }
  if (prev[e] < 0) return null;
  var path = [], id2 = e;
  while (id2 !== s) { path.push([id2 % W, (id2 / W) | 0]); id2 = prev[id2]; }
  path.push([s % W, (s / W) | 0]);
  return path.reverse();
}

/** Точка входа в зону: ближайшая к p точка её контура */
function zoneEntry(z, p) {
  var best = null, bd = 1e18;
  for (var i = 0; i < z.pts.length; i++) {
    var a = z.pts[i], b = z.pts[(i + 1) % z.pts.length];
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var L2 = dx * dx + dy * dy || 1;
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2));
    var qx = a[0] + t * dx, qy = a[1] + t * dy;
    var dd = (qx - p[0]) * (qx - p[0]) + (qy - p[1]) * (qy - p[1]);
    if (dd < bd) { bd = dd; best = [Math.round(qx), Math.round(qy)]; }
  }
  return best;
}

// ─── Приборы санузлов из расчёта ───────────────────────────────────────
// Обводить санузел и отмечать в нём каждый прибор руками долго: состав
// приборов уже задан в карточке санузла калькулятора. Достаточно обвести
// зону «Санузел» и подписать её именем санузла — приборы расставятся вдоль
// стен сами. Ручной режим остаётся переключателем в шапке.

var fixAuto = true;
try { fixAuto = localStorage.getItem('plan_editor_fixauto') !== '0'; } catch (e) {}

function toggleFixAuto() {
  fixAuto = !fixAuto;
  try { localStorage.setItem('plan_editor_fixauto', fixAuto ? '1' : '0'); } catch (e) {}
  syncFixAutoBtn();
  if (fixAuto) refreshAutoFixtures();
  renderZones(); draw();
}
function syncFixAutoBtn() {
  var b = document.getElementById('b_fixauto');
  if (b) b.textContent = 'Приборы: ' + (fixAuto ? 'из расчёта' : 'вручную');
  var w = document.getElementById('wctype');
  if (w) w.style.display = fixAuto ? 'none' : '';
}

/** Рёбра зоны с внутренней нормалью: прибор ставится СПИНОЙ к стене, поэтому
 *  сдвигать его нужно перпендикулярно ребру, а не «к центру комнаты» —
 *  в Г-образном помещении центр лежит в стороне и прибор уезжал бы вбок. */
function zoneEdges(pts) {
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1) continue;
    var ux = dx / L, uy = dy / L;
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    // из двух нормалей берём ту, что смотрит внутрь зоны
    var nx = -uy, ny = ux;
    if (!pip([mx + nx * 2, my + ny * 2], pts)) { nx = -nx; ny = -ny; }
    out.push({ a: a, b: b, L: L, ux: ux, uy: uy, nx: nx, ny: ny,
      ang: Math.round(Math.atan2(dy, dx) * 180 / Math.PI) });
  }
  return out;
}

/** Есть ли стена за спиной прибора: луч наружу от точки по карте стен.
 *  Возвращает расстояние до стены в пикселях плана или -1 (проём, окно, край). */
function wallBehind(m, x, y, nx, ny, maxPx) {
  if (!m) return -1;
  var sx = x * m.k, sy = y * m.k, lim = maxPx * m.k;
  for (var d = 1; d <= lim; d++) {
    var px2 = Math.round(sx - nx * d), py2 = Math.round(sy - ny * d);
    if (px2 < 0 || py2 < 0 || px2 >= m.w || py2 >= m.h) return -1;
    if (m.bar[py2 * m.w + px2]) return d / m.k;
  }
  return -1;
}

/** Приборы одной зоны «Санузел» по её карточке в расчёте.
 *
 *  Каждый прибор прижимается СПИНОЙ К СТЕНЕ: идём вдоль периметра, на каждом
 *  шаге проверяем по карте стен, есть ли стена за спиной (в проёме двери её
 *  нет — там прибор не ставим), отодвигаем прибор от стены на половину его
 *  глубины и разворачиваем вдоль стены. Крупные приборы получают место по
 *  своей ширине, наложений нет. Стояк — в ближайшем к унитазу углу.
 */
function fixturesOfWcZone(f, z, cardArg, label) {
  var card = cardArg || wcCardOf(z.name);
  if (!card) return [];
  var zLabel = label || z.name || '';
  var order = ['toilet', 'pump', 'basin', 'bath', 'shower', 'wash', 'dish'], list = [];
  order.forEach(function (k) {
    var v = +(card.fixtures || {})[k] || 0;
    for (var i = 0; i < v; i++) list.push(k);
  });
  if (!list.length) return [];

  var ppm = f.pxPerM || 100, m = getMask(DATA.floors.indexOf(f));
  var edges = zoneEdges(z.pts);
  if (!edges.length) return [];
  var out = [], gap = 0.12 * ppm;          // зазор между приборами

  // слоты вдоль всех стен: (ребро, положение) с шагом в четверть метра
  var slots = [];
  edges.forEach(function (e) {
    for (var s = 0.25 * ppm; s <= e.L - 0.25 * ppm; s += 0.25 * ppm)
      slots.push({ e: e, s: s });
  });
  if (!slots.length) slots.push({ e: edges[0], s: edges[0].L / 2 });

  // полуразмеры прибора по осям плана с учётом поворота вдоль стены
  var halfOf = function (q) {
    var qw = (q.w || 500) / 2000 * ppm, qd = (q.d || 500) / 2000 * ppm;
    var vert = Math.abs(((q.ang || 0) % 180 + 180) % 180 - 90) < 45;
    return vert ? [qd, qw] : [qw, qd];
  };
  // площадь пересечения прибора-кандидата с уже поставленными (+ зазор)
  var overlapWith = function (x, y, h, pad) {
    var s = 0;
    out.forEach(function (q) {
      var hq = halfOf(q);
      var ow = Math.min(x + h[0], q.x + hq[0]) - Math.max(x - h[0], q.x - hq[0]) + pad;
      var oh = Math.min(y + h[1], q.y + hq[1]) - Math.max(y - h[1], q.y - hq[1]) + pad;
      if (ow > 0 && oh > 0) s += ow * oh;
    });
    return s;
  };

  list.forEach(function (t) {
    var W = (FIXT[t][2] || 500) / 1000 * ppm, D = (FIXT[t][3] || 500) / 1000 * ppm;
    var best = null;
    for (var i = 0; i < slots.length; i++) {
      var e = slots[i].e, s = slots[i].s;
      if (s - W / 2 < 0 || s + W / 2 > e.L) continue;       // не влезает по длине стены
      var bx = e.a[0] + e.ux * s, by = e.a[1] + e.uy * s;   // точка на стене
      // стена за спиной: в дверном проёме её нет — такой слот пропускаем
      if (m && wallBehind(m, bx + e.nx * 2, by + e.ny * 2, e.nx, e.ny, 0.5 * ppm) < 0) continue;
      var x = Math.round(bx + e.nx * (D / 2 + 0.02 * ppm));
      var y = Math.round(by + e.ny * (D / 2 + 0.02 * ppm));
      if (!pip([x, y], z.pts)) continue;                     // центр должен быть внутри
      // Столкновение — по прямоугольникам приборов, а не по расстоянию между
      // центрами: у двух приборов на соседних стенах в углу центры далеко, а
      // корпуса пересекаются.
      if (overlapWith(x, y, halfOf({ w: FIXT[t][2], d: FIXT[t][3], ang: e.ang }), gap) > 0) continue;
      best = { x: x, y: y, t: t, ang: e.ang, w: FIXT[t][2], d: FIXT[t][3], a: 1, z: zLabel };
      break;
    }
    // Места у стен не нашлось (тесная зона или нет подложки). Раньше прибор
    // вставал в центр зоны, и в тесном санузле душ ложился прямо на ванну.
    // Теперь перебираем точки внутри зоны и берём ту, где прибор ни с чем не
    // пересекается, а если такой нет — где перекрытие меньше всего.
    if (!best) {
      var c = centroid(z.pts);
      var hw = W / 2, hd = D / 2;
      var bbz = z.pts.reduce(function (acc, p) {
        return [Math.min(acc[0], p[0]), Math.min(acc[1], p[1]), Math.max(acc[2], p[0]), Math.max(acc[3], p[1])];
      }, [1e9, 1e9, -1e9, -1e9]);
      var stepG = 0.1 * ppm, bestO = Infinity;
      for (var gy = bbz[1] + hd; gy <= bbz[3] - hd + 0.5; gy += stepG) {
        for (var gx = bbz[0] + hw; gx <= bbz[2] - hw + 0.5; gx += stepG) {
          if (!pip([gx, gy], z.pts)) continue;
          var ov = overlapWith(gx, gy, [hw, hd], 0);
          // при равном перекрытии — ближе к середине зоны
          var score = ov * 1e6 + Math.hypot(gx - c[0], gy - c[1]);
          if (score < bestO) { bestO = score; best = { x: Math.round(gx), y: Math.round(gy) }; }
        }
      }
      if (!best) best = { x: Math.round(c[0]), y: Math.round(c[1]) };
      best = { x: best.x, y: best.y, t: t, ang: 0,
        w: FIXT[t][2], d: FIXT[t][3], a: 1, z: zLabel };
    }
    out.push(best);
  });

  // стояк канализации — в углу зоны, ближайшем к унитазу (или к первому прибору)
  var ref = out.filter(function (q) { return q.t === 'toilet'; })[0] || out[0];
  if (ref) {
    var cz = centroid(z.pts), bestV = null, bd = 1e18;
    z.pts.forEach(function (p) {
      var d = Math.hypot(p[0] - ref.x, p[1] - ref.y);
      if (d < bd) { bd = d; bestV = p; }
    });
    if (bestV) {
      var vx = cz[0] - bestV[0], vy = cz[1] - bestV[1], vl = Math.hypot(vx, vy) || 1;
      out.push({ x: Math.round(bestV[0] + vx / vl * 0.25 * ppm),
        y: Math.round(bestV[1] + vy / vl * 0.25 * ppm),
        t: 'riser', ang: 0, w: FIXT.riser[2], d: FIXT.riser[3], a: 1, z: zLabel });
    }
  }
  return out;
}

/** Пересборка приборов «из расчёта». Расставленные вручную (без флага a)
 *  остаются на месте — авто и ручные приборы сочетаются. */
function refreshAutoFixtures() {
  if (!fixAuto) return;
  DATA.floors.forEach(function (f) {
    var manual = (f.fixtures || []).filter(function (q) { return !q.a; });
    var auto = [];
    (f.zones || []).forEach(function (z) {
      if (z.type !== 'wc' || !z.pts || z.pts.length < 3) return;
      auto = auto.concat(fixturesOfWcZone(f, z));
    });
    // карточки шага «Санузлы и вода»: приборы кухни, санузлов и постирочной — в привязанных комнатах
    var ww = DATA.floors[0].water;
    if (ww && ww.visited && ww.cards) ww.cards.forEach(function (c) {
      if (c.fl !== DATA.floors.indexOf(f) || !c.zone) return;
      var rz = wwRoomZone(c.fl, c.zone);
      if (!rz || rz.type === 'wc') return;
      // станция, поставленная этому помещению шагом «Канализация», — ещё один «прибор» рядом с унитазом
      var pn = 0;
      (ww.pumps || []).forEach(function (pp) { if (ww.slopeOn && String(pp.room).trim().toLowerCase() === String(c.name).trim().toLowerCase()) pn += (+pp.qty || 1); });
      var cardX = pn ? { name: c.name, fixtures: Object.assign({}, c.fixtures, { pump: pn }) } : c;
      var gen = fixturesOfWcZone(f, rz, cardX, c.name), cnt = {};
      gen.forEach(function (q) {
        cnt[q.t] = (cnt[q.t] || 0) + 1;
        q.k = q.t + '#' + (cnt[q.t] - 1);                 // ключ для положения, которое поставил монтажник
        var o = c.pos && c.pos[q.k];
        if (o) { q.x = o.x; q.y = o.y; q.ang = o.ang || 0; }
      });
      auto = auto.concat(gen);
    });
    f.fixtures = manual.concat(auto);
  });
}

/** Маршрут между двумя точками по свободному месту (обход стен, проход в
 *  проёмы). Маски нет — прямая линия. */
function routeBetween(m, a, b) {
  if (!m) return [[a[0], a[1]], [b[0], b[1]]];
  var A = nearestFree(m, Math.round(a[0] * m.k), Math.round(a[1] * m.k));
  var B = nearestFree(m, Math.round(b[0] * m.k), Math.round(b[1] * m.k));
  var path = (A && B) ? routeOnMask(m, A, B) : null;
  if (!path) return [[a[0], a[1]], [b[0], b[1]]];
  var pts = dpSimp(path, 2.2).map(function (q) {
    return [Math.round(q[0] / m.k), Math.round(q[1] / m.k)];
  });
  pts[0] = [a[0], a[1]];
  pts[pts.length - 1] = [b[0], b[1]];
  return pts;
}

/** Трассы водоснабжения и канализации: вода — от котельной к каждому прибору,
 *  канализация — от прибора к ближайшему стояку. Считаются при сохранении,
 *  листы их только рисуют. Унитаз — выпуск 110 мм, остальное — 50 мм. */
function computeVk() {
  // Котельная с коллекторами водоснабжения стоит на одном этаже, а приборы
  // есть и на других. Туда вода приходит стояком — раньше у такого этажа
  // источника не было вовсе, и трассы не строились: пустые план, 3D и схема.
  var boilerSomewhere = DATA.floors.some(function (f) {
    return (f.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
  DATA.floors.forEach(function (f, fi) {
    f.wlines = []; f.slines = []; delete f.wsrc;
    var fx = f.fixtures || [];
    if (!fx.length || !f.pxPerM) return;
    var m = getMask(fi);
    var src = null, srcKind = null;
    (f.zones || []).forEach(function (z) { if (z.type === 'boiler') { src = centroid(z.pts); srcKind = 'boiler'; } });
    var risers = fx.filter(function (q) { return q.t === 'riser'; });
    if (!src && boilerSomewhere) {
      // Стояки В1/Т3 ведут в той же шахте, что стояк канализации; его нет —
      // в середине санузла этажа.
      if (risers.length) { src = [risers[0].x, risers[0].y]; }
      else {
        var wz = (f.zones || []).filter(function (z) { return z.type === 'wc'; });
        if (wz.length) src = centroid(wz[0].pts);
        else {
          var sx = 0, sy = 0;
          fx.forEach(function (q) { sx += q.x; sy += q.y; });
          src = [sx / fx.length, sy / fx.length];
        }
      }
      srcKind = 'riser';
    }
    if (!src && f.coll) { src = [f.coll.x, f.coll.y]; srcKind = 'coll'; }
    // мастер: лучевая схема — от коллекторов воды, где бы их ни поставили
    var wP = (DATA.floors[0].water && DATA.floors[0].water.visited) ? wwPoints(DATA.floors[0].water) : null;
    if (wP && wP.coll && wP.coll.fl === fi) { src = [wP.coll.x, wP.coll.y]; srcKind = 'boiler'; }
    if (src) f.wsrc = { x: Math.round(src[0]), y: Math.round(src[1]), kind: srcKind };
    // Мастер: вода идёт как трассы радиаторов — по комнатам, стены только через двери, под 90° (projectPlans.routePipes),
    // лучом от коллекторов к каждому прибору; санузел-стояк канализации — тем же способом внутри комнаты.
    var dIdx = [], dPts = [];
    fx.forEach(function (q, qi) { if (q.t !== 'riser' && q.t !== 'pump') { dIdx.push(qi); dPts.push([q.x, q.y]); } });
    var wRoutes = src ? wwRoutes(f, fi, src, dPts, m) : null;
    f.spress = [];
    fx.forEach(function (q, qi) {
      if (q.t === 'riser') return;
      if (src && q.t !== 'pump') f.wlines.push({ i: qi, pts: wRoutes ? wRoutes[dIdx.indexOf(qi)] : routeBetween(m, src, [q.x, q.y]) });
      if (risers.length) {
        var best = risers[0], bd = 1e18;
        // стояк своего помещения (у санузла он свой); ближайший по прямой может стоять за стеной в соседней комнате
        var own = risers.filter(function (r) { return r.z && r.z === q.z; });
        (own.length ? own : risers).forEach(function (r) {
          var d = Math.hypot(r.x - q.x, r.y - q.y);
          if (d < bd) { bd = d; best = r; }
        });
        // Помещение со станцией: приборы сливаются в неё, от станции к стояку идёт напорная труба Ø32
        var pumpQ = null, pumpI = -1;
        if (q.t !== 'pump') fx.forEach(function (pq, pi) { if (!pumpQ && pq.t === 'pump' && pq.z === q.z) { pumpQ = pq; pumpI = pi; } });
        var tgt = pumpQ || best, sPts = null;
        { var sr = wwRoutes(f, fi, [tgt.x, tgt.y], [[q.x, q.y]], m); sPts = sr && sr[0] ? sr[0].slice().reverse() : null; }
        var linePts = sPts || routeBetween(m, [q.x, q.y], [tgt.x, tgt.y]);
        if (q.t === 'pump') f.spress.push({ i: qi, d: 32, pts: linePts });
        else f.slines.push({ i: qi, d: (q.t === 'toilet' ? 110 : (pumpQ ? 40 : 50)), pump: pumpI, pts: linePts });
      }
    });
  });
}

function computeLeads() {
  DATA.floors.forEach(function (f, fi) {
    f.leads = [];
    if (!f.coll || !f.pxPerM) return;
    // этаж ни разу не открывали в этой сессии — картинки в кэше нет,
    // маршрут не построить: подводка ляжет прямой линией
    var m = getMask(fi);
    f.zones.forEach(function (z, zi) {
      if (z.type !== 'tp') return;
      var E = zoneEntry(z, [f.coll.x, f.coll.y]);
      if (!E) return;
      var pts = null;
      if (m) {
        var a = nearestFree(m, Math.round(f.coll.x * m.k), Math.round(f.coll.y * m.k));
        var b = nearestFree(m, Math.round(E[0] * m.k), Math.round(E[1] * m.k));
        var path = (a && b) ? routeOnMask(m, a, b) : null;
        if (path) {
          pts = dpSimp(path, 2.2).map(function (q) {
            return [Math.round(q[0] / m.k), Math.round(q[1] / m.k)];
          });
          pts[0] = [f.coll.x, f.coll.y];          // концы — точно в коллектор и вход
          pts[pts.length - 1] = E;
        }
      }
      // Нет карты стен — прямую «коллектор → вход» не сохраняем: листы приняли бы её за желаемую трассу
      if (!pts) return;
      f.leads.push({ i: zi, pts: pts });
    });
  });
}

/** Разметка комнат (watershed): карта расстояний до стен → «ядра» глубже
 *  0.63 м разъединяются в дверях и проёмах сами → ядра разрастаются обратно
 *  по свободному месту. Каждому пикселю — метка своей комнаты. */
/**
 * Геометрия этажа для листов: контуры стен и окна.
 *
 * Лист «Сводный план сетей» рисуется программой, а не подложкой: подложка
 * у монтажников любая (фото, скан, экспорт CAD), а лист должен выглядеть
 * одинаково. Контуры берём из той же маски, по которой считаются маршруты
 * труб: тёмное — стена. Дверные проёмы отдельно искать не нужно — в маске
 * это разрывы, и в контуре они остаются разрывами.
 *
 * Мелочь (текст, размерные цепочки, штриховки) отсекается по площади и по
 * средней толщине: стена толще 5 см, надпись — нет.
 */
function exportGeom(fi) {
  var idx = (fi == null) ? cur : fi;
  var f = DATA.floors[idx];
  var m = getMask(idx);
  if (!f || !m || !f.pxPerM) return null;
  var W = m.w, H = m.h, N = W * H;
  var ppm = f.pxPerM * m.k;                       // пикселей маски на метр
  // Копия маски, очищенная от тонкого: размерные цепочки и подписи не должны
  // попасть в контуры стен. Исходная маска не трогается — по ней считаются
  // комнаты и маршруты труб.
  var wm = getWallMask(idx);
  var bar = wm ? wm.bar : m.bar;
  var lab = new Int32Array(N), labMin = [-1], labCnt = [0];
  var bb = [null], q = new Int32Array(N), L = 0;
  for (var s0 = 0; s0 < N; s0++) {
    if (!bar[s0] || lab[s0]) continue;
    L++; labMin.push(s0); labCnt.push(0);
    var x0 = s0 % W, y0 = (s0 / W) | 0, box = [x0, y0, x0, y0];
    var qh = 0, qt = 0;
    lab[s0] = L; q[qt++] = s0;
    while (qh < qt) {
      var c = q[qh++], cx = c % W, cy = (c / W) | 0;
      labCnt[L]++;
      if (cx < box[0]) box[0] = cx;
      if (cy < box[1]) box[1] = cy;
      if (cx > box[2]) box[2] = cx;
      if (cy > box[3]) box[3] = cy;
      for (var d = 0; d < 8; d++) {
        var nx = cx + [1, -1, 0, 0, 1, 1, -1, -1][d];
        var ny = cy + [0, 0, 1, -1, 1, -1, 1, -1][d];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var ni = ny * W + nx;
        if (bar[ni] && !lab[ni]) { lab[ni] = L; q[qt++] = ni; }
      }
    }
    bb.push(box);
  }
  var fake = { w: W, h: H, k: m.k, labels: lab, labMin: labMin };
  var walls = [];
  for (var i = 1; i <= L; i++) {
    var box2 = bb[i], side = Math.max(box2[2] - box2[0], box2[3] - box2[1]) || 1;
    if (labCnt[i] < 0.10 * ppm * ppm) continue;   // мелкое — надписи, значки
    if (labCnt[i] / side < 0.05 * ppm) continue;  // тонкое — размерные линии
    var pts = traceLabel(fake, i);
    if (pts && pts.length > 2) walls.push(pts);
  }
  // Ширину окна округляем до стандартной: измерение по растру даёт ±5 см,
  // а на листе рядом с окном стоит размер — врать он не должен. Дверей это
  // не касается: их detectWindows не отдаёт (у проёма нет тонких линий
  // остекления, по ним окно и опознаётся).
  var STD_W = [600, 900, 1000, 1200, 1300, 1400, 1500, 1600, 1800, 2000, 2100, 2400, 2700, 3000];
  var wins = [], doors = [];
  try {
    var save = cur; cur = idx;
    wins = (detectWindows() || []).map(function (w) {
      var mmW = (w.ow || w.w) / (f.pxPerM || 100) * 1000;
      var best = STD_W[0];
      STD_W.forEach(function (v) { if (Math.abs(v - mmW) < Math.abs(best - mmW)) best = v; });
      var std = Math.abs(best - mmW) <= 150 ? best : Math.round(mmW / 50) * 50;
      return { x: Math.round(w.ox != null ? w.ox : w.x), y: Math.round(w.oy != null ? w.oy : w.y),
        w: Math.round(w.ow || w.w), ang: w.ang || 0, mm: std };
    });
    doors = DOORS.map(function (d) {
      var dmm = d.w / (f.pxPerM || 100) * 1000;
      var STD_D = [600, 700, 800, 900, 1000, 1200, 1500];
      var bd = STD_D[0];
      STD_D.forEach(function (v) { if (Math.abs(v - dmm) < Math.abs(bd - dmm)) bd = v; });
      return { x: Math.round(d.x), y: Math.round(d.y), w: Math.round(d.w), ang: d.ang,
        side: d.side, hinge: d.hinge, mm: Math.abs(bd - dmm) <= 120 ? bd : Math.round(dmm / 50) * 50 };
    });
    cur = save;
  } catch (e) { console.error('[plan_editor] geom windows:', e); }
  return { walls: walls, wins: wins, doors: doors };
}

/** Геометрия всех этажей — считается при сохранении, уезжает в данные планов */
function computeGeom() {
  DATA.floors.forEach(function (f, fi) {
    try { f.geom = exportGeom(fi); }
    catch (e) { console.error('[plan_editor] geom:', e); f.geom = f.geom || null; }
  });
}

/** Карта расстояний (шахматная метрика, в клетках маски) до ближайшей
 *  тёмной клетки. Та же, что считает labelRooms, — вынесена для чистки маски. */
function chamferDist(B, W, H) {
  var N = W * H, d = new Int16Array(N), i, x, y, v;
  for (i = 0; i < N; i++) d[i] = B[i] ? 0 : 30000;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    i = y * W + x; if (!d[i]) continue;
    v = d[i];
    if (x) v = Math.min(v, d[i - 1] + 1);
    if (y) {
      v = Math.min(v, d[i - W] + 1);
      if (x) v = Math.min(v, d[i - W - 1] + 1);
      if (x < W - 1) v = Math.min(v, d[i - W + 1] + 1);
    }
    d[i] = v;
  }
  for (y = H - 1; y >= 0; y--) for (x = W - 1; x >= 0; x--) {
    i = y * W + x; if (!d[i]) continue;
    v = d[i];
    if (x < W - 1) v = Math.min(v, d[i + 1] + 1);
    if (y < H - 1) {
      v = Math.min(v, d[i + W] + 1);
      if (x < W - 1) v = Math.min(v, d[i + W + 1] + 1);
      if (x) v = Math.min(v, d[i + W - 1] + 1);
    }
    d[i] = v;
  }
  return d;
}

/** Маска стен без тонкого: размерные цепочки, выноски, трубы и подписи уходят,
 *  стена остаётся. Чистка стирает и остекление в оконных проёмах — тонкие
 *  линии между простенками, и комната «вытекает» через окно на улицу. Поэтому
 *  тонкое возвращаем, если оно у самой стены (ближе 0,35 м): остекление и
 *  откосы встают на место, а трубы и подписи посреди комнаты остаются стёртыми. */
/** Мебель и сантехника — мелкие тёмные фигуры внутри комнат (диван, ванна, шкаф,
 *  штриховка). Стена — длинная связная линия, у мебели габариты меньше метра с
 *  небольшим. Компоненты тёмной маски, у которых обе стороны короче minM метров,
 *  стираем: они не делят комнату. Проверяем на связность 4-соседями. */
function furnitureClear(bar, W, H, ppm, minM) {
  var N = W * H, lab = new Int32Array(N), st = new Int32Array(N), L = 0, keep = [0];
  var lim = (minM || 1.2) * ppm;
  for (var i = 0; i < N; i++) {
    if (!bar[i] || lab[i]) continue;
    L++; var sp = 0, n = 0; st[sp++] = i; lab[i] = L;
    var x0 = W, x1 = -1, y0 = H, y1 = -1;
    while (sp) {
      var c = st[--sp], cx = c % W, cy = (c - cx) / W; n++;
      if (cx < x0) x0 = cx; if (cx > x1) x1 = cx; if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
      if (cx && bar[c - 1] && !lab[c - 1]) { lab[c - 1] = L; st[sp++] = c - 1; }
      if (cx < W - 1 && bar[c + 1] && !lab[c + 1]) { lab[c + 1] = L; st[sp++] = c + 1; }
      if (cy && bar[c - W] && !lab[c - W]) { lab[c - W] = L; st[sp++] = c - W; }
      if (cy < H - 1 && bar[c + W] && !lab[c + W]) { lab[c + W] = L; st[sp++] = c + W; }
    }
    keep.push(Math.max(x1 - x0, y1 - y0) >= lim ? 1 : 0);
  }
  for (var j = 0; j < N; j++) if (lab[j] && !keep[lab[j]]) bar[j] = 0;
  return bar;
}

function cleanBar(bar, W, H, ppm) {
  var N = W * H, i, C0 = new Uint8Array(bar);
  openThin(C0, W, H, ppm);
  var dc = chamferDist(C0, W, H), near = Math.max(2, Math.round(0.35 * ppm));
  var B = new Uint8Array(N);
  for (i = 0; i < N; i++) B[i] = (C0[i] || (bar[i] && dc[i] <= near)) ? 1 : 0;
  return B;
}

/**
 * Комната по грани стены, а не по размерной цепочке.
 *
 * Метки комнат ищутся по полной маске, где тёмная и стена, и тонкая линия:
 * размерные цепочки вдоль стен, лестницы, подписи. Комната кончалась на
 * первой же линии, и полоса между стеной и размерной цепочкой — 0,3–0,6 м
 * по всему периметру — в площадь не входила: найденная площадь выходила
 * меньше подписанной на плане на 13–25 % (03.10.2026, три плана заказчика с
 * подписанными площадями, bench/room_areas.js).
 *
 * Метки разрастаются по маске без тонкого — до стены — в пределах 0,9 м от
 * найденной комнаты: дальше в дверной проём на улицу они не уйдут. Замкнутые
 * островки внутри комнаты (лестничный проём, шахта) целиком отходят той
 * комнате, которая их окружает.
 */
var GROW_ROOMS = true;    // сверка с подписанными площадями (reconcileRooms) гасит рост на один прогон
function growToWalls(lab, bar, W, H, ppm) {
  var N = W * H, i, x, C = cleanBar(bar, W, H, ppm);
  var cap = Math.max(2, Math.round(0.9 * ppm));
  var dist = new Int16Array(N), q = new Int32Array(N), qt = 0, qh = 0;
  for (i = 0; i < N; i++) if (lab[i]) q[qt++] = i;
  while (qh < qt) {
    var id = q[qh++], dd = dist[id];
    if (dd >= cap) continue;
    x = id % W;
    var nb = [x ? id - 1 : -1, x < W - 1 ? id + 1 : -1, id >= W ? id - W : -1, id < N - W ? id + W : -1];
    for (var t = 0; t < 4; t++) {
      var n = nb[t];
      if (n < 0 || lab[n] || C[n]) continue;
      lab[n] = lab[id]; dist[n] = dd + 1; q[qt++] = n;
    }
  }
  // замкнутые островки: свободное по чистой маске, чего никто не занял
  var seen = new Uint8Array(N), maxIsle = 14 * ppm * ppm;
  for (i = 0; i < N; i++) {
    if (lab[i] || C[i] || seen[i]) continue;
    var comp = [i], ch = 0, edge = false, votes = {}, tot = 0;
    seen[i] = 1;
    while (ch < comp.length) {
      var c = comp[ch++], cx = c % W, cy = (c / W) | 0;
      if (!cx || !cy || cx === W - 1 || cy === H - 1) edge = true;
      var nn = [cx ? c - 1 : -1, cx < W - 1 ? c + 1 : -1, cy ? c - W : -1, cy < H - 1 ? c + W : -1];
      for (var u = 0; u < 4; u++) {
        var m2 = nn[u];
        if (m2 < 0) continue;
        if (lab[m2]) { votes[lab[m2]] = (votes[lab[m2]] || 0) + 1; tot++; }
        else if (!C[m2] && !seen[m2]) { seen[m2] = 1; comp.push(m2); }
      }
      if (comp.length > maxIsle) break;
    }
    if (edge || comp.length > maxIsle || !tot) continue;
    var best = 0, bv = 0;
    for (var key in votes) if (votes[key] > bv) { bv = votes[key]; best = +key; }
    if (bv < 0.9 * tot) continue;
    for (var z = 0; z < comp.length; z++) lab[comp[z]] = best;
  }
}

function labelRooms() {
  var m = getMask(); if (!m) return null;
  var f = F(), mode = f.roomMask === 'clean' ? 'clean' : 'raw';
  if (m.labels && m.labMode === mode) return m;
  var ppm = (f.pxPerM || 100) * m.k;
  var W = m.w, H = m.h, N = W * H;
  // Инженерный чертёж (планы ОВ/ВК) исчерчен внутри комнат: трубы, выноски,
  // подписи, мебель. От каждой линии «ядро» комнаты отступает на 0,63 м, и
  // при настоящем масштабе ядер почти не остаётся — подбор уходил в заведомо
  // мелкий масштаб, где их больше. Режим 'clean' ищет комнаты по маске без
  // тонкого (openThin): стена остаётся, трубы и текст уходят. Режим выбирает
  // подбор масштаба (guessScale) и запоминает за этажом.
  // Мебель и сантехника стираются из маски до поиска комнат: мелкие тёмные
  // фигуры внутри комнаты не должны резать её на куски (1,2 м — порог габарита)
  var base = furnitureClear(new Uint8Array(m.bar), W, H, ppm, 1.2);
  var B = base;
  if (mode === 'clean') B = cleanBar(base, W, H, ppm);
  var d = chamferDist(B, W, H), i, x, y;
  var r = Math.max(3, Math.round(0.63 * ppm));
  var lab = new Int32Array(N), q = new Int32Array(N), qt = 0, L = 0;
  for (i = 0; i < N; i++) {                       // ядра комнат
    if (lab[i] || d[i] <= r) continue;
    L++;
    lab[i] = L; q[qt++] = i;
    var hd = qt - 1;
    while (hd < qt) {
      var idx = q[hd++], xx = idx % W;
      if (xx && d[idx - 1] > r && !lab[idx - 1]) { lab[idx - 1] = L; q[qt++] = idx - 1; }
      if (xx < W - 1 && d[idx + 1] > r && !lab[idx + 1]) { lab[idx + 1] = L; q[qt++] = idx + 1; }
      if (idx >= W && d[idx - W] > r && !lab[idx - W]) { lab[idx - W] = L; q[qt++] = idx - W; }
      if (idx < N - W && d[idx + W] > r && !lab[idx + W]) { lab[idx + W] = L; q[qt++] = idx + W; }
    }
  }
  var qh = 0;                                      // разрастание ядер
  while (qh < qt) {
    var id2 = q[qh++], Lc = lab[id2], x2 = id2 % W;
    if (x2 && d[id2 - 1] > 0 && !lab[id2 - 1]) { lab[id2 - 1] = Lc; q[qt++] = id2 - 1; }
    if (x2 < W - 1 && d[id2 + 1] > 0 && !lab[id2 + 1]) { lab[id2 + 1] = Lc; q[qt++] = id2 + 1; }
    if (id2 >= W && d[id2 - W] > 0 && !lab[id2 - W]) { lab[id2 - W] = Lc; q[qt++] = id2 - W; }
    if (id2 < N - W && d[id2 + W] > 0 && !lab[id2 + W]) { lab[id2 + W] = Lc; q[qt++] = id2 + W; }
  }
  if (mode === 'raw' && L && GROW_ROOMS) growToWalls(lab, base, W, H, ppm);
  var cnt = new Int32Array(L + 1), edge = new Uint8Array(L + 1);
  var mn = new Int32Array(L + 1);
  for (i = 0; i <= L; i++) mn[i] = -1;
  for (i = 0; i < N; i++) {
    var Lx = lab[i]; if (!Lx) continue;
    cnt[Lx]++;
    if (mn[Lx] < 0) mn[Lx] = i;
    x = i % W; y = (i / W) | 0;
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) edge[Lx] = 1;
  }
  m.labels = lab; m.labCnt = cnt; m.labEdge = edge; m.labMin = mn; m.labN = L; m.labMode = mode;
  return m;
}

/** Контур области метки L → полигон в пикселях изображения.
 *  Обход границы по рёбрам (crack following), регион всегда справа. */
function traceLabel(m, L) {
  var W = m.w, H = m.h, lab = m.labels;
  var s0 = m.labMin[L]; if (s0 < 0) return null;
  var bx = s0 % W, by = (s0 / W) | 0;
  function inR(x, y) { return x >= 0 && y >= 0 && x < W && y < H && lab[y * W + x] === L; }
  // dir: 0→право, 1→вниз, 2→влево, 3→вверх; клетки слева/справа по ходу
  var LA = [[0, -1], [0, 0], [-1, 0], [-1, -1]];
  var RA = [[0, 0], [-1, 0], [-1, -1], [0, -1]];
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  var x = bx, y = by, dir = 0, pts = [], steps = 0, maxSteps = 8 * W * H;
  do {
    pts.push([x, y]);
    var la = LA[dir], ra = RA[dir];
    if (inR(x + la[0], y + la[1])) dir = (dir + 3) % 4;        // поворот влево
    else if (!inR(x + ra[0], y + ra[1])) dir = (dir + 1) % 4;  // поворот вправо
    x += DX[dir]; y += DY[dir];
  } while (!(x === bx && y === by) && ++steps < maxSteps);
  if (pts.length < 8 || steps >= maxSteps) return null;
  // Контур комнаты: допуск — 0,1 м, а не 2,4 px. Иначе каждая неровность стены

/**

/** Shift: следующая точка контура строго по горизонтали/вертикали от прежней */

/**

 * прилипание к стене и углу (snapWall). Alt отключает прилипание.

/** Копия маски, где свободные отрезки короче maxLen между двумя ТОЛСТЫМИ тёмными закрыты — дверной

 *  Косяками считаются только отрезки толще minT (стена, а не контур кровати или линия окна):

/** Копия маски без текста подписи: тёмные кусочки вокруг точки (цифры, «м²», перечёркивание),
