    } catch (e) { console.warn('[plan_editor] подписи площадей:', e && e.message); finish([]); }
  });
}

/** Название комнаты из подписи: убрать мусор, отсеять не-названия, привести к «Спальня» */
function cleanRoomName(s) {
  s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim().replace(/[.,:;]+$/, '');
  if (s.length < 3 || s.length > 28) return '';
  if (!/[А-Яа-яЁё]{3}/.test(s)) return '';
  if (/^(площадь|итого|всего|этаж|план|лист|масштаб|экспликация|помещени[ея]|высота|отметка)\b/i.test(s)) return '';
  if (/м\s*[²2]|кв\.?\s*м|\bвт\b|\bмм\b/i.test(s)) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/** Одинаковые названия получают номера по порядку на плане (сверху вниз, слева направо): «Спальня 1», «Спальня 2» */
function uniqueLabelNames(labs) {
  var cnt = {}, seen = {};
  labs.forEach(function (l) { if (l.name) cnt[l.name.toLowerCase()] = (cnt[l.name.toLowerCase()] || 0) + 1; });
  labs.slice().sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); }).forEach(function (l) {
    if (!l.name) return;
    var k = l.name.toLowerCase();
    if (cnt[k] > 1) { seen[k] = (seen[k] || 0) + 1; l.name = l.name + ' ' + seen[k]; }
  });
}

/**
 * Название комнаты рядом с подписью площади в текстовом слое PDF: проектировщики ставят
 * его строкой выше (реже ниже), по центру над числом. Берётся ближайшая строка, куски
 * одной строки склеиваются («Кухня-» «гостиная»).
 */
function nameNearLabel(items, L) {
  var h = L.h || 9, best = null, bd = 1e9;
  var cand = items.filter(function (t) {
    return t !== L.item && /[А-Яа-яЁё]{2}/.test(t.s) && !/^м\s*[²2]/i.test(t.s);
  });
  cand.forEach(function (t) {
    var dy = L.y0 - t.y, ady = Math.abs(dy);
    if (ady < 0.4 * h || ady > 3.4 * h) return;
    var cxC = t.x + (t.w || 0) / 2, cxL = L.x0 + (L.w || 0) / 2;
    if (Math.abs(cxC - cxL) > Math.max(t.w || 0, L.w || 0) * 0.9 + 3 * h) return;
    var d = ady + (dy < 0 ? 0.6 * h : 0);                       // выше площади — предпочтительнее
    if (d < bd) { bd = d; best = t; }
  });
  if (!best) return '';
  var line = cand.filter(function (t) { return Math.abs(t.y - best.y) <= 0.35 * h; }).sort(function (a, b) { return a.x - b.x; });
  var i0 = line.indexOf(best), lo = i0, hi = i0;
  while (lo > 0 && line[lo].x - (line[lo - 1].x + (line[lo - 1].w || 0)) <= 1.3 * h) lo--;
  while (hi < line.length - 1 && line[hi + 1].x - (line[hi].x + (line[hi].w || 0)) <= 1.3 * h) hi++;
  return cleanRoomName(line.slice(lo, hi + 1).map(function (t) { return t.s.trim(); }).join(' ').replace(/-\s+/g, '-'));
}

function areaLabelsFrom(items) {
  var out = [], UNIT = /^(?:м\s*[²2]|м\.?\s*кв|кв\.?\s*м)/i;
  // Показатель степени в PDF обычно отдельный кусок «2» чуть выше строки:
  // «24,78 м» + «2». Ищем его сразу за концом числа.
  var sup = function (t, items) {
    for (var j = 0; j < items.length; j++) {
      var u = items[j];
      if (!/^[²2]$/.test(u.s)) continue;
      var dx = u.x - (t.x + (t.w || 0)), dy = Math.abs(u.y - t.y);
      if (dx > -3 && dx < Math.max(8, (t.h || 8)) && dy < Math.max(8, (t.h || 8))) return true;
    }
    return false;
  };
  (items || []).forEach(function (t, i) {
    var cx = t.x + (t.w || 0) / 2, cy = t.y - (t.h || 0) / 2, v = null, m;
    // площадь бывает и целой («20 м²»), но только с единицей рядом
    if ((m = /^(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:м\s*[²2]|м\.?\s*кв|кв\.?\s*м)/i.exec(t.s))) v = m[1];
    else if ((m = /^(\d{1,3}(?:[.,]\d{1,2})?)\s*м$/i.exec(t.s))) { if (sup(t, items)) v = m[1]; }
    else if (/^\d{1,3}(?:[.,]\d{1,2})?$/.test(t.s)) {
      for (var j = 0; j < items.length; j++) {
        var u = items[j];
        if (j === i || !UNIT.test(u.s)) continue;
        var dy = Math.abs(u.y - t.y), dx = u.x - (t.x + (t.w || 0));
        if (dy <= Math.max(3, (t.h || 8) * 0.6) && dx > -2 && dx < Math.max(12, (t.h || 8) * 2)) { v = t.s; break; }
      }
    }
    if (v === null) return;
    var a = parseFloat(String(v).replace(',', '.'));
    if (a >= 1.5 && a <= 300) out.push({ m2: a, x: cx, y: cy, item: t, x0: t.x, y0: t.y, w: t.w, h: t.h });
  });
  out.forEach(function (L) { L.name = nameNearLabel(items || [], L); delete L.item; });
  uniqueLabelNames(out);
  return out;
}

/**
 * Масштаб по размерным линиям чертежа.
 *
 * На листе проекта размеры стоят цепочками, и число подписано над своим
 * участком примерно по его середине. Значит расстояние между соседними
 * числами одной цепочки — это половина первого участка плюс половина
 * второго, то есть (v1 + v2) / 2 миллиметров. Отсюда и берётся, сколько
 * пикселей подложки приходится на миллиметр.
 *
 * Пары считаются по всем цепочкам — и горизонтальным (числа стоят в строку),
 * и вертикальным (в столбец), — а дальше берётся не среднее, а середина:
 * в цепочку попадают отметки высот и номера узлов, дающие чушь, и одно такое
 * число сдвинуло бы среднее, но не медиану.
 *
 * Источник надёжнее площадей: он не зависит от того, заполнен ли расчёт, и
 * не путает этажи. Проверяется он тем же, чем и подбор по площадям, —
 * шириной дверных проёмов.
 */
function scaleFromDims(items, loose) {
  // loose — для цифр, прочитанных с картинки: хватает двух согласованных пар (точность 4 %)
  if (!items || items.length < (loose ? 3 : 4)) return null;
  var toks = [];
  items.forEach(function (t) {
    // «4 732» и «4732» — одно и то же: в PDF разряды разделены пробелом
    var v = t.s.replace(/[\s\u00a0]+/g, '');
    if (!/^\d{3,5}$/.test(v)) return;
    var mm = +v;
    if (mm < 200 || mm > 20000) return;   // не размер помещения: отметки, номера, годы
    toks.push({ v: mm, x: t.x, y: t.y });
  });
  if (toks.length < 3) return null;

  var ks = [], kp = [];
  var need = loose ? 2 : 3;
  // sk — координата, по которой числа стоят в одну линию, ak — вдоль цепочки
  var walk = function (sk, ak) {
    var list = toks.slice().sort(function (a, b) { return a[sk] - b[sk]; });
    var grp = [];
    var flush = function () {
      if (grp.length >= 2) {
        grp.sort(function (a, b) { return a[ak] - b[ak]; });
        for (var i = 1; i < grp.length; i++) {
          var d = grp[i][ak] - grp[i - 1][ak];
          var mm = (grp[i].v + grp[i - 1].v) / 2;
          if (d <= 2 || mm <= 0) continue;
          var k = d / mm;                       // пикселей в миллиметре
          if (k > 0.004 && k < 1.5) { ks.push(k); kp.push({ k: k, a: grp[i - 1], b: grp[i] }); } // 4..1500 px/м — вне этого чертежей не бывает
        }
      }
      grp = [];
    };
    list.forEach(function (t) {
      if (grp.length && Math.abs(t[sk] - grp[grp.length - 1][sk]) > 6) flush();
      grp.push(t);
    });
    flush();
  };
  walk('y', 'x');
  walk('x', 'y');
  if (ks.length < need) return null;

  ks.sort(function (a, b) { return a - b; });
  var med = ks[Math.floor(ks.length / 2)];
  var good = ks.filter(function (k) { return Math.abs(k - med) / med < 0.12; });
  if (loose) {
    // С картинки в пары попадают и ошибочно прочитанные числа, медиана по ним уезжает:
    // берём самое людное скопление в 4 % — их и сверяет plan_ocr по общей размерной линии
    // Две пары принимаем, только если они делят число (три подряд числа одной цепочки):
    // случайно сошедшиеся пары из разных мест листа такого не дают
    var bestC = [];
    kp.forEach(function (p0) {
      var cl = kp.filter(function (p) { return Math.abs(p.k - p0.k) / p0.k < 0.04; });
      var linked = cl.some(function (p) { return cl.some(function (q) { return p !== q && (p.a === q.b || p.b === q.a); }); });
      if (linked && cl.length > bestC.length) bestC = cl;
    });
    good = bestC.map(function (p) { return p.k; });
  }
  if (good.length < need) return null;
  var sum = 0;
  good.forEach(function (k) { sum += k; });
  return { ppm: (sum / good.length) * 1000, n: good.length, total: ks.length };
}

/**
 * Масштаб по размерным линиям, прочитанным с картинки (скан, фото): у каждой линии
 * известны длина в мм и длина на подложке в пикселях. Берём медиану и отбрасываем
 * выбросы: одна неверно прочитанная цифра не должна сдвигать результат. Общий размер
 * в 10–15 м даёт погрешность около процента — точнее, чем цепочки подписей, где к
 * размерам «в свету» прибавляется толщина стен.
 */
/**
 * Размерные линии, прочитанные моделью, лежат на картинке со сдвигом: концы указаны на глаз и
 * чаще короче настоящих (на листе А3 длина линии в 2260 мм выходила 43 px/м вместо 77). Здесь
 * концы привязываются к реальным засечкам: вдоль оси линии ищутся места, где тёмное
 * поперёк линии длиннее 5 px (засечка, стрелка, выносная линия), и каждый конец встаёт на
 * ближайшую. Привязка принимается, только если обе засечки нашлись и длина изменилась не больше
 * чем в 1,7 раза; иначе линия остаётся как прочитана, но помечается ненадёжной (snapped не ставится).
 */
function snapScanDims(c, dims) {
  if (!dims || !dims.length || !c) return dims || [];
  var W = c.width, H = c.height, g;
  try { g = c.getContext('2d').getImageData(0, 0, W, H).data; } catch (e) { return dims; }
  var dark = function (x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    var p = (y * W + x) * 4;
    return (g[p] * 3 + g[p + 1] * 6 + g[p + 2]) / 10 < 150;
  };
  return dims.map(function (d) {
    if (d.x0 === undefined) return d;
    var hz = d.horiz, a = hz ? d.x0 : d.y0, b = hz ? d.x1 : d.y1, fixed = Math.round(hz ? (d.y0 + d.y1) / 2 : (d.x0 + d.x1) / 2), t;
    if (a > b) { t = a; a = b; b = t; }
    var lo = Math.round(a), hi = Math.round(b), span = hi - lo;
    if (!(span > 20)) return d;
    var at = function (k, o) { return hz ? dark(k, fixed + o) : dark(fixed + o, k); };
    var best = -1, bo = 0, o, k, n;
    for (o = -10; o <= 10; o++) {                       // ось линии: ряд с наибольшим числом тёмных вдоль неё
      n = 0;
      for (k = lo; k <= hi; k++) if (at(k, o)) n++;
      if (n > best) { best = n; bo = o; }
    }
    if (best < span * 0.4) return d;                    // линии под рукой нет
    var line = fixed + bo, margin = Math.max(25, span * 0.35), ticks = [], last = -9;
    for (k = Math.round(lo - margin); k <= Math.round(hi + margin); k++) {
      var up = 0, dn = 0;
      while (up < 14 && (hz ? dark(k, line - up - 1) : dark(line - up - 1, k))) up++;
      while (dn < 14 && (hz ? dark(k, line + dn + 1) : dark(line + dn + 1, k))) dn++;
      if (up + dn + 1 >= 6) { if (k - last > 3) ticks.push([k, k]); else ticks[ticks.length - 1][1] = k; last = k; }
    }
    var centers = ticks.map(function (q) { return (q[0] + q[1]) / 2; });
    var near = function (v) {
      var r = null, rd = margin + 1;
      centers.forEach(function (q) { var dd = Math.abs(q - v); if (dd < rd) { rd = dd; r = q; } });
      return r;
    };
    var na = near(a), nb = near(b);
    if (na === null || nb === null || nb - na < 20) return d;
    var ratio = (nb - na) / span;
    if (ratio < 0.6 || ratio > 1.7) return d;
    return { mm: d.mm, px: nb - na, horiz: hz, x0: d.x0, y0: d.y0, x1: d.x1, y1: d.y1, snapped: true };
  });
}

function scaleFromScanDims(dims) {
  if (!dims || dims.length < 2) return null;
  // Линии, концы которых привязаны к засечкам на картинке (snapScanDims), точнее остальных: на них
  // ищем самое тесное скопление (±4 %), и три согласных линии — уже масштаб. Остальные (концы «на глаз»)
  // в это скопление не идут, даже если их большинство.
  var sn = dims.filter(function (d) { return d.snapped; }).map(function (d) { return d.px / d.mm * 1000; });
  if (sn.length >= 3) {
    var bestC = null;
    sn.forEach(function (k) {
      var mem = sn.filter(function (q) { return Math.abs(q / k - 1) <= 0.04; });
      if (!bestC || mem.length > bestC.length) bestC = mem;
    });
    if (bestC && bestC.length >= 3) {
      var mean = bestC.reduce(function (t, q) { return t + q; }, 0) / bestC.length;
      if (mean > 4 && mean < 1500) return { ppm: mean, n: bestC.length, total: dims.length, via: 'ticks' };
    }
  }
  var ks = dims.map(function (d) { return d.px / d.mm; }).sort(function (a, b) { return a - b; });
  var med = ks[Math.floor(ks.length / 2)];
  var good = ks.filter(function (k) { return Math.abs(k - med) / med < 0.1; });
  // две линии хватает, только если они сошлись между собой почти точно
  if (good.length < 2 || (good.length === 2 && good[1] / good[0] > 1.04)) return null;
  var sum = 0;
  good.forEach(function (k) { sum += k; });
  var ppm = sum / good.length * 1000;
  if (!(ppm > 4 && ppm < 1500)) return null;
  return { ppm: ppm, n: good.length, total: ks.length };
}

/**
 * Рамка наружных стен по маске: { x0, y0, x1, y1, tPx } в пикселях подложки (tPx — толщина
 * стены) или null. Наружные стены — две самые тёмные полосы толщиной в стену: столбцы и
 * строки, где тёмных пикселей не меньше 60 % от максимума. Размерные линии и выноски за
 * домом тонкие (1–2 px) и в полосу не проходят. Проёмы стену не рвут: считаем сумму по
 * столбцу, а не самую длинную непрерывную полосу.
 */
function wallFrame() {
  var m = getMask(); if (!m) return null;
  if (m.frame !== undefined) return m.frame;
  var W = m.w, H = m.h, bar = m.bar, x, y, cx = new Int32Array(W), cy = new Int32Array(H);
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (bar[y * W + x]) { cx[x]++; cy[y]++; }
  var minW = Math.max(3, Math.round(0.1 * (F().pxPerM || 60) * m.k));
  var band = function (arr, n) {
    var mx = 0, i;
    for (i = 0; i < n; i++) if (arr[i] > mx) mx = arr[i];
    if (mx < (n === W ? H : W) * 0.3) return null;
    var thr = mx * 0.6, bands = [], st = -1;
    for (i = 0; i <= n; i++) {
      var on = i < n && arr[i] >= thr;
      if (on && st < 0) st = i;
      if (!on && st >= 0) { if (i - st >= minW) bands.push([st, i]); st = -1; }
    }
    return bands.length >= 2 ? { a: bands[0], b: bands[bands.length - 1] } : null;
  };
  var bx = band(cx, W), by = band(cy, H), fr = null;
  if (bx && by) {
    fr = { x0: bx.a[0] / m.k, x1: bx.b[1] / m.k, y0: by.a[0] / m.k, y1: by.b[1] / m.k,
           tPx: ((bx.a[1] - bx.a[0] + bx.b[1] - bx.b[0] + by.a[1] - by.a[0] + by.b[1] - by.b[0]) / 4) / m.k };
    if (!(fr.x1 - fr.x0 > 0 && fr.y1 - fr.y0 > 0)) fr = null;
  }
  m.frame = fr;
  return fr;
}

/** Две общие размерные линии плана (ширина и высота дома, мм): самые длинные из
 *  прочитанных, по одной на ось. null — если какой-то оси нет. */
function overallDims() {
  var d = SCAN_DIMS[cur] || [], w = null, h = null;
  d.forEach(function (q) {
    if (q.horiz === undefined || !(q.mm >= 3000)) return;
    if (q.horiz) { if (!w || q.mm > w.mm) w = q; } else if (!h || q.mm > h.mm) h = q;
  });
  return w && h ? { w: w, h: h } : null;
}

/** Сверка масштаба с габаритом: рамка наружных стен по маске против двух общих размеров.
 *  Отношение сторон и px/м по обеим осям обязаны сойтись в пределах 4 %. Возвращает
 *  { ppm (по габариту), axesOk, scaleOk, px, py, Wmm, Hmm } или null, если сверять нечем
 *  (размеров нет, рамка не нашлась или длина линии не похожа на рамку — это не габарит). */
function frameScaleCheck() {
  var f = F(), od = overallDims(), fr = wallFrame();
  if (!od || !fr || !f.pxPerM) return null;
  var fw = fr.x1 - fr.x0, fh = fr.y1 - fr.y0;
  if (Math.abs(od.w.px / fw - 1) > 0.15 || Math.abs(od.h.px / fh - 1) > 0.15) return null;
  var px = fw / od.w.mm * 1000, py = fh / od.h.mm * 1000, pm = (px + py) / 2;
  var axes = Math.abs(px / py - 1) <= 0.04;
  return { ppm: pm, px: px, py: py, Wmm: od.w.mm, Hmm: od.h.mm, axesOk: axes,
           scaleOk: axes && Math.abs(f.pxPerM / pm - 1) <= 0.04 };
}

/** Внутренняя площадь габарита, м²: (W − 2t)(H − 2t), t — толщина стены по маске (0,15–0,5 м). */
function frameInnerM2() {
  var f = F(), fr = wallFrame(); if (!fr || !f.pxPerM) return 0;
  var od = overallDims();
  var Wm = od ? od.w.mm / 1000 : (fr.x1 - fr.x0) / f.pxPerM, Hm = od ? od.h.mm / 1000 : (fr.y1 - fr.y0) / f.pxPerM;
  var t = Math.min(0.5, Math.max(0.15, fr.tPx / f.pxPerM));
  return Math.max(0, (Wm - 2 * t) * (Hm - 2 * t));
}

/** «Клетушка»: контур без подписи площади внутри, меньше 4 м² или уже 1 м — шкаф, кухонный
 *  модуль, мебель. Подписанный контур и контур с названием с плана клетушкой не бывает. */
function isCell(c, labs) {
  if (c.pname || c.printed) return false;
  if (labs.some(function (l) { return pip([l.x, l.y], c.pts); })) return false;
  var ppm = F().pxPerM || 100, xs = c.pts.map(function (q) { return q[0]; }), ys = c.pts.map(function (q) { return q[1]; });
  var side = Math.min(Math.max.apply(null, xs) - Math.min.apply(null, xs), Math.max.apply(null, ys) - Math.min.apply(null, ys)) / ppm;
  var m2 = c.m2 != null ? c.m2 : area(c.pts);
  return m2 < 4 || side < 1.0;
}

/** Второй проход чтения подписей: план режется на 4 куска с запасом 12 % и каждый кусок
 *  уходит модели в своём масштабе (цельная картинка сжимается до 1600 px, а подпись
 *  перечёркнута линией). Исходная картинка берётся, пока она в памяти (ORIG_IMG). Резолвится
 *  списком НОВЫХ подписей в координатах подложки этажа. */
var ORIG_IMG = {};      // исходная картинка этажа до сжатия (только на время сессии)
var SCAN_READ = {};     // подписи этажа читала модель, а не текстовый слой PDF
var REREAD = {};        // второй проход по этажу уже был
function rereadLabels(fi) {
  var f = DATA.floors[fi], src = ORIG_IMG[fi] || imgCache[fi];
  if (!f || !src) return Promise.resolve([]);
  var sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  var kx = f.w / sw, ky = f.h / sh, cw = sw * 0.56, ch = sh * 0.56, jobs = [];
  [0, sw - cw].forEach(function (ox) {
    [0, sh - ch].forEach(function (oy) {
      var s = Math.min(3, 1600 / Math.max(cw, ch)), cv = document.createElement('canvas');
      cv.width = Math.round(cw * s); cv.height = Math.round(ch * s);
      var g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(src, ox, oy, cw, ch, 0, 0, cv.width, cv.height);
      jobs.push(readAreaLabelsFromCanvas(cv, null, true).then(function (labs) {
        return labs.map(function (l) { return { m2: l.m2, x: (ox + l.x / s) * kx, y: (oy + l.y / s) * ky, name: l.name, scan: true }; });
      }));
    });
  });
  var have = PDF_AREAS[fi] || [], near = Math.max(f.w, f.h) * 0.03;
  return Promise.all(jobs).then(function (res) {
    var fresh = [];
    res.forEach(function (list) {
      list.forEach(function (l) {
        var dup = function (q) { return Math.hypot(q.x - l.x, q.y - l.y) < near; };
        if (!have.some(dup) && !fresh.some(dup)) fresh.push(l);
      });
    });
    return fresh;
  });
}

function loadPdfPlan(file, done) {
  hint('Читаю PDF…');
  var rd = new FileReader();
  rd.onload = function () {
    var pdfDoc = null;
    loadPdfJs().then(function (pdfjs) {
      return pdfjs.getDocument({ data: rd.result }).promise;
    }).then(function (pdf) {
      pdfDoc = pdf;
      return pdf.numPages > 1 ? pickPdfPages(file, pdf.numPages) : [1];
    }).then(function (pages) {
      // Первая страница — в текущий этаж, каждая следующая — в новый
      var chain = Promise.resolve();
      pages.forEach(function (pno, k) {
        chain = chain.then(function () {
          if (k > 0) {
            undoStack.push({ t: 'floorAdd' });
            DATA.floors.push({ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] });
            cur = DATA.floors.length - 1;
            renderTabs();
          }
          return pdfDoc.getPage(pno).then(renderPdfPage);
        });
      });
      return chain;
    }).then(function () {
      if (done) done();
    }).catch(function (e) {
      console.error('[plan_editor] pdf:', e);
      hint('');
      alert('Не удалось прочитать PDF «' + file.name +
        '». Сохраните план картинкой (скриншот страницы) и загрузите её.');
      if (done) done();
    });
  };
  rd.readAsArrayBuffer(file);
}

/**
 * Несколько страниц в PDF: этажи это или нужна одна. Раньше спрашивали только
 * номер страницы, а в мастере каждая страница молча становилась этажом —
 * лишние «2 этаж», «3 этаж» путали (03.10.2026). Резолвит список страниц.
 */
function pickPdfPages(file, n) {
  var ask = function () {
    var p = parseInt(prompt('В PDF «' + file.name + '» ' + n + ' стр. Какая страница с планом?', '1'), 10);
    return [(p >= 1 && p <= n) ? p : 1];
  };
  if (!UFH) return Promise.resolve(ask());
  return new Promise(function (res) {
    var div = document.createElement('div'); div.className = 'namepick';
    var all = [];
    for (var i = 1; i <= n; i++) all.push(i);
    var word = n % 10 === 1 && n % 100 !== 11 ? 'страница' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'страницы' : 'страниц';
    var fl = n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'этажа' : 'этажей';
    div.innerHTML = '<div class="box"><h3>В файле ' + n + ' ' + word + '</h3>' +
      '<div class="sub">Это план нескольких этажей — по странице на этаж — или нужна одна страница?' +
      (n > 2 ? ' Калькулятор считает два этажа.' : '') + '</div>' +
      '<div class="grid" style="flex-direction:column;align-items:stretch">' +
      (n <= 4 ? '<button class="calc" data-a="all">Это ' + n + ' ' + fl + ' — по странице на этаж</button>' : '') +
      '<button data-a="one">Только первая страница</button>' +
      '<button data-a="pick">Другая страница…</button></div></div>';
    div.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      var a = b.getAttribute('data-a');
      div.remove();
      res(a === 'all' ? all : a === 'pick' ? ask() : [1]);
    };
    document.body.appendChild(div);
  });
}

/** Страница PDF → подложка текущего этажа (с размерными числами для масштаба). */
function renderPdfPage(page) {
  var vp1 = page.getViewport({ scale: 1 });
  var k = Math.min(4, 1600 / Math.max(vp1.width, vp1.height));
  var vp = page.getViewport({ scale: k });
  var c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  var g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);  // PDF бывает прозрачным
  // Размерные числа читаем ДО applyPlanCanvas: он сам зовёт автоподбор
  // масштаба, и к этому моменту размеры уже должны быть под рукой.
  var fi = cur;
  return page.getTextContent().then(function (tc) {
    PDF_DIMS[fi] = textItemsPx(tc, vp);
    PDF_AREAS[fi] = areaLabelsFrom(PDF_DIMS[fi]);
  }, function () { PDF_DIMS[fi] = null; PDF_AREAS[fi] = []; }).then(function () {
    return page.render({ canvasContext: g, viewport: vp }).promise;
  }).then(function () {
    // Страница-скан (текста почти нет) и подписей площадей не нашли — читаем картинку
    if (!(PDF_AREAS[fi] && PDF_AREAS[fi].length) && (!PDF_DIMS[fi] || PDF_DIMS[fi].length < 8)) {
      delete SCAN_OCR[fi];
      return Promise.all([readAreaLabelsFromCanvas(c), startOcr(c, fi)]).then(function (res) {
        var labs = res[0];
        PDF_AREAS[fi] = labs; SCAN_DIMS[fi] = snapScanDims(c, labs.dims || []); SCAN_READ[fi] = true; delete REREAD[fi];
      });
    }
    SCAN_DIMS[fi] = [];
  }).then(function () {
    applyPlanCanvas(c);
  });
}

/** Один файл (картинка или PDF) → подложка ТЕКУЩЕГО этажа; резолв по готовности */
function loadOne(file) {
  return new Promise(function (done) {
    if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      loadPdfPlan(file, done); return;
    }
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        // даунскейл: localStorage не резиновый, 1600 px хватает для печати подложкой
        var k = Math.min(1, 1600 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        // План — на экран сразу, а подписи площадей и размеры читаем следом: по ним
        // подбирается масштаб, но ждать ответа модели (до минуты) перед пустым
        // холстом нельзя — выглядит как зависшая загрузка
        var fi0 = cur;
        PDF_AREAS[fi0] = []; PDF_DIMS[fi0] = null; SCAN_DIMS[fi0] = [];
        SCAN_BUSY[fi0] = true; SCAN_READ[fi0] = true; delete REREAD[fi0]; ORIG_IMG[fi0] = im;
        var tok = LOAD_TOK[fi0] = (LOAD_TOK[fi0] || 0) + 1;
        delete SCAN_OCR[fi0]; delete SCAN_DIAG[fi0];
        applyPlanCanvas(c, true);
        // Цифры размеров читаем тут же, на устройстве: быстрее ИИ и не зависит от сервиса.
        // Кто первым дал масштаб — тот и ставит; ИИ дочитывает подписи комнат.
        startOcr(c, fi0).then(function (r) {
          if (!r || LOAD_TOK[fi0] !== tok || DATA.floors[fi0].pxPerM) return;
          scanExtra = 'Масштаб найден';
          var was = cur; cur = fi0;
          try { finishPlanLoad(); } finally { cur = was; }
        });
        updateGuide();     // шаг «Масштаб» сразу пишет «ищу», а не «не нашёлся»
        var finish = function (labs, turned) {
          SCAN_BUSY[fi0] = false;
          if (LOAD_TOK[fi0] !== tok) { done(); return; }
          // за время ожидания этаж могли сменить на другую подложку — тогда не трогаем
          if (imgCache[fi0] !== c) { done(); return; }
          PDF_AREAS[fi0] = labs; SCAN_DIMS[fi0] = snapScanDims(c, labs.dims || []);
          (SCAN_DIAG[fi0] = SCAN_DIAG[fi0] || {}).read = (labs.why ? 'ИИ: ' + labs.why : 'ИИ ответил за ' + (labs.sec || 0) + ' с: размерных линий ' +
            (labs.rawDims || 0) + ', принято ' + (labs.dims || []).length + '; подписей площадей ' + (labs.rawLabels || 0) +
            (turned ? '; лист развёрнут на ' + turned + '°' : ''));
          // масштаб, заданный руками, пока читалась картинка, не перебиваем
          if (!DATA.floors[fi0].pxPerM) {
            var was = cur; cur = fi0;
            try { finishPlanLoad(); } finally { cur = was; }
          }
          var m = [];
          if (turned) m.push('план был повёрнут — развернули на ' + turned + '°');
          if (labs.length) m.push('прочитано подписей площадей: ' + labs.length);
          if (m.length) hint('<span class=ok>' + m.join('; ').replace(/^./, function (s) { return s.toUpperCase(); }) + '.</span> ' +
            (F().pxPerM ? '' : 'Дальше — масштаб.'));
          updateGuide();     // шаг «Масштаб» перестаёт писать «ищу»
          done();
        };
        readAreaLabelsFromCanvas(c).then(function (labs) {
          if (!labs.rot || imgCache[fi0] !== c) { finish(labs, 0); return; }
          // Лист лежит боком: надписи вертикальные, и читаются они хуже, да и на экране
          // план стоит не так, как задумал проектировщик. Поворачиваем и читаем заново.
          var r = labs.rot, rc = document.createElement('canvas');
          var sw = r !== 180;
          rc.width = sw ? c.height : c.width; rc.height = sw ? c.width : c.height;
          var rg = rc.getContext('2d');
          rg.translate(rc.width / 2, rc.height / 2); rg.rotate(r * Math.PI / 180);
          rg.drawImage(c, -c.width / 2, -c.height / 2);
          var was2 = cur; cur = fi0;
          try { applyPlanCanvas(rc, true); } finally { cur = was2; }
          readAreaLabelsFromCanvas(rc, 'План повёрнут — читаю его заново').then(function (l2) { c = rc; finish(l2, r); });
        });
      };
      im.onerror = function () {
        alert('Не удалось прочитать файл «' + file.name + '».');
        done();
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function loadImage(inp) {
  var files = Array.prototype.slice.call(inp.files || []);
  inp.value = '';
  if (!files.length) return;
  // Один файл — в текущий этаж (замена подложки). Несколько — по этажам:
  // первый в текущий, если тот пуст, дальше каждый файл в новый этаж.
  var chain = Promise.resolve();
  files.forEach(function (file, idx) {
    chain = chain.then(function () {
      if (files.length > 1 && (idx > 0 || F().img)) {
        undoStack.push({ t: 'floorAdd' });
        DATA.floors.push({ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] });
        cur = DATA.floors.length - 1;
        renderTabs();
      }
      return loadOne(file);
    });
  });
  // мастер раскладки: после загрузки — масштаб, комнаты и радиаторы сами
  chain.then(fsNudge, function () {});
  if (UFH) { chain.then(wzAfterLoad); return; }
  if (files.length > 1) chain.then(function () {
    // Масштаб на каждом этаже подбирается сам; напоминаем только про те,
    // где не вышло, — иначе подсказка гонит делать уже сделанное.
    var left = DATA.floors.filter(function (fl) { return fl.img && !fl.pxPerM; }).length;
    hint('Загружено файлов: ' + files.length + '. ' + (left
      ? 'Задайте масштаб на этажах, где он не подобрался: ' + left +
        ' из ' + DATA.floors.length + ' (вкладки сверху).'
      : 'Масштаб подобран на всех этажах — проверьте его и размечайте комнаты.'));
  });
}

function cs() { return F().w ? cv.width / F().w : 1; }  // канвас-пиксели на пиксель изображения

/**
 * Масштаб подложки на экране. Меняется только CSS-ширина канвы: сама она всегда
 * рисуется в 1200 точек, а клики пересчитываются через getBoundingClientRect
 * (см. evPt), поэтому от увеличения ничего не съезжает — ни зоны, ни радиаторы.
 * Плана мелкого чертежа иначе не разглядеть: обвести комнату по стенам, которые
 * в палец толщиной, невозможно.
 */
/**
 * Координатная сетка рабочего поля: точки с мелким шагом и крестики на каждом
 * пятом узле — так размечено поле в САПР. Пустой холст перестаёт быть просто
 * серым прямоугольником, а у подложки с полями видно, где кончается лист.
 *
 * Рисуется одним заполнением по образцу (createPattern): точек на холсте
 * больше семи тысяч, и класть их поштучно на каждую перерисовку — заметная
 * задержка при перетаскивании зон. Образец пересобирается только при смене
 * темы, ключ кэша — она же.
 */
var GRID_DOT = 12, GRID_CROSS = 5;   // шаг точек и через сколько точек крестик
var _gridPat = null, _gridKey = '';
function gridPattern() {
  var key = darkPlan ? 'd' : 'l';
  if (_gridPat && _gridKey === key) return _gridPat;
  var side = GRID_DOT * GRID_CROSS;
  var t = document.createElement('canvas');
  t.width = side; t.height = side;
  var g = t.getContext('2d');
  g.fillStyle = darkPlan ? '#343434' : '#d7d7d7';
  for (var y = 0; y < side; y += GRID_DOT)
    for (var x = 0; x < side; x += GRID_DOT) g.fillRect(x, y, 1, 1);
  // крестик в узле образца — он и повторится каждые пять точек
  g.strokeStyle = darkPlan ? '#4a4a4a' : '#b4b4b4';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(0.5 - 3, 0.5); g.lineTo(0.5 + 3, 0.5);
  g.moveTo(0.5, 0.5 - 3); g.lineTo(0.5, 0.5 + 3);
  g.stroke();
  _gridPat = cx.createPattern(t, 'repeat');
  _gridKey = key;
  return _gridPat;
}
function drawGrid() {
  var p = gridPattern();
  if (!p) return;
  cx.save();
  cx.fillStyle = p;
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.restore();
}

/**
 * Тёмный вид подложки. Сканы и чертежи белые, и на графитовой ленте лист светит
 * прожектором — в САПР его показывают наоборот, светлыми линиями по тёмному.
 * Переключатель нужен для фотографий плана: снимок с телефона в инверсии
 * выглядит негативом, и разобрать на нём стены труднее, чем в оригинале.
 */
var darkPlan = true;
try { darkPlan = localStorage.getItem('plan_editor_darkplan') !== '0'; } catch (e) {}
if (UFH_THEME && !UFH_THEME.dark) darkPlan = false;   // светлое окно мастера — чертёж как есть, на белом
function toggleDarkPlan() {
  darkPlan = !darkPlan;
  _gridPat = null;   // сетка своя у каждой темы — образец пересоберётся
  try { localStorage.setItem('plan_editor_darkplan', darkPlan ? '1' : '0'); } catch (e) {}
  var b = document.getElementById('b_darkplan');
  if (b) b.className = darkPlan ? 'on' : 'ghost';
  draw();
}

// Меньше 100 % — чтобы увидеть высокий план целиком: по ширине холст вписан в
// поле всегда, а по высоте вытянутый этаж уходит под экран.
var ZOOM_MIN = 0.25, ZOOM_MAX = 4, viewZoom = 1;
try { viewZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, parseFloat(localStorage.getItem('plan_editor_zoom')) || 1)); } catch (e) {}
function applyZoom() {
  if (viewZoom === 1) { cv.style.width = ''; cv.style.maxWidth = ''; }
  else { cv.style.width = (viewZoom * 100) + '%'; cv.style.maxWidth = 'none'; }
  var v = document.getElementById('zoom_val');
  if (v) v.textContent = Math.round(viewZoom * 100) + ' %';
  if (typeof fsFit === 'function') fsFit();
}
function setZoom(z) {
  viewZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  try { localStorage.setItem('plan_editor_zoom', String(viewZoom)); } catch (e) {}
  applyZoom();
  try { draw(); } catch (e) {}   // кружки номеров комнат зависят от масштаба показа
}
function zoomStep(dir) { setZoom(Math.round((viewZoom + dir * 0.25) * 100) / 100); }

// ─── Петли тёплого пола в редакторе ───────────────────────────────────
// Зона показывается не заливкой, а самой укладкой: те же змейки, что уйдут
// на лист, — красная подача, синяя обратка. Раскладку считает project_plans.js,
// поэтому редактор и лист рисуют одно и то же.
var UFH_STEP = [150, 150];
try {
  var _stp = JSON.parse(localStorage.getItem('stout_save'));
  if (_stp) { UFH_STEP[0] = +_stp.ufhStep1 || 150; UFH_STEP[1] = +_stp.ufhStep2 || 150; }
} catch (e) {}
// Деление петель — по длине трубы (предел 100 м, projectPlans.MAX_LOOP_M),
// как на листах и в смете: редактор считает ту же раскладку тем же вызовом,
// поэтому картинка и число веток совпадают везде.
var loopCache = { key: null, val: {} };
var noLayWarned = {};      // о какой зоне уже сообщили в консоль

function tpLoops(f, stepMm) {
  if (!window.projectPlans || !projectPlans.floorLoops || !f.pxPerM) return {};
  var key = stepMm + '|' + (f.coll ? f.coll.x + ',' + f.coll.y : '-') + '|' +
    JSON.stringify((f.zones || []).map(function (z) {
      return z.type === 'tp' ? [z.pts, z.lay || ''] : z.type === 'cold' ? ['cold', z.pts] : 0;
    })) + '|' + JSON.stringify(f.leads || []);
  if (loopCache.key === key) return loopCache.val;
  if (dragZ) return loopCache.val;            // тянут край — пересчёт по отпусканию
  var out = {};
  try {
    var FL = projectPlans.floorLoops(f, stepMm);
    FL.forEach(function (Z) {
      if (Z.loops && Z.loops.length && Z.loops[0].sup) out[Z.i] = Z.loops;
    });
    // пучок подводок от коллектора — рисуется отдельно, под зонами
    Object.defineProperty(out, 'bundle', { value: FL.bundle || [], enumerable: false });
  } catch (e) { console.error('[plan_editor] петли:', e); return loopCache.val; }
  loopCache = { key: key, val: out };
  return out;
}

/**
 * Запасная укладка — та же, что рисует лист, когда геометрия петли не
 * строится (узкая зона, лестница внутри контура, слишком мелкий масштаб):
 * встречная змейка по габариту, обрезанная контуром зоны. Комната не
 * остаётся пустой, и в редакторе видно ровно то, что попадёт на лист.
 */
function drawSnake(z, stepMm, k, lw) {
  var f = F(), stepPx = stepMm / 1000 * (f.pxPerM || 100);
  if (!stepPx || z.pts.length < 3) return;
  var xs = z.pts.map(function (p) { return p[0]; });
  var ys = z.pts.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  cx.save();
  cx.beginPath();
  z.pts.forEach(function (p, j) { j ? cx.lineTo(p[0] * k, p[1] * k) : cx.moveTo(p[0] * k, p[1] * k); });
  cx.closePath(); cx.clip();
  var snake = function (yFrom, col) {
    cx.beginPath();
    var dir = 0, first = true;
    for (var y = yFrom; y <= y1; y += 2 * stepPx) {
      if (first) { cx.moveTo(x0 * k, y * k); first = false; }

// ─── Шаг назад: кнопка и Ctrl+Z ────────────────────────────────────────
/** Снимок этажа для отмены и повтора (без подложки — она меняется отдельно). */
function snapFloor(fi) {
  var f = DATA.floors[fi];
  return {
    pxPerM: f.pxPerM,
    zones: JSON.parse(JSON.stringify(f.zones)),
    rads: JSON.parse(JSON.stringify(f.rads || [])),
    coll: f.coll ? { x: f.coll.x, y: f.coll.y } : null,
    collAuto: !!f.collAuto,
    radColl: f.radColl ? { x: f.radColl.x, y: f.radColl.y } : null,
    collAng: f.collAng || 0, radCollAng: f.radCollAng || 0,
    fixtures: JSON.parse(JSON.stringify(f.fixtures || []))
  };
}

function pushUndo(t) {
  var f = F();
  var rec = { t: t, floor: cur, prev: snapFloor(cur) };
  if (t === 'plan') {
    rec.prev.img = f.img; rec.prev.imgFile = f.imgFile || null;
    rec.prev.w = f.w; rec.prev.h = f.h;
  }
  undoStack.push(rec);
  if (undoStack.length > 50) undoStack.shift();
  redoStack.length = 0;   // новое действие отменяет повтор
}

function doUndo() {
  // в процессе рисования отменяется последняя точка
  if (mode === 'poly' && tmp.length) { tmp.pop(); draw(); return; }
  if (mode === 'scale' && scalePts.length) { scalePts.pop(); draw(); return; }
  stepHist(undoStack, redoStack, 'Отменять больше нечего.');
}

/** Повтор отменённого: то же восстановление, из стопки повтора. */
function doRedo() {
  if (mode === 'poly' || mode === 'scale') return;
  stepHist(redoStack, undoStack, 'Повторять больше нечего.');
}

/** Восстановить снимок из from; текущее состояние кладётся в to — туда и обратно. */
function stepHist(from, to, empty) {
  var rec = from.pop();
  if (!rec) { hint(empty); return; }
  if (rec.t !== 'floorAdd' && rec.t !== 'plan') to.push({ t: rec.t, floor: rec.floor, prev: snapFloor(rec.floor) });
  if (rec.t === 'floorAdd') {
    if (DATA.floors.length > 1) {
      DATA.floors.pop();
      if (cur >= DATA.floors.length) cur = DATA.floors.length - 1;
    }
  } else {
    cur = Math.min(rec.floor, DATA.floors.length - 1);
    var f = DATA.floors[cur];
    if (rec.t === 'plan') {
      f.img = rec.prev.img; f.imgFile = rec.prev.imgFile || null;
      f.w = rec.prev.w; f.h = rec.prev.h;
      delete imgCache[cur]; delete maskCache[cur]; delete imgFailed[cur];
    }
    f.pxPerM = rec.prev.pxPerM;
    f.zones = rec.prev.zones;
    f.rads = rec.prev.rads || [];
    f.coll = rec.prev.coll || null;
    if (rec.prev.collAuto) f.collAuto = true; else delete f.collAuto;
    if (rec.prev.radColl) f.radColl = rec.prev.radColl; else delete f.radColl;
    if (rec.prev.collAng) f.collAng = rec.prev.collAng; else delete f.collAng;
    if (rec.prev.radCollAng) f.radCollAng = rec.prev.radCollAng; else delete f.radCollAng;
    f.fixtures = rec.prev.fixtures || [];
  }
  renderTabs(); draw(); renderZones();
}

/**
 * Быстрые клавиши — одна буква на инструмент, как в чертёжных программах.
 * Работают по физической клавише (e.code): раскладка не мешает, русская или
 * английская — одна и та же клавиша. Поле ввода имени и открытые окна их не
 * перехватывают. Список — по «?» (Shift+/) и в подсказках кнопок.
 */
var HOTKEYS = [
  { code: 'KeyV', key: 'V', name: 'Выбор и правка зон', run: function () { setMode('select'); } },
  { code: 'KeyS', key: 'S', name: 'Масштаб: две точки', run: function () { setMode('scale'); }, btn: 'b_scale' },
  { code: 'KeyQ', key: 'Q', name: 'Комната по клику', run: function () { setMode('room'); }, btn: 'b_room' },
  { code: 'KeyW', key: 'W', name: 'Обвести прямоугольником', run: function () { setMode('rect'); }, btn: 'b_rect' },
  { code: 'KeyE', key: 'E', name: 'Обвести контуром', run: function () { setMode('poly'); }, btn: 'b_poly' },
  { code: 'KeyA', key: 'A', name: 'Радиатор', run: function () { setMode('rad'); }, btn: 'b_rad' },
  { code: 'KeyC', key: 'C', name: 'Коллектор', run: function () { setMode('coll'); }, btn: 'b_coll' },
  { code: 'KeyT', key: 'T', name: 'Санузел', run: function () { setMode('wc'); }, btn: 'b_wc' },
  { code: 'KeyN', key: 'N', name: 'Распознать комнаты', run: function () { autoRooms(); }, btn: 'b_autorooms' },
  { code: 'KeyH', key: 'H', name: 'Подсказки вкл / выкл', run: function () { toggleHints(); }, btn: 'b_hints' },
  { code: 'KeyF', key: 'F', name: 'На весь экран', run: function () { toggleFs(); }, btn: 'b_fs' },
  { code: 'Equal', key: '+', name: 'Приблизить', run: function () { zoomStep(1); } },
  { code: 'NumpadAdd', key: '+', name: 'Приблизить', run: function () { zoomStep(1); } },
  { code: 'Minus', key: '−', name: 'Отдалить', run: function () { zoomStep(-1); } },
  { code: 'NumpadSubtract', key: '−', name: 'Отдалить', run: function () { zoomStep(-1); } },
  { code: 'Digit0', key: '0', name: 'Масштаб экрана 100 %', run: function () { setZoom(1); } },
  { code: 'Slash', key: '?', shift: true, name: 'Список клавиш', run: function () { toggleHotkeyHelp(); } }
];

/** Ctrl+D — копия выбранной зоны, сдвинутая на 0,5 м вправо и вниз. */
function duplicateSelected() {
  var zs = F().zones;
  if (selZ < 0 || !zs[selZ]) { hint('Выберите зону щелчком, затем Ctrl+D.'); return; }
  pushUndo('zones');
  var z = zs[selZ], d = Math.round(0.5 * (F().pxPerM || 100));
  var copy = JSON.parse(JSON.stringify(z));
  copy.pts = copy.pts.map(function (q) { return [q[0] + d, q[1] + d]; });
  delete copy.printedM2; delete copy.printedSig; delete copy.planM2;
  zs.push(copy); selZ = zs.length - 1;
  renderZones(); draw();
}

/**
 * Код физической клавиши с поправкой на раскладку. Обычно хватает e.code, но он бывает пустым
 * или не тот (удалённый рабочий стол, виртуальная клавиатура, Mac), и тогда русская «ы» вместо S
 * молча не работала. Поэтому кириллица сопоставляется по ЙЦУКЕН-расположению, а «?» с русской
 * раскладки (Shift+7) и знаки +/− — по самому символу.
 */
var HK_RU = { 'й': 'Q', 'ц': 'W', 'у': 'E', 'к': 'R', 'е': 'T', 'н': 'Y', 'ф': 'A', 'ы': 'S', 'в': 'D',
              'а': 'F', 'р': 'H', 'с': 'C', 'м': 'V', 'т': 'N', 'я': 'Z' };
function hkCode(e) {
  var k = String(e.key || '');
  var low = k.toLowerCase();
  if (k.length === 1 && HK_RU[low]) return 'Key' + HK_RU[low];
  if (/^Key[A-Z]$/.test(e.code || '')) return e.code;
  if (k === '?' ) return 'Slash';
  if (k === '+' || k === '=') return 'Equal';
  if (k === '-' || k === '−' || k === '_') return 'Minus';
  if (/^[a-z]$/.test(low)) return 'Key' + low.toUpperCase();
  return e.code || '';
}

/** Клавиша из HOTKEYS → true, если сработала. Ctrl+S — сохранить, как в редакторах. */
function runHotkey(e) {
  if (e.ctrlKey || e.metaKey) {
    if (!e.altKey && hkCode(e) === 'KeyS') {
      var sb = document.getElementById('b_save');
      if (sb) { e.preventDefault(); sb.click(); return true; }
    }
    return false;
  }
  if (e.altKey) return false;
  var kc = hkCode(e);
  for (var i = 0; i < HOTKEYS.length; i++) {
    var h = HOTKEYS[i];
    if (h.code !== kc) continue;
    if (h.shift && !e.shiftKey) continue;                // «?» — только с Shift
    if (!h.shift && e.shiftKey && /^Key/.test(h.code)) continue;   // буквы — без Shift
    if (!F().img && h.code !== 'KeyV') return false;     // без плана инструменты не нужны
    e.preventDefault(); h.run();
    return true;
  }
  return false;
}

/** Окно со списком клавиш: открыть и закрыть «?» или Esc. */
function toggleHotkeyHelp() {
  var old = document.getElementById('hk_help');
  if (old) { old.remove(); return; }
  var rows = HOTKEYS.filter(function (h, i, a) { return a.findIndex(function (x) { return x.name === h.name; }) === i; })
    .map(function (h) { return '<tr><td><kbd>' + h.key + '</kbd></td><td>' + h.name + '</td></tr>'; }).join('');
  var box = document.createElement('div');
  box.id = 'hk_help';
  box.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:9999;display:flex;align-items:center;justify-content:center';
  box.innerHTML = '<div style="background:var(--panel,#fff);color:var(--text,#111);border-radius:10px;padding:16px 20px;min-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25)">' +
    '<div style="font-weight:700;margin-bottom:8px">Быстрые клавиши</div>' +
    '<table style="border-collapse:collapse;font-size:13px">' + rows +
    '<tr><td><kbd>Ctrl+Z</kbd></td><td>Отменить</td></tr>' +

/** Подсказки на кнопках: в конце названия — клавиша, например «Комната (Q)». */
function markHotkeyButtons() {
  HOTKEYS.forEach(function (h) {
    if (!h.btn) return;
    var b = document.getElementById(h.btn);
    if (b && b.title.indexOf('(' + h.key + ')') < 0) b.title = (b.title ? b.title + ' ' : '') + '(' + h.key + ')';

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', markHotkeyButtons);

document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'Escape' && document.getElementById('hk_help')) { document.getElementById('hk_help').remove(); return; }
  var kc0 = hkCode(e);
  var zk = (e.ctrlKey || e.metaKey) && kc0 === 'KeyZ';
  if (zk && e.shiftKey) { e.preventDefault(); doRedo(); return; }
  if (zk) { e.preventDefault(); doUndo(); return; }
  if ((e.ctrlKey || e.metaKey) && kc0 === 'KeyY') { e.preventDefault(); doRedo(); return; }
  if ((e.ctrlKey || e.metaKey) && kc0 === 'KeyD') {
    e.preventDefault(); duplicateSelected(); return;
  }
  if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.code === 'BracketLeft' || e.code === 'BracketRight')) {
    if (radTurnAt(e.code === 'BracketLeft' ? -45 : 45)) { e.preventDefault(); return; }
  }
  if (runHotkey(e)) return;
  if (e.key === 'Enter' && mode === 'poly' && tmp.length >= 3) { closePoly(); return; }
  // Пробел — как в Revit: поворот прибора под курсором. R оставлена для привычки.
  if ((e.code === 'Space' || kc0 === 'KeyR' || /^[rк]$/i.test(String(e.key))) &&!e.ctrlKey && !e.metaKey && !e.altKey && mode !== 'poly') {
    if (rotateUnderCursor()) { e.preventDefault(); return; }
  }
  // Delete — убрать зону, на которую наведён курсор: то же, что крестик,
  // только с клавиатуры. В поле ввода имени клавиша работает как обычно.
  if ((e.key === 'Delete' || e.key === 'Del') && selZ >= 0 && !dragZ) {
    var t = e.target && e.target.tagName;
    if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'SELECT') {
      e.preventDefault();
      deleteZoneAt(selZ);
      return;
    }
  }
  // Esc: сначала бросает начатое (контур, отрезок масштаба), следующий — выходит из полного экрана
  if (e.key === 'Escape' && fsOn && !tmp.length && !scalePts.length && !polyCur) { toggleFs(false); return; }
  if (e.key === 'Escape') { tmp = []; scalePts = []; polyCur = null; draw(); }
});

/**
 * Упрощение контура комнаты до нескольких углов.
 *
 * Распознавание даёт контур по пикселям: два-три десятка точек, тянуть за
 * сторону такой контур невозможно. Комнаты почти всегда прямоугольные или
 * Г-образные, поэтому стороны выпрямляем по осям, короткие (меньше 0.35 м)
 * убираем, а дальше прореживаем, пока не останется 4–8 углов.
 */
function simplifyZone(pts, ppm, o) {
  if (!pts || pts.length < 5) return pts;   // прямоугольник упрощать нечего
  ppm = ppm || 100;
  // o.maxCorners / o.minSide — мягче к сложным комнатам (fitZonePts): по умолчанию
  // до 6 углов и ступеньки короче 0,9 м выпрямляются
  var maxC = (o && o.maxCorners) || 6, ms = (o && o.minSide) || 0.9;
  var out = dpSimp(pts.slice(), Math.max(2, 0.06 * ppm));
  // стороны почти по осям — выпрямляем
  var ax = function (P) {
    for (var i = 0; i < P.length; i++) {
      var a = P[i], b = P[(i + 1) % P.length];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      if (Math.abs(dx) < 1e-6 || Math.abs(dy) < 1e-6) continue;
      if (Math.abs(dy) < Math.abs(dx) * 0.28) { var my = (a[1] + b[1]) / 2; a[1] = my; b[1] = my; }
      else if (Math.abs(dx) < Math.abs(dy) * 0.28) { var mx = (a[0] + b[0]) / 2; a[0] = mx; b[0] = mx; }
    }
    return P;
  };
  var drop = function (P, minLen) {                 // короткие стороны — схлопнуть
    var res = [], i;
    for (i = 0; i < P.length; i++) {
      var a = P[i], b = P[(i + 1) % P.length];
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < minLen && P.length - res.length > 4) {
        res.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]); i++;   // пара точек в одну
      } else res.push(a);
    }
    return res;
  };
  var col = function (P) {                          // выкинуть точки на прямой
    var res = [], i;
    for (i = 0; i < P.length; i++) {
      var a = P[(i + P.length - 1) % P.length], b = P[i], c = P[(i + 1) % P.length];
      var cr = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      var L = Math.hypot(c[0] - a[0], c[1] - a[1]) || 1;
      if (Math.abs(cr) / L > 0.15 * ppm || res.length < 3) res.push(b);
    }
    return res.length >= 4 ? res : P;
  };
  out = col(drop(ax(out), Math.min(0.6, ms) * ppm));
  // Из распознавания оставляем только четырёх- и шестиугольники: сложнее
  // фигуру монтажник дочертит руками по точкам, зато за любую сторону
  // готовой зоны можно потянуть. Лишние углы убираем по одному — тот,
  // без которого площадь меняется меньше всего.
  var target = out.length <= 4 ? 4 : (out.length <= maxC ? out.length : maxC);
  if (target === 5) target = 4;
  while (out.length > target) {
    var worst = -1, wd = Infinity;
    for (var i = 0; i < out.length; i++) {
      var a2 = out[(i + out.length - 1) % out.length], b2 = out[i], c2 = out[(i + 1) % out.length];
      var d2 = Math.abs((b2[0] - a2[0]) * (c2[1] - a2[1]) - (b2[1] - a2[1]) * (c2[0] - a2[0])) / 2;
      if (d2 < wd) { wd = d2; worst = i; }
    }
    if (worst < 0) break;
    out.splice(worst, 1);
  }
  // Последний проход — стороны строго по осям, без косых: помещения на
  // планах прямоугольные, а косая сторона у зоны берётся от разметки и
  // мешает и тянуть за сторону, и класть петли.
  var rect = function (P) {
    for (var t2 = 0; t2 < 3; t2++) {
      for (var e2 = 0; e2 < P.length; e2++) {
        var p1 = P[e2], p2 = P[(e2 + 1) % P.length];
        var ddx = p2[0] - p1[0], ddy = p2[1] - p1[1];
        if (Math.abs(ddx) < 1e-6 || Math.abs(ddy) < 1e-6) continue;
        if (Math.abs(ddx) >= Math.abs(ddy)) { var yy = (p1[1] + p2[1]) / 2; p1[1] = yy; p2[1] = yy; }
        else { var xx = (p1[0] + p2[0]) / 2; p1[0] = xx; p2[0] = xx; }
      }
    }
    return P;
  };
  out = col(rect(out));
  // Ступеньки короче 0.9 м — это не форма комнаты, а огрехи распознавания
  // у лестницы и дверных откосов: убираем их и выпрямляем контур ещё раз.
  out = col(rect(drop(out, ms * ppm)));
  while (out.length === 5) {                        // пятиугольник сводим к четырём
    var w5 = -1, wd5 = Infinity;
    for (var i5 = 0; i5 < out.length; i5++) {
      var a5 = out[(i5 + out.length - 1) % out.length], b5 = out[i5], c5 = out[(i5 + 1) % out.length];
      var d5 = Math.abs((b5[0] - a5[0]) * (c5[1] - a5[1]) - (b5[1] - a5[1]) * (c5[0] - a5[0])) / 2;
      if (d5 < wd5) { wd5 = d5; w5 = i5; }
    }
    if (w5 < 0) break;
    out.splice(w5, 1);
    out = col(rect(out));
  }
  // Четырёхугольник с косой стороной сводим к прямоугольнику: попарное
  // выпрямление на четырёх точках может не сойтись, а косых в зоне быть
  // не должно.
  var skew = out.some(function (p3, i3) {
    var q3 = out[(i3 + 1) % out.length];
    return Math.abs(q3[0] - p3[0]) > 1 && Math.abs(q3[1] - p3[1]) > 1;
  });
  if (skew && out.length <= 4) {
    var xs2 = out.map(function (q4) { return q4[0]; });
    var ys2 = out.map(function (q4) { return q4[1]; });
    var X0 = Math.min.apply(null, xs2), X1 = Math.max.apply(null, xs2);
    var Y0 = Math.min.apply(null, ys2), Y1 = Math.max.apply(null, ys2);
    out = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]];
  }
  // Страховка: на рваном контуре (зубцы от штриховки и выносок) цепочка
  // выпрямлений могла вывернуть многоугольник сам в себя — из комнаты 7,4 м²
  // выходила зона 0,8 м². Площадь упрощённой зоны сверяем с исходным контуром;
  // разошлась больше чем на треть — берём описанный прямоугольник, если он
  // близок по площади, иначе контур, прорежённый без выпрямления.
  var polyA = function (P) {
    var s = 0;
    for (var i6 = 0, j6 = P.length - 1; i6 < P.length; j6 = i6++)
      s += (P[j6][0] + P[i6][0]) * (P[j6][1] - P[i6][1]);
    return Math.abs(s / 2);
  };
  var a0 = polyA(pts), a1 = polyA(out);
  if (a0 > 0 && Math.abs(a1 - a0) / a0 > 0.33) {
    var bx = pts.map(function (q) { return q[0]; }), by = pts.map(function (q) { return q[1]; });
    var bX0 = Math.min.apply(null, bx), bX1 = Math.max.apply(null, bx);
    var bY0 = Math.min.apply(null, by), bY1 = Math.max.apply(null, by);
    var boxA = (bX1 - bX0) * (bY1 - bY0);
    out = (boxA - a0) / a0 <= 0.33
      ? [[bX0, bY0], [bX1, bY0], [bX1, bY1], [bX0, bY1]]
      : dpSimp(pts.slice(), Math.max(2, 0.06 * ppm));
  }
  return out.map(function (q) { return [Math.round(q[0]), Math.round(q[1])]; });
}

/**
 * Контур комнаты для зоны: упрощённый, но с той же площадью.
 *
 * simplifyZone сводит контур к 4–6 углам и выпрямляет ступеньки короче 0,9 м.
 * На комнате с лестничным проёмом это съедало 15 % площади (19,16 м² на плане →
 * 16,3 м² в зоне, 03.10.2026). Берём первое упрощение, которое держит площадь
 * контура в пределах 2,5 %: сначала прежнее, потом с большим числом углов и
 * более короткой ступенькой. Ничего не сошлось — лучшее из попыток.
 */
function fitZonePts(pts, ppm, printedM2) {
  ppm = ppm || F().pxPerM || 100;
  if (!pts || pts.length < 5) return pts;
  // иголки контура: заход в сторону и обратно меньше чем на 0,35 м при просвете
  // меньше 0,12 м — следы штриховки и подписей, не форма комнаты
  var P0 = pts.map(function (q) { return q.slice(); }), k0;
  for (var pass = 0; pass < 3; pass++) {
    var cut = false;
    for (k0 = 0; k0 < P0.length && P0.length > 4; k0++) {
      var pa = P0[(k0 + P0.length - 1) % P0.length], pb = P0[k0], pc = P0[(k0 + 1) % P0.length];
      if (Math.hypot(pc[0] - pa[0], pc[1] - pa[1]) < 0.12 * ppm &&
          Math.max(Math.hypot(pb[0] - pa[0], pb[1] - pa[1]), Math.hypot(pb[0] - pc[0], pb[1] - pc[1])) < 0.35 * ppm) {
        P0.splice(k0, 1); cut = true; k0--;
      }
    }
    if (!cut) break;
  }
  pts = P0;
  var A0 = area(pts), best = null, bestErr = Infinity;
  var tries = [null, { maxCorners: 8, minSide: 0.5 }, { maxCorners: 10, minSide: 0.35 }, { maxCorners: 12, minSide: 0.25 }];
  for (var i = 0; i < tries.length; i++) {
    var S = simplifyZone(pts.map(function (q) { return q.slice(); }), ppm, tries[i]);
    var err = A0 > 0 ? Math.abs(area(S) - A0) / A0 : 0;
    if (err < bestErr) { bestErr = err; best = S; }
    if (err <= 0.025) break;
  }
  // Прямоугольные упрощения не удержали площадь (диагональная стенка, скос) —
  // берём сам контур, прореженный до 1,5 см на метр масштаба: углов больше,
  // зато площадь та же
  if (bestErr > 0.025) {
    var Dp = dpSimp(pts.map(function (q) { return q.slice(); }), Math.max(1.5, 0.015 * ppm));
    var eD = A0 > 0 ? Math.abs(area(Dp) - A0) / A0 : 0;
    if (Dp.length >= 4 && Dp.length <= 24 && eD < bestErr) { best = Dp.map(function (q) { return [Math.round(q[0]), Math.round(q[1])]; }); bestErr = eD; }
  }
  // Стороны контура — к настоящим стенам плана (внутренняя грань): контур по меткам
  // обрывался на размерных цепочках и лестнице, и серые зоны приходилось тянуть руками
  var snapped = false;
  if (best && SNAP_ZONES) { var sn = snapZoneToWalls(best, ppm); snapped = sn !== best; best = sn; }
  // Подписанная площадь известна и расходится на 1,5–15 % — подгоняем зону к
  // ней растяжением от центра: так «Помещение · N м²» на плане и площадь,
  // уходящая в расчёт, равны напечатанной. Расхождение больше 15 % не трогаем:
  // там комната найдена неверно, и подгонка спрятала бы это.
  // К стенам уже прижато — площадь получилась честной, подгонка только сдвинула бы стороны обратно от стен.
  if (printedM2 > 0 && best && !snapped) {
    var Ab = area(best), dev = Math.abs(Ab - printedM2) / printedM2;
    if (dev > 0.015 && dev <= 0.15) {
      var cc = centroid(best), kk = Math.sqrt(printedM2 / Ab);
      best = best.map(function (q) { return [Math.round(cc[0] + (q[0] - cc[0]) * kk), Math.round(cc[1] + (q[1] - cc[1]) * kk)]; });
    }
  }
  return best;
}

/**
 * Стороны зоны — к внутренней грани стены.
 *
 * Зона по меткам комнаты кончается там, где ей помешала линия: размерная цепочка,
 * ступень лестницы, подпись. До стены оставалось 0,2–0,5 м, и соседние зоны то не
 * доходили до стены, то наползали друг на друга (03.10.2026, план заказчика).
 * Каждая сторона, идущая по осям, ищет стену в маске без тонкого (getWallMask)
 * наружу не дальше 0,7 м и встаёт вплотную к ней; сторона, севшая на стену, отходит
 * внутрь. Сторону с проёмом больше половины длины (дверь, арка) не трогаем:
 * по ней стены нет, и сдвигать её некуда. Углы переносятся вместе со сторонами.
 */
var SNAP_ZONES = true;      // стенд (bench/room_areas.js) гасит, чтобы сравнить «до» и «после»
function snapZoneToWalls(P, ppm) {

  var k = wm.k, W = wm.w, H = wm.h, bar = wm.bar, n = P.length;
  var SN = Math.max(3, Math.round(0.7 * ppm * k)), IN = Math.max(2, Math.round(0.3 * ppm * k));
  var wallAt = function (x, y) {
