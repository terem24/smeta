/** Какому шагу принадлежит текущий режим — чтобы не звать «дальше» в него же. */
function modeStepId() {
  if (mode === 'scale') return 'scale';
  if (mode === 'rad') return 'rad';
  if (mode === 'coll') return 'coll';
  if (mode === 'wc') return 'wc';
  if (mode === 'room' || mode === 'rect' || mode === 'poly') {
    var t = document.getElementById('ztype').value;
    return t === 'boiler' ? 'boiler' : t === 'wc' ? 'wc' : 'tp';
  }
  return null;
}

function guideStep() {
  var f = F();
  var L = stepDefs(), act = activeStep(L);

  // Хвост «Дальше» — то, чего подсказке и не хватало: в режиме рисования она
  // рассказывала только про сам режим, и следующий шаг терялся. Кнопка
  // переводит на него сразу, вместе с нужным типом зоны.
  var nx = '';
  if (act && act.id !== modeStepId()) {
    nx = '<br><br><b>Дальше — шаг ' + (L.indexOf(act) + 1) + ' из ' + L.length + ': ' +
      act.t.toLowerCase() + '.</b> ' +
      '<button onclick="goStep(\'' + act.id + '\')" style="margin-top:6px;font:inherit;' +
      'padding:5px 12px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);' +
      'color:#fff;cursor:pointer">Перейти</button>';
  } else if (!act) {
    nx = '<br><br><b>Все шаги пройдены</b> — жмите зелёную «' + (UFH ? 'Готово' : 'Сохранить') + '».';
  }

  var zn = f.zones.length ? '<br><b>Зон на этаже: ' + f.zones.length + '.</b>' : '';

  if (mode === 'scale') return { t: 'cv', s: 'Масштаб', d: 'scale', txt: (scalePts.length
    ? 'Теперь кликните вторую точку отрезка — и введите его длину в метрах.'
    : 'Кликните первую точку отрезка с известной длиной: край дверного проёма (обычно 0,9 м), стену или размерную линию плана.') + nx };
  if (mode === 'room' && UFH) return { t: 'cv', s: 'Тёплый пол: клик по комнатам', d: 'room',
    txt: 'Кликните внутри комнаты — в ней появится тёплый пол с раскладкой петель. Повторный клик ' +
      'убирает его. Комнату без имени попросим назвать — по имени она свяжется с расчётом.' + zn + nx };
  if (mode === 'room') return { t: 'cv', s: 'Зона: ' + TYPES[document.getElementById('ztype').value][0], d: 'room',
    txt: 'Кликните внутри комнаты — контур найдётся по стенам автоматически. Если не вышло (широкий проём, пёстрое фото) — обведите вручную.' + zn + nx };
  if (mode === 'rad') {
    var rc = (f.rads || []).length;
    return { t: 'cv', s: 'Радиаторы',
      txt: 'Кнопка «Под окна» вверху найдёт окна и расставит радиаторы автоматически. Вручную: клик рядом с окном сам отцентрирует радиатор по окну; у глухой стены — прилипнет к стене. Клик по значку — удалить. Радиаторы свободно сочетаются с зоной тёплого пола.' +
        (rc ? '<br><b>Поставлено: ' + rc + ' шт.</b>' : '') + nx };
  }
  if (mode === 'coll') return { t: 'cv', s: 'Коллектор ТП',
    txt: 'Кликните точку, где будет стоять коллектор тёплого пола (обычно в котельной). От него при сохранении построятся подводки ко всем петлям. Клик по значку — убрать, клик в другом месте — передвинуть.' + nx };
  if (mode === 'wc') return { t: 'cv', s: 'Сантехприборы вручную',
    txt: 'Выберите прибор в списке и кликните, где он стоит; клик по значку — убрать. Обычно это не нужно: в режиме «Приборы: из расчёта» они расставляются сами по карточкам санузлов — достаточно обвести зону «Санузел» и подписать её. Вручную удобно добавить то, чего нет в расчёте.' + nx };
  if (mode === 'rect') return { t: 'cv', s: 'Зона: ' + TYPES[document.getElementById('ztype').value][0], d: 'rect',
    txt: 'Зажмите кнопку мыши и растяните рамку по комнате — края прилипнут к стенам. Тип зоны меняется в списке сверху.' + zn + nx };
  if (mode === 'poly') return { t: 'cv', s: 'Зона-контур: ' + TYPES[document.getElementById('ztype').value][0], d: 'poly',
    txt: (tmp.length ? 'Углов: ' + tmp.length + '. ' : '') +
      'Кликайте углы комнаты по порядку. Замкнуть — клик по первой точке, двойной клик или Enter. Shift — линии строго под 90°, Ctrl+Z — убрать точку.' +
      (tmp.length ? '' : zn + nx) };

  // Вне режимов рисования подсказка — это сам текущий шаг.
  if (act) return stepTip(act, L);
  if (UFH) return { t: 'b_save', s: 'Готово',
    txt: 'Тёплый пол отмечен. Нажмите зелёную «Готово» — раскладка появится в смете, ' +
      'а галочки тёплого пола в карточках комнат встанут по плану. Есть второй этаж — ' +
      'переключите вкладку сверху и отметьте его так же.' };
  if (savedOnce) return { t: 'b_save', s: 'Готово',
    txt: 'Сохранено! Планы попадут в комплект проекта вместе со сметой.' +
      '<br><button onclick="openSheets()" style="margin-top:7px;font:inherit;padding:5px 12px;' +
      'border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer">' +
      'Открыть проект</button><br>Есть ещё этажи — переключите вкладку сверху и повторите шаги.' };
  return { t: 'b_save', s: 'Всё отмечено',
    txt: 'Этаж размечен полностью. Нажмите зелёную «Сохранить» — подложка уедет на сервер фоном, ждать её не нужно.' };
}

/** Открыть комплект листов: смета уже лежит в localStorage после калькулятора */
function openSheets(noRebuild) {
  // Комплект всегда пересобирает калькулятор: в браузере лежит последний собранный, и он может быть
  // от другого объекта или от прошлой версии (на листах тогда плашка «собран прежней версией»)
  var op = noRebuild ? null : pjOpener();
  if (op) {
    try { op.focus(); } catch (e) {}
    try { op.app.openProjectSheets(); return; } catch (e) { console.warn('[plan_editor] листы:', e && e.message); }
  }
  var st = null;
  try { st = JSON.parse(localStorage.getItem('project_sheets_payload')); } catch (e) {}
  if (!st) alert('Сначала откройте калькулятор и нажмите «Проект» — комплект соберётся по смете вместе с планами этажей.');
  else if (!st.nodeSheets || !st.builtAt) alert('Комплект в браузере собран прежней версией калькулятора. Вернитесь во вкладку калькулятора и нажмите «Выпустить проект» — он соберётся заново. Из этой вкладки калькулятор не найден.');
  else window.open('project.html', '_blank');
}

var guidePos = null;     // позиция после ручного перетаскивания (пока страница открыта)
var guideHtml = '';      // кэш содержимого: не перерисовывать без изменений, иначе
                         // SMIL-анимации демок перезапускались бы на каждом движении мыши

function placeGuide() {
  if (!guidePos) return;
  var w = guideEl.offsetWidth || 320, h = guideEl.offsetHeight || 120;
  var L = Math.min(Math.max(4, guidePos.left), window.innerWidth - w - 4);
  var T = Math.min(Math.max(4, guidePos.top), window.innerHeight - Math.min(h, 160) - 4);
  guideEl.style.right = ''; guideEl.style.bottom = '';
  guideEl.style.left = Math.round(L) + 'px';
  guideEl.style.top = Math.round(T) + 'px';
}

// ─── Шаги: полоска под кнопками и показ только нужных инструментов ───────
//
// Подсказка-пузырь показывает ровно один шаг и в режимах рисования вообще
// подменяется описанием режима — из-за этого всё, что идёт после
// радиаторов (коллектор, котельная, санузлы), проходило мимо: увидеть это
// можно было только внизу правой колонки, куда не доскроллить. А два
// десятка кнопок в шапке одинаково доступны на любом шаге, и найти среди
// них ту, которой отмечают котельную, без подсказки нельзя — её там и нет,
// котельная отмечается типом зоны.
//
// Полоска решает обе задачи: все шаги видны сразу, текущий подсвечен, а в
// шапке остаются только его инструменты. Кнопка «Все инструменты»
// возвращает прежний вид целиком.

// кнопки, которые прячутся по шагам; остальные (этажи, отмена, сохранение,
// проект, подсказки) видны всегда
var STEP_BTNS = ['b_upload', 'b_scale', 'b_autorooms', 'b_room', 'b_rect', 'b_poly',
                 'b_rad', 'b_autorad', 'b_coll', 'b_fixauto', 'b_wc', 'wctype', 'ztype', 'b_cold'];

var zoneMore = false;    // «Иначе»: показаны ли рамка и контур рядом с «по клику»

function toggleZoneMore() { zoneMore = !zoneMore; updateGuide(); }

/**
 * Первый экран: пока размечать нечего, в шапке одно действие, а не двадцать.
 *
 * 'empty' — у этажа нет подложки: нужна только «Загрузить план».
 * 'auto'  — подложка есть, разметки нет и шаг не выбран руками: нужна
 *           «Разметить всё», она проходит весь порядок сама.
 * Дальше шапка живёт по шагам, как раньше. Выход из обоих режимов — кнопка
 * «Все инструменты» или любой шаг в полоске.
 */
var heroOff = false;     // автоматика споткнулась — шапка нужна целиком

function heroMode() {
  if (allTools || curStep || heroOff) return null;
  // Включён режим рисования — инструменты шага нужны на виду: иначе масштаб
  // ждёт двух кликов по плану, а кнопки «Масштаб», которой этот режим
  // включён, в шапке нет и выключить его нечем. Так бывает сразу после
  // загрузки плана, когда масштаб не подобрался сам.
  if (mode !== 'select') return null;
  var f = F();
  if (!f || !f.img) return 'empty';
  return (!f.pxPerM && !(f.zones || []).length && !(f.rads || []).length) ? 'auto' : null;
}

var curStep = null;      // шаг, выбранный вручную (null — ведёт первый незакрытый)
var allTools = false;    // «Все инструменты»: показывать шапку целиком
try { allTools = localStorage.getItem('plan_editor_alltools') === '1'; } catch (e) {}
if (PJ) allTools = false;

function toggleAllTools() {
  allTools = !allTools;
  // в мастере раскладки и в выпуске проекта «Ещё» — на один раз: выбор не запоминаем, чтобы
  // страница всегда открывалась простой
  if (UFH || PJ) document.documentElement.classList.toggle('more', allTools);
  else try { localStorage.setItem('plan_editor_alltools', allTools ? '1' : '0'); } catch (e) {}
  updateGuide();
}

// ─── Полный экран ─────────────────────────────────────────────────────
// План во всё окно: в калькуляторе редактор лежит в iframe под шапкой сайта и полосой
// «← К смете», поэтому растягиваем сам iframe и просим у браузера настоящий полный экран
// (не дали — остаётся растянутое окно). Карточка шага с подсказками и быстрые клавиши —
// колонкой у левого края (CSS html.fs #steps): работать и отмечать можно, не выходя из режима.
var fsOn = false, fsFrameCss = '', fsObs = null;

function fsHost() {
  try { if (window.frameElement) return window.parent.document; } catch (e) {}
  return document;
}
function fsSyncTop() {
  var t = document.querySelector('.topbar');
  document.documentElement.style.setProperty('--fs-top', ((t ? t.offsetHeight : 46) + 6) + 'px');
}

/** Быстрые клавиши в пустом поле под планом: те же, что в списке по «?», без дублей; панель сворачивается. */
var fsKeysMin = false;
try { fsKeysMin = localStorage.getItem('plan_editor_fskeys') === '0'; } catch (e) {}
function fsKeysRender() {
  var box = document.getElementById('fs_keys');
  if (!box) return;
  var seen = {}, rows = [['Пробел', 'повернуть прибор'], ['Ctrl+Z', 'шаг назад'], ['F', 'весь экран вкл / выкл'], ['Esc', 'выйти из экрана']];
  HOTKEYS.forEach(function (h) {
    if (seen[h.name] || h.code === 'Slash' || h.code === 'KeyF') return;
    seen[h.name] = 1; rows.push([h.key, h.name]);
  });
  box.className = 'fs-keys' + (fsKeysMin ? ' min' : '');
  box.innerHTML = '<div class="fk-top"><span class="fk-h">Быстрые клавиши</span>' +
    '<button type="button" class="ghost" onclick="toggleFsKeys()">' + (fsKeysMin ? '▸ Показать' : '▾ Свернуть') + '</button></div>' +
    '<div class="fk-grid">' + rows.map(function (r) {
      return '<div class="fk"><kbd>' + r[0] + '</kbd><span>' + r[1] + '</span></div>'; }).join('') + '</div>';
}
function toggleFsKeys() {
  fsKeysMin = !fsKeysMin;
  try { localStorage.setItem('plan_editor_fskeys', fsKeysMin ? '0' : '1'); } catch (e) {}
  fsKeysRender();
  fsFit();
}

/**
 * Автомасштаб полного экрана: чертёж вписывается в поле по высоте (по ширине он вписан и так),
 * поэтому план и быстрые клавиши помещаются без вертикальной прокрутки. Если после вписывания
 * чертёж стал бы мельче 70 % поля — быстрые клавиши сами сворачиваются в строку (кнопкой
 * «Показать» их можно раскрыть, тогда план подожмётся). При масштабе не 100 % — как выбрал пользователь.
 */
function fsFit() {
  var root = document.documentElement;
  if (!fsOn || viewZoom !== 1) { root.style.removeProperty('--fs-ch'); return; }
  var box = document.querySelector('.cvbox'), keys = document.getElementById('fs_keys');
  if (!box) return;
  var cs = getComputedStyle(box);
  var padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  var avail = function () {
    var kh = keys ? keys.offsetHeight + (parseFloat(getComputedStyle(keys).marginTop) || 0) : 0;
    return box.clientHeight - padV - kh - 2;
  };
  if (keys) keys.classList.remove('auto-min');
  var h = avail();
  if (keys && !fsKeysMin && h < box.clientHeight * 0.7) { keys.classList.add('auto-min'); h = avail(); }
  root.style.setProperty('--fs-ch', Math.max(160, Math.floor(h)) + 'px');
}
var fsFitTm = null;
function fsFitSoon() { clearTimeout(fsFitTm); fsFitTm = setTimeout(function () { try { fsFit(); draw(); } catch (e) {} }, 60); }
window.addEventListener('resize', function () { if (fsOn) fsFitSoon(); });

/**
 * После загрузки плана подсвечиваем «На весь экран»: про кнопку не знали, а на весь экран
 * работать куда удобнее. Мигает, пока её не нажмут (или ~15 с), с подписью про клавишу F.
 */
var fsNudgeTm = null;
function fsNudgeOff() {
  clearTimeout(fsNudgeTm); fsNudgeTm = null;
  var n = document.getElementById('fs_nudge'); if (n) n.remove();
  var b = document.getElementById('b_fs2'); if (b) b.classList.remove('nudge');
}
function fsNudge() {
  if (fsOn) return;
  var b = document.getElementById('b_fs2'), corner = b && b.parentNode;
  if (!corner) return;
  fsNudgeOff();
  b.classList.add('nudge');
  var n = document.createElement('div');
  n.id = 'fs_nudge';
  n.innerHTML = '<b>Удобнее на весь экран</b><span>План крупнее, шаги — слева. Клавиша <kbd>F</kbd></span>';
  n.onclick = function () { toggleFs(true); };
  corner.appendChild(n);
  fsNudgeTm = setTimeout(fsNudgeOff, 15000);
}
function toggleFs(force) {
  var on = typeof force === 'boolean' ? force : !fsOn;
  if (on === fsOn) return;
  fsOn = on;
  fsNudgeOff();
  var fr = null;
  try { fr = window.frameElement; } catch (e) {}
  document.documentElement.classList.toggle('fs', on);
  if (fr) {
    if (on) { fsFrameCss = fr.style.cssText; fr.style.cssText = fsFrameCss + ';position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:10060;'; }
    else fr.style.cssText = fsFrameCss;
  }
  var host = fsHost();
  try {
    if (on && !host.fullscreenElement) { var p = host.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    else if (!on && host.fullscreenElement) { var q = host.exitFullscreen(); if (q && q.catch) q.catch(function () {}); }
  } catch (e) {}
  var b = document.getElementById('b_fs');
  if (b) { b.textContent = on ? '⤡ Свернуть (Esc)' : '⤢ На весь экран'; b.className = on ? 'on ufh-keep' : 'ghost ufh-keep'; }
  var b2 = document.getElementById('b_fs2');
  if (b2) b2.textContent = on ? '⤡ Свернуть (Esc)' : '⤢ На весь экран';
  if (on) {
    fsSyncTop();
    var tb = document.querySelector('.topbar');
    if (window.ResizeObserver && !fsObs && tb) { fsObs = new ResizeObserver(fsSyncTop); fsObs.observe(tb); }
  } else if (fsObs) { fsObs.disconnect(); fsObs = null; }
  stepsHtml = '';
  if (on) fsKeysRender();
  updateGuide();
  // холст перерисовать уже по новой ширине: от неё зависят кружки номеров комнат
  setTimeout(function () { try { applyZoom(); fsFit(); draw(); } catch (e) {} }, 80);
}
function toggleFsDock() {
  document.documentElement.classList.toggle('fs-dock-off');
  setTimeout(function () { try { draw(); } catch (e) {} }, 50);
}
// Esc браузера закрывает его полный экран — вместе с ним выходим и из нашего режима
(function () {
  var h = function () { if (fsOn && !fsHost().fullscreenElement) toggleFs(false); };
  document.addEventListener('fullscreenchange', h);
  try { if (fsHost() !== document) fsHost().addEventListener('fullscreenchange', h); } catch (e) {}
  // окно плана закрыли («← К смете») — вернуть браузер из полного экрана
  window.addEventListener('pagehide', function () {
    try { var d = fsHost(); if (fsOn && d.fullscreenElement) d.exitFullscreen(); } catch (e) {}
  });
})();

/** Список шагов текущего этажа: что сделано, чем делается, что подсказать. */
function stepDefs() {
  if (UFH) return ufhSteps();
  var f = F();
  var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
  var hasBoiler = DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
  var wcNamed = f.zones.filter(function (z) {
    return z.type === 'wc' && wcCardOf(z.name);
  }).length;
  var noName = f.zones.filter(function (z) { return z.type === 'tp' && !z.name; }).length;

  var L = [];
  L.push({ id: 'plan', t: 'План', ok: !!f.img, btn: ['b_upload'] });
  L.push({ id: 'scale', t: 'Масштаб', ok: !!f.pxPerM, btn: ['b_autoscale', 'b_scale'], mode: 'scale' });
  L.push({ id: 'tp', t: 'Тёплый пол', ok: hasTp, type: 'tp', mode: 'room',
           btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype'] });
  L.push({ id: 'rad', t: 'Радиаторы', ok: (f.rads || []).length > 0, mode: 'rad',
           btn: ['b_autorad', 'b_rad'] });
  if (hasTp) L.push({ id: 'coll', t: 'Коллектор ТП', ok: !!f.coll, mode: 'coll',
                      btn: ['b_coll'] });
  L.push({ id: 'boiler', t: 'Котельная', ok: hasBoiler, type: 'boiler', mode: 'room',
           btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype'] });
  if (calcWc.length) L.push({ id: 'wc', t: 'Санузлы', ok: wcNamed > 0, type: 'wc', mode: 'room',
                              btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype', 'b_fixauto', 'b_wc', 'wctype'] });
  // Подписывают зоны в правой колонке, кнопки шапки для этого не нужны — но
  // пустая шапка выглядит поломкой, да и имена обычно правят заодно с
  // самими зонами. Поэтому инструменты зон тут остаются.
  if (noName) L.push({ id: 'names', t: 'Имена комнат: ' + noName, ok: false,
                       btn: ['b_room', 'b_rect', 'b_poly', 'ztype'] });
  return L;
}

/** Текущий шаг: выбранный вручную, пока не закрыт, иначе первый незакрытый. */
function activeStep(L) {
  var i;
  if (curStep) {
    for (i = 0; i < L.length; i++) if (L[i].id === curStep && !L[i].ok) return L[i];
    curStep = null;   // закрыт или исчез — дальше ведём сами
  }
  for (i = 0; i < L.length; i++) if (!L[i].ok) return L[i];
  return null;        // всё закрыто, остаётся «Сохранить»
}

/** Переход на шаг по клику в полоске: включает нужный режим и тип зоны. */
function goStep(id) {
  curStep = id;
  var L = stepDefs(), s = null;
  for (var i = 0; i < L.length; i++) if (L[i].id === id) s = L[i];
  if (!s) { updateGuide(); return; }
  if (s.id === 'plan') {
    var inp = document.querySelector('#b_upload input');
    if (inp) inp.click();
    return;
  }
  if (s.id === 'names') {
    var zl = document.getElementById('zlist');
    if (zl) zl.scrollIntoView({ block: 'end', behavior: 'smooth' });
    updateGuide();
    return;
  }
  // Тип зоны ставим до режима: котельную и санузел отмечают не кнопкой, а
  // типом — именно этого в шапке и не находили.
  if (s.type) {
    var sel = document.getElementById('ztype');
    if (sel) sel.value = s.type;
  }
  if (s.mode && mode !== s.mode) setMode(s.mode);   // setMode сам зовёт updateGuide
  else { draw(); updateGuide(); }
}

/** Кнопки шапки: на шаге видны только его инструменты. */
function applyBar(step) {
  var hero = heroMode();
  var need = allTools || !step ? null : (step.btn || []);
  // Шаг зон: «по клику» остаётся в шапке, рамка и контур — под «Иначе».
  // Три кнопки на одно действие читались как три разных инструмента, хотя
  // в девяти случаях из десяти нужен только первый.
  var zoneStep = !!need && need.indexOf('b_rect') >= 0;
  var hidRare = function (id) {
    return !allTools && !zoneMore && (id === 'b_rect' || id === 'b_poly');
  };
  STEP_BTNS.forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (hero) {
      // Первый экран: лишнее убираем совсем, иначе пустой план накрыт
      // двумя десятками погашенных кнопок и выглядит сломанным.
      el.style.display = (id === 'b_upload') ? '' : 'none';
      el.classList.remove('dim');
      return;
    }
    var show = !need || need.indexOf(id) >= 0;
    var rare = hidRare(id);
    // Ненужное на шаге не прячем: кнопка остаётся на месте и нажимается, но
    // гаснет. Пряталась — и вся шапка на каждом шаге перестраивалась,
    // соседние кнопки уезжали из-под курсора. Исключение — рамка и контур:
    // они уходят под «Иначе» на любом шаге, иначе на зону по-прежнему
    // приходится три кнопки в шапке.
    el.style.display = rare ? 'none' : '';
    el.classList.toggle('dim', !show && !rare);
  });
  var am = document.getElementById('b_automark');
  if (am) am.style.display = (hero === 'empty') ? 'none' : '';
  // «Подобрать масштаб» живёт вне STEP_BTNS (он нужен и вне шага «Масштаб»),
  // поэтому на первом экране убирается отдельно: там одно действие.
  var as = document.getElementById('b_autoscale');
  if (as) as.style.display = hero ? 'none' : '';
  var mb = document.getElementById('b_zonemore');
  if (mb) {
    mb.style.display = (hero || allTools || !zoneStep) ? 'none' : '';
    mb.textContent = zoneMore ? 'Иначе ▴' : 'Иначе ▾';
  }
  var b = document.getElementById('b_alltools');
  if (b) {
    b.textContent = allTools ? 'Только текущий шаг' : 'Все инструменты';
    b.className = allTools ? '' : 'ghost';
  }
}

var stepsHtml = '';   // кэш разметки: полоска обновляется на каждый draw

function renderSteps() {
  var box = document.getElementById('steps');
  if (!box) return;
  if (UFH) { applyBar(null); wzRender(box); return; }
  if (PJ) { applyBar(null); pjRender(box); return; }
  var L = stepDefs();
  var act = activeStep(L);
  applyBar(act);

  var h = '<span class="lbl">Шаги:</span>';
  L.forEach(function (s) {
    var cls = s.ok ? 'st done' : (act && act.id === s.id ? 'st next' : 'st');
    h += '<span class="' + cls + '"' +
      (s.ok ? '' : ' onclick="goStep(\'' + s.id + '\')"') + '>' +
      (s.ok ? '✓ ' : '') + s.t + '</span>';
  });
  if (!act) h += UFH ? '<span class="st save" onclick="ufhDone()">Готово</span>'
    : '<span class="st save" onclick="saveAll()">Сохранить</span>';

  // Режим рисования объясняет себя прямо здесь: раньше это было написано
  // только в правой колонке, где лежит и отказ автоподбора, — инструкция
  // терялась под ним, а при выключенных подсказках других слов и не было.
  // Масштаб вдобавок держит остальные шаги: кнопки гаснут, и без объяснения
  // это выглядит поломкой сайта.
  if (MODE_BAR[mode]) h += '<span class="tip">' + MODE_BAR[mode] + '</span>';
  else if (act && act.id === 'scale')
    h += '<span class="tip wait">Пока масштаб не задан, зоны, радиаторы и коллектор не ' +
      'работают' + (allTools ? '' : ' — потому и погашены') + '.</span>';

  // Фоновая отправка подложек — тут же, чтобы не гадать, ушли они или нет.
  if (upState && upState.run) {
    h += '<span class="up">Подложка ' + (upState.done + 1) + ' из ' + upState.total +
      ' — ' + Math.round(upState.pct * 100) + '%</span>';
  } else if (upState && upState.err) {
    h += '<span class="up bad">Подложки не ушли на сервер: ' + upState.err +
      ' · <b onclick="uploadPending()">повторить</b></span>';
  }
  if (h !== stepsHtml) { box.innerHTML = h; stepsHtml = h; }
}

function updateGuide() {
  renderSteps();
  var pulsed = document.querySelectorAll('.pulse');
  for (var i = 0; i < pulsed.length; i++) pulsed[i].classList.remove('pulse');
  // мастер раскладки говорит «что делать» сам, строкой под шапкой — пузырь не нужен
  if (UFH || PJ) { if (guideEl) guideEl.style.display = 'none'; return; }
  if (!guideEl) {
    guideEl = document.createElement('div');
    guideEl.className = 'guide'; guideEl.style.display = 'none';
    guideEl.title = 'Подсказку можно перетащить, если она мешает';
    document.body.appendChild(guideEl);
    guideEl.addEventListener('pointerdown', function (e) {
      if (e.target.classList && e.target.classList.contains('close')) return;
      if (e.target.tagName === 'BUTTON') return;   // кнопка в подсказке — не перетаскивание
      var r0 = guideEl.getBoundingClientRect();
      var dx = e.clientX - r0.left, dy = e.clientY - r0.top;
      try { guideEl.setPointerCapture(e.pointerId); } catch (err) {}
      function mv(ev) { guidePos = { left: ev.clientX - dx, top: ev.clientY - dy }; placeGuide(); }
      function up() {
        guideEl.removeEventListener('pointermove', mv);
        guideEl.removeEventListener('pointerup', up);
        guideEl.removeEventListener('pointercancel', up);
      }
      guideEl.addEventListener('pointermove', mv);
      guideEl.addEventListener('pointerup', up);
      guideEl.addEventListener('pointercancel', up);
      e.preventDefault();
    });
  }
  var g = guideStep();
  // Подсказки выключены — окно не показываем, но кнопку следующего шага
  // подсвечиваем: иначе непонятно, куда нажимать дальше.
  if (!hintsOn) {
    guideEl.style.display = 'none';
    var off = g && g.t !== 'cv' ? document.getElementById(g.t) : null;
    if (off) off.classList.add('pulse');
    return;
  }
  if (!g) { guideEl.style.display = 'none'; return; }
  var html = '<span class="close" onclick="toggleHints()">✕ скрыть подсказки</span>' +
    '<div class="step"><span class="grip">⠿</span>' + g.s + '</div>' + g.txt +
    (g.d ? '<div class="demo">' + DEMOS[g.d] + '</div>' : '');
  if (html !== guideHtml) { guideEl.innerHTML = html; guideHtml = html; }
  guideEl.style.display = 'block';
  var w = Math.min(324, window.innerWidth - 24);
  guideEl.style.maxWidth = w + 'px';
  var tgt = g.t === 'cv' ? cv : document.getElementById(g.t);
  if (tgt && g.t !== 'cv') tgt.classList.add('pulse');
  if (guidePos) { placeGuide(); return; }
  // По умолчанию — правый нижний угол: там подсказка не закрывает ни план,
  // ни панель зон. Перетащить её по-прежнему можно куда угодно.
  guideEl.style.left = ''; guideEl.style.top = '';
  guideEl.style.right = '16px';
  guideEl.style.bottom = '16px';
}

// после каждого изменения состояния подсказка обновляется сама
var _draw = draw;
draw = function () { _draw(); updateGuide(); };
var _rz = renderZones;
renderZones = function () { savedOnce = false; _rz(); updateGuide(); };
var _sm = setMode;
setMode = function (m) { _sm(m); updateGuide(); };
var _sv = saveAll;
// Отметка «сохранено» ставится сразу: разметка ложится в браузер тут же, а
// подложки уезжают фоном и показывают себя в полоске шагов.
saveAll = function () {
  var r = _sv();
  try { savedOnce = !!localStorage.getItem('floor_plans_v1'); } catch (e) { savedOnce = false; }
  updateGuide();
  return r;
};
// Кнопка «Сохранить» показывает, есть ли несохранённые правки: сравниваем разметку
// (без картинок) с тем, что было при открытии или последнем сохранении.
var savedSnap = null, saveBtnTimer = 0;
function planSnap() {
  try { return JSON.stringify(DATA.floors, function (k, v) { return k === 'img' ? undefined : v; }); } catch (e) { return ''; }
}
function syncSaveBtn() {
  saveBtnTimer = 0;
  var b = document.getElementById('b_save');
  if (!b || UFH) return;
  var snap = planSnap();
  if (savedSnap === null) savedSnap = snap;
  var dirty = snap !== savedSnap;
  var t = dirty ? '● Сохранить' : '✓ Сохранено';
  if (b.textContent !== t) b.textContent = t;
  b.style.background = dirty ? '#d97706' : 'var(--ok)';
  b.style.borderColor = dirty ? '#d97706' : 'var(--ok)';
  b.title = dirty ? 'Есть несохранённые правки — нажмите, чтобы сохранить' : 'Все правки сохранены';
}
function scheduleSaveBtn() { if (!saveBtnTimer) saveBtnTimer = setTimeout(syncSaveBtn, 250); }
var _gs = updateGuide;
updateGuide = function () { _gs(); scheduleSaveBtn(); };
var _sv2 = saveAll;
saveAll = function () { var r = _sv2(); savedSnap = planSnap(); syncSaveBtn(); return r; };
scheduleSaveBtn();
window.addEventListener('resize', updateGuide);
window.addEventListener('resize', function () { try { if (!imgCache[cur]) draw(); } catch (e) { } });
window.addEventListener('scroll', updateGuide, true);
document.getElementById('b_hints').textContent = '💡 Подсказки: ' + (hintsOn ? 'вкл' : 'выкл');

syncFixAutoBtn();
refreshAutoFixtures();   // приборы санузлов из расчёта — сразу при открытии
// Кнопка тёмного плана в разметке нажата; если в прошлый раз её выключили,
// снимаем нажатие до первой отрисовки.
(function () {
  var b = document.getElementById('b_darkplan');
  if (b) b.className = darkPlan ? 'on' : 'ghost';
})();
if (PJ) document.title = 'Выпуск проекта — план этажей';
// Режим раскладки: свои подписи; «Сохранить» становится «Готово» и закрывает окно
if (UFH) (function () {
  // название «План дома» — в шапке окна калькулятора; здесь только этажи
  var t = document.querySelector('.bar b');
  if (t) t.textContent = 'Этажи:';
  document.title = 'План дома';
  var s = document.getElementById('b_save');
  if (s) { s.textContent = 'Готово'; s.onclick = ufhDone; s.title = 'Сохранить и вернуться в смету'; }
  var am = document.getElementById('b_automark');
  if (am) { am.textContent = 'Найти комнаты'; am.title = 'Масштаб, комнаты и коллектор — по всем этажам сразу'; }
  document.getElementById('ztype').value = 'tp';
  // «Ещё» в мастере не запоминается: окно всегда открывается простым
  allTools = false;
  document.documentElement.classList.remove('more');
  var ph = document.querySelector('.side .phead');
  if (ph && ph.firstChild) ph.firstChild.textContent = 'Комнаты этажа ';
  // подсказки названий: комнаты расчёта, затем обычные
  var dl = document.createElement('datalist'); dl.id = 'ufhNames';
  roomNames.concat(UFH_NAMES).filter(function (n, i, a) { return a.indexOf(n) === i; }).forEach(function (n) {
    var o = document.createElement('option'); o.value = n; dl.appendChild(o);
  });
  document.body.appendChild(dl);
  // полный редактор и листы проекта — тем, кому открыто проектирование
  var design = false;
  try { design = localStorage.getItem('heatcalc_design_access') === '1'; } catch (e) {}
  var bs = document.getElementById('b_sheets_ufh');
  if (bs) bs.style.display = design ? 'inline-block' : 'none';
  hint('');
  WZ_SIG0 = wzSig();
  // План уже размечен — сразу на нужный шаг, с его режимом на плане
  var f = F();
  if (f && f.img && f.pxPerM) wzGo(wzCur(wzSteps()), true);
})();
if (DATA.floors[0].water && DATA.floors[0].water.visited) wwInit();   // карточки шага — свежие из расчёта, до первого сохранения
renderTabs(); draw(); renderZones();
</script>
