      var parts = ins.map(fill);
      var good = parts.every(function (q, i) {
        return q && !ins.some(function (l, j) { return j !== i && pip([l.x, l.y], q.pts); });
      });
      if (good) { parts.forEach(function (q) { q.rescued = true; add.push(q); }); return; }
    }
    out.push(r);
  });
  labs.forEach(function (l) {
    if (out.concat(add).some(function (r) { return pip([l.x, l.y], r.pts); })) return;
    var r = fill(l);
    if (r) { r.rescued = true; add.push(r); }
  });
  // Контур, чей центр лёг внутрь достроенной комнаты (кольцо вокруг кровати, обрезок той же
  // комнаты), — её же обломок: убираем, иначе он займёт место раньше и перекроет её
  out = out.filter(function (r) {
    var c = centroid(r.pts);
    return !add.some(function (q) { return pip(c, q.pts); });
  });
  return out.concat(add);
}

function pip(p, pts) {  // точка внутри полигона (ray casting)
  var inn = false;
  for (var a = 0, b = pts.length - 1; a < pts.length; b = a++) {
    if ((pts[a][1] > p[1]) !== (pts[b][1] > p[1]) &&
        p[0] < (pts[b][0] - pts[a][0]) * (p[1] - pts[a][1]) / (pts[b][1] - pts[a][1]) + pts[a][0])
      inn = !inn;
  }
  return inn;
}

/** Сброс всего, что считалось от масштаба: метки комнат живут на маске, окна
 *  и двери — в своём кэше. Без этого смена масштаба оставляла бы на этаже
 *  комнаты и окна, отмеренные по прежнему числу. */
function resetScaleCaches() {
  var m = maskCache[cur];
  if (m) { m.labels = null; m.labCnt = null; m.labEdge = null; m.labMin = null; m.labN = 0; }
  delete winCache[cur];
  DOORS = [];
}

/** Медиана: одна ошибочная комната не должна утащить за собой масштаб. */
function median(a) {
  var v = a.slice().sort(function (x, y) { return x - y; });
  if (!v.length) return 0;
  return v.length % 2 ? v[(v.length - 1) / 2]
                      : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
}

/** Площади найденных на плане комнат (м²) при пробном масштабе.
 *  Сегментация сама зависит от масштаба — labelRooms отделяет комнаты по
 *  проёмам радиусом, заданным в метрах, — поэтому метки сбрасываются на
 *  каждый прогон, а прежний масштаб возвращается на место. */
function roomAreasAt(ppmTry, mode) {
  var f = F(), was = f.pxPerM, wasMode = f.roomMask, out = [];
  if (!getMask()) return out;
  f.pxPerM = ppmTry;
  if (mode === 'clean') f.roomMask = 'clean'; else delete f.roomMask;
  resetScaleCaches();
  try { out = enumerateRooms().map(function (r) { return r.m2; }); }
  catch (e) { console.error('[plan_editor] scale rooms:', e); }
  f.pxPerM = was;
  if (wasMode) f.roomMask = wasMode; else delete f.roomMask;
  resetScaleCaches();
  return out;
}

/** Общий множитель площадей: самое плотное скопление отношений «комната
 *  расчёта к комнате плана».
 *
 *  Пары не сводятся по порядку размера: на плане всегда находятся помещения,
 *  которых в расчёте нет (коридоры, гардеробные, лоджии), и одно лишнее сбило
 *  бы весь ряд. Берём ВСЕ отношения: верные ложатся кучно вокруг истинного
 *  множителя, случайные рассыпаются. Окно шириной ±8% по стороне помещения
 *  (±17% по площади) с наибольшим числом отношений и даёт ответ. */
function fitAreaRatio(measured, targets) {
  var rs = [];
  measured.forEach(function (a) {
    if (a > 0) targets.forEach(function (b) { if (b > 0) rs.push(b / a); });
  });
  if (rs.length < 2) return null;
  rs.sort(function (x, y) { return x - y; });
  var bi = 0, bj = 0;
  for (var i = 0; i < rs.length; i++) {
    var hi = rs[i] * 1.17, j = i;
    while (j + 1 < rs.length && rs[j + 1] <= hi) j++;
    if (j - i > bj - bi) { bi = i; bj = j; }
  }
  return median(rs.slice(bi, bj + 1));
}

/** Сколько комнат плана сошлись с расчётом при этом множителе — мера доверия
 *  к масштабу. Комната расчёта занята одной комнатой плана: две одинаковые
 *  спальни не должны считаться за одно совпадение дважды. */
function agreeCount(measured, targets, ratio) {
  var used = {}, ok = 0;
  measured.forEach(function (a) {
    var bestJ = -1, bestE = 1;
    targets.forEach(function (b, j) {
      if (used[j] || !(b > 0)) return;
      var e = Math.abs(a * ratio - b) / b;
      if (e < bestE) { bestE = e; bestJ = j; }
    });
    if (bestJ >= 0 && bestE <= 0.12) { used[bestJ] = 1; ok++; }
  });
  return ok;
}

/** Вес совпадений с расчётом с поправкой на число найденных кусков.
 *
 *  Когда стены плана читаются плохо, он рассыпается на десятки обрывков, и
 *  среди них всегда находятся «подходящие» площади: на исчерченном трубами
 *  инженерном плане 36 обрывков давали 8 совпадений из 8 при масштабе в два с
 *  половиной раза меньше настоящего. Лишние куски сверх числа комнат расчёта
 *  (с запасом 30 % на коридоры и гардеробные) снижают вес совпадений. */
function matchScore(ok, found, nTargets) {
  return ok * Math.min(1, nTargets * 1.3 / Math.max(1, found));
}

/** Площади комнат этажа из подробного расчёта — то единственное, по чему
 *  подбирается масштаб. Вынесено из guessScale: отказ обязан называть
 *  причину, а она как раз в том, сколько таких комнат нашлось. */
function scaleTargets() {
  var t = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && r.area > 0;
  }).map(function (r) { return r.area; });
  if (t.length >= 2) return t;
  // комнат в расчёте нет — площади, напечатанные на самом плане (PDF или прочитанные со скана)
  var pr = (PDF_AREAS[cur] || []).map(function (l) { return l.m2; });
  if (pr.length < 2 && PDF_AREAS[cur] && PDF_AREAS[cur].table) pr = PDF_AREAS[cur].table.rows.map(function (r) { return r.m2; });
  return pr.length >= 2 ? pr : t;
}

/** Масштаб по площадям комнат расчёта: сколько пикселей плана в метре.
 *
 *  Единственное число разметки, которого нет ни на чертеже, ни в расчёте, —
 *  и без него не работают ни авторазметка комнат, ни расстановка радиаторов.
 *  Считаем от обратного: помещения на плане уже находятся по стенам, их
 *  площади в расчёте известны, остаётся подобрать множитель.
 *
 *  Одного прогона мало: при заведомо неверном масштабе комнаты слипаются
 *  через проёмы или рассыпаются на куски. Поэтому идём лесенкой пробных
 *  масштабов, у каждого меряем согласие с расчётом, а лучший уточняем ещё
 *  дважды — уже на его собственной сегментации. */
/** Итог этажа для сверки. Зоны, созданные по площади экспликации (calc), сверяем с
 *  её итогом; остальные — комнаты с подписями на плане вне экспликации (Хамам, Баня…). */
function floorSumNote() {
  var zs = F().zones || [], keyed = {}, extra = 0;
  zs.forEach(function (z) {
    var a = +zoneM2(z) || 0;
    if (!z.calc) { extra += a; return; }
    var k = (z.roomId != null ? 'id' + z.roomId : 'n' + (z.name || ''));
    keyed[k] = Math.max(keyed[k] || 0, a);
  });
  var matched = Object.keys(keyed).reduce(function (s, k) { return s + keyed[k]; }, 0);
  var expl = calcRooms.filter(function (r) { return (+r.floor || 1) === cur + 1 && r.area > 0; })
    .reduce(function (s, r) { return s + r.area; }, 0);
  var f1 = function (x) { return x.toFixed(1).replace('.', ','); };
  if (!expl) return ' Сумма зон этажа: ' + f1(matched + extra) + ' м².';
  var dev = (matched - expl) / expl * 100;
  return ' По экспликации: ' + f1(matched) + ' из ' + f1(expl) + ' м² — ' +
    (Math.abs(dev) <= 5 ? 'сходится.' : 'расхождение ' + (dev > 0 ? '+' : '') + dev.toFixed(0) + ' %.') +
    (extra > 0.05 ? ' Вне экспликации (подписи на плане): ' + f1(extra) + ' м².' : '');
}

/** Выпуклая оболочка точек [[x,y],…] — алгоритм цепочки Эндрю. */
function convexHull(pts) {
  var P = pts.map(function (q) { return [q[0], q[1]]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  if (P.length < 3) return P;
  var cross = function (o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); };
  var lo = [], up = [], i;
  for (i = 0; i < P.length; i++) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], P[i]) <= 0) lo.pop(); lo.push(P[i]); }
  for (i = P.length - 1; i >= 0; i--) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], P[i]) <= 0) up.pop(); up.push(P[i]); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

/** Сопоставление зон этажа с площадями экспликации — по всему этажу, а не по одной комнате.
 *  Каждой целевой площади (от большей к меньшей) ставим одну зону или пару соседних,
 *  чья сумма ближе всего к ней, в пределах 15 %. Пару берём только если она заметно
 *  точнее одиночной (на 5 % и больше): иначе правильную комнату разрежем надвое.
 *  Пара — это разбивка одной комнаты на части (дверь, мебель). Возвращает
 *  [{ t: индекс цели, idx: [индексы зон], e: относительная ошибка }]. */
function matchAreasFloor(cands, targets) {
  var used = {}, out = [];
  var order = targets.map(function (t, i) { return i; })
    .sort(function (a, b) { return targets[b].area - targets[a].area; });
  order.forEach(function (ti) {
    var t = targets[ti].area, best = null;
    for (var i = 0; i < cands.length; i++) {
      if (used[i]) continue;
      var e1 = Math.abs(cands[i].m2 - t) / t;
      if (!best || e1 < best.e) best = { idx: [i], e: e1 };
      for (var j = i + 1; j < cands.length; j++) {
        if (used[j]) continue;
        var e2 = Math.abs(cands[i].m2 + cands[j].m2 - t) / t;
        if (e2 < best.e - 0.05) best = { idx: [i, j], e: e2 };
      }
    }
    if (best && best.e <= 0.15) {
      best.idx.forEach(function (k) { used[k] = 1; });
      out.push({ t: ti, idx: best.idx, e: best.e });
    }
  });
  return out;
}

/** Масштаб перебором: для каждого пробного масштаба (40…130 px/м, обе маски)
 *  считаем, сколько площадей с плана совпало с целевыми один к одному (±15 %).
 *  Истинный масштаб даёт больше всего совпадений; удвоенный или половинный —
 *  меньше. Это надёжнее подгонки множителя: та на удвоенном масштабе сводила
 *  7 из 11 площадей экспликации (площадь «в два раза больше»). Ничья — меньший
 *  масштаб и «сырая» маска. */
function scaleByMatch(targets) {
  var best = null;
  ['raw', 'clean'].forEach(function (mode) {
    for (var ppmTry = 40; ppmTry <= 130; ppmTry += 4) {
      var meas = roomAreasAt(ppmTry, mode), used = {}, ok = 0;
      targets.forEach(function (t) {
        var bi = -1, bd = 1e9;
        meas.forEach(function (a, i) {
          if (used[i]) return;
          var d = Math.abs(a - t) / t;
          if (d < bd) { bd = d; bi = i; }
        });
        if (bi >= 0 && bd <= 0.15) { used[bi] = 1; ok++; }
      });
      if (!best || ok > best.ok || (ok === best.ok && mode === 'raw' && best.mode === 'clean')) {
        best = { ppm: ppmTry, ok: ok, mode: mode, total: targets.length };
      }
    }
  });
  return best;
}

function guessScale() {
  var targets = scaleTargets();
  if (targets.length < 2) return null;
  // Сначала перебор по совпадениям: устойчив к удвоению масштаба
  var byMatch = scaleByMatch(targets);
  if (byMatch && byMatch.ok >= Math.min(3, targets.length)) return byMatch;
  // Подбор по одной маске: обычной ('raw') либо очищенной от тонкого ('clean')
  var score = function (ok, n) { return matchScore(ok, n, targets.length); };
  var fitMode = function (mode) {
    var best = null;
    [40, 70, 110, 170, 260].forEach(function (ppmTry) {
      var meas = roomAreasAt(ppmTry, mode);
      var ratio = fitAreaRatio(meas, targets);
      if (!ratio) return;
      var ppm = ppmTry / Math.sqrt(ratio), ok = agreeCount(meas, targets, ratio);
      if (ppm < 10 || ppm > 600) return;
      var sc = score(ok, meas.length);
      if (!best || sc > best.sc) best = { ppm: ppm, ok: ok, sc: sc };
    });
    if (!best) return null;
    for (var k = 0; k < 2; k++) {
      var meas2 = roomAreasAt(best.ppm, mode);
      var ratio2 = fitAreaRatio(meas2, targets);
      if (!ratio2) break;
      var ppm2 = best.ppm / Math.sqrt(ratio2), ok2 = agreeCount(meas2, targets, ratio2);
      var sc2 = score(ok2, meas2.length);
      if (ppm2 < 10 || ppm2 > 600 || sc2 < best.sc) break;
      var settled = Math.abs(ppm2 - best.ppm) / best.ppm < 0.02;
      best = { ppm: ppm2, ok: ok2, sc: sc2 };
      if (settled) break;
    }
    best.mode = mode;
    return best;
  };
  // Очищенная маска берётся, только если её оценка строго выше: на
  // чистом архитектурном плане тонкие перегородки нарисованы линиями, и
  // чистка их стёрла бы — там прежний режим обязан остаться.
  var best = fitMode('raw'), alt = fitMode('clean');
  if (alt && (!best || alt.sc > best.sc)) best = alt;
  if (!best) return null;
  best.total = targets.length;
  // Три сошедшиеся комнаты (или все, если их всего две) — граница, ниже
  // которой это уже не подбор, а совпадение.
  return best.ok >= Math.min(3, targets.length) ? best : null;
}

/** Чем проверить подобранный масштаб: ширина дверных проёмов. Величина
 *  известна каждому монтажнику — 0,8–0,9 м, и разъехавшийся масштаб виден по
 *  ней сразу, в отличие от площадей, по которым он и подбирался. */
function doorWidthM() {
  try { detectWindows(); } catch (e) { return 0; }
  var f = F();
  if (!DOORS.length || !f.pxPerM) return 0;
  return median(DOORS.map(function (d) { return d.w / f.pxPerM; }));
}

/** Ширина дверных проёмов при таком масштабе: 0 — проёмов не нашлось.
 *  Проверка независимая: площади можно свести к чему угодно, а проём —
 *  величина известная, 0,8–0,9 м. */
function doorCheck(ppm) {
  var f = F(), was = f.pxPerM;
  f.pxPerM = ppm; resetScaleCaches();
  var dw = doorWidthM();
  f.pxPerM = was; resetScaleCaches();
  return dw;
}

/** Масштаб по дверным проёмам: двери на жилом плане — одного размера, 0,9 м.
 *  Медиана ширины проёмов в пикселях даёт пикселей в метре. Ширина меряется при
 *  масштабе, от которого зависят размеры проёмов в детекторе, поэтому пробуем
 *  лесенку масштабов и берём точку, где он сходится сам с собой (± 25 %).
 *  null — проёмов мало или ширины разъехались. */
function doorScale() {
  var f = F(), was = f.pxPerM, best = null;
  try {
    [40, 70, 110, 170, 260].forEach(function (t) {
      f.pxPerM = t; resetScaleCaches();
      detectWindows();
      if (DOORS.length < 2) return;
      var ws = DOORS.map(function (d) { return d.w; }).sort(function (a, b) { return a - b; });
      var med = ws[ws.length >> 1];
      var same = ws.filter(function (w) { return Math.abs(w - med) / med < 0.15; }).length;
      var ppm = med / 0.9;
      if (same < 2 || ppm < 10 || ppm > 600 || ppm / t < 0.75 || ppm / t > 1.33) return;
      if (!best || same > best.n) best = { ppm: ppm, n: same, w: med };
    });
  } finally { f.pxPerM = was; resetScaleCaches(); }
  return best;
}

/** Кнопка «Подобрать масштаб», она же автоподбор при загрузке плана.
 *  silent — молчать о неудаче: при загрузке плана комнат в расчёте может и
 *  не быть, ругаться тут не на что. */
/** Правдоподобие масштаба по габариту: рамка стен (buildingEnvelope, без запаса 0,5 м) в м² при этом масштабе,
 *  делённая на сумму площадей, известных заранее (итог таблицы, подписи на плане, комнаты расчёта).
 *  null — проверять нечем. { ok, ratio }: ok при 0,9–2,6. */
function footprintCheck(ppm) {
  var f = F(), m = getMask(), sum = 0, labs = PDF_AREAS[cur] || [];
  if (!m || !ppm) return null;
  if (labs.table) sum = labs.table.total > 0 ? labs.table.total : labs.table.sum;
  else { var t = scaleTargets(); sum = t.reduce(function (a, b) { return a + b; }, 0); }
  if (!(sum > 5)) return null;
  var was = f.pxPerM, env = null;
  f.pxPerM = ppm;
  try { m.env = undefined; env = buildingEnvelope(m); } catch (e) { env = null; }
  f.pxPerM = was; m.env = undefined;
  if (!env) return null;
  var mg = 0.5 * ppm;       // запас на балкон в габарите уже есть — убираем
  var w = (env.x1 - env.x0) - 2 * mg / m.k, h = (env.y1 - env.y0) - 2 * mg / m.k;
  if (!(w > 0 && h > 0)) return null;
  var ratio = w * h / (ppm * ppm) / sum;
  return { ok: ratio >= 0.9 && ratio <= 2.6, ratio: ratio };
}

function autoScale(silent) {
  scaleDoubt = '';
  // Первый источник — размеры самого чертежа. Он не зависит от того,
  // заполнен ли расчёт, и потому закрывает случай, на котором шаг «Масштаб»
  // раньше становился тупиком: план второго этажа есть, комнат второго
  // этажа в расчёте нет.
  var d = null;
  try { d = scaleFromDims(PDF_DIMS[cur]) || scaleFromScanDims(SCAN_DIMS[cur]) || SCAN_OCR[cur] || null; }
  catch (e) { console.error('[plan_editor] dims:', e); }
  if (d) {
    var ddw = doorCheck(d.ppm);
    if (!ddw || (ddw >= 0.6 && ddw <= 1.3)) {
      if (!silent) pushUndo('scale');
      var fd = F();
      fd.pxPerM = d.ppm; fd.scaleSrc = 'dims';
      resetScaleCaches();
      renderZones(); draw(); updateGuide();
      hint('<span class=ok>Масштаб взят с размерных линий чертежа</span> (сошлось ' +
        d.n + ' размеров из ' + d.total + '). ' +
        (ddw ? 'Проверьте: дверные проёмы получились ' + ddw.toFixed(2).replace('.', ',') +
          ' м. ' : 'Проверьте его кнопкой «Масштаб» по любому известному размеру. ') +
        'Дальше — «Распознать комнаты».');
      return true;
    }
    scanWhy('по размерам вышло ' + d.ppm.toFixed(1) + ' px/м (сошлось ' + d.n + ' из ' + d.total + '), но дверные проёмы при нём ' +
      ddw.toFixed(2) + ' м — вне 0,6–1,3, отброшено');
    d = null;   // проёмы не сошлись — размеры не от этого плана, идём к площадям
  } else {
    var nd = (SCAN_DIMS[cur] || []).length;
    scanWhy(nd ? 'линий принято ' + nd + ', но согласованных меньше двух (разброс больше 10 %)' : 'размерных линий нет');
  }
  // Без размеров чертежа — двери 0,9 м: надёжнее подбора по площадям, который
  // зависит от того, что уже прочитано и посчитано.
  if (!d) {
    var ds = null;
    try { ds = doorScale(); } catch (e) { console.error('[plan_editor] doors:', e); }
    if (ds) {
      if (!silent) pushUndo('scale');
      F().pxPerM = ds.ppm; F().scaleSrc = 'doors';
      resetScaleCaches();
      renderZones(); draw(); updateGuide();
      hint('<span class=ok>Масштаб взят по дверным проёмам</span> (проёмов ' + ds.n +
        ', ширина ' + ds.w.toFixed(0) + ' px ≈ 0,9 м). Проверьте кнопкой «Масштаб» по любому известному размеру.');
      return true;
    }
  }
  var g = null;
  try { g = guessScale(); } catch (e) { console.error('[plan_editor] scale:', e); }
  if (!g) {
    var tg = scaleTargets();
    // Масштаб придётся задавать руками — значит, кнопка «Масштаб» должна
    // быть на виду, а не за «Все инструменты».
    if (!silent) heroOff = true;
    scanWhy(((SCAN_DIAG[cur] || {}).scale || '') + '; по площадям: комнат расчёта на этаже ' + tg.length + ', не сошлось');
    // Причину монтажнику не расписываем — она ему ничего не даёт; в консоль, на случай разбора
    console.info('[plan_editor] масштаб: размеров ' + ((PDF_DIMS[cur] || []).length + (SCAN_DIMS[cur] || []).length) +
      ', комнат расчёта на этаже ' + tg.length);
    if (!silent) {
      var rd = (SCAN_DIAG[cur] || {}).read || '';
      hint(/quota|billing|RESOURCE_EXHAUSTED|429/i.test(rd)
        ? 'Сервис распознавания сейчас перегружен — масштаб не подобрался. Задайте масштаб вручную: кнопка «Задать масштаб», два клика по краям двери или известного размера.'
        : /сервис недоступен|нет ответа/.test(rd)
        ? 'Нет связи с сервисом распознавания — масштаб не подобран. Проверьте интернет и нажмите «Подобрать ещё раз» или задайте масштаб по двери.'
        : 'Масштаб сам не подобрался — задайте его по двери или размеру на плане.');
    }
    return false;
  }
  // Проверяем не тем, чем подбирали: площади можно свести к чему угодно, если
  // комнаты в расчёте вообще от другого объекта, а ширина дверного проёма —
  // величина известная. Вышло полтора метра — подобрался не масштаб, а
  // совпадение, и такой лучше не ставить вовсе.
  var f = F(), dw = doorCheck(g.ppm);
  // Подбор по площадям — самый слабый источник: ни размеров, ни дверей, которыми его можно подтвердить, нет.
  // Единственная проверка, что осталась, — габарит здания: площадь рамки стен при таком масштабе должна быть
  // в 0,9–2,6 раза больше суммы площадей комнат (стены, лестницы, выступы). Не сошлось — не принимаем молча.
  var fp = footprintCheck(g.ppm);
  if (fp && !fp.ok) {
    scaleDoubt = 'Масштаб не подтверждён: подбор по площадям дал ' + g.ppm.toFixed(1) + ' px/м, но при нём габарит здания в ' +
      fp.ratio.toFixed(1).replace('.', ',') + ' раза больше суммы комнат (должен быть 0,9–2,6) — задайте масштаб кнопкой «Масштаб» по размеру на плане.';
    scanWhy('масштаб по площадям ' + g.ppm.toFixed(1) + ' px/м не прошёл проверку габаритом (' + fp.ratio.toFixed(2) + ')');
    if (!silent) hint(scaleDoubt);
    return false;
  }
  // Проёмов не нашлось вовсе — проверить нечем, и тогда подбор должен сойтись
  // хотя бы по половине комнат этажа. Иначе на плане без читаемых стен
  // «сходились» три случайные площади, и масштаб уезжал в разы (39 px/м
  // вместо ~100 на инженерном плане второго этажа).
  if (!dw && g.ok < Math.ceil(g.total / 2)) {
    if (!silent) hint('Масштаб по площадям не принят: по стенам плана сошлось только ' + g.ok +
      ' комнат из ' + g.total + ', а дверных проёмов для проверки не нашлось. ' +
      'Задайте масштаб кнопкой «Масштаб».');
    return false;
  }
  if (dw && (dw < 0.6 || dw > 1.3)) {
    if (!silent) hint('Масштаб по площадям не принят: при нём дверные проёмы плана выходят ' +
      dw.toFixed(2).replace('.', ',') + ' м вместо обычных 0,8–0,9. Похоже, комнаты в ' +
      'расчёте не от этого этажа. Задайте масштаб кнопкой «Масштаб».');
    return false;
  }
  // При загрузке отменять нечего: снимок 'plan' уже сделан и масштаб в нём.
  if (!silent) pushUndo('scale');
  f.pxPerM = g.ppm; f.scaleSrc = 'areas';
  if (g.mode === 'clean') f.roomMask = 'clean'; else delete f.roomMask;
  resetScaleCaches();
  renderZones(); draw(); updateGuide();
  hint('<span class=ok>Масштаб подобран по площадям комнат расчёта: сошлось ' + g.ok +
    ' из ' + g.total + '.</span> ' +
    (dw ? 'Проверьте: дверные проёмы получились ' + dw.toFixed(2).replace('.', ',') +
      ' м — если это не так, задайте масштаб кнопкой «Масштаб». '
        : 'Проверьте его кнопкой «Масштаб» по любому известному размеру. ') +
    'Дальше — «Распознать комнаты».');
  return true;
}

/** Подложка на месте, а масштаба у этажа нет — подбираем сам.
 *
 *  Нужно для планов, пришедших не из файла, а из распознавания: их подложку
 *  кладёт калькулятор, applyPlanCanvas в этом случае не работает. Один раз на
 *  этаж: не подобрался — значит, монтажник задаст его вручную, и навязываться
 *  на каждой перерисовке незачем. Через таймер, потому что зовут отсюда из
 *  draw(), а autoScale сам draw() и вызывает. */
var scaleTried = {};
function tryAutoScaleOnce() {
  var f = F();
  if (!f || !f.img || f.pxPerM || scaleTried[cur] || !imgCache[cur]) return;
  scaleTried[cur] = true;
  setTimeout(function () { autoScale(true); }, 0);
}

/** Подложка этажа в кэше картинок: маску по ней строит getMask, а он берёт
 *  только готовую. Для текущего этажа это делает draw(), для остальных — никто:
 *  их разметка идёт «вслепую», без открытия вкладки. */
function ensureImage(fi) {
  return new Promise(function (ok) {
    var f = DATA.floors[fi];
    if (!f || !f.img) { ok(false); return; }
    if (imgCache[fi]) { ok(true); return; }
    var im = new Image();
    if (f.img.indexOf('data:') !== 0) im.crossOrigin = 'anonymous';
    im.onload = function () { imgCache[fi] = im; ok(true); };
    im.onerror = function () { ok(false); };
    im.src = f.img;
  });
}

/**
 * «Разметить всё»: масштаб → комнаты → радиаторы → коллектор → сохранение,
 * по всем этажам подряд.
 *
 * Ничего нового кнопка не считает — зовёт те же autoScale, autoRooms, autoRads
 * и saveAll. Но по отдельности их пять, идут они в строгом порядке и на каждом
 * этаже заново, а бросают разметку ровно на середине этого порядка.
 *
 * Уже размеченное не сносится: autoRooms пропускает комнаты, где зона есть,
 * autoRads — окна, под которыми уже стоит радиатор. Поэтому нажать её можно и
 * после ручных правок, и второй раз подряд.
 */
var autoBusy = false;
function autoMarkAll() {
  if (autoBusy) return;
  if (!DATA.floors.some(function (f) { return f.img; })) {
    alert('Сначала загрузите план этажа.'); return;
  }
  autoBusy = true;
  var btn = document.getElementById('b_automark');
  if (btn) btn.disabled = true;
  var was = cur, zones = 0, rads = 0, colls = 0, bad = [];
  // Возвращаем обещание: кнопке оно не нужно, но по нему видно, когда разметка
  // кончилась, — этим пользуется стенд, и это же понадобится, если запускать
  // разметку не рукой.
  var chain = Promise.resolve();
  DATA.floors.forEach(function (f, fi) {
    chain = chain.then(function () {
      if (!f.img) return null;
      cur = fi;
      hint('Размечаю ' + (fi + 1) + '-й этаж из ' + DATA.floors.length + '…');
      return ensureImage(fi).then(function (okImg) {
        var name = (fi + 1) + '-й этаж';
        if (!okImg) { bad.push(name + ' — подложка не открылась'); return; }
        if (!f.pxPerM) autoScale(true);
        if (!f.pxPerM) { bad.push(name + ' — не подобрался масштаб'); return; }
        var z0 = f.zones.length, r0 = (f.rads || []).length;
        autoRooms();
        autoRads();          // в режиме раскладки — мимо комнат только с тёплым полом
        // Комнаты с типом в расчёте есть, а зон не появилось — по площадям
        // ничего не сошлось. Молча написать «Зон: 0» мало: монтажник должен
        // знать, что обводить руками и на каком этаже.
        if (f.zones.length === z0) {
          var want = calcRooms.filter(function (r) {
            return (+r.floor || 1) === fi + 1 && zoneKindsOfRoom(r).length;
          }).map(function (r) { return r.name; });
          if (want.length) bad.push(name + ' — комнаты не совпали по площади, обведите: ' + want.join(', '));
        }
        zones += f.zones.length - z0;
        rads += (f.rads || []).length - r0;
        // Коллектор ТП ставим в котельную — там он и стоит. Котельной на
        // этаже нет, а тёплый пол есть — место неочевидно, точку ставит
        // монтажник, и об этом надо сказать вслух.
        var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
        var bz = null;
        f.zones.forEach(function (z) { if (z.type === 'boiler') bz = z; });
        if (hasTp && !f.coll) {
          if (bz) {
            var c = centroid(bz.pts);
            f.coll = { x: Math.round(c[0]), y: Math.round(c[1]) };
            colls++;
          } else if (UFH && ufhAutoColl(f)) {
            colls++;
          } else {
            bad.push(name + ' — некуда поставить коллектор ТП: котельная не отмечена');
          }
        }
      });
    });
  });
  return chain.then(function () {
    cur = was;
    // раскладка: дальше — клик по комнатам, режим сразу нужный
    if (UFH) { if (F().pxPerM && mode !== 'room') setMode('room'); }
    else if (mode !== 'select') setMode('select');
    renderTabs(); renderZones(); draw(); updateGuide();
    return saveAll();      // сохранение считает трассы, подводки и контуры стен
  }).then(function () {
    var done = zones + rads + colls;
    if (bad.length) heroOff = true;   // что-то осталось руками — открываем шапку
    if (UFH) {
      // что делать дальше, скажет строка мастера; здесь — только итог
      hint(F().pxPerM ? '<span class=ok>Найдено комнат: ' + zones + (rads ? ', радиаторов под окнами: ' + rads : '') + '.</span>' + lastRoomsNote +
        (zones ? '' : ' ' + (lastRoomsWhy || 'комнаты не найдены')) +
        (zones ? floorSumNote() : '') +
        (bad.length ? ' <b>Осталось руками:</b> ' + bad.join('; ') + '.' : '') : '');
      return;
    }
    hint((done
      ? '<span class=ok>Разметка готова и сохранена.</span> Зон: ' + zones +
        ', радиаторов: ' + rads + (colls ? ', коллекторов ТП: ' + colls : '') + '. '
      : '<span class=ok>Сохранено.</span> Новых зон и радиаторов не нашлось. ') +
      (bad.length ? '<b>Осталось руками:</b> ' + bad.join('; ') + '. ' : '') +
      'Проверьте зоны и радиаторы — и «Листы проекта» в калькуляторе.');
  })['catch'](function (e) {
    console.error('[plan_editor] авторазметка:', e);
    hint('Разметить всё не удалось: ' + (e && e.message ? e.message : e) +
      '. Пройдите шаги по одному — кнопками выше.');
  }).then(function () {
    autoBusy = false;
    if (btn) btn.disabled = false;
  });
}

/** Какими зонами комната подробного расчёта ложится на план.
 *
 *  Назначение помещения важнее системы: котельная и санузел дают зону своего
 *  типа — по ним собираются компоновка котельной и листы водоснабжения с
 *  канализацией. Тёплый пол в том же помещении добавляется второй зоной по
 *  тому же контуру: убрать его нельзя, из геометрии выпадут петли, по которым
 *  смета считает трубу. */
function zoneKindsOfRoom(r) {
  var out = [], nm = (r && r.name) || '';
  if (/котельн|топочн|бойлерн/i.test(nm)) out.push('boiler');
  // раскладке тёплого пола санузлы с приборами не нужны: в расчёте карточка
  // водоснабжения бывает и у кухни — она стала бы «Санузлом» с унитазом
  else if (!UFH && wcCardOf(nm)) out.push('wc');
  if (((r && r.sys) || []).indexOf('tp') >= 0) out.push('tp');
  return out;
}

/** Отмечена ли котельная хоть на одном этаже: в доме она одна. */
function hasBoilerZone() {
  return DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
}

/** «Распознать комнаты»: зоны по комнатам подробного расчёта — тёплый пол,
 *  котельная и санузлы, тип берётся из самой комнаты (zoneKindsOfRoom).
 *  Сопоставление по площади (лучшие пары, допуск 25% или 2 м²); без расчёта —
 *  зоны ТП для всех найденных комнат. Уже размеченные комнаты не трогаются. */
var lastRoomsNote = '';
var lastRoomsWhy = '';
var scaleDoubt = '';         // плашка «масштаб не подтверждён» — идёт в подсказку «Найти комнаты»
var lastRoomsExtra = '';   // плашки габарита и суммы — в конец подсказки
var rereadInfo = null;      // итог второго прохода чтения подписей { before, after } — для журнала
var lastSkipped = 0;   // сколько контуров пропущено как лишние (без подписи)   // почему комнаты не нашлись — для итоговой строки   // итог сверки с подписанными площадями — для строки «Найдено комнат…»
function autoRooms() {
  lastRoomsWhy = '';
  // Масштаба ещё нет — берём сами (размеры чертежа, двери, площади комнат), а не отправляем
  // монтажника за кнопкой. Спрашиваем руками только когда само не вышло.
  if (!F().pxPerM) { try { autoScale(true); } catch (e) { console.error('[plan_editor] scale:', e); } }
  if (!F().pxPerM) {
    heroOff = true;
    hint('Масштаб сам не подобрался' + (PDF_DIMS[cur] === undefined && F().img ? ' (подложка ещё читается — подождите секунду и повторите)' : '') +
      '. Задайте его кнопкой «Масштаб»: две точки отрезка с известной длиной — дверной проём 0,9 м или размерная линия.' +
      (scaleDoubt ? ' <b style="color:var(--warn-text)">' + scaleDoubt + '</b>' : ''));
    updateGuide();
    return;
  }
  // Масштаб против габарита: две общие размерные линии и рамка наружных стен по маске
  var frameWarn = '', frameNote = '', frameOk = false, fcv = null, scaleWas = F().pxPerM;
  try { fcv = frameScaleCheck(); } catch (e) { console.error('[plan_editor] frame:', e); }
  if (fcv) {
    var mmTxt = Math.round(fcv.Wmm) + '×' + Math.round(fcv.Hmm) + ' мм';
    if (fcv.scaleOk) {
      frameOk = true;
      frameNote = ' Масштаб сверен с габаритом ' + mmTxt + ': сошёлся.';
    } else if (!fcv.axesOk) {
      frameWarn = 'Габарит ' + mmTxt + ' не сошёлся с рамкой наружных стен: по ширине ' + fcv.px.toFixed(1) +
        ', по высоте ' + fcv.py.toFixed(1) + ' px/м (допуск 4 %). Масштаб оставлен ' + F().pxPerM.toFixed(1) + ' — проверьте его по двери или размеру.';
    } else if (F().scaleSrc === 'manual') {
      frameWarn = 'Заданный вручную масштаб ' + F().pxPerM.toFixed(1) + ' px/м расходится с габаритом ' + mmTxt +
        ' (по габариту ' + fcv.ppm.toFixed(1) + ') — проверьте.';
    } else {
      F().pxPerM = fcv.ppm; F().scaleSrc = 'frame'; resetScaleCaches(); frameOk = true;
      frameWarn = 'Масштаб не сошёлся с габаритом ' + mmTxt + ': был ' + scaleWas.toFixed(1) + ', взят по габариту ' + fcv.ppm.toFixed(1) + ' px/м.';
    }
  }
  var rooms = [];
  try { rooms = enumerateRooms(); } catch (e) { console.error('[plan_editor] rooms:', e); }
  // Масштаб могли задать руками — тогда режим маски не выбирал никто.
  // Пробуем и вторую маску: берём её, если по площадям с расчётом она
  // сводит больше комнат (на исчерченном трубами плане так и бывает).
  var calcT = calcRooms.filter(function (r) { return (+r.floor || 1) === cur + 1 && r.area > 0; })
    .map(function (r) { return r.area; });
  if (calcT.length >= 2) {
    var fl0 = F(), mode0 = fl0.roomMask;
    var ok0 = matchScore(agreeCount(rooms.map(function (r) { return r.m2; }), calcT, 1), rooms.length, calcT.length);
    if (mode0 === 'clean') delete fl0.roomMask; else fl0.roomMask = 'clean';
    resetScaleCaches();
    var rooms1 = [];
    try { rooms1 = enumerateRooms(); } catch (e) { rooms1 = []; }
    var ok1 = matchScore(agreeCount(rooms1.map(function (r) { return r.m2; }), calcT, 1), rooms1.length, calcT.length);
    if (ok1 > ok0) rooms = rooms1;
    else { if (mode0) fl0.roomMask = mode0; else delete fl0.roomMask; resetScaleCaches(); }
  }
  if (!rooms.length) {
    lastRoomsWhy = !getMask() ? 'подложка ещё не прочитана — подождите секунду и нажмите «Найти комнаты» снова'
      : 'контуры комнат не замкнулись (проёмы, рамка листа, пёстрая подложка) — обведите зоны вручную';
    hint('Комнаты распознать не удалось: ' + lastRoomsWhy + '.');
    return;
  }
  // Подписи площадей на плане (PDF): сверяем масштаб и выбираем вариант контура,
  // ближе всего к напечатанному
  var labs = PDF_AREAS[cur] || [], scaleNote = '';
  lastRoomsNote = '';
  // Модель могла положить в подписи и числа таблицы-экспликации: подпись вне здания, чьё число есть
  // в таблице, — это ячейка таблицы, а не комната
  if (labs.table) {
    var envT = null;
    try { envT = buildingEnvelope(getMask()); } catch (e) { envT = null; }
    if (envT) {
      var labsT = labs.filter(function (l) {
        return inEnvelope(envT, l.x, l.y) || !labs.table.rows.some(function (r) { return Math.abs(r.m2 - l.m2) < 0.005; });
      });
      labsT.table = labs.table; labs = labsT;
    }
  }
  // Подписей прочитано меньше, чем контуров крупнее 4 м² (перечёркнутые цифры, сжатая картинка):
  // перечитываем по кускам плана в большем разрешении и запускаем поиск заново
  var bigN = rooms.filter(function (r) { return r.m2 > 4; }).length;
  if (SCAN_READ[cur] && !SCAN_BUSY[cur] && !REREAD[cur] && labs.length < bigN) {
    var fiR = cur, was0 = labs.length;
    REREAD[fiR] = 1;
    hint('Подписей площадей прочитано ' + was0 + ', а контуров крупнее 4 м² — ' + bigN + '. Перечитываю план по частям, в большем разрешении…');
    scanBox(true, 'Перечитываю подписи по частям');
    rereadLabels(fiR).then(function (fresh) {
      scanBox(false);
      var arr = PDF_AREAS[fiR] || (PDF_AREAS[fiR] = []);
      fresh.forEach(function (l) { arr.push(l); });
      if (fresh.length) uniqueLabelNames(arr);
      rereadInfo = { before: was0, after: arr.length };
      if (cur === fiR) autoRooms();
    });
    return;
  }
  if (labs.length) {
    var fixPpm = frameOk ? 0 : scaleFromPrinted(rooms, labs);
    if (fixPpm) {
      var oldPpm = F().pxPerM;
      F().pxPerM = fixPpm; resetScaleCaches();
      try { rooms = enumerateRooms(); } catch (e) { rooms = []; }
      scaleNote = ' Масштаб уточнён по площадям, напечатанным на плане: ' + oldPpm.toFixed(1) + ' → ' + fixPpm.toFixed(1) + ' px/м.';

      if (!rooms.length) { hint('Комнаты распознать не удалось.' + scaleNote); return; }
    }
    rooms = reconcileRooms(rooms, labs);
    rooms = rescueLabelRooms(rooms, labs);
    rooms = mergeTableRooms(rooms, labs);
    printedPairs(rooms, labs).forEach(function (pp) { if (pp.room.rescued) { pp.room.printed = pp.label.m2; if (pp.label.name) pp.room.pname = pp.label.name; } });
  }
  var free = rooms.filter(function (r) {
    var c = centroid(r.pts);
    return !F().zones.some(function (z) { return pip(c, z.pts); });
  });
  // В сопоставлении участвуют ВСЕ комнаты этажа из расчёта, а зоны создаются
  // только тем, у кого есть тип (котельная, санузел, тёплый пол). Раньше
  // соревновались одни «типовые»: кусок плана размером с прихожую доставался
  // котельной, потому что прихожей среди претендентов не было.
  var targets = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && r.area > 0;
  });
  // Таблица-экспликация на листе, а марок на плане не нашлось — строки таблицы работают как
  // комнаты расчёта (сверка по площадям): названия и площади всё равно из таблицы
  var tbl = labs.table || null;
  if (!targets.length && tbl && !labs.some(function (l) { return l.fromTable; })) {
    targets = tbl.rows.map(function (r) { return { name: r.name, area: r.m2, id: null, fromTable: true }; });
  }
  var cellSkipped = 0;
  if (!targets.length && labs.length >= 2) {
    free = free.filter(function (c) {
      if (!isCell(c, labs)) return true;
      cellSkipped++;
      return false;
    });
  }
  pushUndo('zones');
  var made = 0, missed = [], cnt = {}, boiler = hasBoilerZone() || cur !== 0;   // на 2 этаже котельную не заводим
  if (targets.length) {
    // Сопоставление по всему этажу: одна зона или пара соседних (разбитая дверью
    // или мебелью комната). Пару склеиваем выпуклой оболочкой, только если её
    // площадь сходится с экспликацией в пределах 15 %; иначе берём одну, ближе всего.
    var mm = matchAreasFloor(free.map(function (c) { return { m2: c.m2 }; }),
      targets.map(function (t) { return { area: t.area }; }));
    var tU = {}, cU = {};
    mm.forEach(function (x) {
      var t = targets[x.t], src = null, printed = null;
      if (x.idx.length === 2) {
        var hull = convexHull(free[x.idx[0]].pts.concat(free[x.idx[1]].pts));
        if (hull.length >= 3 && Math.abs(area(hull) - t.area) / t.area <= 0.15) {
          src = hull;
        } else {
          var k0 = Math.abs(free[x.idx[0]].m2 - t.area) <= Math.abs(free[x.idx[1]].m2 - t.area) ? x.idx[0] : x.idx[1];
          x.idx = [k0];

      if (!src) { src = free[x.idx[0]].pts; printed = free[x.idx[0]].printed; }
      tU[x.t] = 1; x.idx.forEach(function (k) { cU[k] = 1; });
      var pts = fitZonePts(src, F().pxPerM || 100, printed);
      // Раскладка: у комнаты без своего типа — контур «Помещение», чтобы
      // клик по ней включал тёплый пол, а не искал стены заново

      }

        // доме она одна — по ней собирается компоновка.
        if (kind === 'boiler' && boiler) return;
        if (kind === 'boiler') boiler = true;
        F().zones.push({ type: kind, name: t.name, roomId: (t.id != null ? t.id : null), pts: pts, calc: 1 });
        cnt[kind] = (cnt[kind] || 0) + 1;
        made++;
      });
    });

    // Комната расчёта без контура на плане — называем её с площадью: монтажник
    // отметит её вручную. В тепловом режиме нужны все комнаты, не только типовые.
    targets.forEach(function (t, ti) {
      if (!tU[ti] && (UFH || zoneKindsOfRoom(t).length)) missed.push((t.name || 'комната') + ' ' + t.area.toFixed(1).replace('.', ',') + ' м²');
    });
  }
  // Зоны ТП на все найденные комнаты — только когда расчёта по этажу нет вовсе
  // (как и сказано в описании кнопки). Комнаты в расчёте есть, но типовые не
  // сошлись — заливать весь этаж тёплым полом нельзя.
  // Раскладка: несовпавшие комнаты — контурами «Помещение» без имени. Тёплый
  // пол в них монтажник включит кликом, имя спросим тогда же.
  // Лишние контуры (не совпавшие ни с одной строкой экспликации) не создаём зонами,
  // если на них нет подписи с названием: иначе сумма этажа уходит на 30–160 % вверх.
  // Их число показываем в подписи, чтобы монтажник проверил их руками.
  var skippedExtra = 0;
  if (UFH) {
    free.forEach(function (c) {
      var cc = centroid(c.pts);
      if (F().zones.some(function (z) { return pip(cc, z.pts); })) return;
      if (targets.length && !c.pname) { skippedExtra++; return; }
      F().zones.push({ type: 'room', name: c.pname || '', nameSrc: c.pname ? 'plan' : undefined, pts: fitZonePts(c.pts, F().pxPerM || 100, c.printed), mergedM2: c.mergedM2, mergedNote: c.mergedNote });
      cnt.room = (cnt.room || 0) + 1; made++;
    });
  }
  lastSkipped = skippedExtra + cellSkipped;
  if (!made && !targets.length) {
    free.forEach(function (c) {
      F().zones.push({ type: 'tp', name: c.pname || '', nameSrc: c.pname ? 'plan' : undefined, pts: fitZonePts(c.pts, F().pxPerM || 100, c.printed) });

  // Контур теперь по стенам, а площадь в расчёт — та, что напечатана на плане: у комнаты с
  // лестницей или проёмом они расходятся на несколько процентов. Пока контур не двигали
  // руками (подпись контура — printedSig), берётся напечатанная
  F().zones.forEach(function (z) {
    delete z.printedM2; delete z.printedSig; delete z.planM2;
    if (z.mergedM2 && z.type !== 'cold') {      // объединённая зона: площадь — сумма строк таблицы, пока контур не двигали
      z.planM2 = z.mergedM2; z.printedM2 = z.mergedM2; z.printedSig = JSON.stringify(z.pts);
      return;
    }
    if (!labs.length || z.type === 'cold') return;
    var inside = labs.filter(function (l) { return pip([l.x, l.y], z.pts); });
    if (inside.length !== 1) return;
    z.planM2 = inside[0].m2;                    // для подсветки спорных комнат (zoneDisputed)
    var A = area(z.pts);
    // цифры, прочитанные со снимка, доверия меньше: на размытом фото 8,56 читалось как 8,18
    if (Math.abs(A - inside[0].m2) / inside[0].m2 <= (inside[0].scan ? 0.08 : 0.15)) { z.printedM2 = inside[0].m2; z.printedSig = JSON.stringify(z.pts); }
  });
  var named = F().zones.filter(function (z) { return z.nameSrc === 'plan' && z.name; }).length;
  lastRoomsNote = printedNote(labs) + scaleNote +
    (named ? ' Названия комнат взяты с плана (' + named + ') — проверьте их в списке справа.' : '');
  // Сумма комнат не больше внутренней площади габарита (W×H минус стены)
  var sumWarn = '', inner = 0, sumM2 = 0;
  try { inner = frameInnerM2(); } catch (e) { inner = 0; }
  F().zones.forEach(function (z) { if (z.type !== 'cold') sumM2 += +zoneM2(z) || 0; });
  if (inner > 0 && sumM2 > inner * 1.03) {
    sumWarn = 'Сумма найденных комнат ' + sumM2.toFixed(1).replace('.', ',') + ' м² больше внутренней площади габарита ' +
      inner.toFixed(1).replace('.', ',') + ' м² — часть контуров лишняя (мебель, шкафы) или масштаб неверен.';
  }
  var mergedNotes = F().zones.filter(function (z) { return z.mergedNote; }).map(function (z) {

  });

  if (tbl && tbl.total > 0 && Math.abs(tbl.sum - tbl.total) / tbl.total > 0.01) {
    tblWarn = 'Сумма строк таблицы ' + tbl.sum.toFixed(2).replace('.', ',') + ' м², а итог в ней ' + tbl.total.toFixed(2).replace('.', ',') +

    mergedNotes.join('; ') + '. Нужны отдельные комнаты — обведите их рамкой.</b>' : '') + (scaleDoubt ? ' <b style="color:var(--warn-text)">' + scaleDoubt + '</b>' : '') + (tblWarn ? ' <b style="color:var(--warn-text)">' + tblWarn + '</b>' : '') + (frameWarn ? ' <b style="color:var(--warn-text)">' + frameWarn + '</b>' : '') + frameNote +
    (sumWarn ? ' <b style="color:var(--warn-text)">' + sumWarn + '</b>' : '') + ' ' + (roomsTotalHtml() || '');
  roomsLogBegin({ ppm: F().pxPerM, labs: labs, bigN: bigN, cells: lastSkipped, reread: rereadInfo,

    sumWarn: !!sumWarn, inner: inner });

  var parts = ['tp', 'boiler', 'wc', 'room'].filter(function (k) { return cnt[k]; })
    .map(function (k) { return NAMES[k] + ' ' + cnt[k]; });

    if (!F().coll) ufhAutoColl(F());   // тёплый пол из расчёта — коллектор сразу
    // режим на плане ведёт мастер (wzGo): на шаге «Комнаты» клик не должен включать тёплый пол
    renderZones(); draw();
    hint('<span class=ok>Найдено комнат: ' + (rooms.length - cellSkipped) + '.</span> ' +
      (cnt.tp ? 'Тёплый пол из расчёта уже отмечен: ' + cnt.tp + '.' : '') + lastRoomsNote + floorSumNote() + lastRoomsExtra +
      (lastSkipped ? ' Лишних контуров без подписи пропущено: ' + lastSkipped + ' — проверьте вручную.' : ''));
    return;
  }
  hint('<span class=ok>Найдено комнат: ' + (rooms.length - cellSkipped) + ', создано зон: ' +
    (parts.length ? parts.join(', ') : '0') + '.</span>' +
    (missed.length ? ' Не совпали по площади: ' + missed.join(', ') + ' — обведите вручную.' : '') + floorSumNote() + lastRoomsExtra +
    (lastSkipped ? ' Лишних контуров без подписи пропущено: ' + lastSkipped + ' — проверьте вручную.' : '') +
    (hasBoilerZone() ? '' : ' Котельную отметьте сами (тип зоны «Котельная») — ' +
      'без неё проект не выпускается.') +
    ' Лишние зоны удаляйте крестиком, имена правятся в списке.');
}

/**

function roomsSummary() {

}

    scale_src: F().scaleSrc || '', ppm: Math.round((o.ppm || 0) * 10) / 10,
    labels_read: labs.length, labels_scan: labs.some(function (l) { return l.scan; }), contours_big: o.bigN,
    skipped: o.cells, reread_before: o.reread ? o.reread.before : null, reread_after: o.reread ? o.reread.after : null,

    contours_big: L.contours_big, skipped: L.skipped, reread_before: L.reread_before, reread_after: L.reread_after,

var SB_PUB_KEY = 'sb_publishable_gcMJ-PvJmKavObbnePFGZQ_O-pu5O2p';   // тот же публичный ключ, что в app.js

/** «Итого» по комнатам этажа: сумма площадей зон (напечатанная на плане, если она принята) и с чем её
 *  сверять — с таблицей-экспликацией листа (если прочитана) или с внутренней площадью габарита.
 *  Зелёным при расхождении до 3 %, жёлтым иначе. '' — зон ещё нет. */
function roomsTotalHtml() {
  var f = F(), seen = {}, sum = 0, n = 0;
  (f.zones || []).forEach(function (z) {
    if (z.type === 'cold') return;
    var key = JSON.stringify(z.pts);
    if (seen[key]) return;                     // тёплый пол поверх комнаты — та же площадь
    seen[key] = 1; n++; sum += +zoneM2(z) || 0;
  });
  if (!n) return '';
  var fm = function (x) { return x.toFixed(1).replace('.', ','); };
  var labs = PDF_AREAS[cur] || [], t = labs.table, ref = 0, txt;
  if (t) ref = t.total > 0 ? t.total : t.sum;
  if (ref > 0) {
    var dev = (sum - ref) / ref * 100, ok = Math.abs(dev) <= 3;
    txt = 'Итого: ' + fm(sum) + ' м² (в таблице ' + String(ref.toFixed(2)).replace('.', ',') + ' м², Δ ' + (dev > 0 ? '+' : '') + dev.toFixed(1).replace('.', ',') + ' %)';
    return '<span style="color:' + (ok ? 'var(--ok)' : 'var(--warn-text)') + ';font-weight:600">' + txt + '</span>';
  }
  var inner = 0;
  try { inner = frameInnerM2(); } catch (e) { inner = 0; }
  txt = 'Итого: ' + fm(sum) + ' м²' + (inner > 0 ? ' (внутри габарита ' + fm(inner) + ' м²)' : '');
  return '<span style="color:' + (inner > 0 && sum > inner * 1.03 ? 'var(--warn-text)' : 'var(--ok)') + ';font-weight:600">' + txt + '</span>';
}

/** Кнопка «Под окна»: расставить радиаторы по найденным окнам */
function autoRads() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб: кнопкой «Подобрать масштаб» или «Масштаб».'); return; }
  var wins = floorWindows();
  if (!wins.length) {
    hint('Окна распознать не удалось (нечёткий план?) — расставьте радиаторы кликами.');
    if (mode !== 'rad') setMode('rad');
    return;
  }
  pushUndo('zones');
  var added = 0, ppmI = F().pxPerM;
  wins.forEach(function (w) {
    var busy = (F().rads || []).some(function (r) {
      return Math.hypot(r.x - w.x, r.y - w.y) < 0.7 * ppmI;
    });
    if (busy) return;
    if (UFH && !ufhWantsRad(w)) return;          // комната только с тёплым полом
    F().rads.push({ x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), ang: w.ang });
    added++;
  });

  hint('<span class=ok>Найдено окон: ' + wins.length + ', поставлено радиаторов: ' + added +
    '.</span> Лишние уберите кликом по значку, недостающие добавьте кликом.');
  if (mode !== 'rad') setMode('rad');
}

/**
 * Размерные числа страницы PDF, пересчитанные в пиксели подложки.
 *
 * Держим в памяти по этажу: в разметку это не идёт (масштаб из них считается
 * один раз), а этажи только добавляются, поэтому индекс не разъезжается.
 */
var PDF_DIMS = {};

/** Умножение матриц PDF (как pdfjsLib.Util.transform, но без зависимости). */
function mulT(a, b) {
  return [a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
          a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
          a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];
}

/** Текстовый слой страницы → [{ s, x, y }] в пикселях отрисованной подложки. */
function textItemsPx(tc, vp) {
  var out = [];
  (tc.items || []).forEach(function (it) {
    var str = String(it.str == null ? '' : it.str).trim();
    if (!str || !it.transform) return;
    var m = mulT(vp.transform, it.transform);
    out.push({ s: str, x: m[4], y: m[5], w: (it.width || 0) * vp.scale, h: (it.height || 0) * vp.scale });
  });
  return out;
}

/**
 * Подписи площадей на плане («19,16 м²») из текстового слоя PDF.
 *
 * Проектировщик печатает площадь каждой комнаты — это самая точная цифра,
 * какая у нас есть: по ней сверяются найденные комнаты и масштаб (03.10.2026,
 * на плане заказчика найденные площади расходились с подписанными на 13–30 %).
 * Подпись бывает одним куском «19,16 м²» или двумя — число и «м²» рядом.
 * Число без единицы не берём: размерные цепочки тоже полны десятичных дробей.
 * Возвращает [{ m2, x, y }] — центр подписи в пикселях подложки.
 */
var PDF_AREAS = {};

/**

function readAreaLabelsFromCanvas(c, label, quiet) {
  return new Promise(function (resolve) {
    var finished = false;

    var why = '', t0 = Date.now();

      finished = true; clearTimeout(tm); if (!quiet) scanBox(false);
      v = v || [];
      v.sec = Math.round((Date.now() - t0) / 1000);
      if (!v.why && why && v.rawDims === undefined) v.why = why;   // ответ разобран — прежняя ошибка первой модели не в счёт
      resolve(v);
    };
    var tm = setTimeout(function () { why = 'нет ответа за 70 с'; console.warn('[plan_editor] подписи площадей: не дождались ответа'); finish([]); }, 70000);
    try {
      if (!quiet) scanBox(true, label);
      var k = Math.min(1, 1600 / Math.max(c.width, c.height));
      var t = document.createElement('canvas');
      t.width = Math.round(c.width * k); t.height = Math.round(c.height * k);
      var g = t.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, t.width, t.height); g.drawImage(c, 0, 0, t.width, t.height);
      var b64 = t.toDataURL('image/jpeg', 0.85).split(',')[1];
      var models = ['gemini-3.5-flash', 'gemini-flash-latest'], mi = 0, netTry = 0;
      var tryNext = function () {
        fetch(AREA_READ_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'recognize', model: models[mi], systemInstruction: AREA_READ_PROMPT,
            messages: [{ role: 'user', parts: [{ inline_data: { mime_type: 'image/jpeg', data: b64 } },
              { text: 'Найди подписи площадей помещений на этом плане.' }] }]
          })
        }).then(function (r) { return r.json(); }).then(function (resp) {
          if (resp && resp.error) why = 'сервис вернул ошибку: ' + String(resp.error.message || resp.error).slice(0, 100);
          if (resp && resp.error && ++mi < models.length) { tryNext(); return; }
          finish(resp && !resp.error ? parseAreaReply(resp, c.width, c.height) : []);
        })['catch'](function (e) {
          console.warn('[plan_editor] подписи площадей:', e && e.message);

          if (++mi < models.length) { tryNext(); return; }
          // Обрыв связи обычно разовый: оба запроса идут через один прокси и падают вместе —
          // повторяем круг с паузой, пока не вышли 70 с общего ожидания

        });
