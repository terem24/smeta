      drawSnake(z, stepMm, k, Math.max(1, Math.min(2.4, 0.022 * (f.pxPerM || 100) * k)));
      var wk = cur + '|' + i + '|' + z.pts.length;
      if (!noLayWarned[wk]) {
        noLayWarned[wk] = 1;                       // в данные зоны не пишем: они сохраняются
        console.warn('[plan_editor] зона без раскладки:', area(z.pts).toFixed(1) + ' м²',
          'точек', z.pts.length, JSON.stringify(z.pts));
      }
    }
    var c = centroid(z.pts);
    var nm = (z.name || TYPES[z.type][0]) + ' · ' + area(z.pts).toFixed(1) + ' м²' +
      ' · ' + z.pts.length + ' угл.' +
      (lp && lp.length > 1 ? ' · ' + lp.length + ' петли' : '');
    cx.font = 'bold 13px system-ui'; cx.textAlign = 'center';
    if (lp) {                                   // подпись поверх петель — с подложкой
      var wtx = cx.measureText(nm).width;
      cx.fillStyle = 'rgba(255,255,255,.82)';
      cx.fillRect(c[0] * k - wtx / 2 - 4, c[1] * k - 12, wtx + 8, 17);
    }
    cx.fillStyle = col;
    cx.fillText(nm, c[0] * k, c[1] * k);
  });
  // выбранная зона — пунктирная обводка, чтобы было видно, что удалит Delete
  if (selZ >= 0 && f.zones[selZ]) {
    var sz = f.zones[selZ];
    cx.save(); cx.setLineDash([7, 4]); cx.lineWidth = 3;
    cx.strokeStyle = TYPES[sz.type][1];
    cx.beginPath();
    sz.pts.forEach(function (p, j) { j ? cx.lineTo(p[0] * k, p[1] * k) : cx.moveTo(p[0] * k, p[1] * k); });
    cx.closePath(); cx.stroke(); cx.restore();
  }
  // зона под курсором (или выбранная): узлы контура и крестик удаления
  var actZ = hoverZ >= 0 ? hoverZ : selZ;
  if (actZ >= 0 && f.zones[actZ]) {
    var hz = f.zones[actZ], hc = TYPES[hz.type][1];
    cx.lineWidth = 3; cx.strokeStyle = hc;
    cx.beginPath();
    hz.pts.forEach(function (p, j) { j ? cx.lineTo(p[0] * k, p[1] * k) : cx.moveTo(p[0] * k, p[1] * k); });
    cx.closePath(); cx.stroke();
    hz.pts.forEach(function (p, j) {
      cx.fillStyle = (j === hoverV) ? hc : '#fff';
      cx.strokeStyle = hc; cx.lineWidth = 2;
      cx.fillRect(p[0] * k - 4, p[1] * k - 4, 8, 8);
      cx.strokeRect(p[0] * k - 4, p[1] * k - 4, 8, 8);
    });
    // Середина стороны — только у той, к которой поднесён курсор: показывать
    // кружки на всех сторонах сразу значит удвоить число значков, и зона
    // выглядит как контур из двух десятков точек.
    var me = (dragZ && dragZ.ei >= 0) ? dragZ.ei : hoverE;
    if (me >= 0 && hz.pts[me]) {
      var mp = edgeMid(hz.pts, me);
      cx.beginPath(); cx.arc(mp[0] * k, mp[1] * k, 6, 0, 6.2832);
      cx.fillStyle = hc; cx.fill();
      cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
    }
    if (dragZ) {
      var tip = dragZ.free ? 'без привязки (Shift)' : 'привязка к стене · Shift — свободно';
      cx.font = 'bold 12px system-ui'; cx.textAlign = 'left';
      var tw = cx.measureText(tip).width;
      var tp = dragZ.last;
      cx.fillStyle = 'rgba(255,255,255,.85)';
      cx.fillRect(tp[0] * k + 8, tp[1] * k - 20, tw + 8, 16);
      cx.fillStyle = dragZ.free ? '#b35900' : '#059669';
      cx.fillText(tip, tp[0] * k + 12, tp[1] * k - 8);
    }
    var dp = zoneDelPt(actZ);
    cx.beginPath(); cx.arc(dp[0] * k, dp[1] * k, 9, 0, 6.2832);
    cx.fillStyle = '#fff'; cx.fill();
    cx.strokeStyle = '#c92a2a'; cx.lineWidth = 2; cx.stroke();
    cx.strokeStyle = '#c92a2a'; cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(dp[0] * k - 4, dp[1] * k - 4); cx.lineTo(dp[0] * k + 4, dp[1] * k + 4);
    cx.moveTo(dp[0] * k + 4, dp[1] * k - 4); cx.lineTo(dp[0] * k - 4, dp[1] * k + 4);
    cx.stroke();
  }
  // радиаторы — значки вдоль стен
  (f.rads || []).forEach(function (r) {
    cx.save();
    cx.translate(r.x * k, r.y * k);
    cx.rotate((r.ang || 0) * Math.PI / 180);
    var w2 = r.w * k / 2, h2 = Math.max(2.5, 0.07 * (f.pxPerM || 100) * k);
    cx.fillStyle = 'rgba(210,34,34,.28)';
    cx.strokeStyle = '#d22222'; cx.lineWidth = 1.6;
    cx.fillRect(-w2, -h2, w2 * 2, h2 * 2);
    cx.strokeRect(-w2, -h2, w2 * 2, h2 * 2);
    cx.lineWidth = 1;
    for (var sq = -2; sq <= 2; sq++) {
      var xs = sq * w2 / 2.8;
      cx.beginPath(); cx.moveTo(xs, -h2); cx.lineTo(xs, h2); cx.stroke();
    }
    cx.restore();
  });
  // коллектор ТП — гребёнка с отводами
  if (f.coll) {
    var ccx = f.coll.x * k, ccy = f.coll.y * k;
    var cw = Math.max(16, 0.55 * (f.pxPerM || 100) * k), ch = Math.max(6, cw * 0.36);
    cx.fillStyle = '#fff'; cx.strokeStyle = '#b35900'; cx.lineWidth = 2;
    cx.fillRect(ccx - cw / 2, ccy - ch / 2, cw, ch);
    cx.strokeRect(ccx - cw / 2, ccy - ch / 2, cw, ch);
    cx.lineWidth = 1.4;
    for (var so = -1; so <= 1; so++) {
      var sx2 = ccx + so * cw / 3.4;
      cx.beginPath(); cx.moveTo(sx2, ccy - ch / 2 - 5); cx.lineTo(sx2, ccy - ch / 2); cx.stroke();
    }
    cx.fillStyle = '#b35900'; cx.font = 'bold 12px system-ui'; cx.textAlign = 'center';
    cx.fillText('Коллектор ТП', ccx, ccy + ch / 2 + 13);
  }
  // сантехприборы: настоящий габарит и разворот вдоль стены
  (f.fixtures || []).forEach(function (q) {

    var hitF = -1, rr = 0.35 * (fw.pxPerM || 100);
    for (var qi = fw.fixtures.length - 1; qi >= 0; qi--)
      if (Math.hypot(p[0] - fw.fixtures[qi].x, p[1] - fw.fixtures[qi].y) < rr) { hitF = qi; break; }
    if (hitF >= 0) fw.fixtures.splice(hitF, 1);
    else fw.fixtures.push({ x: p[0], y: p[1], t: document.getElementById('wctype').value });
    renderZones(); draw();
  }
});
cv.addEventListener('dblclick', function () {
  if (mode === 'poly' && tmp.length >= 3) { tmp = tmp.slice(0, -1); closePoly(); }
});

// ─── Шаг назад: кнопка и Ctrl+Z ────────────────────────────────────────
function pushUndo(t) {
  var f = F();
  var rec = { t: t, floor: cur, prev: {
    pxPerM: f.pxPerM,
    zones: JSON.parse(JSON.stringify(f.zones)),
    rads: JSON.parse(JSON.stringify(f.rads || [])),
    coll: f.coll ? { x: f.coll.x, y: f.coll.y } : null,
    fixtures: JSON.parse(JSON.stringify(f.fixtures || []))
  } };
  if (t === 'plan') {
    rec.prev.img = f.img; rec.prev.imgFile = f.imgFile || null;
    rec.prev.w = f.w; rec.prev.h = f.h;
  }
  undoStack.push(rec);
  if (undoStack.length > 50) undoStack.shift();
}

function doUndo() {
  // в процессе рисования отменяется последняя точка
  if (mode === 'poly' && tmp.length) { tmp.pop(); draw(); return; }
  if (mode === 'scale' && scalePts.length) { scalePts.pop(); draw(); return; }
  var rec = undoStack.pop();
  if (!rec) { hint('Отменять больше нечего.'); return; }
  if (rec.t === 'floorAdd') {
    if (DATA.floors.length > 1) {
      DATA.floors.pop();
      if (cur >= DATA.floors.length) cur = DATA.floors.length - 1;
    }
  } else {
    cur = Math.min(rec.floor, DATA.floors.length - 1);
    var f = DATA.floors[cur];
    if (rec.t === 'plan') {
      f.img = rec.prev.img; f.imgFile = rec.prev.imgFile || null;
      f.w = rec.prev.w; f.h = rec.prev.h;
      delete imgCache[cur]; delete maskCache[cur]; delete imgFailed[cur];
    }
    f.pxPerM = rec.prev.pxPerM;
    f.zones = rec.prev.zones;
    f.rads = rec.prev.rads || [];
    f.coll = rec.prev.coll || null;
    f.fixtures = rec.prev.fixtures || [];
  }
  renderTabs(); draw(); renderZones();
}

document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyZ' || String(e.key).toLowerCase() === 'z')) {
    e.preventDefault(); doUndo(); return;
  }
  if (e.key === 'Enter' && mode === 'poly' && tmp.length >= 3) { closePoly(); return; }
  // Delete — убрать зону, на которую наведён курсор: то же, что крестик,
  // только с клавиатуры. В поле ввода имени клавиша работает как обычно.
  if ((e.key === 'Delete' || e.key === 'Del') && selZ >= 0 && !dragZ) {
    var t = e.target && e.target.tagName;
    if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'SELECT') {
      e.preventDefault();
      pushUndo('zones');
      F().zones.splice(selZ, 1);
      selZ = -1; hoverZ = hoverV = hoverE = -1;
      renderZones(); draw();
      return;
    }
  }
  if (e.key === 'Escape') { tmp = []; scalePts = []; polyCur = null; draw(); }
});

/**
 * Упрощение контура комнаты до нескольких углов.
 *
 * Распознавание даёт контур по пикселям: два-три десятка точек, тянуть за
 * сторону такой контур невозможно. Комнаты почти всегда прямоугольные или
 * Г-образные, поэтому стороны выпрямляем по осям, короткие (меньше 0.35 м)
 * убираем, а дальше прореживаем, пока не останется 4–8 углов.
 */
function simplifyZone(pts, ppm) {
  if (!pts || pts.length < 5) return pts;   // прямоугольник упрощать нечего
  ppm = ppm || 100;
  var out = dpSimp(pts.slice(), Math.max(2, 0.06 * ppm));
  // стороны почти по осям — выпрямляем
  var ax = function (P) {
    for (var i = 0; i < P.length; i++) {
      var a = P[i], b = P[(i + 1) % P.length];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      if (Math.abs(dx) < 1e-6 || Math.abs(dy) < 1e-6) continue;
      if (Math.abs(dy) < Math.abs(dx) * 0.28) { var my = (a[1] + b[1]) / 2; a[1] = my; b[1] = my; }
      else if (Math.abs(dx) < Math.abs(dy) * 0.28) { var mx = (a[0] + b[0]) / 2; a[0] = mx; b[0] = mx; }
    }
    return P;
  };
  var drop = function (P, minLen) {                 // короткие стороны — схлопнуть
    var res = [], i;
    for (i = 0; i < P.length; i++) {
      var a = P[i], b = P[(i + 1) % P.length];
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < minLen && P.length - res.length > 4) {
        res.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]); i++;   // пара точек в одну
      } else res.push(a);
    }
    return res;
  };
  var col = function (P) {                          // выкинуть точки на прямой
    var res = [], i;
    for (i = 0; i < P.length; i++) {
      var a = P[(i + P.length - 1) % P.length], b = P[i], c = P[(i + 1) % P.length];
      var cr = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      var L = Math.hypot(c[0] - a[0], c[1] - a[1]) || 1;
      if (Math.abs(cr) / L > 0.15 * ppm || res.length < 3) res.push(b);
    }
    return res.length >= 4 ? res : P;
  };
  out = col(drop(ax(out), 0.6 * ppm));
  // Из распознавания оставляем только четырёх- и шестиугольники: сложнее
  // фигуру монтажник дочертит руками по точкам, зато за любую сторону
  // готовой зоны можно потянуть. Лишние углы убираем по одному — тот,
  // без которого площадь меняется меньше всего.
  var target = out.length <= 4 ? 4 : (out.length <= 6 ? out.length : 6);
  if (target === 5) target = 4;
  while (out.length > target) {
    var worst = -1, wd = Infinity;
    for (var i = 0; i < out.length; i++) {
      var a2 = out[(i + out.length - 1) % out.length], b2 = out[i], c2 = out[(i + 1) % out.length];
      var d2 = Math.abs((b2[0] - a2[0]) * (c2[1] - a2[1]) - (b2[1] - a2[1]) * (c2[0] - a2[0])) / 2;
      if (d2 < wd) { wd = d2; worst = i; }
    }
    if (worst < 0) break;
    out.splice(worst, 1);
  }
  // Последний проход — стороны строго по осям, без косых: помещения на
  // планах прямоугольные, а косая сторона у зоны берётся от разметки и
  // мешает и тянуть за сторону, и класть петли.
  var rect = function (P) {
    for (var t2 = 0; t2 < 3; t2++) {
      for (var e2 = 0; e2 < P.length; e2++) {
        var p1 = P[e2], p2 = P[(e2 + 1) % P.length];
        var ddx = p2[0] - p1[0], ddy = p2[1] - p1[1];
        if (Math.abs(ddx) < 1e-6 || Math.abs(ddy) < 1e-6) continue;
        if (Math.abs(ddx) >= Math.abs(ddy)) { var yy = (p1[1] + p2[1]) / 2; p1[1] = yy; p2[1] = yy; }
        else { var xx = (p1[0] + p2[0]) / 2; p1[0] = xx; p2[0] = xx; }
      }
    }
    return P;
  };
  out = col(rect(out));
  // Ступеньки короче 0.9 м — это не форма комнаты, а огрехи распознавания
  // у лестницы и дверных откосов: убираем их и выпрямляем контур ещё раз.
  out = col(rect(drop(out, 0.9 * ppm)));
  while (out.length === 5) {                        // пятиугольник сводим к четырём
    var w5 = -1, wd5 = Infinity;
    for (var i5 = 0; i5 < out.length; i5++) {
      var a5 = out[(i5 + out.length - 1) % out.length], b5 = out[i5], c5 = out[(i5 + 1) % out.length];
      var d5 = Math.abs((b5[0] - a5[0]) * (c5[1] - a5[1]) - (b5[1] - a5[1]) * (c5[0] - a5[0])) / 2;
      if (d5 < wd5) { wd5 = d5; w5 = i5; }
    }
    if (w5 < 0) break;
    out.splice(w5, 1);
    out = col(rect(out));
  }
  // Четырёхугольник с косой стороной сводим к прямоугольнику: попарное
  // выпрямление на четырёх точках может не сойтись, а косых в зоне быть
  // не должно.
  var skew = out.some(function (p3, i3) {
    var q3 = out[(i3 + 1) % out.length];
    return Math.abs(q3[0] - p3[0]) > 1 && Math.abs(q3[1] - p3[1]) > 1;
  });
  if (skew && out.length <= 4) {
    var xs2 = out.map(function (q4) { return q4[0]; });
    var ys2 = out.map(function (q4) { return q4[1]; });
    var X0 = Math.min.apply(null, xs2), X1 = Math.max.apply(null, xs2);
    var Y0 = Math.min.apply(null, ys2), Y1 = Math.max.apply(null, ys2);
    out = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]];
  }
  return out.map(function (q) { return [Math.round(q[0]), Math.round(q[1])]; });
}

function addZone(pts) {
  pts = simplifyZone(pts, F().pxPerM || 100);
  var type = document.getElementById('ztype').value;
  if (type === 'boiler' && F().zones.some(function (z) { return z.type === 'boiler'; })) {
    alert('Котельная на этаже уже отмечена.'); return;
  }
  pushUndo('zones');
  F().zones.push({ type: type, name: '', pts: pts });
  if (type === 'wc' && fixAuto) hint('Впишите имя санузла как в расчёте — приборы расставятся сами.');
  renderZones();
}

function renderZones() {
  var box = document.getElementById('zlist'); box.innerHTML = '';
  F().zones.forEach(function (z, i) {
    var d = document.createElement('div'); d.className = 'zone';
    var sw = document.createElement('span'); sw.className = 'sw';
    sw.style.background = TYPES[z.type][1]; d.appendChild(sw);
    var lb = document.createElement('span'); lb.className = 'zt';
    lb.textContent = TYPES[z.type][0]; d.appendChild(lb);
    var inp = document.createElement('input'); inp.type = 'text';
    inp.placeholder = 'помещение…'; inp.value = z.name;
    if (roomNames.length) inp.setAttribute('list', 'roomNames');
    inp.oninput = function () {
      z.name = inp.value;
      // санузел подписали именем из расчёта — приборы появляются сразу
      if (z.type === 'wc' && fixAuto) { refreshAutoFixtures(); renderZones(); }
      draw();
    };
    d.appendChild(inp);
    var ar = document.createElement('span'); ar.className = 'ar';
    if (z.type === 'wc') {
      var card = wcCardOf(z.name);
      var cnt = 0;
      if (card) Object.keys(card.fixtures || {}).forEach(function (k) { cnt += +card.fixtures[k] || 0; });
      ar.textContent = card ? (cnt + ' приб.') : 'имя не найдено';
      ar.style.color = card ? 'var(--ok)' : '#EF4444';
      ar.title = card ? 'Приборы взяты из карточки санузла в расчёте'
        : 'Впишите имя санузла так же, как в расчёте — приборы подставятся сами';
    } else {
      ar.textContent = area(z.pts).toFixed(1) + ' м²';
    }
    d.appendChild(ar);
    var del = document.createElement('span'); del.className = 'del'; del.textContent = '✕';
    del.onclick = function () { pushUndo('zones'); F().zones.splice(i, 1); renderZones(); draw(); };
    d.appendChild(del);
    box.appendChild(d);
  });
  var rc = (F().rads || []).length;
  if (!F().zones.length && !rc) {
    var em = document.createElement('div'); em.className = 'pempty';
    em.textContent = F().pxPerM ? 'Зоны ещё не обведены' : 'Задайте масштаб, затем обведите зоны';
    box.appendChild(em);
  }
  if (rc) {
    var rd = document.createElement('div'); rd.className = 'zone';
    rd.innerHTML = '<span class="sw" style="background:#d22222"></span>' +
      '<span class="zt">Радиаторы</span>' +
      '<span style="flex:1 1 auto"></span>' +
      '<span class="ar">' + rc + ' шт.</span>';
    rd.title = 'Убрать радиатор — клик по значку в режиме «Радиаторы»';
    box.appendChild(rd);
  }

  // ── Сводка этажа и статусы: секция «параметр — значение» ─────────────────
  var sum = document.getElementById('zsummary');
  if (!sum) return;
  sum.innerHTML = '';
  var tpS = 0, tpN = 0;
  F().zones.forEach(function (z) { if (z.type === 'tp') { tpS += area(z.pts); tpN++; } });
  var hasB = DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });

  // Строка палитры: слева имя, справа значение. cls — good/warn, когда значение
  // само по себе статус, а не число.
  var rows = function (title, list) {
    var g = document.createElement('div'); g.className = 'pgroup';
    var h = '<div class="phead">' + title + '</div><div class="pbody">';
    list.forEach(function (r) {
      h += '<div class="prow"><span class="k">' + r[0] + '</span>' +
        '<span class="v' + (r[2] ? ' ' + r[2] : '') + '">' + r[1] + '</span></div>';
    });
    g.innerHTML = h + '</div>';
    sum.appendChild(g);
    return g;
  };

  var fl = [
    ['Тёплый пол', tpN ? tpN + ' зон · ' + tpS.toFixed(1) + ' м²' : '—'],
    ['Радиаторы', rc ? rc + ' шт.' : '—'],
    ['Котельная', hasB ? 'отмечена' : 'не отмечена', hasB ? 'good' : 'warn']
  ];
  if (tpN) fl.push(['Коллектор ТП', F().coll ? 'отмечен' : 'не отмечен',
    F().coll ? 'good' : 'warn']);

  // санузлы и приборы: видно, что уйдёт на листы водоснабжения и канализации
  var fxs = F().fixtures || [];
  var wcz = F().zones.filter(function (z) { return z.type === 'wc'; });
  if (wcz.length || fxs.length || calcWc.length) {
    var noName = wcz.filter(function (z) { return !wcCardOf(z.name); }).length;
    var risers = fxs.filter(function (q) { return q.t === 'riser'; }).length;
    fl.push(['Санузлы', wcz.length ? wcz.length + ' зон' : '—']);
    if (noName) fl.push(['· без имени из расчёта', noName, 'warn']);
    fl.push(['Приборы санузлов', fxs.filter(function (q) { return q.t !== 'riser'; }).length || '—']);
    fl.push(['Стояк канализации', risers ? risers + ' шт.' : 'нет', risers ? 'good' : 'warn']);
  }
  rows('Этаж ' + (cur + 1), fl);

  // ── Комнаты расчёта: клик подписывает первую безымянную зону ─────────────
  if (calcRooms.length) {
    var g = document.createElement('div'); g.className = 'pgroup';
    var h = '<div class="phead">Комнаты из расчёта <span class="note">клик — подписать зону</span></div>';
    calcRooms.forEach(function (r, idx) {
      var mt = [];
      mt.push('эт.' + r.floor);
      if (r.sys.indexOf('tp') >= 0) mt.push('ТП');
      if (r.sys.indexOf('rad') >= 0) mt.push('рад.');
      if (r.win) mt.push(r.win + ' ок.');
      h += '<div class="croom" data-i="' + idx + '">' +
        '<span class="nm">' + r.name + '</span>' +
        '<span class="mt">' + (r.area ? r.area + ' м² · ' : '') + mt.join(' · ') + '</span></div>';
    });
    g.innerHTML = h;
    g.onclick = function (e) {
      var t = e.target && e.target.closest ? e.target.closest('.croom') : null;
      if (!t) return;
      var r = calcRooms[+t.getAttribute('data-i')];
      var z = null;
      for (var zi = 0; zi < F().zones.length; zi++)
        if (!F().zones[zi].name) { z = F().zones[zi]; break; }
      if (!z) { hint('Все зоны этажа уже подписаны — исправьте имя прямо в списке зон.'); return; }
      z.name = r.name;
      renderZones(); draw();
    };
    sum.appendChild(g);
  }
}

/**
 * Разметка в хранилище браузера. Подложку сюда не кладём — только имя её
 * файла на сервере: всё остальное вместе взятое весит единицы килобайт.
 *
 * keepImages — аварийный режим: сервер не ответил, и картинку приходится
 * держать в браузере по-старому, иначе работа монтажника пропадёт.
 */
function writeLocal(keepImages) {
  // Копируем этаж целиком и убираем только картинку: у этажа есть поля,
  // которые считаются на лету (leads — маршруты подводок к коллектору), и
  // перечислять их поимённо значило бы терять всё, что добавят потом.
  // forCalc — номер расчёта, которому принадлежат планы; его ставит
  // калькулятор перед открытием редактора. Проносим его через сохранение,
  // иначе соседняя вкладка калькулятора приняла бы эти планы за свои.
  var out = { key: planKey(), forCalc: DATA.forCalc || null, floors: DATA.floors.map(function (f) {
    var o = {};
    for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) o[k] = f[k];
    o.imgFile = f.imgFile || null;
    delete o.img;
    if (keepImages && f.img && f.img.indexOf('data:') === 0) o.img = f.img;
    return o;
  }) };
  try {
    localStorage.setItem('floor_plans_v1', JSON.stringify(out));
    return true;
  } catch (e) {
    return false;
  }
}

function saveAll() {
  refreshAutoFixtures();   // приборы санузлов из расчёта — на случай правок зон
  computeLeads();   // маршруты подводок к коллектору — свежие на момент сохранения
  computeVk();      // и трассы водоснабжения с канализацией
  computeGeom();    // и контуры стен с окнами — по ним рисуются листы планов

  // Сначала кладём работу в браузер — вместе с подложками, чтобы ничего не
  // пропало, если отправка не удастся. Раньше «Сохранить» ждало сервера, и
  // на слабой связи монтажник минутами смотрел в «Отправляю подложки…», не
  // зная, идёт ли что-нибудь вообще. Теперь сохранение мгновенное, а
  // подложки уезжают следом, фоном, со счётчиком в полоске шагов.
  var full = writeLocal(true);
  if (!full && !writeLocal()) {
    alert('Не удалось сохранить разметку в браузере. Освободите место и попробуйте снова.');
    return Promise.resolve();
  }
  hint('<span class=ok>Сохранено.</span> ' + (full
    ? 'Откройте «Проект» — планы этажей и тёплый пол попадут в комплект.'
    : 'Разметка на месте, а подложки в браузер не поместились — не закрывайте вкладку, ' +
      'пока они не уедут на сервер.'));
  uploadPending();
  return Promise.resolve();
}

// Состояние фоновой отправки: {run, done, total, pct} или {err} после отказа.
// Показывается в полоске шагов, интерфейс её не ждёт.
var upState = null;

/** Отправляет на сервер подложки тех этажей, которых там ещё нет. */
function uploadPending() {
  if (upState && upState.run) return;   // уже едет — второй раз не начинаем
  var pending = [];
  DATA.floors.forEach(function (f, i) {
    if (f.img && f.img.indexOf('data:') === 0) pending.push(i);
  });
  if (!pending.length) { upState = null; updateGuide(); return; }

  upState = { run: true, done: 0, total: pending.length, pct: 0 };
  updateGuide();

  // Последовательно, а не разом: этаж — это сотни килобайт, и параллельные
  // загрузки с телефона на объекте только мешают друг другу.
  pending.reduce(function (chain, fi) {
    return chain.then(function () {
      return putFloorImage(fi, function (p) {
        upState.pct = p; updateGuide();
      }).then(function (name) {
        if (!name) return;
        DATA.floors[fi].imgFile = name;
        DATA.floors[fi].img = planUrl(name);
        upState.done++; upState.pct = 0;
        writeLocal(true);   // этот этаж уже на сервере — из браузера уходит
        updateGuide();
      });
    });
  }, Promise.resolve()).then(function () {
    upState = null;
    updateGuide();
  }).catch(function (e) {
    console.error('[plan_editor] загрузка подложки:', e);
    // Связи нет, сессия истекла или скрипт хранилища не отвечает. Работа не
    // потеряна: разметка вместе с подложками уже лежит в браузере.
    writeLocal(true);
    upState = { run: false, err: (e && e.message) ? e.message : 'нет связи' };
    updateGuide();
  });
}

/** Какому шагу принадлежит текущий режим — чтобы не звать «дальше» в него же. */
function modeStepId() {
  if (mode === 'scale') return 'scale';
  if (mode === 'rad') return 'rad';
  if (mode === 'coll') return 'coll';
  if (mode === 'wc') return 'wc';
  if (mode === 'room' || mode === 'rect' || mode === 'poly') {
    var t = document.getElementById('ztype').value;
    return t === 'boiler' ? 'boiler' : t === 'wc' ? 'wc' : 'tp';
  }
  return null;
}

function guideStep() {
  var f = F();
  var L = stepDefs(), act = activeStep(L);

  // Хвост «Дальше» — то, чего подсказке и не хватало: в режиме рисования она
  // рассказывала только про сам режим, и следующий шаг терялся. Кнопка
  // переводит на него сразу, вместе с нужным типом зоны.
  var nx = '';
  if (act && act.id !== modeStepId()) {

      'padding:5px 12px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);' +
      'color:#fff;cursor:pointer">Перейти</button>';

    nx = '<br><br><b>Все шаги пройдены</b> — жмите зелёную «Сохранить».';
  }

  if (mode === 'scale') return { t: 'cv', s: 'Масштаб', d: 'scale', txt: (scalePts.length

  if (mode === 'room') return { t: 'cv', s: 'Зона: ' + TYPES[document.getElementById('ztype').value][0], d: 'room',

  if (mode === 'rad') {
    var rc = (f.rads || []).length;
    return { t: 'cv', s: 'Радиаторы',
      txt: 'Кнопка «Под окна» вверху найдёт окна и расставит радиаторы автоматически. Вручную: клик рядом с окном сам отцентрирует радиатор по окну; у глухой стены — прилипнет к стене. Клик по значку — удалить. Радиаторы свободно сочетаются с зоной тёплого пола.' +
        (rc ? '<br><b>Поставлено: ' + rc + ' шт.</b>' : '') + nx };
  }
  if (mode === 'coll') return { t: 'cv', s: 'Коллектор ТП',
    txt: 'Кликните точку, где будет стоять коллектор тёплого пола (обычно в котельной). От него при сохранении построятся подводки ко всем петлям. Клик по значку — убрать, клик в другом месте — передвинуть.' + nx };
  if (mode === 'wc') return { t: 'cv', s: 'Сантехприборы вручную',
    txt: 'Выберите прибор в списке и кликните, где он стоит; клик по значку — убрать. Обычно это не нужно: в режиме «Приборы: из расчёта» они расставляются сами по карточкам санузлов — достаточно обвести зону «Санузел» и подписать её. Вручную удобно добавить то, чего нет в расчёте.' + nx };
  if (mode === 'rect') return { t: 'cv', s: 'Зона: ' + TYPES[document.getElementById('ztype').value][0], d: 'rect',
    txt: 'Зажмите кнопку мыши и растяните рамку по комнате — края прилипнут к стенам. Тип зоны меняется в списке сверху.' + zn + nx };
  if (mode === 'poly') return { t: 'cv', s: 'Зона-контур: ' + TYPES[document.getElementById('ztype').value][0], d: 'poly',
    txt: (tmp.length ? 'Углов: ' + tmp.length + '. ' : '') +
      'Кликайте углы комнаты по порядку. Замкнуть — клик по первой точке, двойной клик или Enter. Shift — линии строго под 90°, Ctrl+Z — убрать точку.' +
      (tmp.length ? '' : zn + nx) };

  // Вне режимов рисования подсказка — это сам текущий шаг.

var guidePos = null;     // позиция после ручного перетаскивания (пока страница открыта)
var guideHtml = '';      // кэш содержимого: не перерисовывать без изменений, иначе
                         // SMIL-анимации демок перезапускались бы на каждом движении мыши

function placeGuide() {
  if (!guidePos) return;
  var w = guideEl.offsetWidth || 320, h = guideEl.offsetHeight || 120;
  var L = Math.min(Math.max(4, guidePos.left), window.innerWidth - w - 4);
  var T = Math.min(Math.max(4, guidePos.top), window.innerHeight - Math.min(h, 160) - 4);
  guideEl.style.right = ''; guideEl.style.bottom = '';
  guideEl.style.left = Math.round(L) + 'px';
  guideEl.style.top = Math.round(T) + 'px';
}

// ─── Шаги: полоска под кнопками и показ только нужных инструментов ───────
//
// Подсказка-пузырь показывает ровно один шаг и в режимах рисования вообще
// подменяется описанием режима — из-за этого всё, что идёт после
// радиаторов (коллектор, котельная, санузлы), проходило мимо: увидеть это
// можно было только внизу правой колонки, куда не доскроллить. А два
// десятка кнопок в шапке одинаково доступны на любом шаге, и найти среди
// них ту, которой отмечают котельную, без подсказки нельзя — её там и нет,
// котельная отмечается типом зоны.
//
// Полоска решает обе задачи: все шаги видны сразу, текущий подсвечен, а в
// шапке остаются только его инструменты. Кнопка «Все инструменты»
// возвращает прежний вид целиком.

// кнопки, которые прячутся по шагам; остальные (этажи, отмена, сохранение,
// проект, подсказки) видны всегда
var STEP_BTNS = ['b_upload', 'b_scale', 'b_autorooms', 'b_room', 'b_rect', 'b_poly',
                 'b_rad', 'b_autorad', 'b_coll', 'b_fixauto', 'b_wc', 'wctype', 'ztype'];

var curStep = null;      // шаг, выбранный вручную (null — ведёт первый незакрытый)
var allTools = false;    // «Все инструменты»: показывать шапку целиком
try { allTools = localStorage.getItem('plan_editor_alltools') === '1'; } catch (e) {}

function toggleAllTools() {
  allTools = !allTools;
  try { localStorage.setItem('plan_editor_alltools', allTools ? '1' : '0'); } catch (e) {}
  updateGuide();
}

/** Список шагов текущего этажа: что сделано, чем делается, что подсказать. */
function stepDefs() {
  var f = F();
  var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
  var hasBoiler = DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
  var wcNamed = f.zones.filter(function (z) {
    return z.type === 'wc' && wcCardOf(z.name);
  }).length;
  var noName = f.zones.filter(function (z) { return z.type === 'tp' && !z.name; }).length;

  var L = [];
  L.push({ id: 'plan', t: 'План', ok: !!f.img, btn: ['b_upload'] });
  L.push({ id: 'scale', t: 'Масштаб', ok: !!f.pxPerM, btn: ['b_autoscale', 'b_scale'], mode: 'scale' });
  L.push({ id: 'tp', t: 'Тёплый пол', ok: hasTp, type: 'tp', mode: 'room',
           btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype'] });
  L.push({ id: 'rad', t: 'Радиаторы', ok: (f.rads || []).length > 0, mode: 'rad',
           btn: ['b_autorad', 'b_rad'] });
  if (hasTp) L.push({ id: 'coll', t: 'Коллектор ТП', ok: !!f.coll, mode: 'coll',
                      btn: ['b_coll'] });
  L.push({ id: 'boiler', t: 'Котельная', ok: hasBoiler, type: 'boiler', mode: 'room',
           btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype'] });
  if (calcWc.length) L.push({ id: 'wc', t: 'Санузлы', ok: wcNamed > 0, type: 'wc', mode: 'room',
                              btn: ['b_autorooms', 'b_room', 'b_rect', 'b_poly', 'ztype', 'b_fixauto', 'b_wc', 'wctype'] });
  // Подписывают зоны в правой колонке, кнопки шапки для этого не нужны — но
  // пустая шапка выглядит поломкой, да и имена обычно правят заодно с
  // самими зонами. Поэтому инструменты зон тут остаются.
  if (noName) L.push({ id: 'names', t: 'Имена комнат: ' + noName, ok: false,
                       btn: ['b_room', 'b_rect', 'b_poly', 'ztype'] });
  return L;
}

/** Текущий шаг: выбранный вручную, пока не закрыт, иначе первый незакрытый. */
function activeStep(L) {
  var i;
  if (curStep) {
    for (i = 0; i < L.length; i++) if (L[i].id === curStep && !L[i].ok) return L[i];
    curStep = null;   // закрыт или исчез — дальше ведём сами
  }
  for (i = 0; i < L.length; i++) if (!L[i].ok) return L[i];
  return null;        // всё закрыто, остаётся «Сохранить»
}

/** Переход на шаг по клику в полоске: включает нужный режим и тип зоны. */
function goStep(id) {
  curStep = id;
  var L = stepDefs(), s = null;
  for (var i = 0; i < L.length; i++) if (L[i].id === id) s = L[i];
  if (!s) { updateGuide(); return; }
  if (s.id === 'plan') {
    var inp = document.querySelector('#b_upload input');
    if (inp) inp.click();
    return;
  }
  if (s.id === 'names') {
    var zl = document.getElementById('zlist');
    if (zl) zl.scrollIntoView({ block: 'end', behavior: 'smooth' });
    updateGuide();
    return;
  }
  // Тип зоны ставим до режима: котельную и санузел отмечают не кнопкой, а
  // типом — именно этого в шапке и не находили.
  if (s.type) {
    var sel = document.getElementById('ztype');
    if (sel) sel.value = s.type;
  }
  if (s.mode && mode !== s.mode) setMode(s.mode);   // setMode сам зовёт updateGuide
  else { draw(); updateGuide(); }
}

/** Кнопки шапки: на шаге видны только его инструменты. */
function applyBar(step) {
  var need = allTools || !step ? null : (step.btn || []);
  STEP_BTNS.forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    var show = !need || need.indexOf(id) >= 0;
    // Не прячем: кнопка остаётся на месте и нажимается, но гаснет. Раньше
    // ненужные на шаге кнопки уходили в display:none, и вся шапка на каждом
    // шаге перестраивалась — соседние кнопки уезжали из-под курсора.
    el.style.display = '';
    el.classList.toggle('dim', !show);
  });
  var b = document.getElementById('b_alltools');
  if (b) {
    b.textContent = allTools ? 'Только текущий шаг' : 'Все инструменты';
    b.className = allTools ? '' : 'ghost';
  }
}

var stepsHtml = '';   // кэш разметки: полоска обновляется на каждый draw

function renderSteps() {
  var box = document.getElementById('steps');
  if (!box) return;
  var L = stepDefs();
  var act = activeStep(L);
  applyBar(act);

  var h = '<span class="lbl">Шаги:</span>';
  L.forEach(function (s) {
    var cls = s.ok ? 'st done' : (act && act.id === s.id ? 'st next' : 'st');
    h += '<span class="' + cls + '"' +
      (s.ok ? '' : ' onclick="goStep(\'' + s.id + '\')"') + '>' +
      (s.ok ? '✓ ' : '') + s.t + '</span>';
  });
  if (!act) h += '<span class="st save" onclick="saveAll()">Сохранить</span>';

  // Фоновая отправка подложек — тут же, чтобы не гадать, ушли они или нет.
  if (upState && upState.run) {
    h += '<span class="up">Подложка ' + (upState.done + 1) + ' из ' + upState.total +
      ' — ' + Math.round(upState.pct * 100) + '%</span>';
  } else if (upState && upState.err) {
    h += '<span class="up bad">Подложки не ушли на сервер: ' + upState.err +
      ' · <b onclick="uploadPending()">повторить</b></span>';
  }
  if (h !== stepsHtml) { box.innerHTML = h; stepsHtml = h; }
}

function updateGuide() {
  renderSteps();
  var pulsed = document.querySelectorAll('.pulse');
  for (var i = 0; i < pulsed.length; i++) pulsed[i].classList.remove('pulse');
  if (!guideEl) {
    guideEl = document.createElement('div');
    guideEl.className = 'guide'; guideEl.style.display = 'none';
    guideEl.title = 'Подсказку можно перетащить, если она мешает';
    document.body.appendChild(guideEl);
    guideEl.addEventListener('pointerdown', function (e) {
      if (e.target.classList && e.target.classList.contains('close')) return;
      if (e.target.tagName === 'BUTTON') return;   // кнопка в подсказке — не перетаскивание
      var r0 = guideEl.getBoundingClientRect();
      var dx = e.clientX - r0.left, dy = e.clientY - r0.top;
      try { guideEl.setPointerCapture(e.pointerId); } catch (err) {}
      function mv(ev) { guidePos = { left: ev.clientX - dx, top: ev.clientY - dy }; placeGuide(); }
      function up() {
        guideEl.removeEventListener('pointermove', mv);
        guideEl.removeEventListener('pointerup', up);
        guideEl.removeEventListener('pointercancel', up);
      }
      guideEl.addEventListener('pointermove', mv);
      guideEl.addEventListener('pointerup', up);
      guideEl.addEventListener('pointercancel', up);
      e.preventDefault();
    });
  }
  var g = guideStep();
  // Подсказки выключены — окно не показываем, но кнопку следующего шага
  // подсвечиваем: иначе непонятно, куда нажимать дальше.
  if (!hintsOn) {
    guideEl.style.display = 'none';
    var off = g && g.t !== 'cv' ? document.getElementById(g.t) : null;
    if (off) off.classList.add('pulse');
    return;
  }
  if (!g) { guideEl.style.display = 'none'; return; }
  var html = '<span class="close" onclick="toggleHints()">✕ скрыть подсказки</span>' +
    '<div class="step"><span class="grip">⠿</span>' + g.s + '</div>' + g.txt +
    (g.d ? '<div class="demo">' + DEMOS[g.d] + '</div>' : '');
  if (html !== guideHtml) { guideEl.innerHTML = html; guideHtml = html; }
  guideEl.style.display = 'block';
  var w = Math.min(324, window.innerWidth - 24);
  guideEl.style.maxWidth = w + 'px';
  var tgt = g.t === 'cv' ? cv : document.getElementById(g.t);
  if (tgt && g.t !== 'cv') tgt.classList.add('pulse');
  if (guidePos) { placeGuide(); return; }
  // По умолчанию — правый нижний угол: там подсказка не закрывает ни план,
  // ни панель зон. Перетащить её по-прежнему можно куда угодно.
  guideEl.style.left = ''; guideEl.style.top = '';
  guideEl.style.right = '16px';
  guideEl.style.bottom = '16px';
}

// после каждого изменения состояния подсказка обновляется сама
var _draw = draw;
draw = function () { _draw(); updateGuide(); };
var _rz = renderZones;
renderZones = function () { savedOnce = false; _rz(); updateGuide(); };
var _sm = setMode;
setMode = function (m) { _sm(m); updateGuide(); };
var _sv = saveAll;
// Отметка «сохранено» ставится сразу: разметка ложится в браузер тут же, а
// подложки уезжают фоном и показывают себя в полоске шагов.
saveAll = function () {
  var r = _sv();
  try { savedOnce = !!localStorage.getItem('floor_plans_v1'); } catch (e) { savedOnce = false; }
  updateGuide();
  return r;
};
window.addEventListener('resize', updateGuide);
window.addEventListener('scroll', updateGuide, true);
document.getElementById('b_hints').textContent = '💡 Подсказки: ' + (hintsOn ? 'вкл' : 'выкл');

syncFixAutoBtn();
refreshAutoFixtures();   // приборы санузлов из расчёта — сразу при открытии
// Кнопка тёмного плана в разметке нажата; если в прошлый раз её выключили,
// снимаем нажатие до первой отрисовки.
(function () {
  var b = document.getElementById('b_darkplan');
  if (b) b.className = darkPlan ? 'on' : 'ghost';
})();
renderTabs(); draw(); renderZones();
</script>
