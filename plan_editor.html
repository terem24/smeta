// ═══ Шаг мастера «Санузлы и вода» ═══════════════════════════════════════
// Необязательный шаг перед «Готово» (24.10.2026, по просьбе монтажников): санузлы
// с приборами, точка ввода воды и коллекторы ХВС / ГВС / рециркуляции. Магистраль от
// коллекторов до каждого санузла считается по плану — и уходит в смету как «Трасса, м»
// вместо оценки на глаз, а значит, в трубы и в гидравлику воды.
//
// Данные лежат в floors[0].water — нулевой этаж и так переезжает в смету вместе с планом,
// отдельной передачи не нужно. Санузлы — те же карточки, что в расчёте (state.waterZones):
// при открытии окна берутся оттуда, при «Готово» калькулятор забирает правки обратно
// (app.syncWaterFromPlan).
//   cards: [{ id (= id зоны расчёта, null у нового), name, fixtures, fl, zone (имя комнаты плана), nz, m }]
//   inp / coll: { fl, x, y, auto } — ввод воды и коллекторы; auto — по умолчанию в котельной.

var WW_FIX = [['toilet', 'Унитаз'], ['basin', 'Раковина'], ['bath', 'Ванна'], ['shower', 'Душ'], ['wash', 'Стиральная'], ['dish', 'Посудомойка']];
var WW_BRANCH_MAX = 3;    // м: отвод DN50 длиннее — ориентир практики, а не норма; на листе помечается «!»
var WW_RISE = 3;          // вертикальный участок на этаж, м (так же считает смета: стояк этажа 3 м)
var wwSynced = false;
function wwEsc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/** Комнаты плана, к которым можно привязать санузел (без «без обогрева» и копий контура тёплого пола) */
function wwRooms() {
  var out = [], seen = {};
  DATA.floors.forEach(function (f, fi) {
    (f.zones || []).forEach(function (z) {
      var nm = String(z.name || '').trim();
      if (!nm || z.type === 'cold' || !z.pts || z.pts.length < 3 || isTpCopy(f, z)) return;
      var k = fi + '|' + nm.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ fl: fi, name: nm });
    });
  });
  return out;
}
function wwRoomZone(fl, name) {
  var f = DATA.floors[fl], k = String(name || '').trim().toLowerCase(), r = null;
  if (!f) return null;
  (f.zones || []).forEach(function (z) {
    if (!r && z.pts && z.pts.length > 2 && String(z.name || '').trim().toLowerCase() === k && z.type !== 'tp') r = z;
  });
  if (!r) (f.zones || []).forEach(function (z) {
    if (!r && z.pts && z.pts.length > 2 && String(z.name || '').trim().toLowerCase() === k) r = z;
  });
  return r;
}

/** Привязка карточек к комнатам плана: по имени, затем по смыслу («С/у», «Ванная») по порядку */
function wwBind(w) {
  var rooms = wwRooms(), used = {}, key = function (r) { return r.fl + '|' + r.name.toLowerCase(); };
  w.cards.forEach(function (c) {
    if (c.zone && !wwRoomZone(c.fl, c.zone)) { c.zone = null; c.fl = null; }
    if (c.zone) used[c.fl + '|' + c.zone.toLowerCase()] = 1;
  });
  w.cards.forEach(function (c) {
    if (c.zone || c.nz) return;
    var k = String(c.name || '').trim().toLowerCase();
    rooms.forEach(function (r) {
      if (!c.zone && !used[key(r)] && r.name.toLowerCase() === k) { c.zone = r.name; c.fl = r.fl; used[key(r)] = 1; }
    });
  });
  w.cards.forEach(function (c) {
    if (c.zone || c.nz) return;
    rooms.forEach(function (r) {
      var okName = c.kind === 'kitchen' ? /кухн/i.test(r.name) : c.kind === 'laundry' ? /постир|прачеч|хоз/i.test(r.name) : (WC_NAME_RE.test(r.name) && !/кухн/i.test(r.name));
      if (!c.zone && !used[key(r)] && okName) { c.zone = r.name; c.fl = r.fl; used[key(r)] = 1; }
    });
  });
}

/** Набор приборов по умолчанию по типу карточки */
function wwKindFixtures(kind, first) {
  if (kind === 'kitchen') return { toilet: 0, basin: 1, bath: 0, shower: 0, wash: 0, dish: 1 };
  if (kind === 'laundry') return { toilet: 0, basin: 0, bath: 0, shower: 0, wash: 1, dish: 0 };
  return wwDefaultFixtures(first);
}
function wwDefaultFixtures(first) {
  return first ? { toilet: 1, basin: 1, bath: 0, shower: 1, wash: 0, dish: 0 } : { toilet: 1, basin: 1, bath: 0, shower: 0, wash: 0, dish: 0 };
}

/** Данные шага; при первом обращении за открытие окна — свежие карточки из расчёта */
function wwInit() {
  var f0 = DATA.floors[0], w = f0.water, st = {};
  if (w && w.cards && wwSynced) return w;
  try { st = JSON.parse(localStorage.getItem('stout_save')) || {}; } catch (e) {}
  var old = w && w.cards ? w.cards : [];
  w = w && w.cards ? w : { visited: false, inp: null, coll: null, trunks: [] };
  w.enable = !!st.water;
  w.recirc = !!st.recirc;
  w.cards = calcWc.map(function (c) {
    var prev = null;
    old.forEach(function (o) { if (c.id != null && o.id === c.id) prev = o; });
    var fx = {};
    for (var k in (c.fixtures || {})) fx[k] = +c.fixtures[k] || 0;
    return { id: c.id, name: c.name, kind: c.kind, fixtures: fx, fl: prev ? prev.fl : null, zone: prev ? prev.zone : null, nz: prev ? !!prev.nz : false, pos: prev ? prev.pos : undefined };
  });
  f0.water = w;
  wwSynced = true;
  // расчёт без санузлов, а на плане они есть — по одному на комнату
  if (!w.cards.some(function (c) { return c.kind !== 'kitchen'; })) {
    wwRooms().forEach(function (r) {
      if (!WC_NAME_RE.test(r.name)) return;
      w.cards.push({ id: null, name: r.name, kind: 'wc', fixtures: wwDefaultFixtures(!w.cards.some(function (c) { return c.kind !== 'kitchen'; })), fl: r.fl, zone: r.name, nz: false });
    });
  }
  // в любом доме есть кухня: нет карточки — добавляем (на плане привязывается по имени «Кухня…»)
  if (!w.cards.some(function (c) { return c.kind === 'kitchen'; })) {
    var kr = null;
    wwRooms().forEach(function (r) { if (!kr && /кухн/i.test(r.name)) kr = r; });
    w.cards.unshift({ id: null, name: kr ? kr.name : 'Кухня', kind: 'kitchen', fixtures: wwKindFixtures('kitchen'), fl: kr ? kr.fl : null, zone: kr ? kr.name : null, nz: false });
  }
  wwBind(w);
  return w;
}

/** Ввод воды и коллекторы: свои или по умолчанию — в котельной */
function wwPoints(w) {
  var bf = -1, bz = null;
  DATA.floors.forEach(function (f, i) {
    (f.zones || []).forEach(function (z) {
      if (bf < 0 && z.type === 'boiler' && z.pts && z.pts.length > 2) { bf = i; bz = z; }
    });
  });
  var inp = w.inp || null, coll = w.coll || null;
  if (!inp && bz) { var c = centroid(bz.pts); inp = { fl: bf, x: Math.round(c[0]), y: Math.round(c[1]), auto: true }; }
  if (!coll && inp) {
    coll = { fl: inp.fl, x: inp.x, y: inp.y, auto: true };
    var fb = DATA.floors[inp.fl], dx = 0.5 * (fb.pxPerM || 100);
    if (bz && pip([inp.x + dx, inp.y], bz.pts)) coll.x = Math.round(inp.x + dx);
  }
  return { inp: inp, coll: coll };
}

/**
 * Прямоугольная трасса «под 90°» между двумя точками: трубы в стяжке и по стенам идут вдоль осей и стены
 * пересекают через гильзы, а не обходят дом через двери. Из двух вариантов угла берётся тот, где меньше стен.
 */
function wwManhattan(m, a, b) {
  if (Math.abs(a[0] - b[0]) < 3 || Math.abs(a[1] - b[1]) < 3) return [[a[0], a[1]], [b[0], b[1]]];
  var walls = function (pts) {
    if (!m) return 0;
    var n = 0;
    for (var i = 1; i < pts.length; i++) {
      var L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]), st = Math.max(1, Math.round(L / 4));
      for (var k = 0; k <= st; k++) {
        var x = Math.round((pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k / st) * m.k), y = Math.round((pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k / st) * m.k);
        if (x >= 0 && y >= 0 && x < m.w && y < m.h && m.bar[y * m.w + x]) n++;
      }
    }
    return n;
  };
  var p1 = [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]]], p2 = [[a[0], a[1]], [a[0], b[1]], [b[0], b[1]]];
  return walls(p1) <= walls(p2) ? p1 : p2;
}

/**
 * Трассы от src к точкам: по правилам радиаторов (двери, под 90°); если плана комнат или пути нет — прямоугольная трасса.
 * Двери берутся из геометрии этажа (f.geom): считаем её при первом обращении.
 */
var geomDone = {};   // этаж + масштаб → геометрия посчитана в этой сессии (в данных этажа свежесть не храним)
function wwRoutes(f, fi, src, dests, m) {
  var r = null;
  try {
    if (window.projectPlans && projectPlans.routePipes) {
      // двери — свежие: кэш геометрии мог остаться от прошлого сохранения (до правки комнат и масштаба)
      var gk = fi + ':' + f.pxPerM;
      if (!f.geom || !geomDone[gk]) { try { f.geom = exportGeom(fi) || f.geom; geomDone[gk] = 1; } catch (e) {} }
      var wm = null; try { wm = getWallMask(fi); } catch (e2) {}
      r = projectPlans.routePipes(f, src, dests, wm);
    }
  } catch (e) { console.warn('[plan_editor] трассы по комнатам:', e && e.message); }
  return dests.map(function (d, i) { return (r && r[i]) || wwManhattan(m, src, d); });
}

function wwPolyM(pts, ppm) {
  var s = 0;
  for (var i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return s / ppm;
}

/** Ближайшая к точке точка на контурах комнат этажа (наружная стена дома — контур крайних комнат) */
function wwNearestOnZones(f, p) {
  var best = null, bd = 1e18;
  (f.zones || []).forEach(function (z) {
    if (z.type === 'cold' || !z.pts || z.pts.length < 3) return;
    for (var i = 0; i < z.pts.length; i++) {
      var a = z.pts[i], b = z.pts[(i + 1) % z.pts.length];
      var dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
      var t = L2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)) : 0;
      var q = [a[0] + t * dx, a[1] + t * dy], d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < bd) { bd = d; best = q; }
    }
  });
  return best;
}

/** Выпуск канализации: свой или по умолчанию — ближайшая к стояку наружная стена нулевого этажа */
function wwOutlet(w) {
  if (w.out) return w.out;
  var f0 = DATA.floors[0];
  if (!f0 || !f0.pxPerM) return null;
  var rs = (f0.fixtures || []).filter(function (q) { return q.t === 'riser'; });
  if (!rs.length) return null;
  var bb = [1e9, 1e9, -1e9, -1e9];
  (f0.zones || []).forEach(function (z) {
    if (z.type === 'cold' || !z.pts) return;
    z.pts.forEach(function (p) { bb = [Math.min(bb[0], p[0]), Math.min(bb[1], p[1]), Math.max(bb[2], p[0]), Math.max(bb[3], p[1])]; });
  });
  if (bb[0] > bb[2]) return null;
  // Выпуск — на той из четырёх наружных сторон, где суммарный лежак от всех стояков короче (точка на стороне — против среднего стояка):
  // не у «первого» стояка, а так, чтобы лежак не тянулся через весь дом
  var mx = 0, my = 0;
  rs.forEach(function (r) { mx += r.x; my += r.y; });
  mx /= rs.length; my /= rs.length;
  var best = null, bd = 1e18;
  [[bb[0], my], [bb[2], my], [mx, bb[1]], [mx, bb[3]]].forEach(function (c) {
    var cost = 0;
    rs.forEach(function (r) { cost += Math.abs(r.x - c[0]) + Math.abs(r.y - c[1]); });
    if (cost < bd) { bd = cost; best = c; }
  });
  var sn = wwNearestOnZones(f0, best) || best;
  return { fl: 0, x: Math.round(sn[0]), y: Math.round(sn[1]), auto: true };
}

// ═══ Самотёк канализации ════════════════════════════════════════════════
// Проверка по одному этажу (без подвала и второго этажа): от прибора до выпуска труба идёт под уклоном, перепад высоты =
// длина × уклон по пути «отвод → стояк → лежак → выпуск». Он должен уместиться между высотой выпуска прибора над полом
// и глубиной, на которой выпуск уходит из дома. Не уместился — самотёк не пойдёт: нужна канализационная насосная станция
// (в прайсе ROMMER — BIOLIFT) или ещё один выпуск, ближе к дальним приборам. Выключатель «Учитывать уклон» — на шаге.
// Цифры (уклон 0,03 у d50 и 0,02 у d110 и лежака, глубина выпуска 0,7 м, высота выпуска раковины и машин 0,4 м) — практика
// проектирования и монтажа, как и в смете; в СП 30.13330 их сверять отдельно.
var SLOPE_B = 0.03, SLOPE_M = 0.02, SLOPE_TIGHT = 0.05, OUT_DEPTH_DEF = 0.7;
var Z_DRAIN = { toilet: 0, bath: 0, shower: 0, basin: 0.4, wash: 0.4, dish: 0.4 };   // м над чистым полом
// Канализационные насосные станции ROMMER BIOLIFT. Характеристики — со страниц моделей и новостей rommer.ru (24.10.2026); паспорта
// (PDF) прочитать не удалось, поэтому значения, которых на страницах нет, помечены null и в подборе не проверяются — «смотрите паспорт».
//   wcIn   — есть вход Ø100 мм под унитаз (S-3 PLUS по странице — 3×40 мм, вход под унитаз не подтверждён: для санузла с унитазом не берём)
//   in40   — входы Ø40 мм под раковину, душ, ванну, машины (с учётом опционального)
//   flow   — предельный входной поток / производительность, л/мин (у S-3, R-4, R-4S это «входной поток», у PLUS и PRO — «производительность»)
//   horiz  — предельная длина сброса по горизонтали, м; lift — напор по вертикали, м.
//   Правило перевода (задано владельцем 24.10.2026): 10 м по горизонтали = 1 м по вертикали. Там, где на странице модели указан только
//   сброс по горизонтали (S-3, R-4, R-4S), напор по вертикали = горизонталь / 10 (liftCalc). У S-3 PLUS и R-4 PRO это правило сходится с
//   указанным производителем напором (75 м ↔ 7,5 м, 90 м ↔ 9 м).
//   Расхождение в источниках: S-3 PLUS — по горизонтали 75 м на странице товара и 90 м в новости; берём меньшее.
var SEWER_PUMPS = [
  { id: 'RPD-0010-100250', name: 'BIOLIFT S-3', price: 14961, kw: 0.25, wcIn: true, in40: 3, flow: 28, horiz: 70, lift: 7, liftCalc: true, src: 'страница модели' },
  { id: 'RPD-0010-100400', name: 'BIOLIFT R-4', price: 18958, kw: 0.4, wcIn: true, in40: 3, flow: 32, horiz: 70, lift: 7, liftCalc: true, src: 'страница модели' },
  { id: 'RPD-0010-100450', name: 'BIOLIFT R-4S', price: 21520, kw: 0.45, wcIn: true, in40: 3, flow: 32, horiz: 75, lift: 7.5, liftCalc: true, src: 'страница модели' },
  { id: 'RPD-0010-100500', name: 'BIOLIFT S-3 PLUS', price: 21520, kw: 0.45, wcIn: false, in40: 3, flow: 115, horiz: 75, lift: 7.5, src: 'карточка и новость' },
  { id: 'RPD-0010-100800', name: 'BIOLIFT R-4 PRO', price: 39162, kw: 0.8, wcIn: true, in40: 3, flow: 170, horiz: 90, lift: 9, src: 'новость' }
];
var PUMP_LIFT_NEED = 1;      // м: подъём напорной трубы от станции у пола до горизонтального участка (практика)
var PUMP_H_PER_V = 10;       // м горизонтали на 1 м вертикали

function wsPumpById(id) { var r = null; SEWER_PUMPS.forEach(function (p) { if (p.id === id) r = p; }); return r; }

/** Нагрузка помещения на станцию: унитазы, прочие приборы и пиковый поток (сумма расходов приборов при открытом кране, л/мин) */
function wsRoomLoad(room) {
  var w = DATA.floors[0].water, key = String(room || '').trim().toLowerCase(), f = {};
  (w.cards || []).forEach(function (c) { if (String(c.name || '').trim().toLowerCase() === key) f = c.fixtures || {}; });
  var wh = window.waterHydro, flow = 0, other = 0, wc = +f.toilet || 0;
  ['toilet', 'basin', 'bath', 'shower', 'wash', 'dish', 'bidet'].forEach(function (t) {
    var n = +f[t] || 0, F0 = wh && wh.FIXTURES[t];
    if (t !== 'toilet') other += n;
    flow += n * (F0 ? (F0.qMax || F0.q) * 1000 / 60 : 6);
  });
  return { wc: wc, other: other, flow: Math.round(flow * 10) / 10, fixtures: f };
}

/** Подходит ли модель помещению: число станций и список причин. dist — путь сброса до выпуска, м (отвод + лежак) */
function wsPumpFit(model, load, dist) {
  var why = [], ok = true;
  if (load.wc > 0 && !model.wcIn) { ok = false; why.push('входа Ø100 мм под унитаз нет'); }
  // на одну станцию — не больше одного унитаза (один вход Ø100) и не больше in40 приборов на Ø40; больше — несколько станций
  var qty = Math.max(1, load.wc, Math.ceil(load.other / model.in40));
  if (qty > 1) why.push('приборов больше, чем входов: нужно ' + qty + ' станции');
  var perFlow = load.flow / qty;
  if (perFlow > model.flow) { ok = false; why.push('поток ' + Math.round(perFlow) + ' л/мин выше предела ' + model.flow); }
  // Напор: подъём 1 м от станции к трубе + длина сброса, пересчитанная в вертикаль (10 м = 1 м); не больше напора модели по вертикали
  var eq = PUMP_LIFT_NEED + dist / PUMP_H_PER_V;
  if (eq > model.lift) { ok = false; why.push('нужен напор ' + (Math.round(eq * 10) / 10).toString().replace('.', ',') + ' м (подъём ' + PUMP_LIFT_NEED + ' м + сброс ' + Math.round(dist) + ' м ÷ ' + PUMP_H_PER_V + '), у модели ' + model.lift + ' м'); }
  var unk = [];
  return { ok: ok, qty: qty, why: why, unknown: unk, eq: eq, flow: Math.round(perFlow * 10) / 10 };
}

/** Автоподбор: самая дешёвая из подходящих моделей (при равной цене — с большим запасом по потоку) */
function wsPumpPick(room, dist) {
  var load = wsRoomLoad(room), best = null, list = [];
  SEWER_PUMPS.forEach(function (m) {
    var fit = wsPumpFit(m, load, dist);
    list.push({ m: m, fit: fit, cost: m.price * fit.qty });
    if (fit.ok && (!best || m.price * fit.qty < best.cost)) best = list[list.length - 1];
  });
  return { load: load, list: list, best: best };
}

/** Путь сброса помещения до выпуска: самый длинный путь его приборов (отвод + лежак от стояка) */
function wsRoomDist(room) {
  var w = DATA.floors[0].water, key = String(room || '').trim().toLowerCase(), d = 0;
  if (w && w.slope) w.slope.rows.forEach(function (r) { if (String(r.room || '').trim().toLowerCase() === key) d = Math.max(d, r.Lb + r.Lm); });
  return d;
}

/** Пояснение, почему выбрана эта станция: вход, поток, длина сброса */
function wsPumpNote(row) {
  var m = wsPumpById(row.id), load = wsRoomLoad(row.room), dist = wsRoomDist(row.room);
  if (!m) return '';
  var fit = wsPumpFit(m, load, dist);
  return 'Помещение «' + row.room + '»: ' + (load.wc ? load.wc + ' унитаз, ' : '') + load.other + ' ' + (load.other === 1 ? 'прибор' : 'приборов') + ' на входах Ø40, пиковый поток ' + load.flow + ' л/мин (предел ' + m.flow + '), ' +
    'напор: подъём ' + PUMP_LIFT_NEED + ' м + сброс ' + Math.round(dist) + ' м ÷ ' + PUMP_H_PER_V + ' = ' + (Math.round(fit.eq * 10) / 10).toString().replace('.', ',') + ' м из ' + m.lift + ' м' + (m.liftCalc ? ' (напор пересчитан: ' + m.horiz + ' м по горизонтали ÷ ' + PUMP_H_PER_V + ')' : '') +
    (fit.why.length ? '; ' + fit.why.join('; ') : '') + '.';
}

function wsSetPumpModel(i, id) {
  var w = wwInit();
  if (!w.pumps || !w.pumps[i]) return;
  w.pumps[i].id = id; w.pumps[i].auto = false; w.touched = true; wwRefresh();
}
function wsDelPump(i) { var w = wwInit(); (w.pumps || []).splice(i, 1); w.touched = true; slopeAsked = ''; wwRefresh(); }

/** Поставить станции помещениям, у которых не хватает перепада: каждому — подобранная модель */
function wsApplyPumps(rooms) {
  var w = wwInit(); w.pumps = w.pumps || [];
  rooms.forEach(function (rm) {
    if (w.pumps.some(function (p) { return p.room === rm; })) return;
    var pk = wsPumpPick(rm, wsRoomDist(rm));
    var m = pk.best ? pk.best.m : SEWER_PUMPS[SEWER_PUMPS.length - 1];
    w.pumps.push({ room: rm, id: m.id, auto: true, noFit: !pk.best });
  });
  w.touched = true; slopeAsked = '';
  wwRefresh();
}


/** Лежак DN110 от стояков до выпусков: у каждого выпуска своё дерево, каждый следующий стояк врезается в ближайшую точку проложенного */
function computeSewerMain() {
  var f0 = DATA.floors[0], w = f0.water;
  f0.smain = [];
  if (!w) return;
  w.sewer = null; w.slope = null;
  var out0 = wwOutlet(w);
  if (!out0 || !f0.pxPerM) return;
  // выпуски: основной (свой или у ближайшей стороны) и дополнительные, поставленные на плане; к дополнительному подключены перечисленные помещения
  var outs = [{ fl: 0, x: out0.x, y: out0.y, auto: !!out0.auto, cards: null }];
  (w.outs || []).forEach(function (o) { outs.push({ fl: 0, x: o.x, y: o.y, auto: false, cards: (o.cards || []).map(function (c) { return String(c).trim().toLowerCase(); }) }); });
  var m = getMask(0), raw = [];
  DATA.floors.forEach(function (f, fi) {
    (f.fixtures || []).forEach(function (q) { if (q.t === 'riser') raw.push({ x: q.x, y: q.y, fl: fi, z: q.z }); });
  });
  var uniq = [], riserM = 0;
  raw.forEach(function (r) {
    if (r.fl) riserM += WW_RISE * r.fl;
    if (!uniq.some(function (u) { return Math.hypot(u.x - r.x, u.y - r.y) < 0.6 * f0.pxPerM; })) uniq.push(r);
  });
  var outOf = function (r) {
    var z = String(r.z || '').trim().toLowerCase();
    for (var i = 1; i < outs.length; i++) if (outs[i].cards.indexOf(z) >= 0) return i;
    return 0;
  };
  uniq.forEach(function (r) { r.out = outOf(r); });
  var total = 0;
  outs.forEach(function (out, oi) {
    var group = uniq.filter(function (r) { return r.out === oi; });
    group.sort(function (a, b) { return Math.hypot(a.x - out.x, a.y - out.y) - Math.hypot(b.x - out.x, b.y - out.y); });
    var nodes = [[out.x, out.y, 0]];                               // третье число — путь от точки до выпуска по дереву, м
    group.forEach(function (r) {
      var tgt = nodes[0], bd = 1e18;
      nodes.forEach(function (n) { var d = Math.hypot(n[0] - r.x, n[1] - r.y); if (d < bd) { bd = d; tgt = n; } });
      // Лежак идёт под полом самотёком и стены пересекает напрямую: прямоугольная трасса (под 90°), а не обход через двери
      var pts = wwManhattan(m, [r.x, r.y], tgt);
      var L = wwPolyM(pts, f0.pxPerM);
      f0.smain.push({ pts: pts, d: 110, m: Math.round(L * 10) / 10, out: oi });
      total += L;
      var acc = tgt[2];
      for (var j = pts.length - 1; j >= 0; j--) {
        if (j < pts.length - 1) acc += Math.hypot(pts[j][0] - pts[j + 1][0], pts[j][1] - pts[j + 1][1]) / f0.pxPerM;
        nodes.push([pts[j][0], pts[j][1], acc]);
      }
      r.Lm = acc;                                                  // путь от стояка до выпуска, м
    });
  });
  // Отвод DN50 длиннее ориентира — стояк стоит далеко от прибора (практика проектирования; цифру по СП 30.13330 сверить)
  var longs = [];
  DATA.floors.forEach(function (f) {
    (f.slines || []).forEach(function (l) {
      var q = (f.fixtures || [])[l.i], L = wwPolyM(l.pts, f.pxPerM || 100);
      if (q && l.d < 110 && L > WW_BRANCH_MAX) longs.push({ name: (q.z ? q.z + ': ' : '') + (FIXT[q.t] || ['прибор'])[0], m: Math.round(L * 10) / 10 });
    });
  });
  w.sewer = { mainM: Math.round(total * 10) / 10, riserM: riserM, longs: longs, out: { fl: 0, x: out0.x, y: out0.y, auto: !!out0.auto },
    outs: outs.slice(1).map(function (o) { return { x: o.x, y: o.y }; }),
    risers: uniq.map(function (r) { return { x: r.x, y: r.y, z: r.z, Lm: r.Lm, out: r.out }; }) };
  computeSlope(w, f0);
}

/** Перепад по каждому прибору этажа: нужно (уклон × длина пути) и есть (высота выпуска прибора + глубина выпуска из дома) */
function computeSlope(w, f0) {
  var S = w.sewer, depth = +w.outDepth > 0 ? +w.outDepth : OUT_DEPTH_DEF;
  var res = { on: !!w.slopeOn, depth: depth, rows: [], fail: 0, tight: 0, worst: null, pumpIds: (w.pumps || []).map(function (p) { return p.id; }) };
  w.slope = res;
  if (!res.on || !S) return;
  var ppm = f0.pxPerM || 100;
  var piped = {};
  (w.pumps || []).forEach(function (p) { piped[String(p.room).trim().toLowerCase()] = 1; });
  (f0.fixtures || []).forEach(function (q, qi) {
    if (q.t === 'riser' || q.t === 'pump') return;
    var sl = null;
    (f0.slines || []).forEach(function (l) { if (l.i === qi) sl = l; });
    if (!sl || !sl.pts || sl.pts.length < 2) return;
    var end = sl.pts[sl.pts.length - 1], rs = null, bd = 0.7 * ppm;
    S.risers.forEach(function (r) { var d = Math.hypot(r.x - end[0], r.y - end[1]); if (d < bd) { bd = d; rs = r; } });
    var Lb = wwPolyM(sl.pts, ppm), Lm = rs && rs.Lm != null ? rs.Lm : 0;
    var needB = (sl.d >= 110 ? SLOPE_M : SLOPE_B) * Lb, needM = SLOPE_M * Lm;
    var zf = Z_DRAIN[q.t] || 0, have = zf + depth, need = needB + needM, margin = have - need;
    var pumped = !!piped[String(q.z || '').trim().toLowerCase()];
    var verdict = pumped ? 'ok' : margin < 0 ? 'fail' : margin < SLOPE_TIGHT ? 'tight' : 'ok';
    var row = { i: qi, t: q.t, room: q.z || '', Lb: Lb, Lm: Lm, needB: needB, needM: needM, need: need, have: have, zf: zf, margin: margin, verdict: verdict, pumped: pumped,
      reqH: need - depth, out: rs ? rs.out : 0 };
    res.rows.push(row);
    if (verdict === 'fail') res.fail++; else if (verdict === 'tight') res.tight++;
    if (!pumped && (!res.worst || margin < res.worst.margin)) res.worst = row;
  });
  // станции: число штук и пояснение подбора — их читает смета
  (w.pumps || []).forEach(function (pp) {
    var m = wsPumpById(pp.id);
    if (!m) return;
    var fit = wsPumpFit(m, wsRoomLoad(pp.room), wsRoomDist(pp.room));
    pp.qty = fit.qty;
    pp.note = wsPumpNote(pp).replace(/^Помещение «[^»]*»: /, '');
  });
}

function wsSlopeRow(i) {
  var w = DATA.floors[0].water, r = null;
  if (w && w.slope) w.slope.rows.forEach(function (x) { if (x.i === i) r = x; });
  return r;
}

/** Строка про самотёк для подсказки по отводу */
function wsSlopeHtml(i) {
  var r = wsSlopeRow(i), cm = function (v) { return Math.round(v * 100); };
  if (!r) return '';
  if (r.pumped) return '<br>Отводится насосной станцией — самотёк не нужен';
  var txt = 'Перепад: нужно ' + cm(r.need) + ' см (отвод ' + String(Math.round(r.Lb * 10) / 10).replace('.', ',') + ' м + лежак ' + String(Math.round(r.Lm * 10) / 10).replace('.', ',') +
    ' м), есть ' + cm(r.have) + ' см';
  if (r.verdict === 'fail') return '<br><span style="color:#ef4444"><b>' + txt + ' — не хватает ' + cm(-r.margin) + ' см: трубу пришлось бы поднять до +' + String(Math.round(r.reqH * 100) / 100).replace('.', ',') + ' м над полом</b></span>';
  if (r.verdict === 'tight') return '<br><span style="color:#d97706">' + txt + ' — запас всего ' + cm(r.margin) + ' см</span>';
  return '<br><span style="color:#16a34a">' + txt + ' — запас ' + cm(r.margin) + ' см</span>';
}

function wsSetSlope(v) { var w = wwInit(); w.slopeOn = !!v; w.touched = true; slopeAsked = ''; wwRefresh(); }
function wsSetDepth(v) {
  var w = wwInit(), n = parseFloat(String(v).replace(',', '.'));
  w.outDepth = n > 0 ? Math.min(3, n) : OUT_DEPTH_DEF; w.touched = true; slopeAsked = ''; wwRefresh();
}
function wsDelOut(i) { var w = wwInit(); w.outs.splice(i, 1); w.touched = true; slopeAsked = ''; wwRefresh(); }

var slopeAsked = '';        // подпись последнего провала, о котором уже спрашивали (не мучаем окном при каждом движении)
var pendingOut = null;      // комнаты, которые подключаются к выпуску, который сейчас ставят на плане
function wsAskCheck() {
  var w = DATA.floors[0].water, sl = w && w.slope;
  if (!sl || !sl.on || !sl.fail || wwLayer() !== 'sewer' || mode === 'wout2') return;
  var sig = sl.rows.filter(function (r) { return r.verdict === 'fail'; }).map(function (r) { return r.i + ':' + Math.round(r.margin * 100); }).join(',');
  if (sig === slopeAsked) return;
  slopeAsked = sig;
  wsAsk();
}

/** Окно «самотёком не пройдёт»: насосная станция BioLift или ещё один выпуск */
function wsAsk() {
  var w = DATA.floors[0].water, sl = w && w.slope;
  if (!sl) return;
  var bad = {}, cm = function (v) { return Math.round(v * 100); }, num = function (v) { return String(Math.round(v * 10) / 10).replace('.', ','); };
  sl.rows.forEach(function (r) {
    if (r.verdict !== 'fail') return;
    var k = String(r.room).trim() || 'без имени';
    if (!bad[k] || r.margin < bad[k].margin) bad[k] = r;
  });
  var rooms = Object.keys(bad);
  if (!rooms.length) return;
  var old = document.getElementById('ws_ask'); if (old) old.remove();
  var div = document.createElement('div'); div.className = 'namepick'; div.id = 'ws_ask';
  var h = '<div class="box"><h3>Самотёком канализация не пройдёт</h3><div class="sub">Выпуск из дома на глубине ' + num(sl.depth).replace('.', ',') + ' м. Не хватает перепада высоты:</div>';
  rooms.forEach(function (k) {
    var r = bad[k];
    h += '<div class="sub" style="color:#ef4444;margin:2px 0"><b>' + wwEsc(k) + '</b> — не хватает ' + cm(-r.margin) + ' см (лежак ' + num(r.Lm) + ' м, отвод ' + num(r.Lb) + ' м; трубу пришлось бы поднять до +' + String(Math.round(r.reqH * 100) / 100).replace('.', ',') + ' м над полом)</div>';
  });

  div.innerHTML = h;

/** Второй шаг: какие санузлы и кухни подключить к новому выпуску */

/**
 * Длина трубы воды до каждой точки — по трассам computeVk (от коллекторов, лучом на точку). Для этажа без
 * коллекторов — плюс подача: от коллекторов до стояка этажа по плану и 3 м вертикали на этаж.
 * В карточку: m — средняя длина луча (идёт в «Трасса, м» сметы), pts — длины по приборам для таблицы листа.
 */
function computeWaterTrunks() {
  DATA.floors.forEach(function (f) { f.wtr = []; f.wfeed = 0; });
  var w = DATA.floors[0].water;
  if (!w || !w.cards) return;
  w.trunks = [];
  var P = wwPoints(w);
  if (!P.coll) return;
  var cf = DATA.floors[P.coll.fl];
  if (!cf || !cf.pxPerM) return;
  var m = getMask(P.coll.fl);
  w.inM = null;
  if (P.inp && P.inp.fl === P.coll.fl && !P.inp.auto) {
    w.inM = Math.round(wwPolyM(wwRoutes(cf, P.coll.fl, [P.inp.x, P.inp.y], [[P.coll.x, P.coll.y]], m)[0], cf.pxPerM) * 10) / 10;
  }
  var feed = {};
  DATA.floors.forEach(function (f, fi) {
    if (fi === P.coll.fl || !f.wsrc) return;
    // Стояк воды идёт в шахте, где внизу уже стоит стояк санузла: берём ближайший к стояку этажа стояк этажа коллекторов
    // (нет такого — стояк прямо под точкой). До него — трасса по плану от коллекторов, плюс смещение, если стояки не друг над другом.
    var shaft = [f.wsrc.x, f.wsrc.y], sd = 1e18;
    (cf.fixtures || []).forEach(function (q) {
      if (q.t !== 'riser') return;
      var dd = Math.hypot(q.x - f.wsrc.x, q.y - f.wsrc.y);
      if (dd < sd) { sd = dd; shaft = [q.x, q.y]; }
    });
    feed[fi] = wwPolyM(wwRoutes(cf, P.coll.fl, [P.coll.x, P.coll.y], [shaft], m)[0], cf.pxPerM) +
      (sd < 1e17 ? sd / cf.pxPerM : 0) + WW_RISE * Math.abs(fi - P.coll.fl);
    f.wfeed = Math.round(feed[fi] * 10) / 10;
  });
  w.cards.forEach(function (c, i) {
    c.m = null; c.pts = [];
    var key = String(c.name || '').trim().toLowerCase();
    DATA.floors.forEach(function (f, fi) {
      (f.wlines || []).forEach(function (l) {
        var q = (f.fixtures || [])[l.i];
        if (!q || q.t === 'riser' || String(q.z || '').trim().toLowerCase() !== key) return;
        c.pts.push({ t: q.t, m: Math.round((wwPolyM(l.pts, f.pxPerM) + (feed[fi] || 0)) * 10) / 10 });
      });
    });
    if (c.pts.length) {
      var sum = 0;
      c.pts.forEach(function (q) { sum += q.m; });
      c.m = Math.round(sum / c.pts.length * 10) / 10;
    } else {
      // приборов на плане нет — до центра комнаты, как оценка
      var z = c.zone ? wwRoomZone(c.fl, c.zone) : null;
      if (!z) return;
      var t = centroid(z.pts), pts = wwRoutes(cf, P.coll.fl, [P.coll.x, P.coll.y], [t], m)[0];
      c.m = Math.round((wwPolyM(pts, cf.pxPerM) + WW_RISE * Math.abs(c.fl - P.coll.fl)) * 10) / 10;
      cf.wtr.push({ i: i, name: c.name, pts: pts, m: c.m, fl: c.fl });
    }
    w.trunks.push({ i: i, id: c.id, name: c.name, m: c.m });
  });
}

/** Сколько выходов нужно коллекторам — по тем же правилам, что у сметы (раздел «Внутреннее водоснабжение») */
function wwColls(w) {
  var cold = 0, hot = 0, rec = 0;
  w.cards.forEach(function (c) {
    var f = c.fixtures || {}, th = Math.min(+f.toiletHot || 0, +f.toilet || 0);
    var mix = (f.basin || 0) + (f.shower || 0) + (f.bath || 0) + (f.bidet || 0) + th;
    cold += (f.toilet || 0) - th + (f.wash || 0) + (f.dish || 0) + mix;
    if (w.recirc) { if (mix > 0) { hot++; rec++; } } else hot += mix;
  });
  return { cold: cold, hot: hot, rec: rec };
}

/** Трассы воды и канализации — вслед за мышью, пока тянут прибор или коллектор (не чаще, чем успевает считаться) */
var wwLiveAt = 0, wwLiveCost = 0;
function wwLive() {
  if (!wwLayer()) return;
  var t0 = Date.now();
  if (t0 < wwLiveAt) return;
  try { computeVk(); computeSewerMain(); computeWaterTrunks(); } catch (e) { console.warn('[plan_editor] трассы на лету:', e && e.message); }
  wwLiveCost = Date.now() - t0;
  wwLiveAt = Date.now() + Math.max(60, wwLiveCost * 2);
}

function wwRefresh() {
  renderZones();
  refreshAutoFixtures();
  computeVk();
  computeSewerMain();
  computeWaterTrunks();
  stepsHtml = '';
  renderSteps();
  draw();
  wsAskCheck();
}
function wwFix(i, k, d) {
  var w = wwInit(), c = w.cards[i];
  if (!c) return;
  c.fixtures[k] = Math.max(0, (+c.fixtures[k] || 0) + d);
  if (k === 'toilet' && (c.fixtures.toiletHot || 0) > c.fixtures.toilet) c.fixtures.toiletHot = c.fixtures.toilet;
  w.touched = true; wwRefresh();
}
function wwName(i, v) {
  var w = wwInit(), c = w.cards[i];
  v = String(v || '').trim();
  if (!c || !v) return;
  c.name = v; w.touched = true; wwBind(w); wwRefresh();
}
function wwZone(i, v) {
  var w = wwInit(), c = w.cards[i];
  if (!c) return;
  if (!v) { c.zone = null; c.fl = null; c.nz = true; }
  else { var p = v.split('|'); c.fl = +p[0]; c.zone = p.slice(1).join('|'); c.nz = false; }
  w.touched = true; wwRefresh();
}
function wwAdd(kind) {
  var w = wwInit();

  var nWc = w.cards.filter(function (q) { return q.kind === 'wc'; }).length;
  var c = { id: null, name: kind === 'kitchen' ? 'Кухня' : kind === 'laundry' ? 'Постирочная' : 'Санузел ' + (nWc + 1),
    kind: kind, fixtures: wwKindFixtures(kind, !nWc), fl: null, zone: null, nz: false };
  w.cards.push(c);
  wwBind(w);
  if (c.zone) c.name = c.zone;
  w.enable = true;
  w.touched = true; wwRefresh();
}
function wwDel(i) {
  var w = wwInit();
  w.cards.splice(i, 1);
  w.touched = true; wwRefresh();
}
function wwRecirc(v) { var w = wwInit(); w.recirc = !!v; w.touched = true; wwRefresh(); }
function wwEnable(v) { var w = wwInit(); w.enable = !!v; w.touched = true; wwRefresh(); }
function wwPlace(kind) { wwInit(); setMode(kind); }
function wwReset() { var w = wwInit(); w.inp = null; w.coll = null; w.out = null; w.touched = true; wwRefresh(); }

/** Слой, который сейчас показывает мастер: 'water' (санузлы и вода), 'sewer' (канализация) или null */
function wwLayer() {
  var ww = DATA.floors[0].water;
  if (!UFH || !ww || !ww.visited) return null;
  var c = wzCur(wzSteps());
  return (c === 'water' || c === 'sewer') ? c : null;
}

var hoverLn = null, pinLn = null;   // линия воды или канализации под курсором / выбранная щелчком: { kind: 'w' | 's' | 'm', i }

/** Линия слоя под точкой плана: вода — трассы к приборам; канализация — отводы и лежак */
function lineAt(p) {
  var layer = wwLayer(), f = F();
  if (!layer || !f.pxPerM) return null;
  var tol = 7 / cs(), best = null, bd = tol;
  var scan = function (kind, list, idOf) {
    (list || []).forEach(function (l, li) {
      if (!l.pts) return;
      for (var j = 1; j < l.pts.length; j++) {
        var d = segDist(p, l.pts[j - 1], l.pts[j]);
        if (d < bd) { bd = d; best = { kind: kind, i: idOf(l, li) }; }
      }
    });
  };
  if (layer === 'water') scan('w', f.wlines, function (l) { return l.i; });
  else { scan('s', f.slines, function (l) { return l.i; }); scan('p', f.spress, function (l) { return l.i; }); if (cur === 0) scan('m', f.smain, function (l, li) { return li; }); }
  return best;
}

/** Что это за линия: потребитель, система, длина, диаметр и проверка скорости — для подсказки и строки справа */
function wwInfoHtml(ln) {
  var f = F(), w = DATA.floors[0].water, wh = window.waterHydro, num = function (v) { return String(Math.round(v * 100) / 100).replace('.', ','); };
  if (ln.kind === 'm') {

    return '<b>Лежак К1 Ø110</b> — собирает стояки и ведёт к выпуску<br>Длина участка ' + num(m.m) + ' м · уклон 0,02 в сторону выпуска' +

  }

  if (ln.kind === 'p') {
    var pl = (f.spress || []).filter(function (l) { return l.i === ln.i; })[0];
    return '<b>Напорная труба Ø32</b> — от насосной станции «' + wwEsc(q.z || '') + '» к стояку<br>Длина ' + num(pl ? wwPolyM(pl.pts, f.pxPerM) : 0) + ' м · уклона не требует, держится вверх 1 м от станции';
  }
  var nm = (FIXT[q.t] || ['прибор'])[0];
  if (q.t === 'basin' && /кухн/i.test(q.z || '')) nm = 'Мойка';
  var head = '<b>' + wwEsc(nm) + '</b> · ' + wwEsc(q.z || 'без имени') + '<br>';
  if (ln.kind === 's') {
    var sl = (f.slines || []).filter(function (l) { return l.i === ln.i; })[0];
    var L = sl ? wwPolyM(sl.pts, f.pxPerM) : 0;
    return head + 'Отвод К1 Ø' + (sl ? sl.d : 50) + ' к стояку своего помещения<br>Длина ' + num(L) + ' м · уклон ' + (sl && sl.d >= 110 ? '0,02' : '0,03') +
      (sl && sl.d < 110 && L > WW_BRANCH_MAX ? '<br><span style="color:#d97706">длиннее ' + WW_BRANCH_MAX + ' м — подвиньте прибор или стояк</span>' : '') + wsSlopeHtml(ln.i);
  }
  var wl = (f.wlines || []).filter(function (l) { return l.i === ln.i; })[0];
  var Lw = wl ? wwPolyM(wl.pts, f.pxPerM) + (f.wfeed || 0) : 0, hot = !!(WET_H_ED[q.t] || {}).hw;
  var out = head + (hot ? 'В1 (ХВС) и Т3 (ГВС)' : 'В1 (ХВС)') + ' — от коллекторов к прибору, отдельной трубой<br>Длина ' + num(Lw) + ' м';
  var F0 = wh && wh.FIXTURES[q.t];
  if (F0) {
    var ql = (F0.qMax || F0.q) * (F0.mixer ? wh.MIX_LINE : 1), v16 = wh.velocity(ql, 0.0116), hf = wh.pipeLoss(ql, 0.0116, Lw * 1.1, 1.3e-6).hf;
    var lim = wh.V_LIMIT.branch, need = v16 > lim ? (wh.velocity(ql, 0.0144) <= lim ? '20×2,8' : '25×3,5') : null;
    out += ' · расход ' + num(ql / 3.6) + ' л/с на линию<br>Труба PEX 16×2,2: ' + num(v16) + ' м/с, потеря ' + num(hf) + ' м — ' +
      (need ? '<span style="color:#d97706"><b>мало, нужна ' + need + '</b></span>' : 'хватает');
  }
  return out;
}

var wwTipEl = null;

/** Прибор под точкой плана (значок с поворотом и небольшим запасом) — для перетаскивания по одному */
function fixAt(p) {
  var f = F(), ppm = f.pxPerM || 100, fx = f.fixtures || [], pad = 0.08 * ppm;
  for (var i = fx.length - 1; i >= 0; i--) {
    var q = fx[i];
    var W = (q.w || (FIXT[q.t] || [])[2] || 500) / 1000 * ppm, D = (q.d || (FIXT[q.t] || [])[3] || 500) / 1000 * ppm;
    var a = (q.ang || 0) * Math.PI / 180, dx = p[0] - q.x, dy = p[1] - q.y;
    if (q.t === 'riser') { if (Math.hypot(dx, dy) < Math.max(W, 0.2 * ppm) / 2 + pad) return i; continue; }
    var lx = dx * Math.cos(a) + dy * Math.sin(a), ly = -dx * Math.sin(a) + dy * Math.cos(a);
    if (Math.abs(lx) <= W / 2 + pad && Math.abs(ly) <= D / 2 + pad) return i;
  }
  return -1;
}

/** Положение прибора, которое поставил монтажник, запоминается в карточке по ключу «тип#номер» и переживает пересборку */
function wwSavePos(q) {
  var w = DATA.floors[0].water;
  if (!w || !q || !q.k) return;
  var key = String(q.z || '').trim().toLowerCase();
  w.cards.forEach(function (c) {
    if (String(c.name || '').trim().toLowerCase() !== key) return;
    c.pos = c.pos || {};
    c.pos[q.k] = { x: Math.round(q.x), y: Math.round(q.y), ang: q.ang || 0 };
  });
  w.touched = true;
}

/** Номер карточки санузла, привязанной к комнате плана (или -1) */
function wwCardIdx(w, fl, z) {
  var nm = String(z.name || '').trim().toLowerCase(), hit = -1;
  if (!nm) return -1;
  w.cards.forEach(function (c, i) { if (c.zone && c.fl === fl && String(c.zone).trim().toLowerCase() === nm) hit = i; });
  return hit;
}

/**
 * Клик по комнате на шаге «Санузлы и вода»: комната становится санузлом (кухней, постирочной) или перестаёт им быть.
 * Безымянной комнате даём имя «Санузел N» — оно же уйдёт в таблицу комнат и в смету.
 */
function wwToggleRoom(zi) {
  var w = wwInit(), f = F(), z = f.zones[zi];
  if (!z || z.type === 'cold' || !z.pts) return;
  var ci = wwCardIdx(w, cur, z);
  if (ci >= 0) { w.cards.splice(ci, 1); }
  else {
    var nm = String(z.name || '').trim();
    var kind = /кухн/i.test(nm) ? 'kitchen' : /постир|прачеч/i.test(nm) ? 'laundry' : 'wc';
    var nWc = w.cards.filter(function (q) { return q.kind === 'wc'; }).length;
    if (!nm) {
      nm = 'Санузел ' + (nWc + 1);
      var key = JSON.stringify(z.pts);
      f.zones.forEach(function (q) { if (q === z || JSON.stringify(q.pts) === key) q.name = nm; });
    }
    var ex = null;

}
function wwDraw(f, k) {
  var w = DATA.floors[0].water;
  if (!w || !w.visited || !f.pxPerM) return;

    cx.setLineDash(dash || []); cx.strokeStyle = col; cx.lineWidth = wd * U; cx.stroke(); cx.setLineDash([]);
  };

    for (i = 1; i < pts.length; i++) { var L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(L); tot += L; }

    for (i = 0; i < seg.length; i++) {
      if (acc + seg[i] >= want) {

        var x = (a[0] + (b[0] - a[0]) * u) * k, y = (a[1] + (b[1] - a[1]) * u) * k, an = Math.atan2(b[1] - a[1], b[0] - a[0]), s = Math.max(5, 0.09 * ppm) * U;
        cx.save(); cx.translate(x, y); cx.rotate(an); cx.beginPath();
        cx.moveTo(s, 0); cx.lineTo(-s * 0.6, -s * 0.55); cx.lineTo(-s * 0.6, s * 0.55); cx.closePath();
        cx.fillStyle = col; cx.fill(); cx.restore();
        return;
      }
      acc += seg[i];
    }
  };
  var act = hoverLn || pinLn;
  var emph = function (kind, i) { return act ? ((act.kind === kind && act.i === i) ? 'on' : 'off') : null; };
  cx.save();
  if (showW) {
    // санузлы, отмеченные на плане, — лёгкой заливкой
    w.cards.forEach(function (c) {
      if (c.fl !== fi || !c.zone) return;
      var z = wwRoomZone(c.fl, c.zone);
      if (!z) return;
      cx.beginPath();
      z.pts.forEach(function (p, j) { if (j) cx.lineTo(p[0] * k, p[1] * k); else cx.moveTo(p[0] * k, p[1] * k); });
      cx.closePath(); cx.fillStyle = 'rgba(11,114,133,.12)'; cx.fill();
    });
    var step = Math.max(2, 0.03 * f.pxPerM) * k;
    (f.wlines || []).forEach(function (l) {
      var q = (f.fixtures || [])[l.i], hot = !!(q && (WET_H_ED[q.t] || {}).hw);
      if (!l.pts || l.pts.length < 2) return;
      var st = emph('w', l.i), wd = st === 'on' ? 3.4 : 2;
      cx.save(); if (st === 'off') cx.globalAlpha = 0.28;

      if (hot) { line(offsetPts(l.pts, -step / 2 / k), '#0696D7', wd); line(offsetPts(l.pts, step / 2 / k), '#c92a2a', wd); }

      line(t.pts, '#0b7285', 2.2, [8, 5]);

      cx.fillStyle = '#0b7285'; cx.font = 'bold ' + (11 * U) + 'px system-ui'; cx.textAlign = 'center';
      cx.fillText(String(t.m).replace('.', ',') + ' м', e[0] * k, e[1] * k - 8);

      arrow(l.pts, '#6b3f12');

      if (l.pts.length > 1 && Math.hypot(l.pts[0][0] - e[0], l.pts[0][1] - e[1]) > 0.5 * f.pxPerM) {

    });
    (f.spress || []).forEach(function (l) {
      var st = emph('p', l.i);
      if (st === 'on') line(l.pts, 'rgba(255,255,255,.95)', 8);

      var e = l.pts[Math.floor(l.pts.length / 2)];

      cx.fillText('напорная Ø32', e[0] * k, e[1] * k - 6 * U);

    (f.smain || []).forEach(function (l, li) {
      var st = emph('m', li);

      line(l.pts, '#6b3f12', st === 'on' ? 5.5 : 4);
      arrow(l.pts, '#6b3f12');
      var mid = l.pts[Math.floor(l.pts.length / 2)];
      cx.fillStyle = '#6b3f12'; cx.font = 'bold ' + (11 * U) + 'px system-ui'; cx.textAlign = 'center';
      cx.fillText('К1 Ø110 · ' + String(l.m).replace('.', ',') + ' м · i=0,02', mid[0] * k, mid[1] * k - 8);
    });
    var O = wwOutlet(w), allO = [O].concat((w.outs || []).map(function (o) { return { fl: 0, x: o.x, y: o.y }; }));

      cx.fillText('Выпуск К1' + (allO.length > 1 ? '-' + (oi + 1) : '') + (w.slopeOn ? ' (−' + String(w.outDepth || OUT_DEPTH_DEF).replace('.', ',') + ' м)' : ''), ox, oy - rr - 5);

      cx.fillStyle = '#0696D7'; cx.font = 'bold ' + (12 * U) + 'px system-ui'; cx.textAlign = 'center';
      cx.fillText('Коллекторы ХВС · ГВС' + (w.recirc ? ' · Рец.' : ''), x, y + ch / 2 + 14);

    var items = showW ? [['#0696D7', 'В1 — холодная'], ['#c92a2a', 'Т3 — горячая'], ['#0b7285', 'прибор']]

// делать дальше и что нужно, чтобы выпустить проект (03.10.2026). Теперь так же, как в окне
// «План дома»: крупные пронумерованные шаги, под ними фраза «что сделать сейчас», кнопки
// только этого шага и зелёная «Дальше →». Последний шаг — «Выпустить проект»: он
// показывает, чего не хватает, и запускает сборку листов в калькуляторе. Сверху — путь
// «Расчёт → Разметка плана → Листы проекта» и возврат в калькулятор.

var pjStep = null;       // шаг, выбранный руками (null — ведёт первый незакрытый)

function pjSteps() {
  var f = F(), L = [];
  var wantTp = calcRooms.some(function (r) { return (r.sys || []).indexOf('tp') >= 0; }) ||
    f.zones.some(function (z) { return z.type === 'tp'; });
  stepDefs().forEach(function (s) {
    if (s.id === 'scale' && (s.ok || !f.img)) return;           // масштаб подбирается сам; шаг — только если не вышло
    if (s.id === 'tp' && !wantTp) return;
    if (s.id === 'rad' && !wzWantRad()) return;
    if (s.id === 'boiler' && cur !== 0) return;                 // котельная — только на 1 этаже
    if (s.id === 'names') return;                               // имена вписывают в списке справа — отдельный шаг не нужен
    L.push(s);
  });
  // «Комнаты» — сразу после масштаба: контуры по стенам и привязка к комнатам расчёта
  var at = 0;
  L.forEach(function (s, i) { if (s.id === 'plan' || s.id === 'scale') at = i + 1; });
  L.splice(at, 0, { id: 'rooms', t: 'Комнаты', ok: f.zones.length > 0 || (f.rads || []).length > 0, mode: 'select' });
  L.push({ id: 'release', t: 'Выпуск', ok: false });
  return L;
}

/**
 * Что делать проекту дальше — одно действие на весь проект, а не на открытый этаж.
 * Шаги в полоске считаются по этажу, и на пустом втором этаже они начинались с
 * «Шаг 1: загрузите план», хотя главное оставалось на первом. Эта строка всегда
 * называет следующее действие и переводит на нужный этаж сама.
 */
function pjTodo() {
  var fl = DATA.floors, hasImg = function (f) { return !!(f.img || f.imgFile); };
  var withImg = [], sc = [], marked = [];
  fl.forEach(function (f, i) {
    if (!hasImg(f)) return;
    withImg.push(i);
    if (f.pxPerM) { sc.push(i); if ((f.zones || []).length || (f.rads || []).length) marked.push(i); }
  });
  if (!withImg.length) return { fi: 0, step: 'plan', text: 'Загрузите план этажа — фото, скан или PDF', btn: 'Загрузить план' };
  if (!sc.length) return { fi: withImg[0], step: 'scale', text: 'Задайте масштаб плана', btn: 'Задать масштаб' };
  if (!marked.length) return { fi: sc[0], step: 'rooms', text: 'Найдите комнаты на плане', btn: 'Найти комнаты' };
  var fi = marked[0];
  for (var k = 0; k < marked.length; k++) {
    var q = fl[marked[k]];
    if ((q.zones || []).some(function (z) { return z.type === 'tp'; }) && !q.coll)
      return { fi: marked[k], step: 'coll', text: 'Поставьте коллектор тёплого пола', btn: 'Поставить коллектор' };
  }
  var hasBoiler = fl.some(function (q) { return (q.zones || []).some(function (z) { return z.type === 'boiler'; }); });
  if (!hasBoiler) return { fi: hasImg(fl[0]) ? 0 : fi, step: 'boiler', text: 'Отметьте котельную на плане — без неё проект не выпускается', btn: 'Отметить котельную' };
  var checks = pjChecks(), miss = checks ? checks.filter(function (c) { return !c.ok; }) : [];
  if (miss.length) return { fi: -1, back: true, text: 'В калькуляторе не закрыто: ' + miss.map(function (c) { return c.t; }).join('; '), btn: 'В калькулятор' };
  return { fi: fi, release: true, text: 'Разметка закончена — можно выпускать проект', btn: 'Выпустить проект →' };
}

function pjDoTodo() {
  var t = pjTodo();
  if (t.back) { pjBack(); return; }
  if (t.fi !== cur) { cur = t.fi; renderTabs(); draw(); renderZones(); syncNorth(); }
  if (t.release) { pjRelease(); return; }
  pjGo(t.step);
}

var pjGoOk = null;   // был ли шаг закрыт в момент, когда на него нажали
function pjCur(L) {
  var ids = L.map(function (s) { return s.id; });
  if (!F().img) return 'plan';
  if (pjStep && ids.indexOf(pjStep) >= 0) {
    // Шаг выбран кнопкой, пока был не закрыт, и вот закрылся (план загружен, комнаты найдены,
    // котельная отмечена) — идём дальше сами, а не стоим на сделанном
    var cs = L[ids.indexOf(pjStep)];
    if (pjGoOk === false && cs.ok && /^(plan|scale|rooms|boiler)$/.test(pjStep)) { pjStep = null; pjGoOk = null; }
    else return pjStep;
  }
  for (var i = 0; i < L.length; i++) if (!L[i].ok) return L[i].id;
  return 'release';
}

function pjGo(id) {
  var L = pjSteps(), s = null;
  for (var i = 0; i < L.length; i++) if (L[i].id === id) s = L[i];
  pjStep = id; pjGoOk = s ? !!s.ok : null;
  hint('');
  if (id === 'plan') { var inp = document.querySelector('#b_upload input'); if (inp) inp.click(); return; }
  if (!s) { updateGuide(); return; }
  if (s.type) { var sel = document.getElementById('ztype'); if (sel) sel.value = s.type; }
  if (s.mode) { if (mode !== s.mode) setMode(s.mode); else { draw(); updateGuide(); } }
  else if (mode !== 'select') setMode(mode);                  // setMode(тот же) — выключить режим
  else { draw(); updateGuide(); }
}

function pjNext() {
  var L = pjSteps(), c = pjCur(L), ids = L.map(function (s) { return s.id; }), i = ids.indexOf(c);
  if (c === 'release') { pjRelease(); return; }
  if (i >= 0 && i + 1 < L.length) pjGo(ids[i + 1]);
}

/** Калькулятор, который открыл эту вкладку (если он ещё жив) */
function pjOpener() {
  try { if (window.opener && !window.opener.closed && window.opener.app) return window.opener; } catch (e) {}
  return null;
}

function pjBack() {
  saveAll();
  var op = pjOpener();
  if (op) { try { op.focus(); } catch (e) {} window.close(); }
  else location.href = 'index.html';
}

/** Условия выпуска от калькулятора: смета, комнаты расчёта, план, котельная, зоны пола */
function pjChecks() {
  var op = pjOpener();
  try { if (op && op.app.projectChecks) return op.app.projectChecks(); } catch (e) {}
  return null;
}

function pjRelease() {
  saveAll();
  var op = pjOpener();
  if (op) {
    try { op.focus(); } catch (e) {}
    try { op.app.openProjectSheets(); return; } catch (e) { console.warn('[plan_editor] выпуск:', e && e.message); }
  }
  openSheets(true);
}

function pjBody(id) {
  var B = function (fn, t, cls) { return '<button class="' + (cls || '') + '" onclick="' + fn + '">' + t + '</button>'; };
  var f = F();
  if (id === 'plan') return { noNext: true, acts: B("pjGo('plan')", 'Загрузить план', 'go'),
    tx: (pjTodo().fi !== cur && DATA.floors.length > 1
      ? 'Этот этаж пока пуст. Нет отопления — пропустите: для выпуска хватит одного размеченного этажа.'
      : 'Загрузите план этажа — масштаб и комнаты найду сама.'),
    tips: [['Фото', 'JPG, PNG'], ['Скан', 'любой'], ['PDF', 'страница с планом']] };
  if (id === 'scale' && SCAN_BUSY[cur]) return { noNext: true, acts: B("setMode('scale')", 'Задать вручную'),
    tx: '<b>Ищу масштаб…</b> Читаю размеры на плане, до минуты.', tips: [['Не хотите ждать', 'задайте вручную']] };
  if (id === 'scale') return { noNext: true, acts: B('autoScale()', 'Подобрать ещё раз') + B("setMode('scale')", 'Задать вручную'),
    tx: '<b>Масштаб не нашёлся.</b> Отметьте на плане отрезок известной длины.',
    tips: [['2 клика', 'по краям отрезка'], ['Например', 'дверной проём 0,9 м']], diag: scanDiagHtml() };
  if (id === 'rooms') return { acts: B('autoRooms()', 'Найти комнаты') + B("document.getElementById('ztype').value='tp';setMode('room')", 'Обвести кликом'),
    tx: 'Нажмите «Найти комнаты» — контуры найдутся по стенам и сопоставятся с расчётом.',
    tips: [['Авто', 'тёплый пол, котельная, санузлы'], ['✕', 'убрать лишнюю зону'], ['«Обвести кликом»', 'если комната не нашлась']] };
  if (id === 'tp') return { acts: B("document.getElementById('ztype').value='tp';setMode('room')", 'Зона: клик по комнате') + B('ufhCold()', 'Без обогрева'),
    tx: 'Отметьте комнаты с тёплым полом — проверьте, что нашлось само.',
    tips: [['Клик по комнате', 'включить зону'], ['«Без обогрева»', 'лестница, ванна, остров']] };
  if (id === 'rad') return { acts: B('autoRads()', 'Под окна') + B("setMode('rad')", 'Радиатор вручную') +
      B('radTurnLast(-45)', '↺ 45°') + B('radTurnLast(45)', '↻ 45°'),
    tx: 'Радиаторы поставлены под окнами — проверьте расстановку.', tips: RAD_TIPS };
  if (id === 'coll') return { acts: B("setMode('coll')", 'Коллектор ТП') + B("setMode('radcoll')", 'Коллектор радиаторов'),
    tx: 'Коллекторы встали у стены котельной сами — при необходимости переставьте.',
    tips: [['Кнопка + клик в комнате', 'переставить'], ['ПКМ или R', 'повернуть на 90°']] };
  if (id === 'boiler') return { acts: (boilerLookalike() ? B('makeBoiler()', 'Сделать «' + boilerLookalike().name + '» котельной', 'go') : '') +
      B("document.getElementById('ztype').value='boiler';setMode('room')", 'Отметить котельную кликом'),
    tx: '<b>Обязательно:</b> отметьте котельную — без неё проект не выпускается.' +
      (boilerLookalike() ? ' Зона «' + boilerLookalike().name + '» уже обведена, но как другой тип — нажмите первую кнопку.' : ''),
    tips: [['Клик по комнате', 'отметить'], ['Только 1 этаж', 'и одна на этаж']] };
  if (id === 'wc') return { acts: B("document.getElementById('ztype').value='wc';setMode('room')", 'Санузел кликом') + B('toggleFixAuto()', 'Приборы: из расчёта'),
    tx: 'Отметьте санузлы — приборы расставятся сами.',
    tips: [['Клик по комнате', 'санузел'], ['Имя', 'как в расчёте']] };
  if (id === 'release') {
    var checks = pjChecks(), ownMiss = [];

      (checks ? '' : 'Калькулятор не открыт в соседней вкладке — условия сметы проверит он сам при выпуске. ');
    return { next: 'Выпустить проект →', tx: tx };
  }
  return { tx: '' };
}

function pjRender(box) {
  box.className = 'steps wz';
  ufhFollowColl();
  var f = F(), L = pjSteps(), c = pjCur(L), ids = L.map(function (s) { return s.id; }), ci = ids.indexOf(c);
  var h = '<div class="wz-row">';
  L.forEach(function (s, i) {
    var reach = s.id === 'plan' || (f.img && (s.id === 'scale' || f.pxPerM));
    var cls = s.id === c ? 'cur' : (s.ok ? 'done' : '') + (reach ? '' : ' off');
    if (i) h += '<span class="wz-ar">→</span>';
    h += '<span class="wz-st ' + cls + '"' + (reach && s.id !== c ? ' onclick="pjGo(\'' + s.id + '\')"' : '') + '>' +
      '<span class="n">' + (s.ok && s.id !== c ? '✓' : (i + 1)) + '</span>' + s.t + '</span>';
  });
  h += '</div>';
  var td = pjTodo();
  if (td.fi !== cur || (td.step && td.step !== c) || td.back) {
    h += '<div class="wz-todo"><span class="tx">' +
      (td.fi >= 0 && td.fi !== cur ? '<b>Дальше, на ' + (td.fi + 1) + ' этаже:</b> ' : '<b>Дальше:</b> ') + td.text + '</span>' +
      '<button class="go" onclick="pjDoTodo()">' + td.btn + '</button></div>';
  }
  var b = pjBody(c);
  b.nextFn = 'pjNext()';
  h += wzDoHtml(ci, L.length, b);
  if (MODE_BAR[mode]) h += '<div class="wz-up" style="color:#9ccbe8">' + MODE_BAR[mode] + '</div>';
  if (upState && upState.run) {
    h += '<div class="wz-up">Отправляю план на сервер: ' + (upState.done + 1) + ' из ' + upState.total +
      ' — ' + Math.round(upState.pct * 100) + '%</div>';
  } else if (upState && upState.err) {
    h += '<div class="wz-up bad">План не ушёл на сервер: ' + upState.err + ' · <b onclick="uploadPending()">повторить</b></div>';
  }
  if (h !== stepsHtml) { box.innerHTML = h; stepsHtml = h; }
  // путь выпуска: Расчёт → Разметка плана → Листы проекта
  var path = document.getElementById('pj_path');
  if (path) {
    var allOk = L.filter(function (s) { return s.id !== 'release'; }).every(function (s) { return s.ok; });
    var hp = '<span class="p done" onclick="pjBack()" title="Смета и комнаты — в калькуляторе">✓ 1. Расчёт</span><span class="ar">→</span>' +
      '<span class="p cur">2. Разметка плана</span><span class="ar">→</span>' +
      '<span class="p ' + (allOk ? 'rel' : '') + '"' + (allOk ? ' onclick="pjRelease()"' : '') +

    if (path._h !== hp) { path.innerHTML = hp; path._h = hp; }

}

/**

  };
