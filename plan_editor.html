<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Служебная страница приложения, в поиске ей делать нечего. -->
<meta name="robots" content="noindex, nofollow">
<title>Планы этажей — подложка и зоны</title>
<style>
  /* Оформление — как в проектных САПР (Revit): графитовые панели, плоские
     элементы почти без скруглений, синий акцент Autodesk, светлый чертёж на
     тёмном поле. Тема всегда тёмная и от калькулятора не зависит: редактор —
     рабочее место с чертежом, а не страница сметы, и белый фон вокруг подложки
     засвечивает сам план. Шрифт системный, как во всех САПР. */
  :root {
    --primary: #0696D7;          /* акцент Autodesk */
    --primary-dim: #0b7cb0;
    --primary-light: rgba(6, 150, 215, .18);
    --bg: #2c2c2c;               /* поле вокруг чертежа */
    --surface: #3c3c3c;          /* панели и лента */
    --surface-light: #454545;    /* карточки внутри панелей */
    --surface-hi: #4f4f4f;       /* наведение */
    --text-main: #e6e6e6;
    --text-sec: #a0a0a0;
    --border: #5a5a5a;
    --border-soft: #4a4a4a;
    --ok: #4c9a2a;
    --ok-bg: rgba(76, 154, 42, .18);
    --warn-bg: #4a2a2a;
    --warn-text: #ff9b8a;
    --warn-border: #7a3b3b;
    --rad: 3px;                  /* САПР почти не скругляет */
  }
  body { margin: 0; font: 13px/1.4 'Segoe UI', system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--text-main); }
  .topbar { position: sticky; top: 0; z-index: 5; }
  /* лента инструментов */
  .bar { background: var(--surface); color: var(--text-main); padding: 7px 10px; display: flex;
         gap: 5px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #222; }
  .bar b { font-weight: 600; letter-spacing: .2px; }
  /* полоска «что осталось»: единственное место, где видны все шаги сразу */
  .steps { background: #343434; color: var(--text-sec); padding: 6px 10px; display: flex;
           gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px;
           border-bottom: 1px solid #222; }
  .steps .lbl { color: var(--text-sec); }
  .steps .st { padding: 3px 9px; border-radius: var(--rad); border: 1px solid var(--border-soft);
               background: var(--surface-light); color: var(--text-main); cursor: pointer;
               white-space: nowrap; font-weight: 500; }
  .steps .st:hover { background: var(--surface-hi); border-color: var(--primary); }
  .steps .st.next { background: var(--primary); border-color: var(--primary); color: #fff;
                    font-weight: 600; }
  .steps .st.done { background: transparent; border-color: var(--border-soft); color: #7ec95a;
                    cursor: default; }
  .steps .st.done:hover { background: transparent; border-color: var(--border-soft); }
  .steps .st.save { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .steps .up { color: #d8b26a; }
  .steps .up.bad { color: var(--warn-text); }
  .steps .up b { cursor: pointer; text-decoration: underline; }
  button, select, input[type=text] { font: inherit; font-size: 12.5px; padding: 5px 10px;
         border-radius: var(--rad); border: 1px solid var(--border-soft);
         background: var(--surface-light); color: var(--text-main); cursor: pointer;
         transition: background .12s, border-color .12s; }
  button:hover, select:hover { background: var(--surface-hi); border-color: var(--primary); }
  button.on { background: var(--primary); color: #fff; border-color: var(--primary-dim); }
  button.on:hover { background: var(--primary-dim); }
  button.ghost { background: transparent; color: var(--text-sec); border-color: var(--border-soft); }
  /* Главное действие панели: делает разом то, на что ниже пять кнопок. */
  button.go { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  button.go:hover { background: var(--ok); border-color: #fff; }
  button.go:disabled { opacity: .5; cursor: default; }
  button.ghost:hover { background: var(--surface-light); color: var(--text-main); }
  input[type=text] { background: #2a2a2a; border-color: #222; cursor: text; }
  input[type=text]:focus { outline: none; border-color: var(--primary); }
  /* Инструмент, не нужный на текущем шаге: гаснет, но остаётся на своём месте и
     нажимается. Прятался — и соседние кнопки прыгали под курсором. */
  .dim { opacity: .4; }
  .dim:hover { opacity: 1; }
  .tab { padding: 5px 10px; border-radius: var(--rad); background: var(--surface-light);
         color: var(--text-sec); cursor: pointer; }
  .tab.on { background: var(--primary); color: #fff; }
  .wrap { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
  /* рабочее поле: чертёж лежит на графите, как вид в САПР */
  .cvbox { background: #262626; border: 1px solid #1c1c1c; border-radius: var(--rad);
           padding: 8px; flex: 1 1 auto; min-width: 0; overflow: auto; }
  canvas { display: block; max-width: 100%; background: #1e1e1e; border-radius: 2px;
           cursor: crosshair; touch-action: none; }
  /* Палитра свойств: секции с заголовками и строки «параметр — значение»,
     как в окне свойств САПР. До этого панель была сплошным абзацем текста,
     в котором сводка этажа, статусы и список комнат сливались в кучу. */
  .side { flex: 0 0 320px; background: var(--surface); border: 1px solid #2a2a2a;
          border-radius: var(--rad); padding: 0; overflow: hidden; }
  .side .pad { padding: 10px 10px 12px; }
  .pgroup { border-top: 1px solid #2a2a2a; }
  .pgroup:first-of-type { border-top: 0; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
           background: #454545; border-bottom: 1px solid #2a2a2a; padding: 5px 10px;
           font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
           color: #cfcfcf; }
  .phead .note { font-size: 10px; font-weight: 400; letter-spacing: 0; text-transform: none;
                 color: var(--text-sec); white-space: nowrap; }
  .pbody { padding: 4px 0; }
  /* строка свойства: имя слева, значение прижато вправо */
  .prow { display: flex; align-items: baseline; gap: 10px; padding: 3px 10px; font-size: 12px; }
  .prow:nth-child(even) { background: rgba(255,255,255,.025); }
  .prow .k { color: var(--text-sec); flex: 1 1 auto; }
  .prow .v { color: var(--text-main); text-align: right; white-space: nowrap; flex: 0 0 auto; }
  .prow .v.warn { color: var(--warn-text); }
  .prow .v.good { color: #7ec95a; }
  .pempty { padding: 7px 10px; font-size: 12px; color: var(--text-sec); font-style: italic; }
  /* зона: цветная метка, тип, поле имени, площадь, удаление — по колонкам */
  .zone { border: 0; border-bottom: 1px solid #333; border-radius: 0; padding: 4px 10px;
          margin: 0; background: transparent; display: flex; gap: 7px;
          align-items: center; flex-wrap: nowrap; }
  .zone:nth-child(even) { background: rgba(255,255,255,.025); }
  .zone:hover { background: rgba(6,150,215,.10); }
  .zone .sw { width: 9px; height: 9px; border-radius: 1px; flex: 0 0 auto; }
  .zone .zt { color: var(--text-sec); font-size: 11px; flex: 0 0 auto; white-space: nowrap; }
  .zone input[type=text] { flex: 1 1 60px; min-width: 0; padding: 2px 5px; font-size: 12px; }
  .zone .ar { color: var(--text-main); font-size: 11.5px; white-space: nowrap; flex: 0 0 auto;
              font-variant-numeric: tabular-nums; }
  .zone .del { color: var(--text-sec); cursor: pointer; font-weight: 700; padding: 0 2px;
               flex: 0 0 auto; }
  .zone .del:hover { color: #e06c5f; }
  /* строка комнаты расчёта: имя слева, свойства справа */
  .croom { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; font-size: 12px;
           cursor: pointer; border-bottom: 1px solid #333; }
  .croom:nth-child(even) { background: rgba(255,255,255,.025); }
  .croom:hover { background: rgba(6,150,215,.12); }
  .croom .nm { flex: 1 1 auto; color: var(--text-main); }
  .croom .mt { flex: 0 0 auto; color: var(--text-sec); font-size: 11px; white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  .hint { background: #343434; border: 1px solid var(--border-soft);
          border-left: 3px solid var(--primary); border-radius: var(--rad); padding: 8px 10px;
          font-size: 12.5px; margin-bottom: 9px; color: var(--text-main); }
  .ok { color: #7ec95a; font-weight: 600; }
  /* пошаговые подсказки */
  .guide { position: fixed; z-index: 50; max-width: 320px; background: var(--surface);
           border: 1px solid var(--primary); border-radius: var(--rad); padding: 10px 12px;
           box-shadow: 0 8px 28px rgba(0,0,0,.5); font-size: 13px; color: var(--text-main);
           cursor: move; user-select: none; touch-action: none; }
  .guide .step { font-size: 10.5px; color: var(--primary); font-weight: 700;
                 text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .guide .grip { color: var(--text-sec); font-size: 12px; margin-right: 5px; }
  .guide .close { float: right; color: var(--text-sec); cursor: pointer; font-size: 12px;
                  margin: -2px -4px 4px 8px; }
  .guide .close:hover { color: #e06c5f; }
  .guide .demo { margin-top: 7px; border: 1px solid var(--border-soft); border-radius: 2px;
                 overflow: hidden; background: #fff; }
  .guide .demo svg { display: block; width: 100%; height: auto; }
  @keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(6,150,215,.7); }
                      70% { box-shadow: 0 0 0 11px rgba(6,150,215,0); }
                      100% { box-shadow: 0 0 0 0 rgba(6,150,215,0); } }
  .pulse { animation: pulseG 1.6s infinite; border-radius: var(--rad); }
  /* масштаб подложки */
  .zoombox { display: inline-flex; align-items: center; gap: 0; }
  .zoombox button { border-radius: 0; margin: 0; }
  .zoombox button:first-child { border-radius: var(--rad) 0 0 var(--rad); }
  .zoombox button:last-child { border-radius: 0 var(--rad) var(--rad) 0; }
  .zoombox .val { min-width: 46px; text-align: center; font-size: 11.5px; font-weight: 600;
                  color: var(--text-sec); border-top: 1px solid var(--border-soft);
                  border-bottom: 1px solid var(--border-soft); background: #2a2a2a;
                  padding: 5px 4px; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
<div class="bar">
  <b>Планы этажей</b>
  <span id="tabs"></span>
  <button class="ghost" onclick="addFloor()">+ этаж</button>
  <span style="flex:1"></span>
  <label class="ghost" id="b_upload" style="padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer">
    Загрузить план <input type="file" multiple accept="image/*,.pdf,application/pdf" style="display:none" onchange="loadImage(this)">
  </label>
  <button id="b_automark" class="go" onclick="autoMarkAll()" title="Масштаб, зоны, радиаторы и коллектор — по всем этажам сразу, и сохранить">Разметить всё</button>
  <button id="b_scale" onclick="setMode('scale')">Масштаб</button>
  <button id="b_autoscale" onclick="autoScale()" title="Подобрать масштаб по площадям комнат подробного расчёта">Масштаб по расчёту</button>
  <button id="b_autorooms" onclick="autoRooms()" title="Найти все комнаты по стенам и создать зоны по комнатам расчёта: тёплый пол, котельная, санузлы">Распознать комнаты</button>
  <button id="b_room" onclick="setMode('room')">Зона: по клику</button>
  <button id="b_rect" onclick="setMode('rect')">Зона: прямоугольник</button>
  <button id="b_poly" onclick="setMode('poly')">Зона: контур</button>
  <button id="b_rad" onclick="setMode('rad')">Радиаторы</button>
  <button id="b_autorad" onclick="autoRads()" title="Найти окна и поставить радиаторы под ними">Под окна</button>
  <button id="b_coll" onclick="setMode('coll')" title="Точка коллектора ТП — от неё на листах рисуются подводки петель">Коллектор</button>
  <button id="b_fixauto" onclick="toggleFixAuto()" title="Откуда берутся сантехприборы: из карточек санузлов расчёта или расставляются вручную">Приборы: из расчёта</button>
  <button id="b_wc" onclick="setMode('wc')" title="Расставить сантехприборы вручную (в режиме «из расчёта» они появляются сами)">Сантехника</button>
  <select id="wctype" onchange="if(mode!=='wc')setMode('wc')">
    <option value="basin">Раковина</option>
    <option value="toilet">Унитаз</option>
    <option value="bath">Ванна</option>
    <option value="shower">Душ</option>
    <option value="wash">Стиральная машина</option>
    <option value="dish">Посудомоечная машина</option>
    <option value="riser">Стояк канализации</option>
  </select>
  <select id="ztype" onchange="typeChanged()">
    <option value="tp">Тёплый пол</option>
    <option value="boiler">Котельная</option>
    <option value="wc">Санузел</option>
  </select>
  <select id="northsel" onchange="setNorth(this.value)" title="Куда на этом плане смотрит север. По нему расчёт сам определяет, на какую сторону выходит каждая комната: на север и восток теплопотери выше.">
    <option value="">Север: не указан</option>
    <option value="0">Север: ↑ вверх</option>
    <option value="45">Север: ↗ вверх-вправо</option>
    <option value="90">Север: → вправо</option>
    <option value="135">Север: ↘ вниз-вправо</option>
    <option value="180">Север: ↓ вниз</option>
    <option value="225">Север: ↙ вниз-влево</option>
    <option value="270">Север: ← влево</option>
    <option value="315">Север: ↖ вверх-влево</option>
  </select>
  <span class="zoombox" title="Масштаб подложки на экране. На расчёт не влияет — только на то, как крупно виден план.">
    <button onclick="zoomStep(-1)">−</button>
    <span class="val" id="zoom_val" onclick="setZoom(1)" title="Вернуть 100 %">100 %</span>
    <button onclick="zoomStep(1)">+</button>
  </span>
  <button id="b_darkplan" class="on" onclick="toggleDarkPlan()" title="Тёмный вид подложки: чертёж светлыми линиями по тёмному, как в САПР. Для фотографии плана удобнее выключить и смотреть оригинал.">◐ Тёмный план</button>
  <button class="ghost" onclick="doUndo()" title="Ctrl+Z">↶ Шаг назад</button>
  <button onclick="saveAll()" id="b_save" style="background:var(--ok);color:#fff;border-color:var(--ok)">Сохранить</button>
  <button class="ghost" onclick="openSheets()" title="Комплект собирается по смете калькулятора вместе с планами">Проект →</button>
  <button class="ghost" id="b_alltools" onclick="toggleAllTools()" title="Показать все инструменты сразу, а не только нужные текущему шагу">Все инструменты</button>
  <button class="ghost" id="b_hints" onclick="toggleHints()">💡 Подсказки: вкл</button>
</div>
<div class="steps" id="steps"></div>
</div>

<div class="wrap">
  <div class="cvbox"><canvas id="cv" width="1200" height="850"></canvas></div>
  <div class="side">
    <div class="pad"><div class="hint" id="hint">Загрузите фото или скан плана этажа, затем задайте масштаб:
      кнопка «Масштаб» → две точки на плане → длина отрезка в метрах.</div></div>
    <div class="pgroup">
      <div class="phead">Зоны этажа <span class="note" id="scale_note"></span></div>
      <div id="zlist"></div>
    </div>
    <div id="zsummary"></div>
  </div>
</div>

<script src="project_plans.js?v=1.8"></script>
<script>
'use strict';
// Доступ к проектированию. Своей авторизации у страницы нет, поэтому отметку
// оставляет калькулятор (app.syncDesignUI) — без неё редактор не открываем:
// иначе прямая ссылка обходила бы переключатель в админке.
(function () {
  var ok = false;
  try { ok = localStorage.getItem('heatcalc_design_access') === '1'; } catch (e) {}
  if (ok) return;
  document.body.innerHTML =
    '<div style="max-width:520px;margin:80px auto;background:var(--surface);border-radius:3px;padding:28px 32px;' +
    'font:15px/1.5 system-ui,sans-serif;color:var(--text-main);border:1px solid var(--border-soft);'  +
    'box-shadow:0 8px 30px rgba(0,0,0,.45)">' +
    '<h2 style="margin:0 0 10px;font-size:19px">Раздел проектирования не открыт</h2>' +
    '<p style="margin:0 0 14px;color:var(--text-sec)">Планы этажей и проект включает администратор. ' +
    'Если доступ вам уже дали — откройте калькулятор heatcalc.ru, войдите в свою учётную запись ' +
    'и перейдите в редактор оттуда.</p>' +
    '<a href="index.html" style="display:inline-block;padding:9px 18px;border-radius:8px;' +
    'background:var(--primary);color:#fff;text-decoration:none;font-weight:600">К калькулятору</a></div>';
  document.body.style.background = 'var(--bg)';
  throw new Error('design access denied');
})();

// Данные: этажи с подложкой и зонами. Точки зон — в пикселях ИЗОБРАЖЕНИЯ.
var DATA = { floors: [{ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] }] };
var cur = 0, mode = 'select', tmp = [], scalePts = [], dragA = null, imgCache = {};
var scaleCur = null, scaleFree = false;   // след масштабной линейки и режим угла
var imgFailed = {};   // этажи, чью подложку не удалось забрать с сервера
var polyCur = null, closeTs = 0, undoStack = [];
var TYPES = { tp: ['Тёплый пол', '#ff8000'], rad: ['Радиаторы', '#d22'],
  boiler: ['Котельная', '#5577aa'], wc: ['Санузел', '#0b7285'] };
// Сантехприборы: подпись, буква на значке и габарит в мм (вдоль стены × от
// стены). Габариты нужны и для привязки к стене, и для значка на листах.
var FIXT = {
  basin: ['Раковина', 'Р', 600, 450],
  toilet: ['Унитаз', 'У', 360, 700],
  bath: ['Ванна', 'В', 1700, 700],
  shower: ['Душ', 'Д', 900, 900],
  wash: ['Стиральная машина', 'СМ', 600, 600],
  dish: ['Посудомоечная машина', 'ПМ', 600, 600],
  riser: ['Стояк канализации', 'Ст', 110, 110]
};

try {
  var saved = JSON.parse(localStorage.getItem('floor_plans_v1'));
  if (saved && saved.floors && saved.floors.length) DATA = saved;
} catch (e) {}

// ─── Подложки на сервере (plans.php на Beget) ──────────────────────────
// В хранилище браузера подложка больше не лежит: одна картинка — сотни
// килобайт, на третьем этаже сохранение упиралось в лимит, а чистка кэша
// уносила работу целиком. Здесь остаётся только разметка (зоны, масштаб,
// радиаторы), сама картинка едет на хостинг и возвращается ссылкой.
//
// Мимо Supabase — сознательно: его egress выбран на две трети, а на Beget
// свободно 12 ГБ и трафик не тарифицируется.
var PLANS_URL = 'https://proxy.heatcalc.ru/plans.php';

// Ключ проекта: 32 hex-знака, он же имя папки на сервере. По нему подложку
// заберёт и заказчик, открывший ссылку на смету, — угадать 128 бит нельзя.
function planKey() {
  if (!/^[a-f0-9]{32}$/.test(DATA.key || '')) {
    var a = new Uint8Array(16);
    window.crypto.getRandomValues(a);
    DATA.key = Array.prototype.map.call(a, function (b) {
      return (b < 16 ? '0' : '') + b.toString(16);
    }).join('');
  }
  return DATA.key;
}

function planUrl(file) {
  return PLANS_URL + '?k=' + planKey() + '&n=' + encodeURIComponent(file);
}

/**
 * Токен сессии Supabase из хранилища калькулятора.
 *
 * Своей авторизации у редактора нет (доступ он берёт из отметки
 * heatcalc_design_access), но заливать файлы на хостинг без входа нельзя.
 * Домен тот же, что у калькулятора, поэтому сессия лежит рядом: библиотека
 * держит её под ключом sb-<проект>-auth-token и в разных версиях пишет туда
 * либо JSON, либо тот же JSON, завёрнутый в base64.
 */
var authKeysSeen = [];   // что нашлось в хранилище — для внятной жалобы

function authToken() {
  // Имя ключа и вложенность зависят от версии библиотеки
  // («sb-<проект>-auth-token» или «supabase.auth.token»; токен то в корне,
  // то в currentSession). Поэтому формат не угадываем, а ищем access_token
  // в любом ключе, похожем на хранилище Supabase — так же, как это делает
  // калькулятор в recognitionToken().
  function findToken(node, depth) {
    if (!node || typeof node !== 'object' || depth > 4) return null;
    if (typeof node.access_token === 'string' && node.access_token) return node.access_token;
    for (var k in node) {
      if (!Object.prototype.hasOwnProperty.call(node, k)) continue;
      var found = findToken(node[k], depth + 1);
      if (found) return found;
    }
    return null;
  }
  authKeysSeen = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i) || '';
      if (!/^(sb-|supabase)/i.test(key)) continue;
      authKeysSeen.push(key);
      var raw = localStorage.getItem(key);
      // Часть версий заворачивает сессию в base64.
      if (raw && raw.indexOf('base64-') === 0) {
        try { raw = atob(raw.slice(7)); } catch (e) {}
      }
      var parsed;
      try { parsed = JSON.parse(raw); } catch (e) { continue; }
      var token = findToken(parsed, 0);
      if (token) return token;
    }
  } catch (e) {}
  return null;
}

/**
 * Заливает подложку этажа. Резолвится именем файла на сервере.
 *
 * Не fetch, а XMLHttpRequest — ради двух вещей, которых у fetch нет:
 * прогресса отправки (иначе на слабой связи полоска молчит минутами и
 * непонятно, идёт ли вообще что-то) и таймаута (иначе запрос висит, пока
 * его не оборвёт сеть).
 */
function putFloorImage(fi, onProgress) {
  var f = DATA.floors[fi];
  var m = /^data:image\/(jpeg|png|webp);base64,(.+)$/.exec(f.img || '');
  if (!m) return Promise.resolve(null);
  var tok = authToken();
  if (!tok) {
    console.warn('[plan_editor] ключи хранилища Supabase:', authKeysSeen);
    return Promise.reject(new Error(authKeysSeen.length
      ? 'сессия в браузере есть, но токен в ней не найден — выйдите и войдите заново'
      : 'нет входа в учётную запись — войдите в калькуляторе по email или через Google'));
  }
  var body = JSON.stringify({
    action: 'put', key: planKey(), floor: fi + 1,
    ext: m[1] === 'jpeg' ? 'jpg' : m[1], data: m[2]
  });
  return new Promise(function (ok, err) {
    var x = new XMLHttpRequest();
    x.open('POST', PLANS_URL, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('Authorization', 'Bearer ' + tok);
    x.timeout = 90000;
    if (x.upload && onProgress) {
      x.upload.onprogress = function (e) {
        if (e.lengthComputable) onProgress(e.loaded / e.total);
      };
    }
    x.onload = function () {
      var j = {};
      try { j = JSON.parse(x.responseText) || {}; } catch (e) {}
      if (x.status >= 200 && x.status < 300 && j.file) { ok(j.file); return; }
      err(new Error(j.error || ('сервер ответил ' + x.status)));
    };
    // Статус сюда не доходит: браузер прячет ответ, у которого нет
    // разрешения CORS, — а его нет ровно тогда, когда отвечал не наш
    // скрипт (страница 404, если plans.php не выложен, или отлуп хостинга).
    x.onerror = function () { err(new Error('сервер подложек не ответил')); };
    x.ontimeout = function () { err(new Error('сервер молчал полторы минуты')); };
    x.send(body);
  });
}

// ─── Карта стен: тёмные пиксели подложки как преграды ──────────────────
// Общая основа «зоны по клику» и прилипания прямоугольника к стенам.
var maskCache = {};
function getMask(fi) {
  var idx = (fi == null) ? cur : fi;
  var f = DATA.floors[idx];
  if (!f || !f.img || !imgCache[idx]) return null;
  if (maskCache[idx]) return maskCache[idx];
  var k = Math.min(1, 900 / f.w);
  var w = Math.round(f.w * k), h = Math.round(f.h * k);
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.drawImage(imgCache[idx], 0, 0, w, h);
  var d = g.getImageData(0, 0, w, h).data;
  var bar = new Uint8Array(w * h);
  for (var i = 0, p = 0; i < bar.length; i++, p += 4) {
    var r = d[p], gg = d[p + 1], b = d[p + 2];
    var lum = (r * 3 + gg * 6 + b) / 10;
    // тёмное — стена/линия; красноватое (размерные цепочки) преградой не считаем
    bar[i] = (lum < 165 && !(r > gg + 28 && r > b + 28)) ? 1 : 0;
  }
  // Чистить маску от размерных линий здесь нельзя: на планах они заодно
  // перекрывают широкие проёмы, и без них заливка комнат утекает через
  // проходы — помещения слипаются в одно. Чистка живёт в exportGeom, где
  // она нужна только контурам стен для листа.
  maskCache[idx] = { w: w, h: h, k: k, bar: bar };
  return maskCache[idx];
}

/**
 * Размыкание маски: эрозия и обратная дилатация радиусом r.
 *
 * Считается по интегральной сумме, поэтому не зависит от радиуса по времени.
 * Если чистка съедает больше половины тёмного — стены на плане нарисованы
 * тонким контуром, а не залиты; тогда откатываемся к исходной маске, иначе
 * от плана ничего не осталось бы.
 */
function openThin(bar, W, H, ppm) {
  var r = Math.max(1, Math.round(0.035 * ppm));
  if (r < 1 || W < 3 || H < 3) return;
  var N = W * H, i, x, y;
  var keep = new Uint8Array(N), was = 0;
  for (i = 0; i < N; i++) if (bar[i]) was++;
  if (!was) return;
  var sum = new Int32Array((W + 1) * (H + 1));
  var box = function (S, x0, y0, x1, y1) {           // сумма по прямоугольнику
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    x1 = Math.min(W - 1, x1); y1 = Math.min(H - 1, y1);
    return S[(y1 + 1) * (W + 1) + x1 + 1] - S[y0 * (W + 1) + x1 + 1]
         - S[(y1 + 1) * (W + 1) + x0] + S[y0 * (W + 1) + x0];
  };
  var integral = function (src, S) {
    for (y = 0; y < H; y++) {
      var row = 0;
      for (x = 0; x < W; x++) {
        row += src[y * W + x];
        S[(y + 1) * (W + 1) + x + 1] = S[y * (W + 1) + x + 1] + row;
      }
    }
  };
  integral(bar, sum);
  var er = new Uint8Array(N);
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    var x0 = x - r, y0 = y - r, x1 = x + r, y1 = y + r;
    var cells = (Math.min(W - 1, x1) - Math.max(0, x0) + 1) *
                (Math.min(H - 1, y1) - Math.max(0, y0) + 1);
    er[y * W + x] = (box(sum, x0, y0, x1, y1) === cells) ? 1 : 0;
  }
  var sum2 = new Int32Array((W + 1) * (H + 1));
  integral(er, sum2);
  var left = 0;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    var v = box(sum2, x - r, y - r, x + r, y + r) > 0 ? 1 : 0;
    keep[y * W + x] = v;
    if (v) left++;
  }
  if (left < was * 0.4) return;                       // стены контуром — не трогаем
  for (i = 0; i < N; i++) bar[i] = keep[i];
}

// ─── Подводки петель ТП к коллектору ───────────────────────────────────
// Маршруты считаются здесь при сохранении и уезжают в данные планов
// (f.leads): листы (project_plans.js) их только рисуют, ничего не зная о
// карте стен. Пересохранение пересчитывает маршруты заново.

/** Ближайшая свободная клетка маски (значок мог попасть на линию стены) */
function nearestFree(m, x, y) {
  x = Math.max(0, Math.min(m.w - 1, x)); y = Math.max(0, Math.min(m.h - 1, y));
  if (!m.bar[y * m.w + x]) return [x, y];
  for (var r = 1; r < 40; r++)
    for (var dy = -r; dy <= r; dy++)
      for (var dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        var nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < m.w && ny < m.h && !m.bar[ny * m.w + nx]) return [nx, ny];
      }
  return null;
}

/** Кратчайший маршрут по свободному полю (BFS): труба обходит стены,
 *  проходит в дверные проёмы — как реальная подводка по полу */
function routeOnMask(m, a, b) {
  var W = m.w, N = W * m.h;
  var prev = new Int32Array(N), i;
  for (i = 0; i < N; i++) prev[i] = -1;
  var q = new Int32Array(N), qt = 0, qh = 0;
  var s = a[1] * W + a[0], e = b[1] * W + b[0];
  prev[s] = s; q[qt++] = s;
  while (qh < qt) {
    var id = q[qh++];
    if (id === e) break;
    var x = id % W;
    if (x && !m.bar[id - 1] && prev[id - 1] < 0) { prev[id - 1] = id; q[qt++] = id - 1; }
    if (x < W - 1 && !m.bar[id + 1] && prev[id + 1] < 0) { prev[id + 1] = id; q[qt++] = id + 1; }
    if (id >= W && !m.bar[id - W] && prev[id - W] < 0) { prev[id - W] = id; q[qt++] = id - W; }
    if (id < N - W && !m.bar[id + W] && prev[id + W] < 0) { prev[id + W] = id; q[qt++] = id + W; }
  }
  if (prev[e] < 0) return null;
  var path = [], id2 = e;
  while (id2 !== s) { path.push([id2 % W, (id2 / W) | 0]); id2 = prev[id2]; }
  path.push([s % W, (s / W) | 0]);
  return path.reverse();
}

/** Точка входа в зону: ближайшая к p точка её контура */
function zoneEntry(z, p) {
  var best = null, bd = 1e18;
  for (var i = 0; i < z.pts.length; i++) {
    var a = z.pts[i], b = z.pts[(i + 1) % z.pts.length];
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var L2 = dx * dx + dy * dy || 1;
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2));
    var qx = a[0] + t * dx, qy = a[1] + t * dy;
    var dd = (qx - p[0]) * (qx - p[0]) + (qy - p[1]) * (qy - p[1]);
    if (dd < bd) { bd = dd; best = [Math.round(qx), Math.round(qy)]; }
  }
  return best;
}

// ─── Приборы санузлов из расчёта ───────────────────────────────────────

function syncFixAutoBtn() {
  var b = document.getElementById('b_fixauto');
  if (b) b.textContent = 'Приборы: ' + (fixAuto ? 'из расчёта' : 'вручную');
  var w = document.getElementById('wctype');
  if (w) w.style.display = fixAuto ? 'none' : '';
}

/** Рёбра зоны с внутренней нормалью: прибор ставится СПИНОЙ к стене, поэтому
 *  сдвигать его нужно перпендикулярно ребру, а не «к центру комнаты» —
 *  в Г-образном помещении центр лежит в стороне и прибор уезжал бы вбок. */
function zoneEdges(pts) {
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1) continue;
    var ux = dx / L, uy = dy / L;
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    // из двух нормалей берём ту, что смотрит внутрь зоны
    var nx = -uy, ny = ux;
    if (!pip([mx + nx * 2, my + ny * 2], pts)) { nx = -nx; ny = -ny; }
    out.push({ a: a, b: b, L: L, ux: ux, uy: uy, nx: nx, ny: ny,
      ang: Math.round(Math.atan2(dy, dx) * 180 / Math.PI) });
  }
  return out;
}

/** Есть ли стена за спиной прибора: луч наружу от точки по карте стен.
 *  Возвращает расстояние до стены в пикселях плана или -1 (проём, окно, край). */
function wallBehind(m, x, y, nx, ny, maxPx) {
  if (!m) return -1;
  var sx = x * m.k, sy = y * m.k, lim = maxPx * m.k;
  for (var d = 1; d <= lim; d++) {
    var px2 = Math.round(sx - nx * d), py2 = Math.round(sy - ny * d);
    if (px2 < 0 || py2 < 0 || px2 >= m.w || py2 >= m.h) return -1;
    if (m.bar[py2 * m.w + px2]) return d / m.k;
  }
  return -1;
}

/** Приборы одной зоны «Санузел» по её карточке в расчёте.
 *
 *  Каждый прибор прижимается СПИНОЙ К СТЕНЕ: идём вдоль периметра, на каждом
 *  шаге проверяем по карте стен, есть ли стена за спиной (в проёме двери её
 *  нет — там прибор не ставим), отодвигаем прибор от стены на половину его
 *  глубины и разворачиваем вдоль стены. Крупные приборы получают место по
 *  своей ширине, наложений нет. Стояк — в ближайшем к унитазу углу.
 */
function fixturesOfWcZone(f, z) {
  var card = wcCardOf(z.name);
  if (!card) return [];
  var order = ['toilet', 'basin', 'bath', 'shower', 'wash', 'dish'], list = [];
  order.forEach(function (k) {
    var v = +(card.fixtures || {})[k] || 0;
    for (var i = 0; i < v; i++) list.push(k);
  });
  if (!list.length) return [];

  var ppm = f.pxPerM || 100, m = getMask(DATA.floors.indexOf(f));
  var edges = zoneEdges(z.pts);
  if (!edges.length) return [];
  var out = [], gap = 0.12 * ppm;          // зазор между приборами

  // слоты вдоль всех стен: (ребро, положение) с шагом в четверть метра
  var slots = [];
  edges.forEach(function (e) {
    for (var s = 0.25 * ppm; s <= e.L - 0.25 * ppm; s += 0.25 * ppm)
      slots.push({ e: e, s: s });
  });
  if (!slots.length) slots.push({ e: edges[0], s: edges[0].L / 2 });

  list.forEach(function (t) {
    var W = (FIXT[t][2] || 500) / 1000 * ppm, D = (FIXT[t][3] || 500) / 1000 * ppm;
    var best = null;
    for (var i = 0; i < slots.length; i++) {
      var e = slots[i].e, s = slots[i].s;
      if (s - W / 2 < 0 || s + W / 2 > e.L) continue;       // не влезает по длине стены
      var bx = e.a[0] + e.ux * s, by = e.a[1] + e.uy * s;   // точка на стене
      // стена за спиной: в дверном проёме её нет — такой слот пропускаем
      if (m && wallBehind(m, bx + e.nx * 2, by + e.ny * 2, e.nx, e.ny, 0.5 * ppm) < 0) continue;
      var x = Math.round(bx + e.nx * (D / 2 + 0.02 * ppm));
      var y = Math.round(by + e.ny * (D / 2 + 0.02 * ppm));
      if (!pip([x, y], z.pts)) continue;                     // центр должен быть внутри
      var clash = out.some(function (q) {
        var qW = (FIXT[q.t][2] || 500) / 1000 * ppm;
        return Math.hypot(q.x - x, q.y - y) < (W + qW) / 2 + gap;
      });
      if (clash) continue;
      best = { x: x, y: y, t: t, ang: e.ang, w: FIXT[t][2], d: FIXT[t][3], a: 1, z: z.name || '' };
      break;
    }
    // места у стен не нашлось (тесная зона или нет подложки) — ставим в центре
    if (!best) {
      var c = centroid(z.pts);
      best = { x: Math.round(c[0]), y: Math.round(c[1]), t: t, ang: 0,
        w: FIXT[t][2], d: FIXT[t][3], a: 1, z: z.name || '' };
    }
    out.push(best);
  });

  // стояк канализации — в углу зоны, ближайшем к унитазу (или к первому прибору)
  var ref = out.filter(function (q) { return q.t === 'toilet'; })[0] || out[0];
  if (ref) {
    var cz = centroid(z.pts), bestV = null, bd = 1e18;
    z.pts.forEach(function (p) {
      var d = Math.hypot(p[0] - ref.x, p[1] - ref.y);
      if (d < bd) { bd = d; bestV = p; }
    });
    if (bestV) {
      var vx = cz[0] - bestV[0], vy = cz[1] - bestV[1], vl = Math.hypot(vx, vy) || 1;
      out.push({ x: Math.round(bestV[0] + vx / vl * 0.25 * ppm),
        y: Math.round(bestV[1] + vy / vl * 0.25 * ppm),
        t: 'riser', ang: 0, w: FIXT.riser[2], d: FIXT.riser[3], a: 1, z: z.name || '' });
    }
  }
  return out;
}

/** Пересборка приборов «из расчёта». Расставленные вручную (без флага a)
 *  остаются на месте — авто и ручные приборы сочетаются. */
function refreshAutoFixtures() {
  if (!fixAuto) return;
  DATA.floors.forEach(function (f) {
    var manual = (f.fixtures || []).filter(function (q) { return !q.a; });
    var auto = [];
    (f.zones || []).forEach(function (z) {
      if (z.type !== 'wc' || !z.pts || z.pts.length < 3) return;
      auto = auto.concat(fixturesOfWcZone(f, z));
    });
    f.fixtures = manual.concat(auto);
  });
}

/** Маршрут между двумя точками по свободному месту (обход стен, проход в
 *  проёмы). Маски нет — прямая линия. */
function routeBetween(m, a, b) {
  if (!m) return [[a[0], a[1]], [b[0], b[1]]];
  var A = nearestFree(m, Math.round(a[0] * m.k), Math.round(a[1] * m.k));
  var B = nearestFree(m, Math.round(b[0] * m.k), Math.round(b[1] * m.k));
  var path = (A && B) ? routeOnMask(m, A, B) : null;
  if (!path) return [[a[0], a[1]], [b[0], b[1]]];
  var pts = dpSimp(path, 2.2).map(function (q) {
    return [Math.round(q[0] / m.k), Math.round(q[1] / m.k)];
  });
  pts[0] = [a[0], a[1]];
  pts[pts.length - 1] = [b[0], b[1]];
  return pts;
}

/** Трассы водоснабжения и канализации: вода — от котельной к каждому прибору,
 *  канализация — от прибора к ближайшему стояку. Считаются при сохранении,
 *  листы их только рисуют. Унитаз — выпуск 110 мм, остальное — 50 мм. */
function computeVk() {
  DATA.floors.forEach(function (f, fi) {
    f.wlines = []; f.slines = [];
    var fx = f.fixtures || [];
    if (!fx.length || !f.pxPerM) return;
    var m = getMask(fi);
    var src = null;
    (f.zones || []).forEach(function (z) { if (z.type === 'boiler') src = centroid(z.pts); });
    if (!src && f.coll) src = [f.coll.x, f.coll.y];
    var risers = fx.filter(function (q) { return q.t === 'riser'; });
    fx.forEach(function (q, qi) {
      if (q.t === 'riser') return;
      if (src) f.wlines.push({ i: qi, pts: routeBetween(m, src, [q.x, q.y]) });
      if (risers.length) {
        var best = risers[0], bd = 1e18;
        risers.forEach(function (r) {
          var d = Math.hypot(r.x - q.x, r.y - q.y);
          if (d < bd) { bd = d; best = r; }
        });
        f.slines.push({ i: qi, d: (q.t === 'toilet' ? 110 : 50),
          pts: routeBetween(m, [q.x, q.y], [best.x, best.y]) });
      }
    });
  });
}

function computeLeads() {
  DATA.floors.forEach(function (f, fi) {
    f.leads = [];
    if (!f.coll || !f.pxPerM) return;
    // этаж ни разу не открывали в этой сессии — картинки в кэше нет,
    // маршрут не построить: подводка ляжет прямой линией
    var m = getMask(fi);
    f.zones.forEach(function (z, zi) {
      if (z.type !== 'tp') return;
      var E = zoneEntry(z, [f.coll.x, f.coll.y]);
      if (!E) return;
      var pts = null;
      if (m) {
        var a = nearestFree(m, Math.round(f.coll.x * m.k), Math.round(f.coll.y * m.k));
        var b = nearestFree(m, Math.round(E[0] * m.k), Math.round(E[1] * m.k));
        var path = (a && b) ? routeOnMask(m, a, b) : null;
        if (path) {
          pts = dpSimp(path, 2.2).map(function (q) {
            return [Math.round(q[0] / m.k), Math.round(q[1] / m.k)];
          });
          pts[0] = [f.coll.x, f.coll.y];          // концы — точно в коллектор и вход
          pts[pts.length - 1] = E;
        }
      }
      if (!pts) pts = [[f.coll.x, f.coll.y], E];
      f.leads.push({ i: zi, pts: pts });
    });
  });
}

/** Разметка комнат (watershed): карта расстояний до стен → «ядра» глубже
 *  0.63 м разъединяются в дверях и проёмах сами → ядра разрастаются обратно
 *  по свободному месту. Каждому пикселю — метка своей комнаты. */
/**
 * Геометрия этажа для листов: контуры стен и окна.
 *
 * Лист «Сводный план сетей» рисуется программой, а не подложкой: подложка
 * у монтажников любая (фото, скан, экспорт CAD), а лист должен выглядеть
 * одинаково. Контуры берём из той же маски, по которой считаются маршруты
 * труб: тёмное — стена. Дверные проёмы отдельно искать не нужно — в маске
 * это разрывы, и в контуре они остаются разрывами.
 *
 * Мелочь (текст, размерные цепочки, штриховки) отсекается по площади и по
 * средней толщине: стена толще 5 см, надпись — нет.
 */
function exportGeom(fi) {
  var idx = (fi == null) ? cur : fi;
  var f = DATA.floors[idx];
  var m = getMask(idx);
  if (!f || !m || !f.pxPerM) return null;
  var W = m.w, H = m.h, N = W * H;
  var ppm = f.pxPerM * m.k;                       // пикселей маски на метр
  // Копия маски, очищенная от тонкого: размерные цепочки и подписи не должны
  // попасть в контуры стен. Исходная маска не трогается — по ней считаются
  // комнаты и маршруты труб.
  var wm = getWallMask(idx);
  var bar = wm ? wm.bar : m.bar;
  var lab = new Int32Array(N), labMin = [-1], labCnt = [0];
  var bb = [null], q = new Int32Array(N), L = 0;
  for (var s0 = 0; s0 < N; s0++) {
    if (!bar[s0] || lab[s0]) continue;
    L++; labMin.push(s0); labCnt.push(0);
    var x0 = s0 % W, y0 = (s0 / W) | 0, box = [x0, y0, x0, y0];
    var qh = 0, qt = 0;
    lab[s0] = L; q[qt++] = s0;
    while (qh < qt) {
      var c = q[qh++], cx = c % W, cy = (c / W) | 0;
      labCnt[L]++;
      if (cx < box[0]) box[0] = cx;
      if (cy < box[1]) box[1] = cy;
      if (cx > box[2]) box[2] = cx;
      if (cy > box[3]) box[3] = cy;
      for (var d = 0; d < 8; d++) {
        var nx = cx + [1, -1, 0, 0, 1, 1, -1, -1][d];
        var ny = cy + [0, 0, 1, -1, 1, -1, 1, -1][d];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var ni = ny * W + nx;
        if (bar[ni] && !lab[ni]) { lab[ni] = L; q[qt++] = ni; }
      }
    }
    bb.push(box);
  }
  var fake = { w: W, h: H, k: m.k, labels: lab, labMin: labMin };
  var walls = [];
  for (var i = 1; i <= L; i++) {
    var box2 = bb[i], side = Math.max(box2[2] - box2[0], box2[3] - box2[1]) || 1;
    if (labCnt[i] < 0.10 * ppm * ppm) continue;   // мелкое — надписи, значки
    if (labCnt[i] / side < 0.05 * ppm) continue;  // тонкое — размерные линии
    var pts = traceLabel(fake, i);
    if (pts && pts.length > 2) walls.push(pts);
  }
  // Ширину окна округляем до стандартной: измерение по растру даёт ±5 см,
  // а на листе рядом с окном стоит размер — врать он не должен. Дверей это
  // не касается: их detectWindows не отдаёт (у проёма нет тонких линий
  // остекления, по ним окно и опознаётся).
  var STD_W = [600, 900, 1000, 1200, 1300, 1400, 1500, 1600, 1800, 2000, 2100, 2400, 2700, 3000];
  var wins = [], doors = [];
  try {
    var save = cur; cur = idx;
    wins = (detectWindows() || []).map(function (w) {
      var mmW = (w.ow || w.w) / (f.pxPerM || 100) * 1000;
      var best = STD_W[0];
      STD_W.forEach(function (v) { if (Math.abs(v - mmW) < Math.abs(best - mmW)) best = v; });
      var std = Math.abs(best - mmW) <= 150 ? best : Math.round(mmW / 50) * 50;
      return { x: Math.round(w.ox != null ? w.ox : w.x), y: Math.round(w.oy != null ? w.oy : w.y),
        w: Math.round(w.ow || w.w), ang: w.ang || 0, mm: std };
    });
    doors = DOORS.map(function (d) {
      var dmm = d.w / (f.pxPerM || 100) * 1000;
      var STD_D = [600, 700, 800, 900, 1000, 1200, 1500];
      var bd = STD_D[0];
      STD_D.forEach(function (v) { if (Math.abs(v - dmm) < Math.abs(bd - dmm)) bd = v; });
      return { x: Math.round(d.x), y: Math.round(d.y), w: Math.round(d.w), ang: d.ang,
        side: d.side, hinge: d.hinge, mm: Math.abs(bd - dmm) <= 120 ? bd : Math.round(dmm / 50) * 50 };
    });
    cur = save;
  } catch (e) { console.error('[plan_editor] geom windows:', e); }
  return { walls: walls, wins: wins, doors: doors };
}

/** Геометрия всех этажей — считается при сохранении, уезжает в данные планов */
function computeGeom() {
  DATA.floors.forEach(function (f, fi) {
    try { f.geom = exportGeom(fi); }
    catch (e) { console.error('[plan_editor] geom:', e); f.geom = f.geom || null; }
  });
}

function labelRooms() {
  var m = getMask(); if (!m) return null;
  if (m.labels) return m;
  var f = F(), ppm = (f.pxPerM || 100) * m.k;
  var W = m.w, H = m.h, B = m.bar, N = W * H;
  var d = new Int16Array(N), i, x, y, v;
  for (i = 0; i < N; i++) d[i] = B[i] ? 0 : 30000;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    i = y * W + x; if (!d[i]) continue;
    v = d[i];
    if (x) v = Math.min(v, d[i - 1] + 1);
    if (y) {
      v = Math.min(v, d[i - W] + 1);
      if (x) v = Math.min(v, d[i - W - 1] + 1);
      if (x < W - 1) v = Math.min(v, d[i - W + 1] + 1);
    }
    d[i] = v;
  }
  for (y = H - 1; y >= 0; y--) for (x = W - 1; x >= 0; x--) {
    i = y * W + x; if (!d[i]) continue;
    v = d[i];
    if (x < W - 1) v = Math.min(v, d[i + 1] + 1);
    if (y < H - 1) {
      v = Math.min(v, d[i + W] + 1);
      if (x < W - 1) v = Math.min(v, d[i + W + 1] + 1);
      if (x) v = Math.min(v, d[i + W - 1] + 1);
    }
    d[i] = v;
  }
  var r = Math.max(3, Math.round(0.63 * ppm));
  var lab = new Int32Array(N), q = new Int32Array(N), qt = 0, L = 0;
  for (i = 0; i < N; i++) {                       // ядра комнат
    if (lab[i] || d[i] <= r) continue;
    L++;
    lab[i] = L; q[qt++] = i;
    var hd = qt - 1;
    while (hd < qt) {
      var idx = q[hd++], xx = idx % W;
      if (xx && d[idx - 1] > r && !lab[idx - 1]) { lab[idx - 1] = L; q[qt++] = idx - 1; }
      if (xx < W - 1 && d[idx + 1] > r && !lab[idx + 1]) { lab[idx + 1] = L; q[qt++] = idx + 1; }
      if (idx >= W && d[idx - W] > r && !lab[idx - W]) { lab[idx - W] = L; q[qt++] = idx - W; }
      if (idx < N - W && d[idx + W] > r && !lab[idx + W]) { lab[idx + W] = L; q[qt++] = idx + W; }
    }
  }
  var qh = 0;                                      // разрастание ядер
  while (qh < qt) {
    var id2 = q[qh++], Lc = lab[id2], x2 = id2 % W;
    if (x2 && d[id2 - 1] > 0 && !lab[id2 - 1]) { lab[id2 - 1] = Lc; q[qt++] = id2 - 1; }
    if (x2 < W - 1 && d[id2 + 1] > 0 && !lab[id2 + 1]) { lab[id2 + 1] = Lc; q[qt++] = id2 + 1; }
    if (id2 >= W && d[id2 - W] > 0 && !lab[id2 - W]) { lab[id2 - W] = Lc; q[qt++] = id2 - W; }
    if (id2 < N - W && d[id2 + W] > 0 && !lab[id2 + W]) { lab[id2 + W] = Lc; q[qt++] = id2 + W; }
  }
  var cnt = new Int32Array(L + 1), edge = new Uint8Array(L + 1);
  var mn = new Int32Array(L + 1);
  for (i = 0; i <= L; i++) mn[i] = -1;
  for (i = 0; i < N; i++) {
    var Lx = lab[i]; if (!Lx) continue;
    cnt[Lx]++;
    if (mn[Lx] < 0) mn[Lx] = i;
    x = i % W; y = (i / W) | 0;
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) edge[Lx] = 1;
  }
  m.labels = lab; m.labCnt = cnt; m.labEdge = edge; m.labMin = mn; m.labN = L;
  return m;
}

/** Контур области метки L → полигон в пикселях изображения.
 *  Обход границы по рёбрам (crack following), регион всегда справа. */
function traceLabel(m, L) {
  var W = m.w, H = m.h, lab = m.labels;
  var s0 = m.labMin[L]; if (s0 < 0) return null;
  var bx = s0 % W, by = (s0 / W) | 0;
  function inR(x, y) { return x >= 0 && y >= 0 && x < W && y < H && lab[y * W + x] === L; }
  // dir: 0→право, 1→вниз, 2→влево, 3→вверх; клетки слева/справа по ходу
  var LA = [[0, -1], [0, 0], [-1, 0], [-1, -1]];
  var RA = [[0, 0], [-1, 0], [-1, -1], [0, -1]];
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  var x = bx, y = by, dir = 0, pts = [], steps = 0, maxSteps = 8 * W * H;
  do {
    pts.push([x, y]);
    var la = LA[dir], ra = RA[dir];
    if (inR(x + la[0], y + la[1])) dir = (dir + 3) % 4;        // поворот влево
    else if (!inR(x + ra[0], y + ra[1])) dir = (dir + 1) % 4;  // поворот вправо
    x += DX[dir]; y += DY[dir];
  } while (!(x === bx && y === by) && ++steps < maxSteps);
  if (pts.length < 8 || steps >= maxSteps) return null;
  var simp = dpSimp(pts, 2.4);
  if (simp.length < 3 || simp.length > 200) return null;
  return simp.map(function (q) { return [Math.round(q[0] / m.k), Math.round(q[1] / m.k)]; });
}

function dpSimp(pts, eps) {

/** Прилипание краёв прямоугольника к внутренним граням стен (±20 px плана) */

/**

 * плана. Если рядом угол (стена и по горизонтали, и по вертикали) — точка
 * встаёт в него: масштаб чаще всего снимают по проёму или углу комнаты.

function snapRect(a, b) {

/** Shift: следующая точка контура строго по горизонтали/вертикали от прежней */

/** Радиатор: клик рядом с окном центрируется по окну (70% его ширины),

    if (dW < bestD) { bestD = dW; bestW = wins[wi]; }
  }

    w: Math.round(bestW.w), ang: bestW.ang };

    var sx = Math.round(p[0] * m.k), sy = Math.round(p[1] * m.k);
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]], best = null;

    for (x = W - 1; x > 0; x--) { i = y * W + x; if (B[i] && B[i - 1]) hr[i - 1] = hr[i]; }
  }
  for (x = 0; x < W; x++) {
    var run2 = 0;
    for (y = 0; y < H; y++) { i = y * W + x; run2 = B[i] ? run2 + 1 : 0; vr[i] = run2; }
    for (y = H - 1; y > 0; y--) { i = y * W + x; if (B[i] && B[i - W]) vr[i - W] = vr[i]; }

  for (y = 0; y < H; y++) {

    // рваное покрытие. Такие проёмы собираем отдельно, со стороной навески

  DOORS = [];
}

/** Медиана: одна ошибочная комната не должна утащить за собой масштаб. */
function median(a) {
  var v = a.slice().sort(function (x, y) { return x - y; });
  if (!v.length) return 0;
  return v.length % 2 ? v[(v.length - 1) / 2]
                      : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
}

/** Площади найденных на плане комнат (м²) при пробном масштабе.
 *  Сегментация сама зависит от масштаба — labelRooms отделяет комнаты по
 *  проёмам радиусом, заданным в метрах, — поэтому метки сбрасываются на
 *  каждый прогон, а прежний масштаб возвращается на место. */
function roomAreasAt(ppmTry) {
  var f = F(), was = f.pxPerM, out = [];
  if (!getMask()) return out;
  f.pxPerM = ppmTry;
  resetScaleCaches();
  try { out = enumerateRooms().map(function (r) { return r.m2; }); }
  catch (e) { console.error('[plan_editor] scale rooms:', e); }
  f.pxPerM = was;
  resetScaleCaches();
  return out;
}

/** Общий множитель площадей: самое плотное скопление отношений «комната
 *  расчёта к комнате плана».
 *
 *  Пары не сводятся по порядку размера: на плане всегда находятся помещения,
 *  которых в расчёте нет (коридоры, гардеробные, лоджии), и одно лишнее сбило
 *  бы весь ряд. Берём ВСЕ отношения: верные ложатся кучно вокруг истинного
 *  множителя, случайные рассыпаются. Окно шириной ±8% по стороне помещения
 *  (±17% по площади) с наибольшим числом отношений и даёт ответ. */
function fitAreaRatio(measured, targets) {
  var rs = [];
  measured.forEach(function (a) {
    if (a > 0) targets.forEach(function (b) { if (b > 0) rs.push(b / a); });
  });
  if (rs.length < 2) return null;
  rs.sort(function (x, y) { return x - y; });
  var bi = 0, bj = 0;
  for (var i = 0; i < rs.length; i++) {
    var hi = rs[i] * 1.17, j = i;
    while (j + 1 < rs.length && rs[j + 1] <= hi) j++;
    if (j - i > bj - bi) { bi = i; bj = j; }
  }
  return median(rs.slice(bi, bj + 1));
}

/** Сколько комнат плана сошлись с расчётом при этом множителе — мера доверия
 *  к масштабу. Комната расчёта занята одной комнатой плана: две одинаковые
 *  спальни не должны считаться за одно совпадение дважды. */
function agreeCount(measured, targets, ratio) {
  var used = {}, ok = 0;
  measured.forEach(function (a) {
    var bestJ = -1, bestE = 1;
    targets.forEach(function (b, j) {
      if (used[j] || !(b > 0)) return;
      var e = Math.abs(a * ratio - b) / b;
      if (e < bestE) { bestE = e; bestJ = j; }
    });
    if (bestJ >= 0 && bestE <= 0.12) { used[bestJ] = 1; ok++; }
  });
  return ok;
}

/** Масштаб по площадям комнат расчёта: сколько пикселей плана в метре.
 *
 *  Единственное число разметки, которого нет ни на чертеже, ни в расчёте, —
 *  и без него не работают ни авторазметка комнат, ни расстановка радиаторов.
 *  Считаем от обратного: помещения на плане уже находятся по стенам, их
 *  площади в расчёте известны, остаётся подобрать множитель.
 *
 *  Одного прогона мало: при заведомо неверном масштабе комнаты слипаются
 *  через проёмы или рассыпаются на куски. Поэтому идём лесенкой пробных
 *  масштабов, у каждого меряем согласие с расчётом, а лучший уточняем ещё
 *  дважды — уже на его собственной сегментации. */
function guessScale() {
  var targets = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && r.area > 0;
  }).map(function (r) { return r.area; });
  if (targets.length < 2) return null;
  var best = null;
  [40, 70, 110, 170, 260].forEach(function (ppmTry) {
    var meas = roomAreasAt(ppmTry);
    var ratio = fitAreaRatio(meas, targets);
    if (!ratio) return;
    var ppm = ppmTry / Math.sqrt(ratio), ok = agreeCount(meas, targets, ratio);
    if (ppm < 10 || ppm > 600) return;
    if (!best || ok > best.ok) best = { ppm: ppm, ok: ok };
  });
  if (!best) return null;
  for (var k = 0; k < 2; k++) {
    var meas2 = roomAreasAt(best.ppm);
    var ratio2 = fitAreaRatio(meas2, targets);
    if (!ratio2) break;
    var ppm2 = best.ppm / Math.sqrt(ratio2), ok2 = agreeCount(meas2, targets, ratio2);
    if (ppm2 < 10 || ppm2 > 600 || ok2 < best.ok) break;
    var settled = Math.abs(ppm2 - best.ppm) / best.ppm < 0.02;
    best = { ppm: ppm2, ok: ok2 };
    if (settled) break;
  }
  best.total = targets.length;
  // Три сошедшиеся комнаты (или все, если их всего две) — граница, ниже
  // которой это уже не подбор, а совпадение.
  return best.ok >= Math.min(3, targets.length) ? best : null;
}

/** Чем проверить подобранный масштаб: ширина дверных проёмов. Величина
 *  известна каждому монтажнику — 0,8–0,9 м, и разъехавшийся масштаб виден по
 *  ней сразу, в отличие от площадей, по которым он и подбирался. */
function doorWidthM() {
  try { detectWindows(); } catch (e) { return 0; }
  var f = F();
  if (!DOORS.length || !f.pxPerM) return 0;
  return median(DOORS.map(function (d) { return d.w / f.pxPerM; }));
}

/** Кнопка «Масштаб по расчёту», она же автоподбор при загрузке плана.
 *  silent — молчать о неудаче: при загрузке плана комнат в расчёте может и
 *  не быть, ругаться тут не на что. */
function autoScale(silent) {
  var g = null;
  try { g = guessScale(); } catch (e) { console.error('[plan_editor] scale:', e); }
  if (!g) {
    if (!silent) hint('Масштаб по расчёту подобрать не удалось. Задайте его кнопкой ' +
      '«Масштаб»: две точки отрезка с известной длиной. Для подбора нужны хотя бы три ' +
      'комнаты этажа в подробном расчёте и читаемые стены на подложке.');
    return false;
  }
  // Проверяем не тем, чем подбирали: площади можно свести к чему угодно, если
  // комнаты в расчёте вообще от другого объекта, а ширина дверного проёма —
  // величина известная. Вышло полтора метра — подобрался не масштаб, а
  // совпадение, и такой лучше не ставить вовсе.
  var f = F(), was = f.pxPerM;
  f.pxPerM = g.ppm; resetScaleCaches();
  var dw = doorWidthM();
  f.pxPerM = was; resetScaleCaches();
  if (dw && (dw < 0.6 || dw > 1.3)) {
    if (!silent) hint('Масштаб по расчёту не принят: при нём дверные проёмы плана выходят ' +
      dw.toFixed(2).replace('.', ',') + ' м вместо обычных 0,8–0,9. Похоже, комнаты в ' +
      'расчёте не от этого этажа. Задайте масштаб кнопкой «Масштаб».');
    return false;
  }
  // При загрузке отменять нечего: снимок 'plan' уже сделан и масштаб в нём.
  if (!silent) pushUndo('scale');
  f.pxPerM = g.ppm;
  resetScaleCaches();
  renderZones(); draw(); updateGuide();
  hint('<span class=ok>Масштаб подобран по площадям комнат расчёта: сошлось ' + g.ok +
    ' из ' + g.total + '.</span> ' +
    (dw ? 'Проверьте: дверные проёмы получились ' + dw.toFixed(2).replace('.', ',') +
      ' м — если это не так, задайте масштаб кнопкой «Масштаб». '
        : 'Проверьте его кнопкой «Масштаб» по любому известному размеру. ') +
    'Дальше — «Распознать комнаты».');
  return true;
}

/** Подложка на месте, а масштаба у этажа нет — подбираем сам.
 *
 *  Нужно для планов, пришедших не из файла, а из распознавания: их подложку
 *  кладёт калькулятор, applyPlanCanvas в этом случае не работает. Один раз на
 *  этаж: не подобрался — значит, монтажник задаст его вручную, и навязываться
 *  на каждой перерисовке незачем. Через таймер, потому что зовут отсюда из
 *  draw(), а autoScale сам draw() и вызывает. */
var scaleTried = {};
function tryAutoScaleOnce() {
  var f = F();
  if (!f || !f.img || f.pxPerM || scaleTried[cur] || !imgCache[cur]) return;
  scaleTried[cur] = true;
  setTimeout(function () { autoScale(true); }, 0);
}

/** Подложка этажа в кэше картинок: маску по ней строит getMask, а он берёт
 *  только готовую. Для текущего этажа это делает draw(), для остальных — никто:
 *  их разметка идёт «вслепую», без открытия вкладки. */
function ensureImage(fi) {
  return new Promise(function (ok) {
    var f = DATA.floors[fi];
    if (!f || !f.img) { ok(false); return; }
    if (imgCache[fi]) { ok(true); return; }
    var im = new Image();
    if (f.img.indexOf('data:') !== 0) im.crossOrigin = 'anonymous';
    im.onload = function () { imgCache[fi] = im; ok(true); };
    im.onerror = function () { ok(false); };
    im.src = f.img;
  });
}

/**
 * «Разметить всё»: масштаб → комнаты → радиаторы → коллектор → сохранение,
 * по всем этажам подряд.
 *
 * Ничего нового кнопка не считает — зовёт те же autoScale, autoRooms, autoRads
 * и saveAll. Но по отдельности их пять, идут они в строгом порядке и на каждом
 * этаже заново, а бросают разметку ровно на середине этого порядка.
 *
 * Уже размеченное не сносится: autoRooms пропускает комнаты, где зона есть,
 * autoRads — окна, под которыми уже стоит радиатор. Поэтому нажать её можно и
 * после ручных правок, и второй раз подряд.
 */
var autoBusy = false;
function autoMarkAll() {
  if (autoBusy) return;
  if (!DATA.floors.some(function (f) { return f.img; })) {
    alert('Сначала загрузите план этажа.'); return;
  }
  autoBusy = true;
  var btn = document.getElementById('b_automark');
  if (btn) btn.disabled = true;
  var was = cur, zones = 0, rads = 0, colls = 0, bad = [];
  // Возвращаем обещание: кнопке оно не нужно, но по нему видно, когда разметка
  // кончилась, — этим пользуется стенд, и это же понадобится, если запускать
  // разметку не рукой.
  var chain = Promise.resolve();
  DATA.floors.forEach(function (f, fi) {
    chain = chain.then(function () {
      if (!f.img) return null;
      cur = fi;
      hint('Размечаю ' + (fi + 1) + '-й этаж из ' + DATA.floors.length + '…');
      return ensureImage(fi).then(function (okImg) {
        var name = (fi + 1) + '-й этаж';
        if (!okImg) { bad.push(name + ' — подложка не открылась'); return; }
        if (!f.pxPerM) autoScale(true);
        if (!f.pxPerM) { bad.push(name + ' — не подобрался масштаб'); return; }
        var z0 = f.zones.length, r0 = (f.rads || []).length;
        autoRooms();
        autoRads();
        zones += f.zones.length - z0;
        rads += (f.rads || []).length - r0;
        // Коллектор ТП ставим в котельную — там он и стоит. Котельной на
        // этаже нет, а тёплый пол есть — место неочевидно, точку ставит
        // монтажник, и об этом надо сказать вслух.
        var hasTp = f.zones.some(function (z) { return z.type === 'tp'; });
        var bz = null;
        f.zones.forEach(function (z) { if (z.type === 'boiler') bz = z; });
        if (hasTp && !f.coll) {
          if (bz) {
            var c = centroid(bz.pts);
            f.coll = { x: Math.round(c[0]), y: Math.round(c[1]) };
            colls++;
          } else {
            bad.push(name + ' — некуда поставить коллектор ТП: котельная не отмечена');
          }
        }
      });
    });
  });
  return chain.then(function () {
    cur = was;
    if (mode !== 'select') setMode('select');
    renderTabs(); renderZones(); draw(); updateGuide();
    return saveAll();      // сохранение считает трассы, подводки и контуры стен
  }).then(function () {
    var done = zones + rads + colls;
    hint((done
      ? '<span class=ok>Разметка готова и сохранена.</span> Зон: ' + zones +
        ', радиаторов: ' + rads + (colls ? ', коллекторов ТП: ' + colls : '') + '. '
      : '<span class=ok>Сохранено.</span> Новых зон и радиаторов не нашлось. ') +
      (bad.length ? '<b>Осталось руками:</b> ' + bad.join('; ') + '. ' : '') +
      'Проверьте зоны и радиаторы — и «Листы проекта» в калькуляторе.');
  })['catch'](function (e) {
    console.error('[plan_editor] авторазметка:', e);
    hint('Разметить всё не удалось: ' + (e && e.message ? e.message : e) +
      '. Пройдите шаги по одному — кнопками выше.');
  }).then(function () {
    autoBusy = false;
    if (btn) btn.disabled = false;
  });
}

/** Какими зонами комната подробного расчёта ложится на план.
 *
 *  Назначение помещения важнее системы: котельная и санузел дают зону своего
 *  типа — по ним собираются компоновка котельной и листы водоснабжения с
 *  канализацией. Тёплый пол в том же помещении добавляется второй зоной по
 *  тому же контуру: убрать его нельзя, из геометрии выпадут петли, по которым
 *  смета считает трубу. */
function zoneKindsOfRoom(r) {
  var out = [], nm = (r && r.name) || '';
  if (/котельн|топочн|бойлерн/i.test(nm)) out.push('boiler');
  else if (wcCardOf(nm)) out.push('wc');
  if (((r && r.sys) || []).indexOf('tp') >= 0) out.push('tp');
  return out;
}

/** Отмечена ли котельная хоть на одном этаже: в доме она одна. */
function hasBoilerZone() {
  return DATA.floors.some(function (fl) {
    return (fl.zones || []).some(function (z) { return z.type === 'boiler'; });
  });
}

/** «Распознать комнаты»: зоны по комнатам подробного расчёта — тёплый пол,
 *  котельная и санузлы, тип берётся из самой комнаты (zoneKindsOfRoom).
 *  Сопоставление по площади (лучшие пары, допуск 25% или 2 м²); без расчёта —
 *  зоны ТП для всех найденных комнат. Уже размеченные комнаты не трогаются. */
function autoRooms() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб: кнопкой «Масштаб по расчёту» или «Масштаб».'); return; }
  var rooms = [];
  try { rooms = enumerateRooms(); } catch (e) { console.error('[plan_editor] rooms:', e); }
  if (!rooms.length) {
    hint('Комнаты распознать не удалось (пёстрая подложка?) — обведите зоны вручную.');
    return;
  }
  var free = rooms.filter(function (r) {
    var c = centroid(r.pts);
    return !F().zones.some(function (z) { return pip(c, z.pts); });
  });
  var targets = calcRooms.filter(function (r) {
    return (+r.floor || 1) === cur + 1 && zoneKindsOfRoom(r).length;
  });
  pushUndo('zones');
  var made = 0, missed = [], cnt = {}, boiler = hasBoilerZone();
  if (targets.length) {
    var pairs = [];
    targets.forEach(function (t, ti) {
      free.forEach(function (c, ci) { pairs.push([Math.abs(c.m2 - t.area), ti, ci]); });
    });
    pairs.sort(function (a, b) { return a[0] - b[0]; });
    var tU = {}, cU = {};
    pairs.forEach(function (p) {
      if (tU[p[1]] || cU[p[2]]) return;
      var t = targets[p[1]];
      if (p[0] > Math.max(2, 0.25 * t.area)) return;
      tU[p[1]] = 1; cU[p[2]] = 1;
      var pts = simplifyZone(free[p[2]].pts, F().pxPerM || 100);
      zoneKindsOfRoom(t).forEach(function (kind) {
        // Вторую котельную не заводим: на этаже её запрещает addZone, а в
        // доме она одна — по ней собирается компоновка.
        if (kind === 'boiler' && boiler) return;
        if (kind === 'boiler') boiler = true;
        F().zones.push({ type: kind, name: t.name, pts: pts });
        cnt[kind] = (cnt[kind] || 0) + 1;
        made++;
      });
    });
    targets.forEach(function (t, ti) { if (!tU[ti]) missed.push(t.name); });
  }
  if (!made) {
    free.forEach(function (c) {
      F().zones.push({ type: 'tp', name: '', pts: simplifyZone(c.pts, F().pxPerM || 100) });
      made++;
    });
    cnt = { tp: made };
    missed = [];
  }
  // Санузел подписан именем из расчёта — приборы по его карточке встают сами
  if (cnt.wc && fixAuto) refreshAutoFixtures();
  renderZones(); draw();
  var NAMES = { tp: 'тёплый пол', boiler: 'котельная', wc: 'санузлы' };
  var parts = ['tp', 'boiler', 'wc'].filter(function (k) { return cnt[k]; })
    .map(function (k) { return NAMES[k] + ' ' + cnt[k]; });
  hint('<span class=ok>Найдено комнат: ' + rooms.length + ', создано зон: ' +
    (parts.length ? parts.join(', ') : '0') + '.</span>' +
    (missed.length ? ' Не совпали по площади: ' + missed.join(', ') + ' — обведите вручную.' : '') +
    (hasBoilerZone() ? '' : ' Котельную отметьте сами (тип зоны «Котельная») — ' +
      'без неё проект не выпускается.') +
    ' Лишние зоны удаляйте крестиком, имена правятся в списке.');
}

/** Кнопка «Под окна»: расставить радиаторы по найденным окнам */
function autoRads() {
  if (!F().pxPerM) { alert('Сначала задайте масштаб: кнопкой «Масштаб по расчёту» или «Масштаб».'); return; }
  var wins = floorWindows();
  if (!wins.length) {
    hint('Окна распознать не удалось (нечёткий план?) — расставьте радиаторы кликами.');
    if (mode !== 'rad') setMode('rad');
    return;
  }
  pushUndo('zones');
  var added = 0, ppmI = F().pxPerM;
  wins.forEach(function (w) {
    var busy = (F().rads || []).some(function (r) {
      return Math.hypot(r.x - w.x, r.y - w.y) < 0.7 * ppmI;
    });
    if (busy) return;
    F().rads.push({ x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), ang: w.ang });
    added++;
  });
  renderZones(); draw();
  hint('<span class=ok>Найдено окон: ' + wins.length + ', поставлено радиаторов: ' + added +
    '.</span> Лишние уберите кликом по значку, недостающие добавьте кликом.');
  if (mode !== 'rad') setMode('rad');
}

function loadPdfPlan(file, done) {
  hint('Читаю PDF…');
  var rd = new FileReader();
  rd.onload = function () {
    loadPdfJs().then(function (pdfjs) {
      return pdfjs.getDocument({ data: rd.result }).promise;
    }).then(function (pdf) {
      var pno = 1;
      if (pdf.numPages > 1) {
        pno = parseInt(prompt('В PDF «' + file.name + '» ' + pdf.numPages +
          ' стр. Какая страница с планом?', '1'), 10);
        if (!(pno >= 1 && pno <= pdf.numPages)) pno = 1;
      }
      return pdf.getPage(pno);
    }).then(function (page) {
      var vp1 = page.getViewport({ scale: 1 });
      var k = Math.min(4, 1600 / Math.max(vp1.width, vp1.height));
      var vp = page.getViewport({ scale: k });
      var c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);  // PDF бывает прозрачным
      return page.render({ canvasContext: g, viewport: vp }).promise.then(function () {
        applyPlanCanvas(c);
        if (done) done();
      });
    }).catch(function (e) {
      console.error('[plan_editor] pdf:', e);
      hint('');
      alert('Не удалось прочитать PDF «' + file.name +
        '». Сохраните план картинкой (скриншот страницы) и загрузите её.');
      if (done) done();
    });
  };
  rd.readAsArrayBuffer(file);
}

/** Один файл (картинка или PDF) → подложка ТЕКУЩЕГО этажа; резолв по готовности */
function loadOne(file) {
  return new Promise(function (done) {
    if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      loadPdfPlan(file, done); return;
    }
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        // даунскейл: localStorage не резиновый, 1600 px хватает для печати подложкой
        var k = Math.min(1, 1600 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        applyPlanCanvas(c);
        done();
      };
      im.onerror = function () {
        alert('Не удалось прочитать файл «' + file.name + '».');
        done();
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function loadImage(inp) {
  var files = Array.prototype.slice.call(inp.files || []);
  inp.value = '';
  if (!files.length) return;
  // Один файл — в текущий этаж (замена подложки). Несколько — по этажам:
  // первый в текущий, если тот пуст, дальше каждый файл в новый этаж.
  var chain = Promise.resolve();
  files.forEach(function (file, idx) {
    chain = chain.then(function () {
      if (files.length > 1 && (idx > 0 || F().img)) {
        undoStack.push({ t: 'floorAdd' });
        DATA.floors.push({ img: null, w: 0, h: 0, pxPerM: 0, zones: [], rads: [] });
        cur = DATA.floors.length - 1;
        renderTabs();
      }
      return loadOne(file);
    });
  });
  if (files.length > 1) chain.then(function () {
    // Масштаб на каждом этаже подбирается сам; напоминаем только про те,
    // где не вышло, — иначе подсказка гонит делать уже сделанное.
    var left = DATA.floors.filter(function (fl) { return fl.img && !fl.pxPerM; }).length;
    hint('Загружено файлов: ' + files.length + '. ' + (left
      ? 'Задайте масштаб на этажах, где он не подобрался: ' + left +
        ' из ' + DATA.floors.length + ' (вкладки сверху).'
      : 'Масштаб подобран на всех этажах — проверьте его и размечайте комнаты.'));
  });
}

function cs() { return F().w ? cv.width / F().w : 1; }  // канвас-пиксели на пиксель изображения

/**
 * Масштаб подложки на экране. Меняется только CSS-ширина канвы: сама она всегда
 * рисуется в 1200 точек, а клики пересчитываются через getBoundingClientRect
 * (см. evPt), поэтому от увеличения ничего не съезжает — ни зоны, ни радиаторы.
 * Плана мелкого чертежа иначе не разглядеть: обвести комнату по стенам, которые
 * в палец толщиной, невозможно.
 */
/**
 * Координатная сетка рабочего поля: точки с мелким шагом и крестики на каждом
 * пятом узле — так размечено поле в САПР. Пустой холст перестаёт быть просто
 * серым прямоугольником, а у подложки с полями видно, где кончается лист.
 *
 * Рисуется одним заполнением по образцу (createPattern): точек на холсте
 * больше семи тысяч, и класть их поштучно на каждую перерисовку — заметная
 * задержка при перетаскивании зон. Образец пересобирается только при смене
 * темы, ключ кэша — она же.
 */
var GRID_DOT = 12, GRID_CROSS = 5;   // шаг точек и через сколько точек крестик
var _gridPat = null, _gridKey = '';
function gridPattern() {
  var key = darkPlan ? 'd' : 'l';
  if (_gridPat && _gridKey === key) return _gridPat;
  var side = GRID_DOT * GRID_CROSS;
  var t = document.createElement('canvas');
  t.width = side; t.height = side;
  var g = t.getContext('2d');
  g.fillStyle = darkPlan ? '#343434' : '#d7d7d7';
  for (var y = 0; y < side; y += GRID_DOT)
    for (var x = 0; x < side; x += GRID_DOT) g.fillRect(x, y, 1, 1);
  // крестик в узле образца — он и повторится каждые пять точек
  g.strokeStyle = darkPlan ? '#4a4a4a' : '#b4b4b4';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(0.5 - 3, 0.5); g.lineTo(0.5 + 3, 0.5);
  g.moveTo(0.5, 0.5 - 3); g.lineTo(0.5, 0.5 + 3);
  g.stroke();
  _gridPat = cx.createPattern(t, 'repeat');
  _gridKey = key;
  return _gridPat;
}
function drawGrid() {
  var p = gridPattern();
  if (!p) return;
  cx.save();
  cx.fillStyle = p;
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.restore();
}

/**
 * Тёмный вид подложки. Сканы и чертежи белые, и на графитовой ленте лист светит
 * прожектором — в САПР его показывают наоборот, светлыми линиями по тёмному.
 * Переключатель нужен для фотографий плана: снимок с телефона в инверсии
 * выглядит негативом, и разобрать на нём стены труднее, чем в оригинале.
 */
var darkPlan = true;
try { darkPlan = localStorage.getItem('plan_editor_darkplan') !== '0'; } catch (e) {}
function toggleDarkPlan() {
  darkPlan = !darkPlan;
  _gridPat = null;   // сетка своя у каждой темы — образец пересоберётся
  try { localStorage.setItem('plan_editor_darkplan', darkPlan ? '1' : '0'); } catch (e) {}
  var b = document.getElementById('b_darkplan');
  if (b) b.className = darkPlan ? 'on' : 'ghost';
  draw();
}

// Меньше 100 % — чтобы увидеть высокий план целиком: по ширине холст вписан в
// поле всегда, а по высоте вытянутый этаж уходит под экран.
var ZOOM_MIN = 0.25, ZOOM_MAX = 4, viewZoom = 1;
try { viewZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, parseFloat(localStorage.getItem('plan_editor_zoom')) || 1)); } catch (e) {}
function applyZoom() {
  if (viewZoom === 1) { cv.style.width = ''; cv.style.maxWidth = ''; }
  else { cv.style.width = (viewZoom * 100) + '%'; cv.style.maxWidth = 'none'; }
  var v = document.getElementById('zoom_val');
  if (v) v.textContent = Math.round(viewZoom * 100) + ' %';
}
function setZoom(z) {
  viewZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  try { localStorage.setItem('plan_editor_zoom', String(viewZoom)); } catch (e) {}
  applyZoom();
}
function zoomStep(dir) { setZoom(Math.round((viewZoom + dir * 0.25) * 100) / 100); }

// ─── Петли тёплого пола в редакторе ───────────────────────────────────
// Зона показывается не заливкой, а самой укладкой: те же змейки, что уйдут
// на лист, — красная подача, синяя обратка. Раскладку считает project_plans.js,
// поэтому редактор и лист рисуют одно и то же.
var UFH_STEP = [150, 150];
try {
  var _stp = JSON.parse(localStorage.getItem('stout_save'));
  if (_stp) { UFH_STEP[0] = +_stp.ufhStep1 || 150; UFH_STEP[1] = +_stp.ufhStep2 || 150; }
} catch (e) {}
// Деление петель — по длине трубы (предел 100 м, projectPlans.MAX_LOOP_M),
// как на листах и в смете: редактор считает ту же раскладку тем же вызовом,
// поэтому картинка и число веток совпадают везде.
var loopCache = { key: null, val: {} };
var noLayWarned = {};      // о какой зоне уже сообщили в консоль

function tpLoops(f, stepMm) {
  if (!window.projectPlans || !projectPlans.floorLoops || !f.pxPerM) return {};
  var key = stepMm + '|' + (f.coll ? f.coll.x + ',' + f.coll.y : '-') + '|' +
    JSON.stringify((f.zones || []).map(function (z) {
      return z.type === 'tp' ? z.pts : 0;
    })) + '|' + JSON.stringify(f.leads || []);
  if (loopCache.key === key) return loopCache.val;
  if (dragZ) return loopCache.val;            // тянут край — пересчёт по отпусканию
  var out = {};
  try {
    projectPlans.floorLoops(f, stepMm).forEach(function (Z) {
      if (Z.loops && Z.loops.length && Z.loops[0].sup) out[Z.i] = Z.loops;
    });
  } catch (e) { console.error('[plan_editor] петли:', e); return loopCache.val; }
  loopCache = { key: key, val: out };
  return out;
}

/**
 * Запасная укладка — та же, что рисует лист, когда геометрия петли не
 * строится (узкая зона, лестница внутри контура, слишком мелкий масштаб):
 * встречная змейка по габариту, обрезанная контуром зоны. Комната не
 * остаётся пустой, и в редакторе видно ровно то, что попадёт на лист.
 */
function drawSnake(z, stepMm, k, lw) {
  var f = F(), stepPx = stepMm / 1000 * (f.pxPerM || 100);
  if (!stepPx || z.pts.length < 3) return;
  var xs = z.pts.map(function (p) { return p[0]; });
  var ys = z.pts.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  cx.save();
  cx.beginPath();
  z.pts.forEach(function (p, j) { j ? cx.lineTo(p[0] * k, p[1] * k) : cx.moveTo(p[0] * k, p[1] * k); });
  cx.closePath(); cx.clip();
  var snake = function (yFrom, col) {
    cx.beginPath();
    var dir = 0, first = true;
    for (var y = yFrom; y <= y1; y += 2 * stepPx) {
      if (first) { cx.moveTo(x0 * k, y * k); first = false; }
      cx.lineTo((dir ? x0 : x1) * k, y * k);
      var yn = y + 2 * stepPx;
      if (yn <= y1) cx.lineTo((dir ? x0 : x1) * k, yn * k);
      dir = 1 - dir;
    }
    cx.strokeStyle = col; cx.lineWidth = lw; cx.stroke();
  };
  snake(y0 + stepPx / 2, '#ff8080');
  snake(y0 + stepPx * 1.5, '#8080ff');
  cx.restore();
}

function draw() {
  var f = F();
  if (f.img && !imgCache[cur] && !imgFailed[cur]) {
    var im = new Image();
    // Подложка приходит с proxy.heatcalc.ru, а по ней потом строится карта
    // стен через getImageData. Без разрешения CORS канвас считается
    // «испорченным» чужой картинкой, и «зона по клику» падает с ошибкой
    // безопасности. Сервер отдаёт Access-Control-Allow-Origin: *.
    if (f.img.indexOf('data:') !== 0) im.crossOrigin = 'anonymous';
    im.onload = function () { imgCache[cur] = im; draw(); };
    im.onerror = function () {
      // Имя файла не трогаем: связь появится — подложка подтянется сама
      // после перезагрузки страницы.
      imgFailed[cur] = true;
      hint('Не удалось загрузить подложку этажа с сервера. Проверьте связь и обновите ' +
        'страницу — или загрузите план заново.');
      draw();
    };
    im.src = f.img; return;
  }
  var im2 = imgCache[cur];
  tryAutoScaleOnce();
  if (im2) {
    cv.width = 1200; cv.height = Math.round(1200 * f.h / f.w);
  } else { cv.width = 1200; cv.height = 850; }
  cx.fillStyle = darkPlan ? '#1e1e1e' : '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  drawGrid();
  if (im2) {
    // Подложка в тёмном виде: белый лист становится графитовым, а линии
    // чертежа — светлыми, как вид в САПР. hue-rotate возвращает оттенки,
    // которые перевернула инверсия: подписи площадей на планах красные, и без
    // него они становились бы голубыми.
    // Инвертируется только то, что видно на экране. Распознавание стен и окон
    // читает пиксели со своей отдельной канвы из оригинала (см. maskOf), и
    // подмена цветов до него не доходит.
    cx.save();
    if (darkPlan) cx.filter = 'invert(1) hue-rotate(180deg)';
    cx.drawImage(im2, 0, 0, cv.width, cv.height);
    cx.restore();
  } else {
    cx.fillStyle = '#999'; cx.font = '20px system-ui'; cx.textAlign = 'center';
    cx.fillText('Загрузите план этажа (фото или скан)', cv.width / 2, cv.height / 2);
  }
  var k = cs();
  var stepMm = UFH_STEP[cur] || 150;
  var loops = tpLoops(f, stepMm);
  f.zones.forEach(function (z, i) {
    var col = TYPES[z.type][1];
    var lp = loops[i];
    cx.beginPath();
    z.pts.forEach(function (p, j) { j ? cx.lineTo(p[0] * k, p[1] * k) : cx.moveTo(p[0] * k, p[1] * k); });
    cx.closePath();
    // Зона с посчитанной укладкой показывается петлями, а не заливкой:
    // сразу видно шаг, число веток и как ляжет труба.
    cx.fillStyle = col + (lp ? '14' : '33'); cx.fill();
    cx.lineWidth = lp ? 1.4 : 2; cx.strokeStyle = col; cx.stroke();
    if (lp) {
      var lw = Math.max(1, Math.min(2.4, 0.022 * (f.pxPerM || 100) * k));
      cx.lineJoin = 'round'; cx.lineCap = 'round';
      // Цвета и скругления — как на листах: подача #ff8080, обратка #8080ff,
      // радиус гиба в полшага укладки (труба гнётся, а не ломается).
      var rr = stepMm / 1000 * (f.pxPerM || 100) * k * 0.5;
      lp.forEach(function (L) {
        if (!L.sup || !L.ret) return;
        [[L.sup, '#ff8080'], [L.ret, '#8080ff']].forEach(function (pair) {
          var P = pair[0];
          cx.beginPath();
          cx.moveTo(P[0][0] * k, P[0][1] * k);
          for (var j = 1; j < P.length - 1; j++)
            cx.arcTo(P[j][0] * k, P[j][1] * k, P[j + 1][0] * k, P[j + 1][1] * k, rr);
          cx.lineTo(P[P.length - 1][0] * k, P[P.length - 1][1] * k);

    }
    if (!lp && z.type === 'tp' && f.pxPerM) {
      // Геометрия не построилась — рисуем запасную змейку и говорим об этом
