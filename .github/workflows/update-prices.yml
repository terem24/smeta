name: Weekly Price Parser

on:
  schedule:
    - cron: '0 2 * * *'   # каждый день; запускать ли сегодня — решает AutoSchedule.py
  workflow_dispatch:

# Общая очередь всех, кто пишет catalog.js (см. apply-successors.yml): парсер
# сохраняет каталог снимком от своего старта и затёр бы параллельную правку.
concurrency:
  group: catalog-js-writers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Взять свежий main
        # Задача закреплена за той версией файлов, что была в момент ЗАПУСКА, а не
        # старта. 22.09.2026 из-за этого прогон «другие бренды» отстоял очередь и
        # переписал catalog.js своей копией трёхчасовой давности — 1481 обновление
        # соседнего прогона откатилось. Перед работой берём текущий main.
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Нужен ли запуск сегодня (расписание из админки)
        id: gate
        run: python AutoSchedule.py main
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4
      - name: Run parser script
        if: steps.gate.outputs.run == 'true'
        run: python AutoPrice.py
      - name: Commit and push changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add catalog.js
          if git diff --staged --quiet; then
            echo "Цены и статусы не изменились."
          else
            git commit -m "Автообновление цен"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
