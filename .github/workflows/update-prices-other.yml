name: Monthly Price Parser (other brands)

on:
  schedule:
    - cron: '0 2 20 * *'
  workflow_dispatch:

# Общая очередь всех, кто пишет catalog.js (см. apply-successors.yml): парсер
# сохраняет каталог снимком от своего старта и затёр бы параллельную правку.
concurrency:
  group: catalog-js-writers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Взять свежий main
        # См. тот же шаг в update-prices.yml: 22.09.2026 этот прогон затёр
        # catalog.js копией, снятой в момент запуска задачи, а не её старта.
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4
      - name: Run parser script
        run: python AutoPrice.py --others
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add catalog.js
          if git diff --staged --quiet; then
            echo "Цены и статусы не изменились."
          else
            git commit -m "Автообновление цен (другие бренды)"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
