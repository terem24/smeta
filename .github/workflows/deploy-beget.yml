# Выкладка сайта на хостинг Beget.
#
# Зачем. Сайт раздаётся с GitHub Pages, а часть провайдеров начала резать
# шифрованное соединение к адресам, на которых Pages стоит (185.199.108–111.x).
# У таких пользователей сайт просто не открывается, и узнать об этом нельзя:
# человек, до которого сайт не доехал, в статистику не попадает. Вторая
# причина (26.09.2026) — репозиторий готовим к закрытию: GitHub Pages из
# закрытого репозитория на бесплатном тарифе не работает, сайт будет жить
# только на Beget, а GitHub останется мастерской (код + роботы цен).
#
# Как заливаем. По SSH через rsync — шифровано, и уезжают только файлы,
# у которых поменялось содержимое (--checksum: время файлов после checkout
# всегда «сейчас», по нему сравнивать нельзя). Старый путь по FTP без
# шифрования оставлен запасным: он включается, только если ключа SSH нет.
#
# Что заведено в настройках репозитория
# (Settings → Secrets and variables → Actions):
#   секрет BEGET_SSH_KEY        — закрытая половина ключа (на компьютере
#                                 владельца: ~/.ssh/heatcalc_beget);
#                                 открытая лежит на Beget в ~/.ssh/authorized_keys
#   переменная BEGET_SITE_DIRS  — папки сайта от домашней через пробел, по
#                                 умолчанию обе: new.heatcalc.ru/public_html
#                                 (проверочная копия) и heatcalc.ru/public_html
#                                 (основной сайт; домен к ней прикрепляется
#                                 в панели Beget при переезде)
#   (запасной FTP) BEGET_FTP_HOST / _USER / _PASSWORD / _DIR
#
# Пока ничего не задано, задача честно пропускается и не мигает красным.

name: Выкладка на Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

# Две выкладки разом — верный способ получить полусайт.
# Ставим их в очередь, а не отменяем: отменённая на середине оставила бы
# ровно то, чего мы избегаем.
concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, заведён ли доступ к хостингу
        id: check
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          HOST: ${{ secrets.BEGET_FTP_HOST }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "Заливка по SSH (шифрованная)."
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          elif [ -n "$HOST" ]; then
            echo "::warning::Ключа SSH нет — заливка по FTP без шифрования."
            echo "mode=ftp" >> "$GITHUB_OUTPUT"
          else
            echo "Доступ к Beget не задан — выкладка пропущена, это не ошибка."
            echo "mode=off" >> "$GITHUB_OUTPUT"
          fi

      - name: Забрать файлы репозитория
        if: steps.check.outputs.mode != 'off'
        uses: actions/checkout@v4

      # Список исключений один на оба способа. Ничего лишнего на боевом
      # сервере — особенно php: на Beget он, в отличие от GitHub Pages,
      # по-настоящему исполняется, и копии прокси на сайте создали бы вторую
      # дверь к тем же данным. Исходники, стенды, планы (*.md) — тоже мимо.
      - name: Залить изменившееся по SSH
        if: steps.check.outputs.mode == 'ssh'
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          SITE_DIRS: ${{ vars.BEGET_SITE_DIRS }}
        run: |
          set -o pipefail
          [ -z "$SITE_DIRS" ] && SITE_DIRS="heatcalc.ru/public_html new.heatcalc.ru/public_html"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/beget
          chmod 600 ~/.ssh/beget
          # Отпечаток сервера закреплён: подменённый сервер ключ не получит.
          echo "v953008q.beget.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL2mdvWDDbap1QDeEh8Yq7NqUNCJjpjVymb+9RqSBYYr" > ~/.ssh/known_hosts
          # Без --delete: удалённое из репозитория на сервере остаётся.
          # Права файлов не трогаем (-rlt без -p) — как было при FTP.
          for SITE_DIR in $SITE_DIRS; do
          echo "=== $SITE_DIR"
          rsync -rlt --checksum --omit-dir-times --itemize-changes \
            -e "ssh -i ~/.ssh/beget -o BatchMode=yes" \
            --exclude='.git*' --exclude='.claude/' --exclude='.agents/' \
            --exclude='.github/' --exclude='mobile-android/' --exclude='supabase/' \
            --exclude='bench/' --exclude='scratch/' --exclude='__pycache__/' \
            --exclude='models/' --exclude='*.py' --exclude='*.php' --exclude='*.md' \
            --exclude='*.sql' --exclude='*.ps1' --exclude='CNAME' \
            --exclude='revit_catalog.json' --exclude='price_index.new.json' \
            ./ "v953008q@v953008q.beget.tech:$SITE_DIR/" | { grep -v '^\.' || true; } | tail -n 200
          done
          rm -f ~/.ssh/beget

      - name: Залить изменившееся по FTP (запасной путь)
        if: steps.check.outputs.mode == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          server-dir: ${{ secrets.BEGET_FTP_DIR }}
          # Обычный FTP: оба шифрованных варианта (ftps, ftps-legacy) с Beget
          # не поехали — рвались на середине. Поэтому и перешли на SSH.
          protocol: ftp
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.agents/**
            **/.github/**
            **/mobile-android/**
            **/supabase/**
            **/bench/**
            **/scratch/**
            **/__pycache__/**
            **/models/**
            **/*.py
            **/*.php
            **/*.md
            **/*.sql
            **/*.ps1
            **/CNAME
            **/revit_catalog.json
            **/price_index.new.json

      - name: Проверить, что сайт отвечает
        if: steps.check.outputs.mode != 'off'
        continue-on-error: true
        run: |
          URL="${{ vars.BEGET_CHECK_URL }}"
          if [ -z "$URL" ]; then URL="https://new.heatcalc.ru/index.html"; fi
          echo "Проверяю $URL"
          CODE=$(curl -sS -o /tmp/page.html -w "%{http_code}" --max-time 60 "$URL" || echo 000)
          echo "код ответа: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Сайт ответил $CODE — загляните на хостинг"
            exit 0
          fi
          # Версии файлов в index.html должны совпасть с теми, что в репозитории:
          # иначе заливка прошла наполовину и на сервере смесь двух выпусков.
          WANT=$(grep -o 'app\.js?v=[0-9.]*' index.html | head -1)
          GOT=$(grep -o 'app\.js?v=[0-9.]*' /tmp/page.html | head -1)
          echo "в репозитории: $WANT"
          echo "на сервере:    $GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::warning::Версии не совпали — возможно, залилось не всё"
          fi
