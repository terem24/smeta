name: Proxy Watch

# Автопроверка прокси на Beget (proxy.heatcalc.ru): по расписанию стучимся в те же пять файлов,
# что и кнопка «Проверить серверы» в админке (вкладка «Сервер»), и пишем, когда состояние
# меняется: «перестал отвечать» или «снова отвечает». Уведомления идут через GitHub: состояние
# хранится в одной Issue с меткой proxy-watch, на каждое изменение в неё пишется комментарий
# с упоминанием владельца, и GitHub присылает письмо (и пуш в мобильное приложение GitHub).
# Секретов для основной работы не нужно. Необязательно: секреты SMTP_USER и SMTP_PASS (пароль приложения
# Яндекса; ALERT_TO — куда слать, по умолчанию на SMTP_USER) включают прямое письмо по SMTP при смене
# состояния, в обе стороны, мимо Beget (про падение Beget нельзя сообщать через Beget).
#
# Частота: GitHub запускает файл каждые 15 минут, а реальную проверку делает только тот запуск, что попал
# в шаг из админки (app_settings.proxy_watch.interval: 15/30/60/180/360 минут, по умолчанию 60).
# Ручной запуск (workflow_dispatch) проверяет всегда.
#
# Статус для сайта: после каждой проверки пишется proxy_status.json в корень репозитория (его раздаёт GitHub Pages,
# не Beget). Сайт читает его при загрузке и отключает функции, чьи файлы не отвечают, у всех сразу (переключатель
# «Отключать автоматически» во вкладке «Сервер»). Файл обновляется при смене результата и раз в сутки, чтобы не
# плодить коммиты. Если у workflow нет права записи в репозиторий, шаг сообщит об этом и проверка пойдёт дальше.
#
# Включается и выключается тумблером в админке: app_settings.proxy_watch = {"enabled": bool,
# "digest": bool}. Читается публичным ключом, как и остальные настройки сайта. Пока строки в базе
# нет, проверка и дневная сводка включены. Совсем остановить можно в Actions → Proxy Watch → Disable.
on:
  schedule:
    - cron: '0 * * * *'     # раз в час, в начале часа
  workflow_dispatch:
    inputs:
      test_mail:
        description: 'Только отправить тестовое письмо по SMTP (проверка секретов), проверку Beget не запускать'
        type: boolean
        default: false

permissions:
  contents: write   # только proxy_status.json (см. шаг «Опубликовать статус для сайта»)
  issues: write

concurrency:
  group: proxy-watch
  cancel-in-progress: false

env:
  OWNER_LOGIN: terem24
  SUPABASE_URL: https://ahanbwugsmcyvrwbmtlx.supabase.co
  # Публичный (publishable) ключ из app.js: он и так открыт в браузере каждому посетителю
  SUPABASE_KEY: sb_publishable_gcMJ-PvJmKavObbnePFGZQ_O-pu5O2p

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Тестовое письмо
        if: inputs.test_mail == true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then echo "Секретов SMTP_USER и SMTP_PASS нет"; exit 1; fi
          to="${ALERT_TO:-$SMTP_USER}"
          {
            printf 'From: HeatCalc <%s>\nTo: %s\nSubject: =?UTF-8?B?%s?=\nMIME-Version: 1.0\nContent-Type: text/plain; charset=UTF-8\n\n' "$SMTP_USER" "$to" "$(printf '%s' 'Проверка почты: HeatCalc' | base64 -w0)"
            printf 'Тестовое письмо автопроверки Beget. Если вы его читаете, прямые уведомления настроены верно.\n'
          } > /tmp/mail.txt
          curl -sS --ssl-reqd --url smtps://smtp.yandex.ru:465 --user "$SMTP_USER:$SMTP_PASS" --mail-from "$SMTP_USER" --mail-rcpt "$to" -T /tmp/mail.txt
          echo "Тестовое письмо отправлено"

      - name: Настройки из админки
        id: cfg
        env:
          TEST_MAIL: ${{ inputs.test_mail }}
        run: |
          v=$(curl -s -m 20 "$SUPABASE_URL/rest/v1/app_settings?key=eq.proxy_watch&select=value" -H "apikey: $SUPABASE_KEY" || true)
          enabled=$(echo "$v" | jq -r 'if type=="array" and length>0 and .[0].value.enabled==false then "false" else "true" end' 2>/dev/null || echo true)
          digest=$(echo "$v" | jq -r 'if type=="array" and length>0 and .[0].value.digest==false then "false" else "true" end' 2>/dev/null || echo true)
          interval=$(echo "$v" | jq -r 'if type=="array" and length>0 and (.[0].value.interval|type)=="number" then .[0].value.interval else 60 end' 2>/dev/null || echo 60)
          case "$interval" in 15|30|60|180|360) ;; *) interval=60 ;; esac
          slot=$(( (10#$(date -u +%H) * 60 + 10#$(date -u +%M)) / 15 ))
          step=$(( interval / 15 ))
          due=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( slot % step )) -eq 0 ]; then due=true; fi
          run=false
          if [ "$enabled" = "true" ] && [ "$due" = "true" ] && [ "$TEST_MAIL" != "true" ]; then run=true; fi
          echo "interval=$interval" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Автопроверка: $enabled, шаг: $interval мин, в расписании сейчас: $due, дневная сводка: $digest"

      - name: Проверить прокси
        if: steps.cfg.outputs.run == 'true'
        id: check
        run: |
          check_once() {
            local ok=1 report="" fj="" fok key
            for p in "price_index.php|json|Прайс-индекс" "recognize_archive.php?access=1|json|Архив и доступы" \
                     "gemini_proxy.php||ИИ-прокси" "supabase_proxy.php?path=%2Frest%2Fv1%2F||Вход и база" "geo.php||Геолокация"; do
              IFS='|' read -r path kind name <<< "$p"
              code=$(curl -s -m 15 -o /tmp/body -w '%{http_code}' "https://proxy.heatcalc.ru/$path" || true)
              code=${code:-000}
              fok=true; key=${path%%\?*}
              if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
                ok=0; fok=false; report+="- ❌ $name: не отвечает (HTTP $code)"$'\n'
              elif [ "$kind" = "json" ] && [ "$code" = "200" ] && ! jq -e . /tmp/body >/dev/null 2>&1; then
                ok=0; fok=false; report+="- ❌ $name: ответ не JSON"$'\n'
              else
                report+="- ✅ $name: HTTP $code"$'\n'
              fi
              fj+="\"$key\":$fok,"
            done
            echo "$ok"
            printf '%s' "$report" > /tmp/report
            printf '{%s}' "${fj%,}" > /tmp/filesj
          }
          # Две проверки с паузой: одиночный сбой сети не считается переменой состояния
          a=$(check_once); cp /tmp/report /tmp/report1
          sleep 60
          b=$(check_once)
          if [ "$a" = "1" ] && [ "$b" = "1" ]; then state=up
          elif [ "$a" = "0" ] && [ "$b" = "0" ]; then state=down
          else state=unclear; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "files=$(cat /tmp/filesj)" >> "$GITHUB_OUTPUT"
          { echo 'report<<EOF'; cat /tmp/report; echo; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "Состояние: $state (проверки: $a, $b)"; cat /tmp/report

      - name: Опубликовать статус для сайта
        if: steps.cfg.outputs.run == 'true' && steps.check.outputs.state != 'unclear'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.check.outputs.state }}
          FILES: ${{ steps.check.outputs.files }}
          INTERVAL: ${{ steps.cfg.outputs.interval }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          [ -z "$FILES" ] && { echo "нет данных по файлам"; exit 0; }
          smtp=false; if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then smtp=true; fi
          now=$(( $(date -u +%s) * 1000 ))
          new=$(jq -cn --argjson t "$now" --arg state "$STATE" --argjson interval "$INTERVAL" --argjson smtp "$smtp" --argjson files "$FILES"             '{t:$t,state:$state,interval:$interval,smtp:$smtp,files:$files}')
          cur=$(gh api "repos/$GH_REPO/contents/proxy_status.json?ref=main" 2>/dev/null || true)
          sha=$(echo "$cur" | jq -r '.sha // empty' 2>/dev/null || true)
          old=$(echo "$cur" | jq -r '.content // empty' 2>/dev/null | base64 -d 2>/dev/null || true)
          [ -z "$old" ] && old=null
          same=$(jq -n --argjson a "$old" --argjson b "$new" '($a != null) and (($a|del(.t)) == ($b|del(.t)))' 2>/dev/null || echo false)
          oldt=$(echo "$old" | jq -r '.t // 0' 2>/dev/null || echo 0)
          # Пишем при смене результата и раз в сутки: иначе сайт счёл бы файл устаревшим (он верит 36 часов)
          if [ "$same" = "true" ] && [ $(( now - oldt )) -lt 72000000 ]; then echo "статус без перемен"; exit 0; fi
          args=(-X PUT "repos/$GH_REPO/contents/proxy_status.json" -f message="Статус прокси Beget: $STATE" -f branch=main -f content="$(printf '%s\n' "$new" | base64 -w0)")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          if gh api "${args[@]}" >/dev/null; then echo "статус записан: $new"; else echo "не удалось записать статус: нужны права записи у workflow (Settings → Actions → Workflow permissions)"; fi

      - name: Записать и сообщить
        if: steps.cfg.outputs.run == 'true' && steps.check.outputs.state != 'unclear'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.check.outputs.state }}
          REPORT: ${{ steps.check.outputs.report }}
          DIGEST: ${{ steps.cfg.outputs.digest }}
          INTERVAL: ${{ steps.cfg.outputs.interval }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          gh label create proxy-watch --color 5319e7 --description "Автопроверка прокси Beget" 2>/dev/null || true
          gh label create proxy-up --color 0e8a16 --description "Прокси отвечает" 2>/dev/null || true
          gh label create proxy-down --color d93f0b --description "Прокси не отвечает" 2>/dev/null || true

          admin="Админка: Обзор → Сервер."
          num=$(gh issue list --label proxy-watch --state all --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$num" ]; then
            if [ "$STATE" = "up" ]; then now="отвечает"; else now="не отвечает"; fi
            gh issue create --title "Статус прокси Beget (автопроверка)" --label proxy-watch --label "proxy-$STATE" \
              --assignee "$OWNER_LOGIN" \
              --body "Автопроверка прокси proxy.heatcalc.ru включена, проверка каждые $INTERVAL мин (меняется в админке). Сейчас: **$now**.

          В эту задачу будут приходить комментарии, когда прокси перестанет отвечать или снова заработает, и раз в день краткая сводка. Выключить: тумблер в админке (Обзор → Сервер).

          $REPORT"
            exit 0
          fi

          labels=$(gh issue view "$num" --json labels --jq '[.labels[].name] | join(" ")')
          if echo "$labels" | grep -qw proxy-up; then last=up; elif echo "$labels" | grep -qw proxy-down; then last=down; else last=none; fi
          [ "$(gh issue view "$num" --json state --jq .state)" = "CLOSED" ] && gh issue reopen "$num"

          if [ "$last" != "$STATE" ]; then
            gh issue edit "$num" --add-label "proxy-$STATE" ${last:+--remove-label "proxy-$last"} >/dev/null 2>&1 || gh issue edit "$num" --add-label "proxy-$STATE"
            if [ "$STATE" = "up" ]; then
              body="@$OWNER_LOGIN **Beget снова отвечает: все пять файлов прокси работают.**

          Можно включать: $admin Нажмите «Проверить серверы», а потом «Включить прокси». Если ещё не сделали, сначала перевыпустите ключи (список там же).

          $REPORT"
            else
              body="@$OWNER_LOGIN **Прокси Beget перестал отвечать.**

          Функции через прокси (ИИ, заявки, подложки планов) могут не работать. Если тумблер «Прокси» включён, лучше отключить: $admin

          $REPORT"
            fi
            gh issue comment "$num" --body "$body"
            # Прямое письмо по SMTP Яндекса: только при смене состояния и только если заведены секреты.
            # Нет секретов — остаётся письмо GitHub. Сбой письма не валит проверку.
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
              to="${ALERT_TO:-$SMTP_USER}"
              if [ "$STATE" = "up" ]; then subj="Beget снова отвечает"; else subj="Beget перестал отвечать"; fi
              {
                printf 'From: HeatCalc <%s>\nTo: %s\nSubject: =?UTF-8?B?%s?=\nMIME-Version: 1.0\nContent-Type: text/plain; charset=UTF-8\n\n' \
                  "$SMTP_USER" "$to" "$(printf '%s' "$subj" | base64 -w0)"
                printf '%s: proxy.heatcalc.ru\n\n%s\n\nАдминка: Обзор → Сервер.\n' "$subj" "$REPORT"
              } > /tmp/mail.txt
              curl -sS --ssl-reqd --url smtps://smtp.yandex.ru:465 --user "$SMTP_USER:$SMTP_PASS" \
                --mail-from "$SMTP_USER" --mail-rcpt "$to" -T /tmp/mail.txt \
                && echo "письмо отправлено" || echo "письмо не ушло: проверьте SMTP_USER и SMTP_PASS"
            fi
          elif [ "$DIGEST" = "true" ] && [ "$(date -u +%H)" = "06" ] && [ "$(date -u +%M)" -lt 15 ]; then
            if [ "$STATE" = "up" ]; then now="отвечает"; else now="по-прежнему не отвечает"; fi
            gh issue comment "$num" --body "Дневная сводка: прокси Beget $now.

          $REPORT"
          else
            echo "Без перемен: $STATE"
          fi
