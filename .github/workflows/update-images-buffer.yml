name: Download Buffer Tank Images (STT)

# Картинки буферных ёмкостей STOUT STT-0001…0004 (38 артикулов). Позиции появятся в прайсе и на
# teremonline.ru в ноябре 2026, поэтому поиск запускается 10 ноября и, если что-то не нашлось, ещё
# раз 10 декабря. Дальше сам не запускается: ручной запуск — workflow_dispatch.
# Скрипт идёт с --only, поэтому «не найдено» в articles_not_found.txt не пишет (позиции могли
# просто ещё не выложить) и общий articles_without_images.txt не перезаписывает.
on:
  schedule:
    - cron: '0 6 10 11,12 *'
  workflow_dispatch:

jobs:
  scrape-buffer-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 pillow
      - name: Run parser script
        run: python AutoImage.py --only STT-000
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add img/
          if git diff --staged --quiet; then
            echo "Картинок STT пока нет на сайте — повторим при следующем запуске."
          else
            git commit -m "Картинки буферных ёмкостей STT"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
