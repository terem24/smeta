<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Отладочная страница, в поиске ей делать нечего. -->
<meta name="robots" content="noindex, nofollow">
<title>Проба листа А3 — спецификация</title>
<style>
  /* Шрифты оригинала, полными файлами: ISOCPEUR из поставки AutoCAD и
     GOST-Common. local() первым — если шрифт стоит в системе, берём его. */
  /* Только файл из папки fonts: local() убран намеренно. Установленный в
     системе ISOCPEUR зарегистрирован курсивным начертанием, и при запросе
     прямого правило local() не совпадало — браузер откатывался на Arial
     Narrow, отчего лист переставал быть похожим на оригинал. */
  @font-face {
    font-family: 'ISOCPEUR'; font-style: normal;
    src: url('fonts/isocpeur.ttf?v=4.14') format('truetype');
  }
  @font-face {
    font-family: 'GOST Common'; font-style: normal;
    src: url('fonts/gost_common.ttf?v=4.14') format('truetype');
  }
  body { margin: 0; background: #6b6b6b; font: 14px/1.4 system-ui, sans-serif; color: #fff; }
  .bar { padding: 10px 16px; background: #2b2b2b; display: flex; gap: 16px; align-items: center; }
  .bar b { font-weight: 600; }
  .wrap { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .paper { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.5); }
  svg.sheet-a3 { display: block; width: min(96vw, 1400px); height: auto; }
  svg.sheet-a3 text { fill: #000; stroke: none; }

  @media print {
    @page { size: A3 landscape; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .wrap { padding: 0; gap: 0; }
    .paper { box-shadow: none; break-after: page; }
    .paper:last-child { break-after: auto; }
    svg.sheet-a3 { width: 420mm; height: 297mm; }
  }
</style>
</head>
<body>

<div class="bar">
  <b id="bar_title">Листы проекта</b>
  <span id="bar_note"></span>
  <label style="display:flex;gap:6px;align-items:center">Обвязка узлов:
    <select id="piping_sel" onchange="try{localStorage.setItem('project_nodes_piping',this.value)}catch(e){};location.reload()">
      <option value="insulated">группы в теплоизоляции (по подбору)</option>
      <option value="steel">сборная из нержавейки</option>
    </select>
  </label>
  <button onclick="window.print()">Печать / PDF</button>
</div>

<div class="wrap" id="out"></div>

<script src="project_sheets.js?v=4.20"></script>
<script src="project_scheme.js?v=4.51"></script>
<script src="boiler_wall.js?v=1.0"></script>
<script src="project_layout.js?v=4.16"></script>
<script src="project_plans.js?v=4.19"></script>
<script src="project_nodes.js?v=4.14"></script>
<!-- Узел коллектора ТП: рисуется вектором и берёт петли из project_plans.js,
     поэтому подключается после него. -->
<script src="project_ufh_manifold.js?v=4.15"></script>
<!-- Листы узлов по 3D-рендеру: коллектор водоснабжения и панельный радиатор. -->
<script src="project_node_sheets.js?v=4.14"></script>
<script>
// Данные один в один с листа ТМ-16 примера
var items = [
  { section: 'Арматура трубопроводов' },
  { name: 'Хомут трубный 24-28 мм', unit: 'шт.', qty: 2 },
  { name: 'Шаровой кран латунный стандарт. 3/4" ВР-НР, ручка-бабочка', unit: 'шт.', qty: 7 },
  { name: 'Клапан обратный 3/4’’ ВР', unit: 'шт.', qty: 1 },
  { name: 'Фильтр универсальный 3/4’’', unit: 'шт.', qty: 1 },
  { name: 'Манометр радиальный 6 бар, 50мм, 1/4’’', unit: 'шт.', qty: 2 },
  { section: 'Оборудование' },
  { name: 'Водосчетчик универсальный (новый), 3/4’’, 105 мм', unit: 'шт.', qty: 1 },
  { section: 'Соединительные детали трубопроводов' },
  { name: 'Ниппель HH никелированный 3/4"', unit: 'шт.', qty: 6 },
  { name: 'Разъемное соединение "американка" ВН, никелированное, уплотнение под гайкой по плоскости, 3/4"', unit: 'шт.', qty: 7 },
  { name: 'Тройник ВВ никелированный 3/4"', unit: 'шт.', qty: 6 },
  { name: 'Фитинг резьбовой – удлинитель хромированный 3/4" 30 мм', unit: 'шт.', qty: 3 },
  { name: 'Футорка никелированная 1/2" x 1/4"', unit: 'шт.', qty: 2 },
  { name: 'Футорка никелированная 3/4" x 1/2"', unit: 'шт.', qty: 2 }
];

// Доступ к проектированию: отметку оставляет калькулятор (app.syncDesignUI),
// своей авторизации у страницы нет. Без отметки листы не собираем — иначе
// прямая ссылка обходила бы переключатель в админке.
(function () {
  var ok = false;
  try { ok = localStorage.getItem('heatcalc_design_access') === '1'; } catch (e) {}
  if (ok) return;
  document.body.innerHTML =
    '<div style="max-width:520px;margin:80px auto;background:#fff;border-radius:12px;padding:28px 32px;' +
    'font:15px/1.5 system-ui,sans-serif;color:#222;box-shadow:0 8px 30px rgba(0,0,0,.25)">' +
    '<h2 style="margin:0 0 10px;font-size:19px">Раздел проектирования не открыт</h2>' +
    '<p style="margin:0 0 14px;color:#555">Листы проекта включает администратор. Если доступ вам уже ' +
    'дали — откройте калькулятор heatcalc.ru, войдите в свою учётную запись и нажмите «Листы проекта».</p>' +
    '<a href="index.html" style="display:inline-block;padding:9px 18px;border-radius:8px;' +
    'background:#ff6b35;color:#fff;text-decoration:none;font-weight:600">К калькулятору</a></div>';
  throw new Error('design access denied');
})();

// Режим 1: смета из калькулятора (кнопка «Листы проекта» кладёт её в localStorage).
// Режим 2 (#demo или нет данных): контрольный образец ТМ-16 для сверки с PDF.
var payload = null;
if (location.hash !== '#demo') {
  try { payload = JSON.parse(localStorage.getItem('project_sheets_payload')); } catch (e) {}
}

var out = document.getElementById('out');
if (payload && payload.items && payload.items.length) {
  // ── Разделы комплекта ────────────────────────────────────────────────
  // Как в проектах-образцах: четыре марки, у каждой свой шифр, свой
  // титульный лист с собственным описанием, своя нумерация листов и своя
  // спецификация. Номер листа внутри раздела печатается с маркой («ТМ-6»),
  // титульный лист номера не имеет и в списке идёт нулевым.
  //   MEP — сводный проект: сводные планы сетей и расчёт теплопотерь;
  //   ТМ  — котельная: схема, компоновка, обвязка узлов;
  //   О   — отопление: планы этажей, тёплый пол, коллекторы;
  //   В   — водоснабжение и канализация.
  var codeBase = payload.codeBase ||
    String(payload.code || '').replace(/\s*[–—-]\s*[A-ZА-Я]{1,3}\s*$/, '');
  var MARK = {
    mep: { code: codeBase + ' – MEP', name: 'Сводный проект инженерных систем', pre: '' },
    tm:  { code: codeBase + ' – ТМ',  name: 'Индивидуальная котельная',        pre: 'ТМ-' },
    o:   { code: codeBase + ' – О',   name: 'Система отопления',               pre: 'О-' },
    v:   { code: codeBase + ' – В',   name: 'Система водоснабжения',           pre: 'В-' },
    k:   { code: codeBase + ' – К',   name: 'Система канализации',             pre: 'К-' }
  };
  // Нумерация как в проектах-образцах: номер двузначный, титульный лист —
  // первый (О-01), а спецификации выделены суффиксом СО (О-СО-11).
  // Нумерация как в проектах-образцах Виталяна: одна цифра без ведущего
  // нуля, титульный лист нулевой (В-0), общие данные В-1, содержательные с
  // В-2, спецификация продолжает тот же ряд — отдельного суффикса СО нет.
  // Внутри страницы счёт по-прежнему ведётся с единицы, поэтому сдвиг тут.
  var numOf = function (mk) {
    return function (v) { return MARK[mk].pre + String(Math.max(0, v - 1)); };
  };
  var specNumOf = numOf;

  // Позиции сметы по разделам. Котельная (1, 2) и узел ввода ХВС (6) — в ТМ;
  // приборы отопления, тёплый пол и расходные материалы (3, 4, 9) — в О;
  // водоснабжение и канализация (5, 7, 8) — в В. Так же поделены спецификации
  // в проектах-образцах.
  var SECTION_MARK = { 1: 'tm', 2: 'tm', 6: 'tm', 3: 'o', 4: 'o', 9: 'o', 5: 'v', 7: 'v', 8: 'k' };
  var itemsBy = { mep: [], tm: [], o: [], v: [], k: [] };
  payload.items.forEach(function (i) {
    var m = /^\s*(\d+)/.exec(String(i.sectionTitle || ''));
    itemsBy[(m && SECTION_MARK[+m[1]]) || 'tm'].push(i);
  });

  // Планы этажей: подложки и зоны готовит plan_editor.html (localStorage).
  // Зона «котельная» задаёт реальные размеры помещения на листе компоновки.
  var plans = null;
  try { plans = JSON.parse(localStorage.getItem('floor_plans_v1')); } catch (e) {}
  // Подложка лежит на Beget (plans.php), а в разметке от неё остаётся имя
  // файла — разворачиваем его в адрес, картинку загрузит сам <image> листа.
  // Записи, сделанные до переноса, держат картинку прямо в img: у них imgFile
  // пуст, и эта ветка их не трогает.
  if (plans && plans.key && plans.floors) {
    plans.floors.forEach(function (f) {
      if (f && !f.img && f.imgFile) {
        f.img = 'https://proxy.heatcalc.ru/plans.php?k=' + plans.key +
          '&n=' + encodeURIComponent(f.imgFile);
      }
    });
  }
  var room = (plans && window.projectPlans) ? projectPlans.boilerRoom(plans) : null;
  // Шаг укладки по этажам приходит из сметы (ufhSteps). У смет, отправленных
  // на листы до этого, его нет — тогда, как раньше, достаём одно число из
  // названия позиции.
  var tpStep = 150;
  (payload.items || []).some(function (i) {
    var m = /шаг[^0-9]{0,4}(\d{2,3})/i.exec(i.name || '');
    if (m) { tpStep = +m[1]; return true; }
    return false;
  });
  var tpSteps = payload.ufhSteps || [tpStep, tpStep];
  // Помещения для экспликации сводного плана: номер, имя, площадь и
  // теплопотери — те же, что на листе расчёта теплопотерь.
  var expRooms = [];
  (payload.heatloss || []).forEach(function (fl, fi) {
    (fl.rooms || []).forEach(function (r) {
      expRooms.push({ id: r.id, name: r.name, area: r.area, q: r.total, floor: fi + 1 });
    });
  });
  var planOpts = {
    stepMm: tpStep, steps: tpSteps, rooms: expRooms,
    floorLayers: (payload.gd && payload.gd.floorScheme) ? payload.gd.floorScheme.layers : null,
    wallLayers: (payload.gd && payload.gd.wallLayers) ? payload.gd.wallLayers : null
  };
  var withOpts = function (extra) {
    var o = {}, k;
    for (k in planOpts) o[k] = planOpts[k];
    for (k in extra) o[k] = extra[k];
    return o;
  };

  var now = new Date();
  var dateStr = now.toLocaleDateString('ru-RU');
  var stampDate = String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getFullYear()).slice(2);
  // Подписи: «Заказчик» пустой (подписывает клиент), ГИП и «Разработал» —
  // из личного кабинета; место под живую подпись остаётся между ними.
  var ppl = payload.people || {};
  var sigs = [{ label: 'Заказчик', name: ppl.zakaz || '' },
              { label: 'ГИП', name: ppl.gip || '' },
              { label: 'Разработал', name: ppl.razrab || '' }];
  var objLine = 'Объект: ' + payload.object +
    (payload.area ? ', отапливаемая площадь ' + payload.area + ' м²' : '') +
    (payload.city ? ', ' + payload.city : '') + '.';

  // ── MEP: сводные планы сетей и расчёт теплопотерь ────────────────────
  // Номера листов MEP — как в эталоне: два знака, титульный 01, сводная
  // схема сетей котельной 02, дальше по два листа на этаж (сводный план и
  // сводная схема сетей этажа), затем расчёт теплопотерь по этажам. Слот
  // ненаписанного листа остаётся пустым — по разрыву в номерах сразу видно,
  // какого листа не хватает.
  var pad2 = function (v) { return (v < 10 ? '0' : '') + v; };
  var numMep = function (v) { return pad2(v); };
  var nFloors = (plans && plans.floors) ? plans.floors.length : 0;
  var mepPlans = [], mepSlots = [];
  mepSlots.push(['02', 'Сводная схема сетей помещения котельной', 'лист не формируется']);
  if (plans && window.projectPlans) {
    (plans.floors || []).forEach(function (_, i) {
      var fl = i + 1, base = 3 + i * 2;
      var got = projectPlans.sheets(plans, withOpts({ code: MARK.mep.code,
        sheetStart: base, only: ['summary'], floor: fl, num: numMep }));
      got.forEach(function (p) { mepPlans.push(p); mepSlots.push([pad2(base), p.title, '']); });
      if (!got.length) mepSlots.push([pad2(base),
        'Этаж ' + pad2(fl) + '. Сводный план сетей', 'лист не сформирован']);
      mepSlots.push([pad2(base + 1), 'Сводная схема сетей ' + fl + ' этажа', 'лист не формируется']);
    });
  }
  var mepHlStart = 3 + nFloors * 2;
  var mepHl = (payload.heatloss && payload.heatloss.length)
    ? projectSheets.heatLossSheets(payload.heatloss,
        { code: MARK.mep.code, sheetStart: mepHlStart, num: numMep })
    : [];

  // Схемы, которые смета рисует у своих разделов (автоматика котельной,
  // автоматика напольного отопления, узел снеготаяния), приходят готовыми
  // чертежами — тем же project_scheme.js. Рисовать их здесь заново незачем:
  // на лист уходит тот же самый SVG, страница добавляет рамку и штамп.
  var artAll = payload.artSheets || [];
  var artOf = function (mk, start) {
    return artAll.filter(function (q) { return q.mk === mk; }).map(function (q, i) {
      return { title: q.title, svg: projectSheets.artSheet({ art: q, title: q.title,
        code: MARK[mk].code, sheet: numOf(mk)(start + i) }) };
    });
  };

  // ── ТМ: котельная ────────────────────────────────────────────────────
  var tmSchemeNo = 3;                       // 01 — титул, 02 — общие указания
  var tmScheme = (payload.scheme && window.projectScheme)
    ? [projectScheme.sheet(payload.scheme, { code: MARK.tm.code, sheet: numOf('tm')(tmSchemeNo) })]
    : [];
  var tmLayoutStart = tmSchemeNo + tmScheme.length;
  var tmLayout = (payload.scheme && window.projectLayout)
    ? projectLayout.sheets(payload.scheme, payload.items,
        { code: MARK.tm.code, sheetStart: tmLayoutStart, room: room,
          photo: payload.boiler3d || null, num: numOf('tm'),
          equip: payload.equip || null,
          front: (payload.node3d || {}).boiler_front || null,
          frontDhw: (payload.node3d || {}).boiler_dhw || null })
    : [];
  // Обвязка узлов: по умолчанию подбор считает готовые насосные группы и
  // коллекторы в теплоизоляции — листы сборки групп из нержавейки скрыты;
  // переключатель в шапке страницы включает вариант «на нержавейке».
  var piping = 'insulated';
  try { piping = localStorage.getItem('project_nodes_piping') || 'insulated'; } catch (e) {}
  try { document.getElementById('piping_sel').value = piping; } catch (e) {}
  var nodesPlan = (payload.scheme && window.projectNodes)
    ? projectNodes.plan(payload.scheme, payload.items, { piping: piping }) : [];
  var nodeCtx = nodesPlan.length ? projectNodes.buildCtx(payload.scheme, payload.items) : null;
  var tmNodesStart = tmLayoutStart + tmLayout.length;
  // Листы узлов собираем по одному: нумерация раздела своя, а
  // projectNodes.sheets() нумерует список подряд с единицы.
  var tmNodes = nodesPlan.map(function (p, i) {
    return projectNodes.sheet(p.id, p.title, nodeCtx,
      { code: MARK.tm.code, sheet: numOf('tm')(tmNodesStart + i) });
  });
  // Схема подключения автоматики котельной — сразу за узлами обвязки
  var tmArtNo = tmNodesStart + tmNodes.length;
  var tmArt = artOf('tm', tmArtNo);
  // Листы обвязки из фитингов сняты: не совпадают с эталоном, узлы идут
  // прежними видами из img/nodes.
  var tmPipeNo = tmArtNo + tmArt.length;
  var tmPipe = [];
  var tmSpecStart = tmPipeNo + tmPipe.length;
  var tmSpec = itemsBy.tm.length ? projectSheets.fromEquipment(itemsBy.tm, {
    title: 'Спецификация материалов и оборудования котельной',
    code: MARK.tm.code, sheetStart: tmSpecStart, num: specNumOf('tm')
  }) : [];

  // ── О: отопление ─────────────────────────────────────────────────────
  // Порядок листов внутри раздела — как в проектах-образцах: этажами, а не
  // пачками. На каждом этаже: план напольного отопления, его объёмный вид,
  // затем план радиаторного отопления (его объёмного вида у нас нет).
  // На этаж отведено четыре слота эталона: план напольного отопления, его
  // объёмный вид, план отопления, объёмный вид отопления. Пустой слот —
  // разрыв в нумерации и строка «нет» в списке листов.
  var oBody = [], oSlots = [];
  if (plans && window.projectPlans) {
    (plans.floors || []).forEach(function (_, i) {
      var fl = i + 1, base = 3 + i * 4, ttl = 'Этаж ' + pad2(fl);
      var put = function (n, list, want) {
        list.forEach(function (p) { oBody.push(p); oSlots.push([numOf('o')(n), p.title, '']); });
        if (!list.length) oSlots.push([numOf('o')(n), want, 'лист не сформирован']);
      };
      put(base, projectPlans.sheets(plans, withOpts({ code: MARK.o.code,
        sheetStart: base, only: ['tp'], floor: fl, num: numOf('o') })),
        ttl + '. План напольного отопления');
      put(base + 1, projectPlans.iso3dSheets(plans, { kind: 'tp', code: MARK.o.code,
        sheetStart: base + 1, stepMm: tpStep, rooms: expRooms, floor: fl, num: numOf('o') }),
        ttl + '. 3D вид напольного отопления');
      put(base + 2, projectPlans.sheets(plans, withOpts({ code: MARK.o.code,
        sheetStart: base + 2, only: ['floor'], floor: fl, num: numOf('o') })),
        ttl + '. План отопления');
      oSlots.push([numOf('o')(base + 3), ttl + '. 3D вид отопления', 'лист не формируется']);
    });
  }
  // Узлы отопления: готовые листы проектов-образцов — ровно те, что смета
  // показывает картинкой над своими разделами (payload.nodeSheets). Заново их
  // не рисуем: оформление проектного листа задано жёстко, и снимок отвечает
  // ему точнее любой перерисовки.
  var NS = payload.nodeSheets || null;
  var oManStart = 3 + nFloors * 4;
  var oNodes = [];
  if (NS) {
    var oDefs = [];
    if (NS.ufh) oDefs.push({ url: NS.ufh, title: 'Узел обвязки коллектора тёплого пола' });
    if (NS.radManifold) oDefs.push({ url: NS.radManifold,
      title: 'Узел обвязки коллектора радиаторного отопления' });
    (NS.radPanels || []).forEach(function (q) {
      oDefs.push({ url: q.url, title: 'Узел обвязки панельного радиатора' +
        (q.kind === 'side' ? ' (боковое подключение)' : ' (нижнее подключение)') });
    });
    oNodes = oDefs.map(function (d, i) {
      return { title: d.title, svg: projectSheets.imageSheet({ url: d.url,
        code: MARK.o.code, sheet: numOf('o')(oManStart + i) }) };
    });
  } else {
    // Сметы, отправленные на листы раньше, готовых узлов не передают — им
    // остаётся прежнее: вектор узла коллектора ТП и радиатор по 3D-рендеру.
    if (plans && window.projectUfhManifold) {
      oNodes = projectUfhManifold.sheets(plans, { code: MARK.o.code, sheetStart: oManStart,
        stepMm: tpStep, steps: tpSteps, rooms: expRooms, items: payload.items,
        photo: (payload.node3d || {}).ufh || null, num: numOf('o') });
    }
    if (window.projectNodeSheets && (payload.node3d || {}).radiator) {
      oNodes = oNodes.concat([projectNodeSheets.radiator({ code: MARK.o.code,
        sheet: numOf('o')(oManStart + oNodes.length),
        photo: payload.node3d.radiator, items: itemsBy.o })].filter(Boolean));
    }
  }
  // Схемы автоматики напольного отопления и узла снеготаяния — за узлами
  var oArtNo = oManStart + oNodes.length;
  var oArt = artOf('o', oArtNo);
  // Гидравлический расчёт радиаторной части: итоги и расчётное кольцо, за
  // ними преднастройки клапанов приборов. Данные готовит калькулятор
  // (payload.hydro) — у смет, отправленных на листы раньше, их нет.
  var oHydroStart = oArtNo + oArt.length;
  var oHydro = (payload.hydro && projectSheets.hydraulicsSheets)
    ? projectSheets.hydraulicsSheets(payload.hydro,
        { code: MARK.o.code, sheetStart: oHydroStart, num: numOf('o') })
    : [];
  // Гидравлика напольного отопления — сразу за радиаторной: тот же раздел,
  // тот же вид листа, только предмет другой.
  var oUfhHydroStart = oHydroStart + oHydro.length;
  var oUfhHydro = (payload.ufhHydro && projectSheets.ufhHydraulicsSheets)
    ? projectSheets.ufhHydraulicsSheets(payload.ufhHydro,
        { code: MARK.o.code, sheetStart: oUfhHydroStart, num: numOf('o') })
    : [];
  var oSpecStart = oUfhHydroStart + oUfhHydro.length;
  var oSpec = itemsBy.o.length ? projectSheets.fromEquipment(itemsBy.o, {
    title: 'Спецификация материалов и оборудования отопления',
    code: MARK.o.code, sheetStart: oSpecStart, num: specNumOf('o')
  }) : [];

  // ── В: водоснабжение ─────────────────────────────────────────────────
  // Этажами, как в эталоне: план водоснабжения этажа — сразу его объёмный вид.
  var vBody = [], vSlots = [];
  if (plans && window.projectPlans && itemsBy.v.length) {
    (plans.floors || []).forEach(function (_, i) {
      var fl = i + 1, base = 3 + i * 2, ttl = 'Этаж ' + pad2(fl);
      var put = function (n, list, want) {
        list.forEach(function (p) { vBody.push(p); vSlots.push([numOf('v')(n), p.title, '']); });
        if (!list.length) vSlots.push([numOf('v')(n), want, 'лист не сформирован']);
      };
      put(base, projectPlans.waterSheets(plans, { code: MARK.v.code, sheetStart: base,
        only: 'water', floor: fl, num: numOf('v') }), ttl + '. План водоснабжения');
      put(base + 1, projectPlans.iso3dSheets(plans, { kind: 'water', code: MARK.v.code,
        sheetStart: base + 1, floor: fl, num: numOf('v') }), ttl + '. 3D вид водоснабжения');
    });
  }
  var vNodeStart = itemsBy.v.length ? 3 + nFloors * 2 : 3;
  // Узел обвязки коллекторов водоснабжения — тот же готовый лист, что в смете
  var vNodes = [];
  if (NS && NS.water && itemsBy.v.length) {
    vNodes = [{ title: 'Узел обвязки коллекторов водоснабжения',
      svg: projectSheets.imageSheet({ url: NS.water, code: MARK.v.code,
        sheet: numOf('v')(vNodeStart) }) }];
  } else if (!NS && window.projectNodeSheets && itemsBy.v.length && (payload.node3d || {}).water) {
    vNodes = [projectNodeSheets.water({ code: MARK.v.code, sheet: numOf('v')(vNodeStart),
      photo: payload.node3d.water, items: itemsBy.v })].filter(Boolean);
  }
  var vPipeNo = vNodeStart + vNodes.length;
  // Обвязка узла ввода ХВС: вид собран 3D-рендером, потому что на листах
  // проектов-образцов узел с редуктором и счётчиком не нарисован ни разу.
  var vPipe = (window.projectNodeSheets && (payload.node3d || {}).hvs_in)
    ? [projectNodeSheets.piping({ code: MARK.v.code, sheet: numOf('v')(vPipeNo),
        title: 'Обвязка узла ввода ХВС', photo: payload.node3d.hvs_in,
        notes: ['Косой фильтр ставится раньше счётчика и редуктора: песок и окалина ' +
                  'из магистрали сажают крыльчатку счётчика и седло редуктора.',
                'Обратный клапан — после редуктора; перед ним он отсекает редуктор ' +
                  'от магистрали, и настроить его нечем.',
                'После сборки провести гидравлическое испытание давлением 10 бар.'] })].filter(Boolean)
    : [];
  var vSpecStart = vPipeNo + vPipe.length;
  var vSpec = itemsBy.v.length ? projectSheets.fromEquipment(itemsBy.v, {
    title: 'Спецификация материалов и оборудования водоснабжения',
    code: MARK.v.code, sheetStart: vSpecStart, num: specNumOf('v')
  }) : [];

  // ── К: канализация ───────────────────────────────────────────────────
  // В проектах-образцах это самостоятельный раздел со своим титулом,
  // общими данными, планами и спецификацией, а не часть водоснабжения.
  var kNo = 3;
  var kBody = [];
  if (plans && window.projectPlans && itemsBy.k.length) {
    (plans.floors || []).forEach(function (_, i) {
      var fl = i + 1, add = function (list) {
        list.forEach(function (p) { kBody.push(p); kNo++; });
      };
      add(projectPlans.waterSheets(plans, { code: MARK.k.code, sheetStart: kNo,
        only: 'sewer', floor: fl, num: numOf('k') }));
      add(projectPlans.iso3dSheets(plans, { kind: 'sewer', code: MARK.k.code,
        sheetStart: kNo, floor: fl, num: numOf('k') }));
    });
  }
  var kSpecStart = kNo;
  var kSpec = itemsBy.k.length ? projectSheets.fromEquipment(itemsBy.k, {
    title: 'Спецификация материалов и оборудования канализации',
    code: MARK.k.code, sheetStart: kSpecStart, num: specNumOf('k')
  }) : [];

  // ── Сборка разделов ──────────────────────────────────────────────────
  // Раздел выпускается, только если в нём есть содержательные листы: пустой
  // комплект из титула и общих данных заказчику не нужен.
  var titleOf = function (mk) {
    return projectSheets.titleSheet({
      object: payload.object || MARK[mk].code,
      region: payload.city,
      code: MARK[mk].code,
      logo: payload.logo,
      section: MARK[mk].name,
      year: now.getFullYear(),
      sigs: sigs
    });
  };
  // список листов раздела: [номер, имя листа, примечание]; титульный — нулевой
  var listOf = function (mk, rows) {
    var pre = MARK[mk].pre;
    // Имена листов — как в оригинале: титульный лист называет систему
    var sysName = { tm: ' котельной', o: ' системы отопления',
                    v: ' системы водоснабжения', k: ' системы канализации' }[mk] || '';
    var out2 = [[numOf(mk)(1), 'Титульный лист' + sysName, '']];
    if (mk !== 'mep') out2.push([numOf(mk)(2), 'Общие данные', '']);
    rows.forEach(function (r) { out2.push([String(r[0]), r[1], r[2] || '']); });
    return out2;
  };
  var gdOf = function (mk, list, notes, total, extra) {
    extra = extra || {};
    return projectSheets.generalData({
      // В оригинале название таблицы указывает систему: «Список листов
      // раздела водоснабжения», «…отопления» и так далее
      listTitle: 'Список листов раздела' + ({
        tm: ' котельной', o: ' отопления', v: ' водоснабжения', k: ' канализации'
      }[mk] || ''),
      sheetsList: list,
      notesTitle: mk === 'tm' ? 'Общие указания' : 'Общие данные',
      notes: notes,
      indicators: extra.indicators || null,
      // Разрез пола — вырезка из оригинала: слои, штриховки и выноски там
      // выверены, перерисовывать вектором смысла нет.
      floorScheme: (mk === 'v' || mk === 'o')
        ? { image: 'img/scheme_floor.png' } : (extra.floorScheme || null),
      // Условные обозначения систем: в оригинале они стоят на листе общих
      // данных того раздела, чьи трубопроводы показаны на схеме пола.
      legend: {
        v: [{ code: 'В1', color: '#4fc3d9', text: 'трубопровод холодного водоснабжения' },
            { code: 'Т3', color: '#e8a35a', text: 'трубопровод горячего водоснабжения' }],
        o: [{ code: 'Т11', color: '#c62828', text: 'трубопровод подачи отопления' },
            { code: 'Т21', color: '#2c47a8', text: 'трубопровод обратки отопления' }],
        k: [{ code: 'К1', color: '#7a7a7a', text: 'трубопровод бытовой канализации' }]
      }[mk] || null,
      // Сноска к схеме, типовая оговорка и подпись ГИП — как в оригинале
      footer: {
        note: [
          '*На Схеме 1 приведена принципиальная модель расположения трубопроводов в составе перекрытия 1',
          'этажа. Толщина слоев, как и состав перекрытия может меняться в зависимости от требований',
          'архитектурного проекта.'
        ],
        legalLines: [
          'Технические решения, принятые в рабочих чертежах, соответствуют требованиям экологических, санитарно-гигиенических,',
          'противопожарных и других действующих норм и правил, обеспечивающих безопасную для жизни и здоровья людей эксплуатацию',
          'объекта при проведении мероприятий, предусмотренных рабочим проектом.'
        ],
        gip: 'Главный инженер проекта _________________/ ' + ((payload.people || {}).gip || '')
      },
      code: MARK[mk].code, object: payload.object,
      section: MARK[mk].name,
      sheetTitle: mk === 'tm' ? 'Общие указания' : 'Общие данные',
      people: { razrab: ppl.razrab, utv: ppl.gip },
      sheet: numOf(mk)(2), total: String(total), date: stampDate
    });
  };
  var made = [];        // [{mk, total}] — для перекрёстных ссылок в общих данных
  var svgs = [];        // листы комплекта по порядку разделов

  var mepTotal = mepPlans.length + mepHl.length;
  var tmTotal = (tmScheme.length + tmNodes.length + tmSpec.length)
    ? 1 + tmScheme.length + tmLayout.length + tmNodes.length + tmArt.length +
      tmPipe.length + tmSpec.length : 0;
  var oTotal = (oBody.length + oNodes.length + oArt.length + oHydro.length + oUfhHydro.length + oSpec.length)
    ? 1 + oBody.length + oNodes.length + oArt.length + oHydro.length + oUfhHydro.length + oSpec.length : 0;
  var vTotal = (vBody.length + vNodes.length + vSpec.length)
    ? 1 + vBody.length + vNodes.length + vPipe.length + vSpec.length : 0;
  var kTotal = (kBody.length + kSpec.length)
    ? 1 + kBody.length + kSpec.length : 0;

  // перечень «другие разделы» для общих данных каждого раздела
  var otherLine = function (mk) {
    var parts = [];
    if (mk !== 'mep' && mepTotal) parts.push(MARK.mep.code + ' (' + mepTotal + ' л.)');
    if (mk !== 'tm' && tmTotal) parts.push(MARK.tm.code + ' (' + tmTotal + ' л.)');
    if (mk !== 'o' && oTotal) parts.push(MARK.o.code + ' (' + oTotal + ' л.)');
    if (mk !== 'v' && vTotal) parts.push(MARK.v.code + ' (' + vTotal + ' л.)');
    if (mk !== 'k' && kTotal) parts.push(MARK.k.code + ' (' + kTotal + ' л.)');
    return parts.length ? ['Другие разделы комплекта: ' + parts.join(', ') + '.'] : [];
  };
  var commonNotes = function (mk, composition, total) {
    return [
      { h: '1. Общие сведения', lines: [
        objLine,
        'Раздел сформирован ' + dateStr + ' автоматически, по составу сметы калькулятора heatcalc.ru.'
      ]},
      { h: '2. Состав раздела', lines: [composition +
        ' — ' + total + ' листов формата А3.'].concat(otherLine(mk)) },
      { h: '3. Примечания', lines: [
        'Количества позиций соответствуют смете на дату формирования; цены в спецификацию не выносятся.',
        'Комплект не заменяет проектную документацию. Перед закупкой и монтажом проконсультируйтесь с инженером.'
      ]}
    ];
  };

  // MEP: титул и содержательные листы. Общих данных в этом разделе нет —
  // указания живут в разделах, к которым относятся.
  if (mepTotal) {
    svgs.push(titleOf('mep'));
    mepPlans.forEach(function (p) { svgs.push(p.svg); });
    mepHl.forEach(function (s) { svgs.push(s); });
    made.push({ mk: 'mep', total: mepTotal });
  }

  if (tmTotal) {
    var tmRows = [];
    tmScheme.forEach(function () { tmRows.push([numOf('tm')(tmSchemeNo), 'Принципиальная схема']); });
    tmLayout.forEach(function (p, i) { tmRows.push([numOf('tm')(tmLayoutStart + i), p.title]); });
    nodesPlan.forEach(function (p, i) { tmRows.push([numOf('tm')(tmNodesStart + i), p.title]); });
    tmArt.forEach(function (p, i) { tmRows.push([numOf('tm')(tmArtNo + i), p.title]); });
    tmPipe.forEach(function (p, i) { tmRows.push([numOf('tm')(tmPipeNo + i), p.title]); });
    tmSpec.forEach(function (_, i) {
      tmRows.push([specNumOf('tm')(tmSpecStart + i), 'Спецификация материалов и оборудования котельной']);
    });
    // Указания по котельной приходят из сметы (gdTm): описание, режимы,
    // обвязка, энергоэффективность. Их нет у смет, отправленных на листы
    // раньше, — тогда обходимся составом раздела.
    var gdTm = payload.gdTm || {};
    var tmNotes = (gdTm.notes && gdTm.notes.length)
      ? gdTm.notes.concat([{ h: 'Состав раздела', lines: ['Титульный лист, общие указания' +
          (tmScheme.length ? ', принципиальная схема' : '') +
          (tmLayout.length ? ', компоновка котельной и вид спереди' : '') +
          (tmNodes.length ? ', узлы обвязки (' + tmNodes.length + ' л.)' : '') +
          (tmArt.length ? ', схема автоматики' : '') +
          ' и спецификация — ' + tmTotal + ' листов формата А3.'].concat(otherLine('tm')) }])
      : commonNotes('tm', 'Титульный лист, общие указания' +
      (tmScheme.length ? ', принципиальная схема' : '') +
      (tmLayout.length ? ', компоновка котельной и вид спереди' : '') +
      (tmNodes.length ? ', узлы обвязки (' + tmNodes.length + ' л.)' : '') +
      ' и спецификация', tmTotal);
    svgs.push(titleOf('tm'));
    svgs.push(gdOf('tm', listOf('tm', tmRows), tmNotes, tmTotal));
    tmScheme.forEach(function (s) { svgs.push(s); });
    tmLayout.forEach(function (p) { svgs.push(p.svg); });
    tmNodes.forEach(function (s) { svgs.push(s); });
    tmArt.forEach(function (p) { svgs.push(p.svg); });
    tmPipe.forEach(function (p) { svgs.push(p.svg); });
    tmSpec.forEach(function (s) { svgs.push(s); });
    made.push({ mk: 'tm', total: tmTotal });
  }

  if (oTotal) {
    var oRows = [];
    oSlots.forEach(function (r) { oRows.push(r); });
    oNodes.forEach(function (p, i) { oRows.push([numOf('o')(oManStart + i), p.title]); });
    oArt.forEach(function (p, i) { oRows.push([numOf('o')(oArtNo + i), p.title]); });
    // Листы гидравлики приходят готовыми SVG, без названия в объекте: первый —
    // сам расчёт, следующие — продолжение таблицы преднастроек.
    oHydro.forEach(function (_, i) {
      oRows.push([numOf('o')(oHydroStart + i), i === 0
        ? 'Гидравлический расчет системы отопления'
        : 'Настройка клапанов приборов отопления']);
    });
    oUfhHydro.forEach(function (_, i) {
      oRows.push([numOf('o')(oUfhHydroStart + i), i === 0
        ? 'Гидравлический расчет напольного отопления'
        : 'Настройка расходомеров напольного отопления']);
    });
    oSpec.forEach(function (_, i) {
      oRows.push([specNumOf('o')(oSpecStart + i), 'Спецификация материалов и оборудования отопления']);
    });
    var gd = payload.gd || {};
    var oNotes = (gd.notes && gd.notes.length) ? gd.notes
      : commonNotes('o', 'Титульный лист, общие данные' +
          (oBody.length ? ', планы этажей (' + oBody.length + ' л.)' : '') +
          (oNodes.length ? ', узлы обвязки (' + oNodes.length + ' л.)' : '') +
          (oArt.length ? ', схемы (' + oArt.length + ' л.)' : '') +
          (oHydro.length ? ', гидравлический расчёт' : '') +
          (oUfhHydro.length ? ', гидравлика напольного отопления' : '') +
          ' и спецификация', oTotal);
    svgs.push(titleOf('o'));
    svgs.push(gdOf('o', listOf('o', oRows), oNotes, oTotal,
      { indicators: gd.indicators, floorScheme: gd.floorScheme }));
    oBody.forEach(function (p) { svgs.push(p.svg); });
    oNodes.forEach(function (p) { svgs.push(p.svg); });
    oArt.forEach(function (p) { svgs.push(p.svg); });
    oHydro.forEach(function (s) { svgs.push(s); });
    oUfhHydro.forEach(function (s) { svgs.push(s); });
    oSpec.forEach(function (s) { svgs.push(s); });
    made.push({ mk: 'o', total: oTotal });
  }

  if (vTotal) {
    var vRows = [];
    vSlots.forEach(function (r) { vRows.push(r); });
    vNodes.forEach(function (p, i) { vRows.push([numOf('v')(vNodeStart + i), p.title]); });
    vPipe.forEach(function (p, i) { vRows.push([numOf('v')(vPipeNo + i), p.title]); });
    vSpec.forEach(function (_, i) {
      vRows.push([specNumOf('v')(vSpecStart + i), 'Спецификация материалов и оборудования водоснабжения']);
    });
    var gdVk = payload.gdVk || {};
    var vNotes = (gdVk.notes && gdVk.notes.length) ? gdVk.notes
      : commonNotes('v', 'Титульный лист, общие данные' +
          (vBody.length ? ', планы водоснабжения (' + vBody.length + ' л.)' : '') +
          (vNodes.length ? ', узел коллектора водоснабжения' : '') +
          ' и спецификация', vTotal);
    svgs.push(titleOf('v'));
    svgs.push(gdOf('v', listOf('v', vRows), vNotes, vTotal,
      // Таблицы показателей на листе общих данных раздела В в оригинале нет —
      // её место занимают условные обозначения систем и схема пола.
      { floorScheme: gdVk.floorScheme }));
    vBody.forEach(function (p) { svgs.push(p.svg); });
    vNodes.forEach(function (p) { svgs.push(p.svg); });
    vPipe.forEach(function (p) { svgs.push(p.svg); });
    vSpec.forEach(function (s) { svgs.push(s); });
    made.push({ mk: 'v', total: vTotal });
  }

  if (kTotal) {
    var kRows = [];
    kBody.forEach(function (p, i) { kRows.push([numOf('k')(3 + i), p.title]); });
    kSpec.forEach(function (_, i) {
      kRows.push([specNumOf('k')(kSpecStart + i), 'Спецификация материалов и оборудования канализации']);
    });
    var kNotes = (payload.gdK && payload.gdK.length) ? payload.gdK
      : commonNotes('k', 'Титульный лист, общие данные' +
          (kBody.length ? ', планы канализации (' + kBody.length + ' л.)' : '') +
          ' и спецификация', kTotal);
    svgs.push(titleOf('k'));
    svgs.push(gdOf('k', listOf('k', kRows), kNotes, kTotal));
    kBody.forEach(function (p) { svgs.push(p.svg); });
    kSpec.forEach(function (s) { svgs.push(s); });
    made.push({ mk: 'k', total: kTotal });
  }

  // Имя вкладки — оно же имя файла, который предложит «Печать / PDF»: браузер
  // берёт его из <title>. «Проба листа А3» в папке заказчика ничего не значит,
  // а объект, площадь, разделы и дата — значат.
  var MARKS_ORDER = { mep: 'MEP', tm: 'ТМ', o: 'О', v: 'В', k: 'К' };
  document.title = 'Проект: ' + (payload.object || 'объект') +
    ' — ' + (made.map(function (m) { return MARKS_ORDER[m.mk]; }).join(', ') || 'без разделов') +
    ' — ' + dateStr;

  document.getElementById('bar_title').textContent = payload.title;
  document.getElementById('bar_note').textContent =
    made.map(function (m) { return MARK[m.mk].code + ' (' + m.total + ' л.)'; }).join(' + ') +
    ' — позиций: ' + payload.items.length;
  out.innerHTML = svgs.map(function (s) { return '<div class="paper">' + s + '</div>'; }).join('');
} else {
  document.getElementById('bar_title').textContent = 'Лист ТМ-16 — Спецификация узла ввода воды';
  document.getElementById('bar_note').textContent = 'контрольный образец, сверять с Boiler_Club_106m2.pdf стр. 39';
  out.innerHTML = '<div class="paper">' + projectSheets.specification({
    title: 'Спецификация узла ввода воды',
    code: '2025-191 - ТМ',
    sheet: 'ТМ-16',
    numTitle: 'Позиция',      // на листах ТМ так, на В и О — «№»
    items: items
  }) + '</div>';
}
